<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Storage Prototype v0</title>
  <script src="https://cdn.tailwindcss.com/3.4.1"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'f-primary': '#ff4301', 'f-secondary': '#d1d5dc', 'f-flat': '#e7e7ff', 'f-gray': '#312f2f',
            'f-light-gray': '#d9d9d9', 'f-dark-gray': '#7a7e80', 'f-light-purple': '#c6c4ff', 'f-light': '#f7bda9',
          },
          fontFamily: { sans: ['Outfit', 'sans-serif'], mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'] },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    body { font-family: 'Outfit', sans-serif; color: black; background: #fff; }
    .insert-row:hover .insert-hint { opacity: 1; }
    /* Image Storage v2 add flow */
    @keyframes slotIn { from { opacity: 0; max-height: 0; transform: translateY(-3px); } to { opacity: 1; max-height: 48px; transform: none; } }
    .slot-in { animation: slotIn .2s ease-out both; overflow: hidden; }
    @keyframes popIn { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
    .pop-in { animation: popIn .16s ease-out both; }
    @keyframes flashNew { 0%, 30% { background: #ffe7dc; } 100% { background: transparent; } }
    .flash-new { animation: flashNew 1.6s ease-out; }
    .tree-row { transition: opacity .2s ease; }
    .placing .tree-row { opacity: .5; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

/* =====================================================================
   Sample data: one instance with its variants, captures and module values
   ===================================================================== */
const INSTANCE = { id: 'inst-1', label: 'Line3-Edge - Magnify-Panel - Pune', instance: 'Line3-Edge', project: 'Magnify-Panel' };
const CAPTURES = [
  { id: 'cc-1', variant: 'CDCP-D547', capture: 'Cap1', sas: ['Label', 'Cap', 'Seal'] },
  { id: 'cc-2', variant: 'CDCP-D547', capture: 'Cap2', sas: ['Body', 'Weld'] },
  { id: 'cc-3', variant: 'CDCP-D990', capture: 'Cap3', sas: ['Label', 'Cap'] },
];
const uniq = (a) => [...new Set(a)];
const VARIANTS = uniq(CAPTURES.map((c) => c.variant));
const CAPTURE_NAMES = uniq(CAPTURES.map((c) => c.capture));
const SEARCH_AREAS = uniq(CAPTURES.flatMap((c) => c.sas));
// Modules of each capture (sample instance). Cap1 has one module of every type so all keys can be seen.
const MODULES = [
  { id: 'm1', name: 'Barcode Reader', type: 'CR', captures: ['cc-1'], read: 'ABCD-0001' },
  { id: 'm4', name: 'Date OCR', type: 'OCR', captures: ['cc-1'], read: 'MFG10-26', labels: ['MFG', 'EXP'] },
  { id: 'm5', name: 'Cap Classifier', type: 'IC', captures: ['cc-1'], sas: ['Cap', 'Seal'] },
  { id: 'm6', name: 'Seal Assembly', type: 'ODC', captures: ['cc-1'], classes: ['Screw', 'Washer'] },
  { id: 'm7', name: 'Label Colour', type: 'CD', captures: ['cc-1'], colours: ['Red', 'Blue'] },
  { id: 'm8', name: 'Defect Segmentation', type: 'SEG', captures: ['cc-1'] },
  { id: 'm9', name: 'Orientation Check', type: 'OTC', captures: ['cc-1'] },
  { id: 'm10', name: 'Glue Bead', type: 'BEAD', captures: ['cc-1'], beads: ['Bead-1', 'Bead-2'] },
  { id: 'm11', name: 'Shape Measure', type: 'SE', captures: ['cc-1'],
    shapes: [['Hole', 1], ['Edge', 2], ['Slot', 3], ['Plate', 4], ['Arc', 8], ['Gap search', 5]] },
  { id: 'm12', name: 'Gap Dimension', type: 'DIM', captures: ['cc-1'] },
  // Module types the key store has no keys for
  { id: 'm17', name: 'Code Reader 2', type: 'CR', captures: ['cc-2'], read: 'SN-77812' },
  { id: 'm18', name: 'Weld Assembly', type: 'ODC', captures: ['cc-2'], classes: ['Screw', 'Washer'] },
  { id: 'm19', name: 'Code Reader 3', type: 'CR', captures: ['cc-3'], read: 'ABCD-0457' },
  { id: 'm20', name: 'Cap Colour', type: 'CD', captures: ['cc-3'], colours: ['Red', 'Blue'] },
];
// Module types in the order they are offered
const MOD_TYPES = [
  ['CR', 'Code Reader'], ['OCR', 'OCR'], ['IC', 'Classification'], ['ODC', 'Object detection'], ['CD', 'Color detection'],
  ['SEG', 'Segmentation'], ['OTC', 'Orientation'], ['BEAD', 'Bead inspection'], ['SE', 'Shape extractor'], ['DIM', 'Dimensioning'],

];
const TYPE_LABEL = Object.fromEntries(MOD_TYPES);
// Name of the level between a module and its keys
const SUB_LABEL = { OCR: 'Labels', ODC: 'Classes', CD: 'Colours', BEAD: 'Beads', SE: 'Shapes' };
// Keys per module type, from the Edge key store (frinksedge-deployment-backend
// src/dao/systemKeyDefinition.ts), with every mode on (Code Reader match, OCR reading mode,
// Segmentation single class), so every key is listed.
const mk = (name, dtype, sample, sub) => ({ name, dtype, sample, sub });
const counts = () => [mk('result', 'bool', 'true'), mk('pass_count', 'num', '1520'), mk('fail_count', 'num', '12')];
// Shape extractor keys depend on the shape type (src/keys/shapeKeyMetrics.ts)
const SHAPE_METRICS = {
  1: ['radius', 'perimeter', 'area', 'circularity', 'convexity', 'contour_continuity', 'error_pct'],
  2: ['angle', 'length', 'error_pct'],
  3: ['major_axis', 'minor_axis', 'angle', 'error_pct'],
  4: ['line_1', 'line_2', 'line_3', 'line_4', 'diagonal_1', 'diagonal_2', 'error_pct'],
  5: ['error_pct'], 6: ['error_pct'], 7: ['error_pct'],
  8: ['radius', 'perimeter', 'area', 'convexity', 'contour_continuity', 'sector_angle', 'error_pct'],
};
const SHAPE_TYPE = { 1: 'circle', 2: 'line', 3: 'ellipse', 4: 'quadrilateral', 5: 'parallel line search', 6: 'edge search', 7: 'peak search', 8: 'sector' };
const moduleKeys = (m) => {
  switch (m.type) {
    case 'CR': return [...counts(), mk('detected_string', 'str', m.read), mk('gt_string', 'str', m.read)];
    case 'OCR': return [...counts(), mk('detected_text', 'str', m.read), ...m.labels.flatMap((l) => [
      mk('gt_text', 'str', `${l}10-26`, l), mk('result', 'bool', 'true', l), mk('pass_count', 'str', '1488', l), mk('fail_count', 'str', '7', l)])];
    case 'IC': return [...counts(), ...m.sas.map((sa) => mk(`detected_class (${sa})`, 'str', 'Dent')), mk('correct_class', 'str', 'OK')];
    case 'ODC': return [...counts(), ...m.classes.flatMap((c) => [
      mk('result', 'bool', 'true', c), mk('current_count', 'num', '4', c), mk('count_till_now', 'num', '6080', c)])];
    case 'CD': return [...counts(), ...m.colours.flatMap((c) => [
      mk('detected_color', 'str', c, c), mk('result', 'bool', 'true', c), mk('pass_count', 'num', '1490', c),
      mk('fail_count', 'num', '9', c), mk('distribution_percentage', 'num', '87.5', c)])];
    case 'SEG': return [...counts(), mk('detected_class', 'str', 'Scratch'), mk('correct_class', 'str', 'OK')];
    case 'OTC': return counts();
    case 'BEAD': return [...counts(), mk('caliper_pass_percentage', 'num', '96.4'), mk('bead_class_name', 'str', 'Glue'),
      ...m.beads.flatMap((b) => [mk('result', 'bool', 'true', b), mk('pass_count', 'num', '1502', b), mk('fail_count', 'num', '18', b),
        mk('bead_width', 'bool', 'true', b), mk('bead_gap/position', 'bool', 'true', b)])];
    case 'SE': return m.shapes.flatMap(([shape, t]) => SHAPE_METRICS[t].map((metric) => mk(metric, 'num', '12.48', `${shape} (${SHAPE_TYPE[t]})`)));
    case 'DIM': return [mk('dim_result', 'bool', 'true'), mk('dim_predicted_value', 'num', '24.97'), mk('dim_unit_used', 'str', 'mm'),
      mk('dim_process', 'str', 'Gap'), mk('dim_current_gt', 'str', '25.00')];
    default: return [];
  }
};
// One entry per module key; a file-name part stores the alias
const KEYS = MODULES.flatMap((m) => moduleKeys(m).map((x) => {
  const keyLabel = `${x.sub ? `${x.sub} › ` : ''}${x.name}`;
  return {
    alias: `${m.name} → ${keyLabel}`, modId: m.id, keyLabel, keyName: x.name, sub: x.sub, dtype: x.dtype, sample: x.sample,
    source: TYPE_LABEL[m.type], captures: m.captures, kind: x.name.includes('class') ? 'class' : 'id',
  };
}));
const hasKeys = (m) => KEYS.some((x) => x.modId === m.id);
const capLabel = (id) => { const c = CAPTURES.find((x) => x.id === id); return `${c.variant} ${c.capture}`; };
const DEFAULT_ROOT = '/home/frinksserver/frinksedge/volumes/frinksedge_saved-results';
const DEFAULT_LOCATION = { id: 'default', name: 'Frinks Edge saved results', path: DEFAULT_ROOT, isDefault: true, free: '412 GB free' };
// Extension comes from Image Saving Configurations (unchanged behaviour)
const EXT = { analysed: 'jpg', raw: 'png' };

/* =====================================================================
   Folder hierarchy rules
   ===================================================================== */
const ENTITY = {
  instance: { rank: 1, label: 'Instance' },
  variant: { rank: 3, label: 'Variant' },
  capture: { rank: 5, label: 'Capture' },
  sa: { rank: 6, label: 'Search area', analysedOnly: true },
};
// A result sits below the thing it describes.
const RESULT = {
  result: { min: 3, label: 'Cycle result', hint: 'Pass / Fail of the whole cycle' },
  sa_result: { min: 6, label: 'Search area result', hint: 'Pass / Fail of each search area', analysedOnly: true },
};
const TIME = {
  year: { order: 1, label: 'Year' },
  month: { order: 2, label: 'Month' },
  day: { order: 3, label: 'Day' },
  hour: { order: 4, label: 'Hour' },
};

// One folder per inspection cycle: all images of one part together. Cycles
// belong to the instance, so it only has to sit below Instance. A cycle happens
// at one moment, so it also sits below every date/time level.
const CYCLE = {
  cycle_id: { min: 1, label: 'Cycle ID', hint: 'One folder per inspection cycle, so all images of a part are together' },
};

const GROUP_STYLE = {
  product: { dot: 'bg-[#6d6af0]', chip: 'bg-f-flat text-[#3b3a8f]', title: 'Product hierarchy' },
  time: { dot: 'bg-sky-500', chip: 'bg-sky-50 text-sky-800', title: 'Date & time' },
  result: { dot: 'bg-amber-500', chip: 'bg-amber-50 text-amber-800', title: 'Result' },
  cycle: { dot: 'bg-teal-500', chip: 'bg-teal-50 text-teal-800', title: 'Cycle' },
  value: { dot: 'bg-f-primary', chip: 'bg-[#fff1eb] text-[#b83000]', title: 'Module values' },
  text: { dot: 'bg-gray-400', chip: 'bg-gray-100 text-gray-700', title: 'Other' },
};

const levelId = (l) => (l.type === 'key' ? `key:${l.key}` : l.type === 'text' ? 'text' : l.type);

const describe = (l) => {
  if (ENTITY[l.type]) return { group: 'product', label: ENTITY[l.type].label };
  if (RESULT[l.type]) return { group: 'result', label: RESULT[l.type].label };
  if (l.type === 'capture_result') return { group: 'result', label: 'Capture result' };
  if (TIME[l.type]) return { group: 'time', label: TIME[l.type].label };
  if (CYCLE[l.type]) return { group: 'cycle', label: CYCLE[l.type].label };
  if (l.type === 'key') {
    const k = KEYS.find((x) => x.alias === l.key);
    return { group: 'value', label: l.key, isClass: k?.kind === 'class', source: k ? `${k.source} · read in ${k.captures.map(capLabel).join(', ')}` : '' };
  }
  return { group: 'text', label: 'Fixed folder' };
};

/**
 * The level a level cannot exist without. Its folder would mix things that
 * only make sense inside that parent (e.g. OK/NG of a search area, without
 * the search area). Capture needs nothing above it: capture names are unique
 * within an instance, so each capture gets its own folder directly (no
 * Variant or Capture position level needed).
 */
const requiredParent = (l) => {
  if (l.type === 'sa_result') return 'sa';
  if (l.type === 'sa') return 'capture';
  return null;
};

/** Why `cand` cannot be placed at `index` of `list` (list without cand), or null. */
const placementProblem = (cand, index, list, kind) => {
  const d = describe(cand);
  const above = list.slice(0, index);
  const below = list.slice(index);
  const label = (l) => describe(l).label;

  if (kind === 'raw' && (ENTITY[cand.type]?.analysedOnly || RESULT[cand.type]?.analysedOnly || d.isClass)) {
    return 'Raw images are the full capture, not split by search area';
  }
  if (cand.type !== 'text' && list.some((l) => l.type === cand.type && (l.type !== 'key' || l.key === cand.key))) {
    return 'Already in the structure';
  }
  const parent = requiredParent(cand);
  if (parent && !above.some((l) => l.type === parent)) {
    return list.some((l) => l.type === parent) ? `Must be below ${ENTITY[parent].label}` : `Needs ${ENTITY[parent].label} above it`;
  }
  const resultMin = (l) => (RESULT[l.type] ? RESULT[l.type].min : CYCLE[l.type] ? CYCLE[l.type].min : describe(l).isClass ? 6 : null);

  if (ENTITY[cand.type]) {
    const r = ENTITY[cand.type].rank;
    const higher = above.find((l) => ENTITY[l.type] && ENTITY[l.type].rank > r);
    if (higher) return `Must be above ${label(higher)}`;
    const lower = below.find((l) => ENTITY[l.type] && ENTITY[l.type].rank < r);
    if (lower) return `Must be below ${label(lower)}`;
    const res = above.find((l) => resultMin(l) !== null && r <= resultMin(l));
    if (res) return `Must be above ${label(res)}`;
  }
  const min = resultMin(cand);
  if (min !== null) {
    const owner = below.find((l) => ENTITY[l.type] && ENTITY[l.type].rank <= min);
    if (owner) return `Must be below ${label(owner)}`;
  }
  if (TIME[cand.type]) {
    const o = TIME[cand.type].order;
    const finer = above.find((l) => TIME[l.type] && TIME[l.type].order > o);
    if (finer) return `Must be above ${label(finer)}`;
    const coarser = below.find((l) => TIME[l.type] && TIME[l.type].order < o);
    if (coarser) return `Must be below ${label(coarser)}`;
  }
  // A cycle happens at one moment: date and time folders always sit above Cycle ID.
  if (cand.type === 'cycle_id') {
    const time = below.find((l) => TIME[l.type]);
    if (time) return `Must be below ${label(time)}`;
  }
  if (TIME[cand.type] && above.some((l) => l.type === 'cycle_id')) return 'Must be above Cycle ID';
  return null;
};

const isValidOrder = (levels, kind) =>
  levels.every((l, i) => !placementProblem(l, i, levels.filter((_, j) => j !== i), kind));

/** Removing a level also removes the levels that cannot exist without it. */
const removeWithDependents = (levels, index) => {
  let next = levels.filter((_, j) => j !== index);
  const removed = [describe(levels[index]).label];
  let changed = true;
  while (changed) {
    changed = false;
    const k = next.findIndex((l, i) => requiredParent(l) && !next.slice(0, i).some((p) => p.type === requiredParent(l)));
    if (k >= 0) { removed.push(describe(next[k]).label); next = next.filter((_, j) => j !== k); changed = true; }
  }
  return { next, removed };
};

const levelOptions = () => [
  ...Object.keys(ENTITY).map((type) => ({ type })),
  ...Object.keys(TIME).map((type) => ({ type })),
  ...Object.keys(RESULT).map((type) => ({ type })),
  ...Object.keys(CYCLE).map((type) => ({ type })),
  // Module values are not folder levels; they are only used in file names.
  { type: 'text', text: 'Folder' },
];

/* =====================================================================
   Example values
   ===================================================================== */
const NOW = { y: '2026', m: '10', d: '14', h: '13', time: '13-10-02', ms: '370' };
const list = (a) => (a.length > 3 ? `${a.slice(0, 3).join(', ')}…` : a.join(', '));

const timeValue = (l, levels, i) => {
  // Stacked date levels show only their own part: 2026 / 10 / 14
  const coarser = levels.slice(0, i).filter((x) => TIME[x.type]).map((x) => TIME[x.type].order);
  const from = coarser.length ? Math.max(...coarser) + 1 : 1;
  const parts = [NOW.y, NOW.m, NOW.d, NOW.h].slice(from - 1, TIME[l.type].order);
  return from === 1 && l.type === 'hour' ? `${NOW.y}-${NOW.m}-${NOW.d}_${NOW.h}` : parts.join('-');
};

/** What the tree shows next to each level: which folders it creates in this instance. */
const levelExamples = (l, levels, i) => {
  if (l.type === 'instance') return INSTANCE.instance;
  if (l.type === 'variant') return `one folder per variant · ${list(VARIANTS)}`;
  if (l.type === 'capture') return `one folder per capture (names are unique) · ${list(CAPTURE_NAMES)}`;
  if (l.type === 'sa') return `one folder per search area · ${list(SEARCH_AREAS)}`;
  if (l.type === 'result' || l.type === 'sa_result') return 'Pass, Fail';
  if (l.type === 'cycle_id') return 'one folder per inspection cycle · e.g. C1042';
  if (TIME[l.type]) return `one folder per ${l.type} · ${timeValue(l, levels, i)}`;
  if (l.type === 'key') { const k = KEYS.find((x) => x.alias === l.key); return `one folder per value · e.g. ${k?.sample}`; }
  return '';
};

const clean = (v) => (v || '').replace(/[<>:"/\\|?*]/g, '-').trim().replace(/\s+/g, '-');

/** One concrete folder name, for a sample image (used by the internal preview). */
const sampleValue = (l, levels, i, ctx) => {
  if (l.type === 'instance') return ctx.instance;
  if (l.type === 'variant') return ctx.variant;
  if (l.type === 'capture') return ctx.capture;
  if (l.type === 'sa') return ctx.sa;
  if (l.type === 'result') return ctx.cycleOk ? 'Pass' : 'Fail';
  if (l.type === 'sa_result') return ctx.saOk ? 'Pass' : 'Fail';
  if (l.type === 'capture_result') return (ctx.capOk ?? ctx.cycleOk) ? 'Pass' : 'Fail';
  if (l.type === 'cycle_id') return ctx.cycleId || 'C1042';
  if (l.type === 'text') return l.text || 'Folder';
  if (l.type === 'key') return clean(ctx.values[l.key]) || l.missing || 'NOREAD';
  if (TIME[l.type]) return timeValue(l, levels, i);
  return '';
};

const NAME_PARTS = [
  // Date and time are one part, so they always stay together: 2026-10-14_13-10-02-370
  { type: 'datetime', label: 'Date & time', group: 'time', sample: () => `${NOW.y}-${NOW.m}-${NOW.d}_${NOW.time}-${NOW.ms}`, unique: true },
  { type: 'cycle_id', label: 'Cycle ID', group: 'text', sample: () => 'C1042', unique: true },
  { type: 'counter', label: 'Counter', group: 'text', sample: () => '000123', unique: true },
  { type: 'variant', label: 'Variant', group: 'product', sample: (c) => c.variant },
  { type: 'capture', label: 'Capture', group: 'product', sample: (c) => c.capture },
  { type: 'sa', label: 'Search area', group: 'product', sample: (c) => c.sa, analysedOnly: true },
  { type: 'result', label: 'Capture result', group: 'result', sample: (c) => (c.cycleOk ? 'Pass' : 'Fail') },
  { type: 'sa_result', label: 'Search area result', group: 'result', sample: (c) => (c.saOk ? 'Pass' : 'Fail'), analysedOnly: true },
];

const partSample = (p, ctx) => {
  if (p.type === 'key') return clean(ctx.values[p.key]) || p.missing || 'NOREAD';
  if (p.type === 'text') return clean(p.text) || 'text';
  return NAME_PARTS.find((x) => x.type === p.type)?.sample(ctx) ?? '';
};

const renderName = (name, kind, ctx, folder) => {
  const parts = name.parts.filter((p) => kind === 'analysed' || !NAME_PARTS.find((x) => x.type === p.type)?.analysedOnly);
  let out = parts.map((p) => partSample(p, ctx)).filter(Boolean).join(name.sep) || 'image';
  const hasSa = parts.some((p) => p.type === 'sa') || folder.some((l) => l.type === 'sa');
  if (kind === 'analysed' && !hasSa) out += `${name.sep}${ctx.sa}`;
  if (!parts.some((p) => NAME_PARTS.find((x) => x.type === p.type)?.unique)) out += `${name.sep}000123`;
  return `${out}.${EXT[kind]}`;
};

// A representative image for the file row in the tree
// A sample image of one capture: only the module values that capture reads
const captureCtx = (cap, sa = cap.sas[0], over = {}) => ({
  ...INSTANCE, ...cap, sa, cycleOk: false, saOk: false,
  values: Object.fromEntries(KEYS.filter((k) => k.captures.includes(cap.id)).map((k) => [k.alias, k.sample])),
  ...over,
});
const EXAMPLE_CTX = captureCtx(CAPTURES[0]);

/* Raw structure derived from analysed: drop search-area levels, add a RAW folder */
const deriveRaw = (levels) => {
  const saIdx = levels.findIndex((l) => l.type === 'sa');
  const hadSaResult = levels.some((l) => l.type === 'sa_result');
  const base = levels.filter((l) => l.type !== 'sa' && l.type !== 'sa_result' && !describe(l).isClass);
  const insertAt = saIdx >= 0 ? Math.min(saIdx, base.length) : base.length;
  base.splice(insertAt, 0, { type: 'text', text: 'raw' });
  if (hadSaResult && !base.some((l) => l.type === 'result')) base.push({ type: 'result' });
  return base;
};

/* =====================================================================
   Default configuration of an instance (created as soon as the page opens)
   ===================================================================== */
// File names are set per capture (Inferencing Customization > File Names).
// Default = today's file name: Date_Time_Variant_Capture_Result_SearchArea
const defaultNames = () => Object.fromEntries(CAPTURES.map((c) => [c.id, {
  parts: [{ type: 'datetime' }, { type: 'variant' }, { type: 'capture' }, { type: 'result' }, { type: 'sa' }],
  sep: '_',
}]));

const defaultConfig = () => ({
  // Same as today's path: instance / date (YYYY-MM-DD) / variant / capture / search area / pass|fail
  analysed: [{ type: 'instance' }, { type: 'day' }, { type: 'variant' }, { type: 'capture' }, { type: 'sa' }, { type: 'sa_result' }],
  rawSame: true,
  // Image Storage (v2): its own tree. Pass / Fail is a page option applied at the bottom of the
  // tree, not a folder level. rawAt = Raw images folder position (sibling of the level at this index).
  v2: {
    levels: [{ type: 'instance' }, { type: 'day' }, { type: 'variant' }, { type: 'capture' }, { type: 'sa' }],
    rawAt: 4,
    splitAnalysed: true,
    splitRaw: true,
  },
  raw: [],
});

/* =====================================================================
   Shell: sidebar, heading, controls (Edge layout)
   ===================================================================== */

const AddLevelMenu = ({ index, levels, kind, onPick, onClose, exclude = [], anyPosition = false }) => {
  const ref = useRef(null);
  useEffect(() => {
    const h = (e) => ref.current && !ref.current.contains(e.target) && onClose();
    const esc = (e) => e.key === 'Escape' && onClose();
    setTimeout(() => document.addEventListener('mousedown', h), 0);
    document.addEventListener('keydown', esc);
    return () => { document.removeEventListener('mousedown', h); document.removeEventListener('keydown', esc); };
  }, []);
  // Levels already in the tree are listed as added; levels that don't fit here are hidden
  const isAdded = (o) => o.type !== 'text' && levels.some((l) => l.type === o.type);
  const opts = levelOptions()
    .filter((o) => !exclude.includes(describe(o).group) && !exclude.includes(o.type))
    .filter((o) => isAdded(o) || (anyPosition
      ? Array.from({ length: levels.length + 1 }, (_, i) => i).some((i) => !placementProblem(o, i, levels, kind))
      : !placementProblem(o, index, levels, kind)))
    .map((o) => ({ o, d: describe(o), added: isAdded(o) }));
  // Pick mode (Image Storage v2): a compact grid of tiles; placing happens in the tree afterwards
  if (anyPosition) {
    return (
      <div ref={ref} className="pop-in absolute right-0 top-full z-[95] mt-2 w-[440px] max-w-[calc(100vw-2rem)] rounded-lg border border-gray-200 bg-white p-3 shadow-xl">
        <p className="mb-2 text-xs text-gray-500">{opts.some((x) => !x.added) ? 'Pick a folder level, then choose where it goes in the tree' : 'Every folder level is already in the tree.'}</p>
        {['product', 'time', 'cycle'].map((g) => {
          const items = opts.filter((x) => x.d.group === g);
          if (!items.length) return null;
          return (
            <div key={g} className="mb-2.5 last:mb-0">
              <p className="mb-1 text-[11px] font-semibold uppercase tracking-wide text-gray-400">{GROUP_STYLE[g].title}</p>
              <div className="grid grid-cols-2 gap-1.5">
                {items.map(({ o, d, added }) => (
                  <button key={levelId(o)} type="button" disabled={added} onClick={() => onPick(o)}
                    className="flex items-start gap-2 rounded-md border border-gray-200 px-2.5 py-2 text-left transition-all duration-150 hover:-translate-y-px hover:border-f-primary hover:bg-[#fffaf7] hover:shadow-sm disabled:translate-y-0 disabled:cursor-default disabled:border-gray-100 disabled:bg-gray-50 disabled:shadow-none">
                    <span className={`mt-1.5 h-2 w-2 shrink-0 rounded-full ${added ? 'bg-gray-300' : GROUP_STYLE[g].dot}`} />
                    <span className="min-w-0 flex-1">
                      <span className="flex items-center justify-between gap-1">
                        <span className={`text-sm font-medium ${added ? 'text-gray-400' : 'text-black'}`}>{d.label}</span>
                        {added && <span className="rounded bg-gray-100 px-1.5 text-[10px] text-gray-500">Added</span>}
                      </span>
                      <span className={`block text-[11px] leading-snug ${added ? 'text-gray-300' : 'text-gray-500'}`}>{CYCLE[o.type]?.hint || levelDescription(o)}</span>
                    </span>
                  </button>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    );
  }
  return (
    <div ref={ref} className="pop-in absolute left-8 top-full z-[95] mt-1 w-[360px] rounded-lg border border-gray-200 bg-white p-2 shadow-xl">
      <p className="px-2 pb-1 text-xs text-gray-500">{anyPosition
        ? (opts.some((x) => !x.added) ? 'Pick a folder level, then choose where to insert it' : 'Every folder level is already in the tree.')
        : (opts.some((x) => !x.added) ? 'Folder levels that fit here' : 'No folder level fits here. Try another position in the tree.')}</p>
      {['product', 'time', 'result', 'cycle', 'text'].map((g) => {
        const items = opts.filter((x) => x.d.group === g);
        if (!items.length) return null;
        return (
          <div key={g} className="mt-1">
            <p className="px-2 pt-1 text-[11px] font-semibold uppercase tracking-wide text-gray-400">{GROUP_STYLE[g].title}</p>
            {items.map(({ o, d, added }) => (
              <button key={levelId(o)} type="button" disabled={added} onClick={() => onPick(o)}

const LevelTree = ({ levels, onChange, kind, rootLabel, fileName, readOnly, notify }) => {
  const [menu, setMenu] = useState(null);
  const update = (i, patch) => onChange(levels.map((l, j) => (j === i ? { ...l, ...patch } : l)));
  const remove = (i) => {
    const { next, removed } = removeWithDependents(levels, i);
    onChange(next);
    if (removed.length > 1) notify?.(`Removed ${removed.join(', ')}: they need ${removed[0]}`);
  };
  const insert = (i, o) => { const n = [...levels]; n.splice(i, 0, { ...o, ...(o.type === 'key' ? { missing: 'NOREAD' } : {}) }); onChange(n); setMenu(null); };
  const moved = (i, delta) => { const n = [...levels]; const [x] = n.splice(i, 1); n.splice(i + delta, 0, x); return n; };
  const canMove = (i, delta) => i + delta >= 0 && i + delta < levels.length && isValidOrder(moved(i, delta), kind);
  const ip = (index, depth) => !readOnly && <InsertPoint index={index} depth={depth} menu={menu} setMenu={setMenu} levels={levels} kind={kind} onPick={(o) => insert(index, o)} />;

  return (
    <div className="rounded-md border border-gray-200 bg-white py-2">
      <div className="flex items-center gap-2 px-3 py-1.5 text-sm">
        <span className="text-gray-500"><Icon d={ICONS.drive} size={18} /></span>
        <span className="font-medium">{rootLabel}</span>
      </div>
      {ip(0, 0)}
      {levels.map((l, i) => {
        const d = describe(l);
        return (
          <React.Fragment key={i}>
            <div className="group flex items-center gap-2 py-1 pr-3 hover:bg-gray-50" style={{ paddingLeft: i * 22 + 12 }}>
              <span className="w-4 text-right text-gray-300">└</span>
              <span className="text-gray-400"><Icon d={ICONS.folder} size={17} /></span>
              <span className={`shrink-0 rounded px-2 py-0.5 text-xs font-medium ${GROUP_STYLE[d.group].chip}`}>{d.label}</span>
              {l.type === 'text' && !readOnly ? (
                <input className="w-36 rounded-md border border-gray-300 px-2 py-0.5 font-mono text-xs focus:border-f-primary focus:outline-none" value={l.text} onChange={(e) => update(i, { text: e.target.value })} />
              ) : (
                <span className="truncate text-xs text-gray-500">{l.type === 'text' ? <span className="font-mono">{l.text}</span> : levelExamples(l, levels, i)}</span>
              )}
              {l.type === 'key' && !readOnly && (
                <span className="hidden shrink-0 items-center gap-1 text-[11px] text-gray-400 lg:flex">
                  if not read
                  <input className="w-20 rounded border border-gray-200 px-1.5 py-0.5 font-mono text-[11px]" value={l.missing || ''} onChange={(e) => update(i, { missing: e.target.value })} />
                </span>
              )}
              {!readOnly && (
                <span className="ml-auto flex shrink-0 items-center gap-0.5 opacity-60 group-hover:opacity-100">
                  <button aria-label="Move level up" disabled={!canMove(i, -1)} onClick={() => onChange(moved(i, -1))} title={canMove(i, -1) ? 'Move up' : 'Not allowed by the folder hierarchy'} className="rounded p-1 text-gray-500 hover:bg-white disabled:opacity-25"><Icon d={ICONS.up} size={15} /></button>
                  <button aria-label="Move level down" disabled={!canMove(i, 1)} onClick={() => onChange(moved(i, 1))} title={canMove(i, 1) ? 'Move down' : 'Not allowed by the folder hierarchy'} className="rounded p-1 text-gray-500 hover:bg-white disabled:opacity-25"><Icon d={ICONS.down} size={15} /></button>
                  <button aria-label="Remove level" onClick={() => remove(i)} title="Remove level" className="rounded p-1 text-gray-500 hover:bg-white hover:text-red-500"><Icon d={ICONS.x} size={15} /></button>
                </span>
              )}
            </div>
            {ip(i + 1, i + 1)}
          </React.Fragment>
        );
      })}
      <div className="flex items-center gap-2 py-1 pr-3" style={{ paddingLeft: levels.length * 22 + 12 }}>
        <span className="w-4 text-right text-gray-300">└</span>
        <span className="text-f-primary"><Icon d={ICONS.image} size={17} /></span>
        <span className="truncate font-mono text-xs text-black">{fileName}</span>
        <span className="text-[11px] text-gray-400">example · {CAPTURES[0].capture} file name</span>
      </div>
      {!readOnly && (
        <div className="relative mt-1 px-3">
          <button type="button" onClick={() => setMenu(menu === 'end' ? null : 'end')} className="flex items-center gap-1.5 rounded-md px-1 py-1 text-sm font-medium text-f-primary hover:underline">
            <Icon d={ICONS.plus} size={15} /> Add folder level
          </button>
          {menu === 'end' && <AddLevelMenu index={levels.length} levels={levels} kind={kind} onPick={(o) => insert(levels.length, o)} onClose={() => setMenu(null)} />}
        </div>
      )}
    </div>
  );
};

const KeyPicker = ({ mod, value, onPick, onBack, backLabel, cols = 'grid-cols-3' }) => {

  const subs = [...new Set(keys.filter((x) => x.sub).map((x) => x.sub))];
  return (

/* =====================================================================
   Image Storage (v2): its own folder tree with a movable Raw images folder.
   Pass / Fail folders are page options applied at the bottom of the tree,
   so result levels are not offered in the add-folder popup.
   ===================================================================== */
// Not offered in v2: result levels (Pass / Fail is a page option), Fixed folder, Year and Month
const V2_EXCLUDE = ['result', 'text', 'year', 'month'];
// Raw images sit at most at the Search area level (raw images are never split by search area)
const maxRawAt = (levels) => {
  const sa = levels.findIndex((l) => l.type === 'sa');
  return sa >= 0 ? sa : levels.length;
};
const rawAtOf = (v) => Math.min(v.rawAt ?? maxRawAt(v.levels), maxRawAt(v.levels));

// Pass / Fail folders go at the bottom, by the result of the lowest product level in those folders:
// Search area -> search area result, Capture -> capture result, Variant / Instance / none -> cycle result
const lowestProduct = (levels) => [...levels].reverse().find((l) => ENTITY[l.type]);
const splitLevel = (levels) => {
  const t = lowestProduct(levels)?.type;
  return { type: t === 'sa' ? 'sa_result' : t === 'capture' ? 'capture_result' : 'result' };
};
const resultName = (levels) => {
  const t = lowestProduct(levels)?.type;
  return t === 'sa' ? 'SA result' : t === 'capture' ? 'capture result' : 'cycle result';
};
const splitText = (levels) => {
  const t = lowestProduct(levels)?.type;
  if (t === 'sa') return 'by search area result';
  if (t === 'capture') return 'by capture result';
  if (t === 'variant') return 'by variant result (the whole cycle)';
  return 'by cycle result';
};
// Folders of an analysed image: the tree, then Pass / Fail
const analysedLevelsV2 = (cfg) => [...cfg.v2.levels, ...(cfg.v2.splitAnalysed ? [splitLevel(cfg.v2.levels)] : [])];
// Folders of a raw image: every level above the Raw images folder, the folder itself, then Pass / Fail
const rawLevelsV2 = (cfg) => {
  const above = cfg.v2.levels.slice(0, rawAtOf(cfg.v2));
  return [...above, { type: 'text', text: 'raw' }, ...(cfg.v2.splitRaw ? [splitLevel(above)] : [])];
};

const TIME_WORD = { year: 'year', month: 'month', day: 'day', hour: 'hour' };

/** Plain description of a folder level (no example values). */
const levelDescription = (l) => {
  if (l.type === 'instance') return 'One folder for this instance';
  if (l.type === 'variant') return 'One folder per variant';
  if (l.type === 'capture') return 'One folder per capture';
  if (l.type === 'sa') return 'One folder per search area';
  if (l.type === 'cycle_id') return 'One folder per inspection cycle';
  if (TIME[l.type]) return `One folder per ${TIME_WORD[l.type]}`;
  return '';
};

/** What the Raw images folder holds at position `at` of the hierarchy. */
const rawDescription = (levels, at) => {
  const above = levels.slice(0, at).filter((l) => l.type !== 'text');
  const below = levels.slice(at).filter((l) => !['sa', 'text'].includes(l.type));
  const owner = above[above.length - 1];
  let base = 'One folder in the root folder for all raw images';
  if (owner?.type === 'instance') base = 'One folder for all raw images of this instance';
  else if (owner?.type === 'variant') base = 'One folder per variant for its raw images';
  else if (owner?.type === 'capture') base = 'One folder per capture for its raw images';
  else if (owner?.type === 'cycle_id') base = 'One folder per inspection cycle for its raw images';
  else if (owner && TIME[owner.type]) base = `One folder per ${TIME_WORD[owner.type]} for its raw images`;
  const notSplit = below.map((l) => describe(l).label.toLowerCase());
  return `${base}${notSplit.length ? `, not split by ${notSplit.join(', ')}` : ''}`;
};

/** Tree connector: a vertical line (full height, or to the middle for the last child) and a tick. */
const Conn = ({ last }) => (
  <span className="relative -my-1 w-4 shrink-0 self-stretch">
    <span className={`absolute left-2 top-0 w-px bg-gray-300 ${last ? 'h-1/2' : 'h-full'}`} />
    <span className="absolute left-2 top-1/2 h-px w-2 bg-gray-300" />
  </span>
);

const LevelTreeV2 = ({ levels, rawAt, splitAnalysed, splitRaw, onChange, onSplit, rootLabel, notify }) => {
  const [menu, setMenu] = useState(null);
  // Level picked in Add folder level, waiting for an Insert here click
  const [placing, setPlacing] = useState(null);
  // Index of the folder just inserted, highlighted for a moment
  const [fresh, setFresh] = useState(null);
  useEffect(() => {
    if (fresh === null) return undefined;
    const t = setTimeout(() => setFresh(null), 1700);
    return () => clearTimeout(t);
  }, [fresh]);
  useEffect(() => {
    if (!placing) return undefined;
    const esc = (e) => e.key === 'Escape' && setPlacing(null);
    document.addEventListener('keydown', esc);
    return () => document.removeEventListener('keydown', esc);
  }, [placing]);
  const [dragging, setDragging] = useState(false);
  const [over, setOver] = useState(null);
  const max = maxRawAt(levels);
  const commit = (next, at) => onChange(next, Math.max(0, Math.min(at, maxRawAt(next))));
  const update = (i, patch) => commit(levels.map((l, j) => (j === i ? { ...l, ...patch } : l)), rawAt);
  const remove = (i) => {
    const { next, removed } = removeWithDependents(levels, i);
    // Raw images keep their parent folder: shift by the levels removed above them
    commit(next, rawAt - levels.slice(0, rawAt).filter((l) => !next.includes(l)).length);
    if (removed.length > 1) notify?.(`Removed ${removed.join(', ')}: they need ${removed[0]}`);
  };
  const insert = (i, o) => {
    const n = [...levels];
    n.splice(i, 0, { ...o });
    commit(n, i < rawAt ? rawAt + 1 : rawAt);
    setMenu(null);
    setPlacing(null);
    setFresh(i);
  };
  const moved = (i, delta) => { const n = [...levels]; const [x] = n.splice(i, 1); n.splice(i + delta, 0, x); return n; };
  const canMove = (i, delta) => i + delta >= 0 && i + delta < levels.length && isValidOrder(moved(i, delta), 'analysed');
  const moveRaw = (at) => { commit(levels, at); setDragging(false); setOver(null); };
  const insertHere = (i) => {
    if (!placing || placementProblem(placing, i, levels, 'analysed')) return null;
    const d = describe(placing);
    return (
      <div key={`here-${i}-${placing.type}`} className="slot-in py-0.5 pr-3" style={{ paddingLeft: i * 22 + 12 }}>
        <button type="button" onClick={() => insert(i, placing)}
          className="group/slot flex w-full items-center gap-2 rounded-md border border-dashed border-[#ffb497] bg-[#fffaf7] px-2 py-1 text-left transition-all duration-150 hover:border-solid hover:border-f-primary hover:bg-[#fff1ea] hover:shadow-sm">
          <span className="flex h-4 w-4 shrink-0 items-center justify-center rounded-full bg-f-primary text-white transition-transform duration-150 group-hover/slot:scale-110"><Icon d={ICONS.plus} size={11} /></span>
          <span className="text-[11px] font-medium text-f-primary">Insert here</span>
          <span className="flex min-w-0 items-center gap-2 opacity-0 transition-opacity duration-150 group-hover/slot:opacity-100">
            <span className="text-gray-300">→</span>
            <span className={`shrink-0 rounded px-2 py-0.5 text-xs font-medium ${GROUP_STYLE[d.group].chip}`}>{d.label}</span>
            <span className="truncate text-xs text-gray-500">{levelDescription(placing)}</span>
          </span>
        </button>
      </div>
    );
  };
  // Pass and Fail folders sit side by side; removing either removes both (the split)
  const unsplit = (key, what) => { onSplit(key, false); notify?.(`Pass and Fail folders removed for ${what}. Use Split Pass / Fail to add them back.`); };
  const passFailRows = (depth, result, onRemove, moreBelow = false) => ['Pass', 'Fail'].map((w, k) => (
    <div key={w} className="tree-row group flex items-center gap-2 py-1 pr-3 hover:bg-gray-50" style={{ paddingLeft: depth * 22 + 12 }}>
      <Conn last={!(k === 0 || moreBelow)} />
      <span className="text-gray-400"><Icon d={ICONS.folder} size={17} /></span>
      <span className={`shrink-0 rounded px-2 py-0.5 text-xs font-medium ${GROUP_STYLE.result.chip}`}>{w}</span>
      <span className="truncate text-xs text-black">Contains images with {result} {w} <span className="text-gray-500">(Subject to Image Saving Configurations)</span></span>
      <span className="ml-auto flex shrink-0 items-center opacity-60 group-hover:opacity-100">
        <button aria-label="Remove Pass and Fail folders" onClick={onRemove} title="Remove the Pass and Fail folders (they are removed together)" className="rounded p-1 text-gray-500 hover:bg-white hover:text-red-500"><Icon d={ICONS.x} size={15} /></button>
      </span>
    </div>
  ));
  // Shown on hover, like Insert folder, where the Pass and Fail folders were
  const splitHint = (onClick) => (
    <button type="button" onClick={onClick}
      className="insert-hint -my-1 flex h-4 items-center gap-1 text-[11px] text-f-primary opacity-0 transition-opacity">
      <span className="flex h-4 w-4 items-center justify-center rounded-full border border-f-primary bg-white"><Icon d={ICONS.plus} size={10} /></span>
      Split Pass / Fail
    </button>
  );

  const rawRow = (at) => (
    <div key="raw" draggable onDragStart={(e) => { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'raw'); setDragging(true); }}
      onDragEnd={() => { setDragging(false); setOver(null); }}
      className={`tree-row group flex cursor-grab items-center gap-2 py-1 pr-3 hover:bg-gray-50 ${dragging ? 'opacity-50' : ''}`} style={{ paddingLeft: at * 22 + 12 }}>
      <Conn last />
      <span className="text-gray-400"><Icon d={ICONS.folder} size={17} /></span>
      <span className="shrink-0 rounded bg-emerald-50 px-2 py-0.5 text-xs font-medium text-emerald-800">Raw images</span>
      <span className="truncate text-xs text-black">{rawDescription(levels, at)}</span>
      <span className="ml-auto flex shrink-0 items-center gap-0.5 opacity-60 group-hover:opacity-100">
        <span className="hidden text-[11px] text-gray-400 sm:inline">drag up</span>
        <button aria-label="Move Raw images up" disabled={at === 0} onClick={() => moveRaw(at - 1)} title={at === 0 ? 'Already at the top' : 'Move up'} className="rounded p-1 text-gray-500 hover:bg-white disabled:opacity-25"><Icon d={ICONS.up} size={15} /></button>
        <button aria-label="Move Raw images down" disabled={at >= max} onClick={() => moveRaw(at + 1)} title={at >= max ? 'Raw images cannot go below the Search area level' : 'Move down'} className="rounded p-1 text-gray-500 hover:bg-white disabled:opacity-25"><Icon d={ICONS.down} size={15} /></button>
      </span>
    </div>
  );
  // Drop targets for the Raw images folder: every position from the top down to the Search area level
  const dropZone = (at) => dragging && at !== rawAt && at <= max && (
    <div key={`drop-${at}`} onDragOver={(e) => { e.preventDefault(); setOver(at); }} onDragLeave={() => setOver((o) => (o === at ? null : o))}
      onDrop={(e) => { e.preventDefault(); moveRaw(at); }} style={{ marginLeft: at * 22 + 30 }}
      className={`my-0.5 mr-3 rounded border-2 border-dashed px-2 py-1 text-[11px] ${over === at ? 'border-emerald-500 bg-emerald-50 text-emerald-800' : 'border-emerald-200 text-emerald-700'}`}>
      Drop here: {rawDescription(levels, at)}
    </div>
  );
  const rawBlock = (at) => (
    <React.Fragment key="raw-block">
      {rawRow(at)}
      {splitRaw
        ? passFailRows(at + 1, resultName(levels.slice(0, at)), () => unsplit('splitRaw', 'raw images'))
        : <div className="insert-row relative" style={{ paddingLeft: (at + 1) * 22 + 28 }}>{splitHint(() => onSplit('splitRaw', true))}</div>}
    </React.Fragment>
  );

  const levelRow = (l, i) => {
    const d = describe(l);
    return (
      <React.Fragment key={i}>
        {insertHere(i)}
        {dropZone(i)}
        <div key={fresh === i ? `fresh-${i}` : `row-${i}`} className={`tree-row group flex items-center gap-2 rounded py-1 pr-3 hover:bg-gray-50 ${fresh === i ? 'flash-new' : ''}`} style={{ paddingLeft: i * 22 + 12 }}>
          <Conn last={rawAt !== i} />
          <span className="text-gray-400"><Icon d={ICONS.folder} size={17} /></span>
          <span className={`shrink-0 rounded px-2 py-0.5 text-xs font-medium ${GROUP_STYLE[d.group].chip}`}>{d.label}</span>
          {l.type === 'text' ? (
            <input className="w-36 rounded-md border border-gray-300 px-2 py-0.5 font-mono text-xs focus:border-f-primary focus:outline-none" value={l.text} onChange={(e) => update(i, { text: e.target.value })} />
          ) : (
            <span className="truncate text-xs text-black">{levelDescription(l)}</span>
          )}
          <span className="ml-auto flex shrink-0 items-center gap-0.5 opacity-60 group-hover:opacity-100">
            <button aria-label="Move level up" disabled={!canMove(i, -1)} onClick={() => commit(moved(i, -1), rawAt)} title={canMove(i, -1) ? 'Move up' : 'Not allowed by the folder hierarchy'} className="rounded p-1 text-gray-500 hover:bg-white disabled:opacity-25"><Icon d={ICONS.up} size={15} /></button>
            <button aria-label="Move level down" disabled={!canMove(i, 1)} onClick={() => commit(moved(i, 1), rawAt)} title={canMove(i, 1) ? 'Move down' : 'Not allowed by the folder hierarchy'} className="rounded p-1 text-gray-500 hover:bg-white disabled:opacity-25"><Icon d={ICONS.down} size={15} /></button>
            <button aria-label="Remove level" onClick={() => remove(i)} title="Remove level" className="rounded p-1 text-gray-500 hover:bg-white hover:text-red-500"><Icon d={ICONS.x} size={15} /></button>
          </span>
        </div>
      </React.Fragment>
    );
  };

  return (
    <div className={`rounded-lg border bg-white py-2 transition-all duration-200 ${placing ? 'placing border-[#ffb497] shadow-[0_0_0_3px_rgba(255,67,1,0.08)]' : 'border-gray-200'}`}>
      <div className="flex items-center gap-2 px-3 py-1.5 text-sm">
        <span className="tree-row flex items-center gap-2">
          <span className="text-gray-500"><Icon d={ICONS.drive} size={18} /></span>
          <span className="font-medium">{rootLabel}</span>
        </span>
        <div className="relative ml-auto flex items-center gap-2">
          <Btn variant="border" className="px-3 py-1.5" disabled={!placing} onClick={() => setPlacing(null)} title="Stop adding (Esc)">Cancel</Btn>
          <button type="button" disabled={!!placing} onClick={() => setMenu(menu === 'end' ? null : 'end')}
            className={`flex items-center gap-1.5 rounded-md border px-3 py-1.5 text-sm font-medium transition-colors ${menu === 'end' || placing ? 'border-f-primary bg-[#fff4ee] text-f-primary' : 'border-dashed border-[#ffb497] text-f-primary hover:border-solid hover:border-f-primary hover:bg-[#fffaf7]'}`}>
            <Icon d={ICONS.plus} size={15} /> Add folder level
          </button>
          {menu === 'end' && <AddLevelMenu index={levels.length} levels={levels} kind="analysed" exclude={V2_EXCLUDE} anyPosition
            onPick={(o) => { setPlacing({ ...o }); setMenu(null); }} onClose={() => setMenu(null)} />}
        </div>
      </div>
      {levels.slice(0, rawAt).map((l, i) => levelRow(l, i))}
      {/* From the Raw images folder's first sibling down to Raw images: a line joins it to its parent folder */}
      <div className="relative">
        <span className="pointer-events-none absolute bottom-0 top-0 w-px bg-gray-300" style={{ left: rawAt * 22 + 12 + 8 }} />
        {levels.slice(rawAt).map((l, k) => levelRow(l, rawAt + k))}
        {insertHere(levels.length)}
        {!splitAnalysed && !placing && <div className="insert-row relative" style={{ paddingLeft: levels.length * 22 + 28 }}>{splitHint(() => onSplit('splitAnalysed', true))}</div>}
        {dropZone(levels.length)}
        {splitAnalysed && passFailRows(levels.length, resultName(levels), () => unsplit('splitAnalysed', 'analysed images'), rawAt === levels.length)}
      </div>
      {rawBlock(rawAt)}
    </div>
  );
};

const pathFor = (kind, cfg, ctx, names, v2 = false) => {
  const loc = DEFAULT_LOCATION;
  const levels = v2
    ? (kind === 'raw' ? rawLevelsV2(cfg) : analysedLevelsV2(cfg))
    : (kind === 'raw' ? (cfg.rawSame ? deriveRaw(cfg.analysed) : cfg.raw) : cfg.analysed);
  const segs = levels.map((l, i) => clean(sampleValue(l, levels, i, ctx)));
  const file = renderName(names[ctx.id], kind, ctx, levels);
  return { loc, levels, segs, file, full: [loc.path, ...segs, file].join('/') };
};

/** Read-only label of one file-name part, as shown in the table. */
const partLabel = (p) => {
  if (p.type === 'key') {
    const k = KEYS.find((x) => x.alias === p.key);
    const m = k && MODULES.find((x) => x.id === k.modId);
    return `${m?.name || 'Module'} → ${k?.keyName || 'key'}`;
  }
  if (p.type === 'text') return p.text || 'text';
  return NAME_PARTS.find((x) => x.type === p.type)?.label || p.type;
};
const partGroup = (p) => (p.type === 'key' ? 'value' : p.type === 'text' ? 'text' : NAME_PARTS.find((x) => x.type === p.type)?.group || 'text');

);

            onSave={() => { setSavedNames(copy(names)); notify('File names saved and pushed to the running deployment'); }} />
        )}
        {view === 'preview' && <PreviewTab cfg={cfg} names={names} v2={lastStorage === 'storage2'} />}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
