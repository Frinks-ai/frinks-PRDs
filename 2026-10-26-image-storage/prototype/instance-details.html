        <span className="self-center">

            <span role="button" tabIndex={0} className="pointer-events-auto inline-flex shrink-0 items-center justify-center rounded-full transition-transform focus:outline-none focus:ring-2 focus:ring-f-primary text-gray-500 hover:scale-110">
              <LuInfo size={15} />
            </span>
          </span>
        </span>
      </div>
    </div>
  );
}

function Filter({ label }) {
  return (
    <div className="relative w-auto">
      <button type="button" className="flex h-[38px] items-center justify-between gap-1.5 whitespace-nowrap rounded-lg bg-white px-3 text-[13px] font-medium text-gray-700 transition-colors hover:bg-gray-50 focus:outline-none w-32 border-none">
        <span className="truncate">{label}</span>
        <ChevronDown size={14} className="flex-shrink-0 text-gray-500 transition-transform" />
      </button>
    </div>
  );
}

const BTN_BASE = 'inline-flex items-center justify-center gap-2 font-semibold shadow-xs h-fit cursor-pointer';
const BTN_DISABLED = 'disabled:bg-gray-300 disabled:text-gray-500 disabled:border-transparent disabled:cursor-not-allowed';
// tailwind-variants output after tailwind-merge
const BTN_PRIMARY_XS = `${BTN_BASE} border border-transparent bg-f-primary text-white hover:bg-f-primary/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-f-primary text-xs px-2 py-1 rounded-sm w-full`;
const BTN_BORDER_XS = `${BTN_BASE} focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-f-primary text-xs px-2 py-1 rounded-sm w-full bg-transparent border hover:opacity-70 border-f-primary text-f-primary hover:bg-white/90`;
const BTN_PRIMARY_LG = `${BTN_BASE} border border-transparent bg-f-primary text-white hover:bg-f-primary/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-f-primary text-sm px-6 py-2 rounded-md`;

function TableInfo() {
  return (
    <span className="pointer-events-auto relative inline-flex items-center">
      <span role="button" tabIndex={0} className="pointer-events-auto inline-flex shrink-0 items-center justify-center rounded-full transition-transform focus:outline-none focus:ring-2 focus:ring-f-primary text-white">
        <LuInfo size={16} />
      </span>
    </span>
  );
}

function TableHead({ children }) {
  return (
    <thead className="sticky top-0 z-10">
      <tr className="bg-f-primary relative">{children}</tr>
    </thead>
  );
}
function TableHeadData({ children, idx, info }) {
  return (
    <th scope="col" className="group sticky top-0 px-2 py-2 pb-4 pt-4 text-center text-base font-medium text-white ">
      {info ? <span className="inline-flex items-center justify-center gap-1">{children}<TableInfo /></span> : children}
      {idx !== undefined && <div className="absolute bottom-2.5 right-0 top-2.5 w-0.5 cursor-col-resize rounded-2xl bg-white group-last:hidden" />}
    </th>
  );
}
function TableBody({ children }) {
  return <tbody className="divide-y divide-gray-200 bg-white">{children}</tbody>;
}
function TableBodyRow({ children, className = '', onClick }) {
  return (
    <tr className={className + ' ' + 'min-h-[500px] cursor-pointer hover:bg-gray-100'} onClick={onClick}>
      {children}
    </tr>
  );
}
// Note: in the real component {...props} is spread after className, so a passed className replaces the defaults.
function TableBodyData({ children, className, onClick, colSpan }) {
  return (
    <td className={className !== undefined ? className : 'overflow-visible px-2 py-2 text-black  '} onClick={onClick} colSpan={colSpan}>
      <div className="flex h-full w-full items-center justify-center text-center">{children}</div>
    </td>
  );
}
function Table({ children, columnCount, className, fullWidth = false }) {
  const ref = useRef(null);
  const [w, setW] = useState([]);
  // Same sizing rule as shared/ui/Table. Re-measured on resize only because the
  // Tailwind CDN emits the modal width class a moment after first paint.
  useLayoutEffect(() => {
    const measure = () => {
      const cw = ref.current ? ref.current.offsetWidth : 0;
      if (!cw) { setW([...Array(columnCount)].map(() => 150)); return; }
      const per = fullWidth ? (cw - 20) / columnCount : Math.min(cw / columnCount, 300);
      setW([...Array(columnCount)].map(() => per));
    };
    measure();
    const ro = new ResizeObserver(() => measure());
    if (ref.current && ref.current.parentElement) ro.observe(ref.current.parentElement);
    return () => ro.disconnect();
  }, [columnCount]);
  return (
    <div ref={ref} className="flow-root w-full" style={{ overflowX: 'auto', overflowY: 'visible' }}>
      <div style={{ width: 'max-content', minWidth: '100%' }}>
        <table className={`min-w-full divide-y divide-gray-300 ${className ?? ''}`} style={{ tableLayout: 'auto' }}>
          <colgroup>{[...Array(columnCount)].map((_, i) => <col key={i} style={{ width: w[i] || 'auto' }} />)}</colgroup>
          {children}
        </table>
      </div>
    </div>
  );
}

function Modal({ isOpen, onClose, className, children }) {
  const boxRef = useRef(null);
  useEffect(() => {
    if (!isOpen) return;
    const h = (e) => { if (boxRef.current && !boxRef.current.contains(e.target) && !e.target.closest('.proto-switch')) onClose(); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [isOpen, onClose]);
  if (!isOpen) return null;
  return ReactDOM.createPortal(
    <div className="fixed left-0 top-0 z-[99991] h-screen w-screen rounded-lg bg-gray-500 bg-opacity-75 transition-opacity" role="dialog" aria-modal="true">
      <div className={`relative top-[50%] mx-auto translate-y-[-50%] transform rounded-lg bg-white text-left shadow-xl transition-all ${className} `} onClick={(e) => e.stopPropagation()}>
        {/* p-[${..}] is built at runtime in the real Modal, so Tailwind never emits it: no padding here */}
        <div className="rounded-lg bg-white" ref={boxRef}>{children}</div>
      </div>
    </div>,
    document.body
  );
}

function ProjectCreateLoader({ title }) {
  return (
    <div className="fixed left-0 top-0 z-[999] flex h-full w-full items-center justify-center bg-gray-200/75">
      <div className="loader-container">
        <label className="font-medium">{title}</label>
        <div className="loader"></div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------- InstanceTable.jsx
function PreservationSection({ title, text, columns, rows }) {
  return (
    <div className="mt-4 flex flex-col gap-2">
      <h3 className="text-sm font-semibold text-gray-800 border-b pb-1">{title}</h3>
      {text && <p className="text-sm text-gray-800">{text}</p>}
      <Table columnCount={columns.length} fullWidth={true} className="min-w-full text-sm">
        <TableHead>
          {columns.map((c, i) => <TableHeadData key={c} idx={i}>{c}</TableHeadData>)}
        </TableHead>
        <TableBody>
          {rows.map((r, idx) => (
            <TableBodyRow key={idx} className={idx % 2 === 0 ? 'bg-gray-50/50' : 'bg-white'}>
              {r.map((cell, ci) => <TableBodyData key={ci} className="!py-3 text-gray-700 text-center">{cell}</TableBodyData>)}
            </TableBodyRow>
          ))}
        </TableBody>
      </Table>
    </div>
  );
}

function InstanceWarningModal({ warnings, preservationDetails, folderRenames, onUpload, onDiscard, onClose }) {
  return (
    <div className="flex flex-col gap-4 rounded-md bg-white p-6 max-h-[85vh] overflow-y-auto">
      <div className="flex items-center justify-between">
        <h2 className="text-lg font-semibold">Warning</h2>
        <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
      </div>
      <ul className="list-disc pl-5 flex flex-col gap-1">
        {warnings.map((w, i) => <li key={i} className="text-sm text-yellow-700">{w}</li>)}
      </ul>

      {preservationDetails?.gtDiffs?.length > 0 && (
        <PreservationSection
          title="Ground Truth Preservation"
          text="The following Ground Truth parameters configured on this Edge device will be preserved in the updated instance."
          columns={['Variant', 'Capture', 'Module', 'Class/Label', 'Parameter', 'Edge (Preserved)', 'Vision']}
          rows={preservationDetails.gtDiffs.map((d) => [d.variantName, d.captureName, d.moduleName, d.className || '-', d.parameter, formatValue(d.existingValue), formatValue(d.incomingValue)])}
        />
      )}

      {preservationDetails?.thresholdDiffs?.length > 0 && (
        <PreservationSection
          title="Threshold Preservation"
          text="The following model thresholds configured on this Edge device will be preserved in the updated instance."
          columns={['Model', 'Class', 'Threshold', 'Edge', 'Vision']}
          rows={preservationDetails.thresholdDiffs.map((d) => [d.modelName, d.className, d.parameter, formatValue(d.existingValue), formatValue(d.incomingValue)])}
        />
      )}

      {folderRenames?.length > 0 && (
        <PreservationSection
          title="Saved image folders"
          text="Folders are renamed and Reports keep opening old images."
          columns={['Level', 'Edge', 'Vision']}
          rows={folderRenames.map((f) => [f.level, f.from, f.to])}
        />
      )}

      <div className="ml-auto flex items-center gap-3 pt-2">
        <button type="button" className={`${BTN_BORDER_XS}  ${BTN_DISABLED}`} onClick={onDiscard}>Discard</button>
        <button type="button" className={`${BTN_PRIMARY_XS}  ${BTN_DISABLED}`} onClick={onUpload}>Upload</button>
      </div>
    </div>
  );
}

const HISTORY_ITEM = 'flex cursor-pointer items-center gap-2 px-4 py-2 text-[12px] text-gray-700 hover:bg-gray-50';

function RowActions({ onUpdate }) {
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState({ top: 0, left: 0 });
  const ref = useRef(null);
  const dd = useRef(null);
  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (ref.current && !ref.current.contains(e.target) && dd.current && !dd.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [open]);
  const toggle = (e) => {
    e.stopPropagation();
    if (!open && ref.current) {
      const r = ref.current.getBoundingClientRect();
      setPos({ top: r.bottom + window.scrollY, left: r.right + window.scrollX - 160 });
    }
    setOpen(!open);
  };
  return (
    <div className="relative flex justify-center">
      <div ref={ref} onClick={toggle} className="cursor-pointer rounded-full p-1 hover:bg-gray-100 ">
        <ThreeDots />
      </div>
      {open && ReactDOM.createPortal(
        <ul ref={dd} className="fixed z-[9999] w-40 rounded-md bg-white py-1 shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none" style={{ top: pos.top + 'px', left: pos.left + 'px' }}>
          <li className="flex cursor-pointer items-center gap-2 px-4 py-2 text-[12px] text-gray-700 hover:bg-gray-50" onClick={(e) => { e.stopPropagation(); onUpdate(); setOpen(false); }}>
            <Copy width="14" height="14" />
            Update
          </li>
          <li className={HISTORY_ITEM} onClick={() => setOpen(false)}>
            <Clock className="h-4 w-4" color="#000" />
            View history
          </li>
          <li className="flex cursor-pointer items-center gap-2 px-4 py-2 text-[12px] text-red-600 hover:bg-gray-50" onClick={(e) => { e.stopPropagation(); setOpen(false); }}>
            <Trash className="w-4 h-4" />
            Delete
          </li>
        </ul>,
        document.body
      )}
    </div>
  );
}

function ErrorBanner({ errorMessages, onDismiss }) {
  if (!errorMessages || errorMessages.length === 0) return null;
  return (
    <div className="absolute top-4 left-1/2 -translate-x-1/2 z-50 max-w-[550px] w-[90%] flex items-center justify-between gap-3 rounded-lg border border-red-200 bg-white px-6 py-4 shadow-lg">
      <div className="flex flex-col gap-1">
        {errorMessages.map((err, i) => (
          <div key={i} className="flex items-start gap-1">
            <span className="text-red-500 pr-2">⚠️</span>
            <span className="text-sm pt-1">{err}</span>
          </div>
        ))}
      </div>
      <button onClick={onDismiss} className="ml-2 shrink-0 text-red-500 hover:text-red-700 text-lg">✕</button>
    </div>
  );
}

function InstanceTable({ instances, flow }) {
  const { loading, loaderTitle, showWarningModal, errorMessages, mode } = flow;
  return (
    <>
      {loading && <ProjectCreateLoader title={loaderTitle} />}
      <ErrorBanner errorMessages={errorMessages} onDismiss={flow.dismissErrors} />

      <Modal isOpen={showWarningModal} onClose={flow.discard} className="!w-[80%] max-w-6xl">
        <InstanceWarningModal
          warnings={WARNINGS}
          preservationDetails={PRESERVATION}
          folderRenames={mode === 'after' ? FOLDER_RENAMES : null}
          onUpload={flow.upload}
          onDiscard={flow.discard}
          onClose={flow.discard}
        />
      </Modal>

      <Table columnCount={6} className="min-w-full">
        <TableHead>
          <TableHeadData idx={0} info>Instance ID</TableHeadData>
          <TableHeadData idx={1}>Instance Name</TableHeadData>
          <TableHeadData idx={2}>Created At</TableHeadData>
          <TableHeadData idx={3}>Updated At</TableHeadData>
          <TableHeadData idx={4} info>Team</TableHeadData>
          <TableHeadData idx={5}>Actions</TableHeadData>
        </TableHead>
        <TableBody>
          {instances.map((instance) => (
            <TableBodyRow key={instance.id} className="cursor-pointer hover:bg-gray-50">
              <TableBodyData>{instance.id}</TableBodyData>
              <TableBodyData>{instance.name}</TableBodyData>
              <TableBodyData>{new Date(Number(instance.createdAt)).toLocaleString()}</TableBodyData>
              <TableBodyData>{new Date(Number(instance.updatedAt)).toLocaleString()}</TableBodyData>
              <TableBodyData>{instance.teamName || '-'}</TableBodyData>
              <TableBodyData onClick={(e) => e.stopPropagation()}>
                <RowActions onUpdate={flow.startUpdate} />
              </TableBodyData>
            </TableBodyRow>
          ))}
        </TableBody>
      </Table>
    </>
  );
}

// ---------------------------------------------------------------- page
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

function readParams() {
  const p = new URLSearchParams(window.location.search);
  const mode = p.get('mode') === 'today' ? 'today' : 'after';
  const state = p.get('state') === 'rename-failed' ? 'rename-failed' : 'update';
  return { mode, state };
}

function initialFlow(mode, state) {
  if (state === 'rename-failed' && mode === 'after') return { showWarningModal: false, errorMessages: [FAILED_MESSAGE] };
  return { showWarningModal: true, errorMessages: [] };
}

function App() {
  const [{ mode, state }, setParams] = useState(readParams);
  const [ui, setUi] = useState(() => initialFlow(mode, state));
  const [loading, setLoading] = useState(false);
  const [loaderTitle, setLoaderTitle] = useState('Processing...');
  const [toastMsg, setToastMsg] = useState('');
  const timers = useRef([]);

  const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.current.push(t); };
  const clearTimers = () => { timers.current.forEach(clearTimeout); timers.current = []; };

  const setMode = (m) => {
    const p = new URLSearchParams(window.location.search);
    p.set('mode', m);
    p.set('state', state);
    try { window.history.replaceState(null, '', `${window.location.pathname}?${p.toString()}`); } catch (e) {}
    clearTimers();
    setLoading(false);
    setToastMsg('');
    setParams({ mode: m, state });
    setUi(initialFlow(m, state));
  };

  const flow = {
    mode, loading, loaderTitle,
    showWarningModal: ui.showWarningModal,
    errorMessages: ui.errorMessages,
    dismissErrors: () => setUi((u) => ({ ...u, errorMessages: [] })),
    discard: () => setUi({ showWarningModal: false, errorMessages: [] }),
    startUpdate: () => {
      setUi({ showWarningModal: false, errorMessages: [] });
      setLoaderTitle('Verifying...');
      setLoading(true);
      later(() => { setLoading(false); setUi({ showWarningModal: true, errorMessages: [] }); }, 1200);
    },
    upload: () => {
      setUi({ showWarningModal: false, errorMessages: [] });
      if (mode === 'after' && window.self !== window.top) {
        try { parent.postMessage({ type: 'image-storage-nav', to: 'edge-rename-failed' }, '*'); } catch (e) {}
      }
      setLoaderTitle('Processing...');
      setLoading(true);
      later(() => {
        setLoading(false);
        if (mode === 'after') {
          setUi({ showWarningModal: false, errorMessages: [FAILED_MESSAGE] });
        } else {
          setToastMsg('Instance uploaded successfully!');
          later(() => setToastMsg(''), 2000);
        }
      }, 1200);
    },
  };

  return (
    <>
      {toastMsg && (
        <div className="rht-wrap">
          <div className="rht-toast"><div className="rht-icon"></div><div className="rht-msg" role="status">{toastMsg}</div></div>
        </div>
      )}
      <Sidebar />
      <div className="relative h-full min-h-screen w-full overflow-x-auto bg-white transition-all duration-300 md:ml-[114px] md:w-[calc(100%-114px)]">
        <div className="relative">
          <Heading subcontent={<><ArrowRight /><span className="">Instance Details</span></>}>Instances</Heading>
          <div className="px-5 pt-2">
            <div className="mb-4 flex items-center justify-between gap-4">
              <Filter label="All Instances" />
              <div className="relative group inline-block">
                <button type="button" className={`${BTN_PRIMARY_LG} flex justify-end gap-2  ${BTN_DISABLED}`}>Add Instance</button>
              </div>
            </div>
          </div>
        </div>
        <div className="relative px-5 pb-5">
          <InstanceTable instances={INSTANCES} flow={flow} />
        </div>
      </div>
      {!inFrame && (
        <div className="proto-switch">
          <button className={mode === 'today' ? 'on' : ''} onClick={() => setMode('today')}>Today</button>
          <button className={mode === 'after' ? 'on' : ''} onClick={() => setMode('after')}>After</button>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
