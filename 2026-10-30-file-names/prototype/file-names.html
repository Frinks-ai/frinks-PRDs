const TIP = 'pointer-events-none w-max max-w-[300px] whitespace-normal break-words rounded border border-gray-300 bg-gray-100 px-2 py-1 text-xs font-normal text-gray-600 shadow-sm';
const Tooltip = ({ text, children, className = 'relative inline-block', align = 'center', as = 'div', below = false }) => {
  const [open, setOpen] = useState(false);
  const timer = useRef(null);
  const Trigger = as;
  const hide = () => { clearTimeout(timer.current); setOpen(false); };
  return (
    <Trigger className={className} onMouseEnter={() => { clearTimeout(timer.current); timer.current = setTimeout(() => setOpen(true), 150); }} onMouseLeave={hide} onMouseDown={hide}>
      {children}
      {open && text && (
        <div role="tooltip" style={{ zIndex: 99999 }}
          className={`absolute ${below ? 'top-full mt-1.5' : 'bottom-full mb-1.5'} ${align === 'end' ? 'right-0' : align === 'start' ? 'left-0' : 'left-1/2 -translate-x-1/2'} ${TIP}`}>{text}</div>
      )}
    </Trigger>
  );
};
const InfoTooltip = ({ text, size = 16 }) => (
  <Tooltip text={text} className="pointer-events-auto relative inline-flex items-center">
    <span role="button" tabIndex={0} aria-label={text} className="pointer-events-auto inline-flex shrink-0 items-center justify-center rounded-full text-gray-500 transition-transform hover:scale-110 focus:outline-none focus:ring-2 focus:ring-f-primary">

// src/shared/ui/SelectInput.jsx
const SelectInput = ({ data, value, onChange }) => {
  const [open, setOpen] = useState(false);
  const [hovered, setHovered] = useState(null);
  const ref = useRef(null);
  useEffect(() => {
    const h = (e) => ref.current && !ref.current.contains(e.target) && setOpen(false);
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  const selected = data.find((d) => d.id === value);
  return (
    <div className="relative" ref={ref}>
      <button type="button" onClick={() => setOpen(!open)}
        className="relative w-full min-w-[120px] cursor-default rounded-md border border-gray-300 bg-white py-2 pl-3 pr-10 text-left text-gray-900 shadow-sm focus:border-f-primary focus:outline-none focus:ring-1 focus:ring-f-primary sm:text-sm">
        <span className="block truncate">{selected ? selected.name : 'Select Instance'}</span>
        <span className="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2"><ArrowUpDown className="h-5 w-5 text-gray-400" aria-hidden="true" /></span>
      </button>
      {open && (
        <ul onMouseLeave={() => setHovered(null)} className="absolute z-[9999] mt-1 max-h-60 w-full overflow-auto rounded-md bg-white py-1 text-base shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none sm:text-sm">
          {data.map((item) => {
            const isSel = item.id === value;
            const active = hovered === item.id || (isSel && hovered === null);
            return (
              <li key={item.id} onMouseEnter={() => setHovered(item.id)} onClick={() => { setOpen(false); onChange(item); }}
                className={`relative cursor-default select-none py-2 pl-10 pr-4 ${active ? 'bg-f-primary text-white' : 'text-gray-900'}`}>

// src/modules/modal
const Modal = ({ isOpen, onClose, children, className = 'w-1/3', closeOnOutside = true }) => {
  const ref = useRef(null);
  useEffect(() => {
    if (!isOpen || !closeOnOutside) return undefined;
    const h = (e) => ref.current && !ref.current.contains(e.target) && onClose();
    const t = setTimeout(() => document.addEventListener('mousedown', h), 0);
    return () => { clearTimeout(t); document.removeEventListener('mousedown', h); };
  }, [isOpen]);
  if (!isOpen) return null;
  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-[99991] rounded-lg bg-gray-500 bg-opacity-75 transition-opacity" role="dialog" aria-modal="true">
      <div className={`relative top-[50%] mx-auto translate-y-[-50%] transform rounded-lg bg-white text-left shadow-xl transition-all ${className}`} onClick={(e) => e.stopPropagation()}>
        <div className="rounded-lg bg-white p-0" ref={ref}>{children}</div>
      </div>
    </div>,
    document.body
  );
};

const TODAY_DEFAULT = { useDate: true, useTime: true, useTimestamp: false, useVariantName: true, useCapturePositionName: false, useCameraConfigurationName: true, useResult: true, useSearchArea: true };
const SAMPLE_NOW = new Date(2026, 9, 14, 13, 10, 2, 370);
const FileNamePage = ({ notify, instance, setInstance }) => {
  const [initialConfig, setInitialConfig] = useState(TODAY_DEFAULT);
  const [cfg, setCfg] = useState(TODAY_DEFAULT);
  const [inlineError, setInlineError] = useState(false);
  const [deploymentModal, setDeploymentModal] = useState(false);
  useEffect(() => { if (Object.values(cfg).every((v) => !v)) setInlineError(true); }, [cfg]);
  const options = [
    { title: 'Use Date', key: 'useDate' },
    { title: 'Use Time', key: 'useTime' },
    { title: 'Use Timestamp', key: 'useTimestamp' },
    { title: 'Use Variant Name', key: 'useVariantName' },
    { title: 'Use Capture', key: 'useCameraConfigurationName' },
    { title: 'Use Result (Pass/Fail)', key: 'useResult' },
    { title: 'Use Search Area Name', key: 'useSearchArea' },
  ];
  const metadata = {
    date: SAMPLE_NOW.toLocaleDateString().split('/').join('-'),
    time: `${SAMPLE_NOW.toLocaleTimeString('en-US', { hour12: false })}.${SAMPLE_NOW.getMilliseconds().toString().padStart(3, '0')}`,
    timestamp: SAMPLE_NOW.getTime(),
    variantName: 'Var-1', cameraConfigurationName: 'Cam-Conf-1', result: 'Pass-1', searchArea: 'Search-Area-1',
  };
  const generateFileName = () => {
    const parts = [];
    if (cfg.useDate) parts.push(metadata.date);
    if (cfg.useTime) parts.push(metadata.time);
    if (cfg.useTimestamp) parts.push(metadata.timestamp);
    if (cfg.useVariantName) parts.push(metadata.variantName);
    if (cfg.useCameraConfigurationName) parts.push(metadata.cameraConfigurationName);
    if (cfg.useResult) parts.push(metadata.result);
    if (cfg.useSearchArea) parts.push(metadata.searchArea);
    return parts.join('_') + '.png';
  };
  const toggle = (key) => {
    if ((key === 'useTime' && cfg.useTime && !cfg.useTimestamp) || (key === 'useTimestamp' && cfg.useTimestamp && !cfg.useTime)) {
      setCfg((p) => ({ ...p, useTime: !p.useTime, useTimestamp: !p.useTimestamp }));
      notify("Time and Timestamp can't be de-selected together", false);
      return;
    }
    setInlineError(false);
    setCfg((p) => ({ ...p, [key]: !p[key] }));
  };
  const dirty = !same(cfg, initialConfig);
  const reload = () => { setDeploymentModal(false); setCfg(initialConfig); };
  return (
    <PageFrame saveDisabled={!dirty} resetDisabled={!dirty}
      saveTip={dirty ? TOOLTIP_COPY.save : TOOLTIP_COPY.saveNoChanges} resetTip={dirty ? TOOLTIP_COPY.reset : TOOLTIP_COPY.resetNoChanges}
      onSave={() => setDeploymentModal(true)} onReset={() => setCfg(initialConfig)}
      modal={<DeploymentModal isOpen={deploymentModal} onCancel={reload}
        onConfirm={() => { setInitialConfig(cfg); setDeploymentModal(false); notify('File Names updated and deployment reloaded.', true); }} />}>
      <div>
        <div className="mx-auto">
          <InstanceSelector value={instance} hasUnsavedChanges={dirty}
            onChange={(id) => { setInstance(id); setCfg(initialConfig); }} />
          <div className="mb-6 mt-0 flex items-center justify-between">
            <div className="font-semibold text-black">Customise the File Names for inferenced images being stored</div>
          </div>
          {inlineError && <div className="mb-4 text-left text-[14px] text-red-500">Please enable at least one toggle.</div>}
          <div className="mt-8 flex flex-col gap-6">
            {options.map((opt) => (
              <div key={opt.key} className="flex items-center justify-between">
                <div className="text-sm font-medium text-black">{opt.title}</div>
                <ToggleButton isOn={cfg[opt.key]} onToggle={() => toggle(opt.key)} />
              </div>
            ))}
          </div>
          <div className="mt-10 flex flex-col">
            <div className="mb-3 font-semibold text-black">Preview File Name:</div>
            <div className="rounded-lg border border-gray-300 bg-gray-50 p-4 shadow-sm">
              <div className="break-all font-mono text-sm text-black">{generateFileName()}</div>
            </div>
          </div>
        </div>
      </div>
    </PageFrame>
  );
};

                className="flex items-center justify-between rounded-md border border-gray-200 px-2.5 py-1.5 text-left text-sm transition-colors hover:border-f-primary hover:bg-[#fffaf7]">
                <span className="truncate">{x}</span><Chevron />
              </button>
            ))}
          </div>
        </>
      )}
    </div>
  );
};

/** Name builder of one capture: chips in any order, Add popup, preview. */
const NameBuilder = ({ cap, parts, onChange, init = {} }) => {
  const [adding, setAdding] = useState(!!init.adding);
  const [addStep, setAddStep] = useState(init.addStep || null); // { type } then { type, mod }
  const [keyMenu, setKeyMenu] = useState(null);
  const [drag, setDrag] = useState(null);
  const [over, setOver] = useState(null);
  const [image, setImage] = useState(init.image ?? '');
  const ref = useRef(null);
  useEffect(() => {
    const close = () => { setAdding(false); setAddStep(null); setKeyMenu(null); };
    const h = (e) => ref.current && !ref.current.contains(e.target) && close();
    const esc = (e) => e.key === 'Escape' && close();
    document.addEventListener('mousedown', h);
    document.addEventListener('keydown', esc);
    return () => { document.removeEventListener('mousedown', h); document.removeEventListener('keydown', esc); };
  }, []);
  const setParts = (next) => onChange(next);
  const setPart = (i, patch) => setParts(parts.map((x, j) => (j === i ? { ...x, ...patch } : x)));
  const usedType = (t) => parts.some((p) => p.type === t);
  const usedModule = (m) => parts.some((p) => p.type === 'key' && KEY_BY_ALIAS[p.key]?.modId === m.id);
  const add = (part) => { setParts([...parts, part]); setAdding(false); setAddStep(null); };
  const modules = cap.modules.filter(hasKeys);
  const types = MOD_TYPES.filter(([t]) => modules.some((m) => m.type === t));
  const dropAt = (to) => {
    if (drag === null) return;
    const target = Math.max(1, to); // Date & time stays first
    if (drag === target) return;
    const n = [...parts];
    const [x] = n.splice(drag, 1);
    n.splice(target, 0, x);
    setParts(n);
  };
  const invalid = textInvalid(parts);
  const img = image === '' ? null : image;

  const optionRow = (o) => {
    const used = usedType(o.type);
    return (
      <button key={o.type} type="button" disabled={used} onClick={() => add({ type: o.type })}
        className="flex w-full items-center justify-between gap-2 rounded px-2 py-1 text-left text-sm hover:bg-gray-50 disabled:text-gray-300 disabled:hover:bg-transparent">
        <span className="truncate">{o.label}</span>
        {used ? <Tag>Added</Tag> : <span className="truncate font-mono text-[11px] text-gray-400">{o.sample(cap, cap.sas[0]?.name)}</span>}
      </button>
    );
  };

  return (
    <div ref={ref} className="flex flex-col gap-3">
      <div className="relative flex min-h-[48px] flex-wrap items-center gap-1 rounded-md border border-gray-300 px-2 py-2">
        {parts.map((p, i) => {
          const fixed = p.type === 'datetime';
          const removable = !fixed && p.type !== 'sa';
          const group = partGroup(p);
          const k = p.type === 'key' ? KEY_BY_ALIAS[p.key] : null;
          const mod = k && MODULE_BY_ID[k.modId];
          const badText = p.type === 'text' && !TEXT_RE.test(p.text || '');
          const chip = (
            <span draggable={!fixed}
              onDragStart={(e) => { if (fixed) return; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); setDrag(i); setKeyMenu(null); }}
              onDragOver={(e) => { e.preventDefault(); setOver(i); }}
              onDragLeave={() => setOver((o) => (o === i ? null : o))}
              onDrop={(e) => { e.preventDefault(); dropAt(i); setDrag(null); setOver(null); }}
              onDragEnd={() => { setDrag(null); setOver(null); }}
              title={fixed ? undefined : p.type === 'sa' ? 'Always in the file name. Drag to move.' : 'Drag to move'}
              className={`relative flex items-center gap-1 rounded py-1 text-xs font-medium ${fixed ? 'cursor-default px-2' : 'cursor-grab pl-1 pr-1.5'} ${GROUP_STYLE[group].chip} ${drag === i ? 'opacity-40' : ''} ${over === i && drag !== null && drag !== i ? 'ring-2 ring-f-primary' : ''}`}>
              {!fixed && <span className="opacity-40"><Icon d={ICONS.grip} size={12} /></span>}
              {p.type === 'text' ? (
                <input aria-label="Custom text" aria-invalid={badText}
                  className={`w-24 rounded border bg-white/70 px-1 font-mono text-xs focus:outline-none ${badText ? 'border-red-500 text-red-600' : 'border-transparent focus:border-f-primary'}`}
                  value={p.text || ''} placeholder="text" maxLength={40}
                  onChange={(e) => setPart(i, { text: e.target.value })} onMouseDown={(e) => e.stopPropagation()} />
              ) : p.type === 'key' ? (
                <>
                  <span title={partLabel(p)}>{mod?.name}</span>
                  <span className="opacity-60">→</span>
                  <button type="button" title={partLabel(p)} onClick={() => { setKeyMenu(keyMenu === i ? null : i); setAdding(false); }} className="flex items-center gap-0.5 rounded bg-white/70 px-1 font-mono hover:bg-white">
                    {k?.sub ? `${k.sub} › ` : ''}{k?.keyName}<Icon d={ICONS.chevronDown} size={12} />
                  </button>
                </>
              ) : PART[p.type]?.label}
              {removable && (
                <button type="button" aria-label={`Remove ${partLabel(p)}`} onClick={() => { setParts(parts.filter((_, j) => j !== i)); setKeyMenu(null); }}
                  className="ml-0.5 rounded p-0.5 opacity-50 hover:bg-white hover:text-red-500 hover:opacity-100"><Icon d={ICONS.x} size={11} /></button>
              )}
              {keyMenu === i && mod && (
                <div className="pop-in absolute left-0 top-full z-30 mt-1 w-[560px] max-w-[85vw] rounded-lg border border-gray-200 bg-white p-3 text-black shadow-xl" onMouseDown={(e) => e.stopPropagation()} draggable={false} onDragStart={(e) => e.preventDefault()}>
                  <KeyPicker cols="grid-cols-2" mod={mod} value={p.key} onPick={(nk) => { setPart(i, { key: nk.alias }); setKeyMenu(null); }} />
                </div>
              )}
            </span>
          );
          return (
            <React.Fragment key={i}>
              {i > 0 && <span className="px-0.5 font-mono text-xs text-gray-300">_</span>}
              {fixed ? <Tooltip text="Always first in the file name" className="relative inline-flex" align="start">{chip}</Tooltip> : chip}
            </React.Fragment>
          );
        })}
        <span className="ml-1">
          <button type="button" onClick={() => { setAdding(!adding); setAddStep(null); setKeyMenu(null); }}
            className={`flex items-center gap-1 rounded border border-dashed border-f-primary px-2 py-1 text-xs font-medium text-f-primary hover:bg-[#fff8f5] ${adding ? 'bg-[#fff4ee]' : ''}`}>
            <Icon d={ICONS.plus} size={12} /> Add
          </button>
          {adding && (
            <div className="pop-in absolute left-0 right-0 top-full z-30 mt-1 max-h-[75vh] overflow-y-auto rounded-lg border border-gray-200 bg-white p-3 shadow-xl">
              {addStep?.mod ? (
                <KeyPicker mod={addStep.mod} onPick={(x) => add({ type: 'key', key: x.alias })}
                  onBack={() => setAddStep({ type: addStep.type })} backLabel={TYPE_LABEL[addStep.type]} initialSub={addStep.sub || null} />
              ) : addStep ? (
                <>
                  <MenuBack onClick={() => setAddStep(null)}>Add</MenuBack>
                  <MenuHead>{TYPE_LABEL[addStep.type]} → choose a module</MenuHead>
                  <div className="grid grid-cols-3 gap-1.5 px-1">
                    {modules.filter((m) => m.type === addStep.type).map((m) => (
                      <button key={m.id} type="button" disabled={usedModule(m)} onClick={() => setAddStep({ type: m.type, mod: m })}
                        className="flex items-center justify-between rounded-md border border-gray-200 px-2.5 py-1.5 text-left text-sm transition-colors hover:border-f-primary hover:bg-[#fffaf7] disabled:border-gray-100 disabled:bg-gray-50 disabled:text-gray-300">
                        <span className="truncate">{m.name}</span>{usedModule(m) ? <Tag>Added</Tag> : <Chevron />}
                      </button>
                    ))}
                  </div>
                </>
              ) : (
                <div className="grid grid-cols-5 gap-3">
                  <div className="flex flex-col gap-0.5">
                    <MenuHead>Product</MenuHead>
                    {['variant', 'capture', 'sa'].map((t) => optionRow(PART[t]))}
                  </div>
                  <div className="flex flex-col gap-0.5">
                    <MenuHead>Result</MenuHead>
                    {['result', 'sa_result'].map((t) => optionRow(PART[t]))}
                  </div>
                  <div className="col-span-2 grid grid-cols-2 content-start gap-x-3 gap-y-0.5">
                    <p className="col-span-2 px-2 pb-1 pt-1.5 text-[11px] font-semibold uppercase tracking-wide text-gray-400">Module types</p>
                    {types.length === 0 && <p className="col-span-2 px-2 py-1 text-xs text-gray-400">No modules with values in this capture</p>}
                    {types.map(([t, label]) => (
                      <button key={t} type="button" onClick={() => setAddStep({ type: t })}
                        className="flex w-full items-center justify-between gap-2 rounded px-2 py-1 text-left text-sm hover:bg-gray-50">
                        <span className="truncate">{label}</span><Chevron />
                      </button>
                    ))}
                  </div>
                  <div className="flex flex-col gap-0.5">
                    <MenuHead>Unique &amp; other</MenuHead>
                    {optionRow(PART.cycle_id)}
                    <button type="button" disabled={usedType('text')} onClick={() => add({ type: 'text', text: 'Line3' })}
                      className="flex w-full items-center justify-between gap-2 rounded px-2 py-1 text-left text-sm hover:bg-gray-50 disabled:text-gray-300 disabled:hover:bg-transparent">
                      <span className="truncate">Custom text</span>{usedType('text') ? <Tag>Added</Tag> : <span className="font-mono text-[11px] text-gray-400">text</span>}
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}
        </span>
      </div>
      {invalid && <p className="-mt-1 text-left text-[14px] text-red-500">{TEXT_ERR}</p>}
      <div className="rounded-lg border border-gray-300 bg-gray-50 px-4 py-3">
        <div className="mb-1 flex items-center justify-between gap-3">
          <p className="text-xs font-medium text-gray-500">Preview file name</p>
          <label className="flex items-center gap-1.5 text-xs text-gray-500">Image:
            <select value={image} onChange={(e) => setImage(e.target.value)}
              className="rounded-md border border-gray-300 bg-white px-2 py-0.5 text-xs text-black focus:border-f-primary focus:outline-none focus:ring-1 focus:ring-f-primary">
              <option value="">Raw image (Input image)</option>
              {cap.sas.map((s) => <option key={s.name} value={s.name}>{saPath(cap, s.name)}</option>)}
            </select>
          </label>
        </div>
        <p className="break-all font-mono text-sm text-black">{renderName(parts, cap, img)}</p>
      </div>
    </div>

};

/* Preset states (rendered from the query string, no clicks needed) */
const key = (modId, name, sub = '') => `${modId}|${sub}|${name}`;
const presetOf = (state, store) => {
  const caps = capturesOf(store.instance);
  const [c1, c2, c3] = caps;
  const names = { ...store.names };
  const base = { names, savedNames: store.savedNames, editing: null, init: {}, modal: false, readOnly: false, pending: null };
  const withCap1 = (extra) => ({ ...names, [c1.id]: [...(names[c1.id] || DEFAULT_PARTS).filter((p) => !(p.type === extra.type && p.key === extra.key)), extra] });
  const anyChanged = caps.some((c) => !same(store.names[c.id], store.savedNames[c.id]));
  switch (state) {
    case 'edit': return { ...base, editing: c1.id };
    case 'add': return { ...base, editing: c1.id, init: { adding: true } };
    case 'key': return { ...base, editing: c1.id, init: { adding: true, addStep: { type: 'OCR', mod: MODULE_BY_ID.m2 } } };
    case 'preview-seal': return { ...base, editing: c1.id, names: withCap1({ type: 'key', key: key('m7', 'current_count', 'Screw') }), init: { image: 'Label' } };
    case 'custom-error': return { ...base, editing: c1.id, names: { ...names, [c1.id]: [...(names[c1.id] || DEFAULT_PARTS).filter((p) => p.type !== 'text'), { type: 'text', text: '.Line 3' }] } };
    case 'save-confirm': return anyChanged ? { ...base, modal: true } : {
      ...base, modal: true,
      names: {
        ...names,
        [c1.id]: [{ type: 'datetime' }, { type: 'cycle_id' }, { type: 'variant' }, { type: 'capture' }, { type: 'result' }, { type: 'sa' }, { type: 'key', key: key('m1', 'detected_string') }],
        [c3.id]: [{ type: 'datetime' }, { type: 'variant' }, { type: 'capture' }, { type: 'sa' }, { type: 'sa_result' }],
      },
    };
    case 'deployed': return { ...base, names: store.savedNames, readOnly: true };
    case 'unsaved': return {
      ...base, pending: INSTANCES.find((i) => i.id !== store.instance).id,
      names: anyChanged ? names : { ...names, [c1.id]: [{ type: 'datetime' }, { type: 'cycle_id' }, ...(names[c1.id] || DEFAULT_PARTS).slice(1).filter((p) => p.type !== 'cycle_id')] },
    };
    default: return base;
  }
};

const FileNamesPage = ({ store, setStore }) => {
  const [preset] = useState(() => presetOf(STATE, store));
  const [names, setNamesState] = useState(preset.names);
  const [savedNames, setSaved] = useState(preset.savedNames);
  const [instance, setInstanceState] = useState(store.instance);
  const [editing, setEditing] = useState(preset.editing);
  const [before, setBefore] = useState(preset.editing ? store.names[preset.editing] : null);
  const [modal, setModal] = useState(preset.modal);
  const readOnly = preset.readOnly;
  const caps = capturesOf(instance);

  // Another screen (or step) changed the shared store
  useEffect(() => {
    const onStorage = (e) => {
      if (e.key !== STORE_KEY) return;
      const s = readStore();
      setNamesState(readOnly ? s.savedNames : s.names); setSaved(s.savedNames); setInstanceState(s.instance);
    };
    window.addEventListener('storage', onStorage);
    return () => window.removeEventListener('storage', onStorage);
  }, []);
  const persist = (n, s, inst) => { const v = { names: n, savedNames: s, instance: inst }; writeStore(v); setStore(v); };
  const setNames = (fn) => setNamesState((all) => { const next = typeof fn === 'function' ? fn(all) : fn; persist(next, savedNames, instance); return next; });

  const changedCaps = caps.filter((c) => !same(names[c.id], savedNames[c.id]));
  const dirty = changedCaps.length > 0;
  const invalid = caps.some((c) => textInvalid(names[c.id]));
  const startEdit = (c) => {
    if (readOnly) return;
    if (IN_SHELL && STATE === 'table' && c.id === caps[0].id) { nav('edge-edit-name'); return; }
    setEditing(c.id); setBefore(names[c.id]);
  };
  const cancelEdit = () => { setNames((all) => ({ ...all, [editing]: before })); setEditing(null); };
  const reset = () => { setEditing(null); setNames((all) => ({ ...all, ...Object.fromEntries(caps.map((c) => [c.id, savedNames[c.id]])) })); };
  const confirmSave = () => {
    const nextSaved = { ...savedNames, ...Object.fromEntries(caps.map((c) => [c.id, names[c.id]])) };
    setSaved(nextSaved); setEditing(null); setModal(false);
    persist(names, nextSaved, instance);
    nav('edge-file-names');
  };
  const switchInstance = (id, discard) => {
    let n = names;
    if (discard) { n = { ...names, ...Object.fromEntries(caps.map((c) => [c.id, savedNames[c.id]])) }; setNamesState(n); }
    setEditing(null); setInstanceState(id); persist(n, savedNames, id);
  };

  const saveDisabled = readOnly || !dirty || invalid;
  const saveTip = readOnly ? LOCK_MSG : invalid ? TOOLTIP_COPY.saveFixErrors : dirty ? TOOLTIP_COPY.save : TOOLTIP_COPY.saveNoChanges;
  const resetTip = readOnly ? LOCK_MSG : dirty ? TOOLTIP_COPY.reset : TOOLTIP_COPY.resetNoChanges;

  return (
    <PageFrame saveDisabled={saveDisabled} resetDisabled={readOnly || !dirty} saveTip={saveTip} resetTip={resetTip}
      onSave={() => setModal(true)} onReset={reset}
      modal={<SaveNamesModal isOpen={modal && dirty} onCancel={() => setModal(false)} onSave={confirmSave}
        changed={changedCaps.map((c) => ({ cap: c, before: savedNames[c.id], after: names[c.id] }))} />}>
      <div className="mx-auto">
        <InstanceSelector value={instance} hasUnsavedChanges={dirty} onChange={switchInstance} initialPending={preset.pending} />
        <div className="mx-auto mt-6 flex flex-col gap-2">
          {readOnly && (
            <div className="flex justify-end"><div role="note" className={TIP}>{LOCK_MSG}</div></div>
          )}
          {/* shared/ui/Table.jsx look */}
          <div className="w-full">
            <table className="min-w-full table-fixed divide-y divide-gray-300">
              <colgroup><col style={{ width: '16%' }} /><col style={{ width: '12%' }} /><col /></colgroup>
              <thead className="sticky top-0 z-10">
                <tr className="relative bg-f-primary">
                  {['Variant', 'Capture', 'File Name'].map((h, i) => (
                    <th key={h} scope="col" className="group relative px-2 py-2 pb-4 pt-4 text-center text-base font-medium text-white">
                      {h}
                      {i < 2 && <div className="absolute bottom-2.5 right-0 top-2.5 w-0.5 rounded-2xl bg-white" />}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-200 bg-white">
                {caps.map((c) => {
                  const isEditing = editing === c.id;
                  const changed = !same(names[c.id], savedNames[c.id]);
                  return (
                    <React.Fragment key={c.id}>
                      <tr className={isEditing ? 'bg-[#fffaf7]' : ''}>
                        <td className="px-2 py-2 text-center font-semibold text-black">{c.variant}</td>
                        <td className="px-2 py-2 text-center text-black">{c.capture}</td>
                        <td className="px-4 py-2.5">
                          <div className="flex items-start gap-2">
                            <NameSummary parts={names[c.id]} cap={c} />
                            {changed && <span className="mt-0.5 shrink-0 rounded bg-amber-50 px-1.5 py-0.5 text-[10px] font-medium text-amber-700">Unsaved</span>}
                            {!isEditing && (
                              <button type="button" aria-label={`Edit file name of ${c.variant} ${c.capture}`} title={readOnly ? LOCK_MSG : 'Edit file name'}
                                disabled={readOnly} onClick={() => startEdit(c)}
                                className={`-mt-0.5 shrink-0 rounded-md p-1.5 ${readOnly ? 'cursor-not-allowed opacity-30' : 'hover:bg-gray-100'}`}>
                                <EditIcon stroke={readOnly ? '#9ca3af' : '#0E0F0F'} />
                              </button>
                            )}
                          </div>
                        </td>
                      </tr>
                      {isEditing && (
                        <tr className="bg-[#fffaf7]">
                          <td colSpan={3} className="px-5 pb-4 pt-1">
                            <div className="pop-in rounded-md border border-gray-200 bg-white p-4">
                              <NameBuilder key={c.id} cap={c} parts={names[c.id]} init={preset.editing === c.id ? preset.init : {}}
                                onChange={(n) => setNames((all) => ({ ...all, [c.id]: n }))} />
                              <div className="mt-4 flex justify-end gap-2">
                                <Button variant="border" className="w-24" onClick={cancelEdit}>Cancel</Button>
                                <Button className="w-24" disabled={textInvalid(names[c.id])} onClick={() => setEditing(null)}>Done</Button>
                              </div>
                            </div>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </PageFrame>
  );
};

  const [store, setStore] = useState(readStore);
  const [toast, setToast] = useState(null);
  const notify = (msg, success = false) => { setToast({ msg, success }); clearTimeout(toastTimer); toastTimer = setTimeout(() => setToast(null), 3600); };
  useEffect(() => {
    const onStorage = (e) => { if (e.key === STORE_KEY) setStore(readStore()); };
    window.addEventListener('storage', onStorage);
    return () => window.removeEventListener('storage', onStorage);
  }, []);
  const setMode = (m) => {
    setModeState(m);
    const p = new URLSearchParams(window.location.search);
    p.set('mode', m);
    try { window.history.replaceState(null, '', `${window.location.pathname}?${p.toString()}`); } catch (e) { /* file URL */ }
  };
  const setInstance = (id) => { const v = { ...store, instance: id }; writeStore(v); setStore(v); };
  return (
    <>
      <Toast toast={toast} />
      {!IN_SHELL && <ModeSwitch mode={mode} setMode={setMode} />}
      <Sidebar collapsed={collapsed} setCollapsed={setCollapsed} />
      <div className={`relative h-full min-h-screen w-full overflow-x-auto bg-white transition-all duration-300 ${collapsed ? 'md:ml-[114px] md:w-[calc(100%-114px)]' : 'md:ml-[350px] md:w-[calc(100%-350px)]'}`}
        onClick={() => { if (!collapsed) setCollapsed(true); }}>
        {mode === 'today'
          ? <FileNamePage key="today" notify={notify} instance={store.instance} setInstance={setInstance} />
          : <FileNamesPage key="after" store={store} setStore={setStore} />}
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
