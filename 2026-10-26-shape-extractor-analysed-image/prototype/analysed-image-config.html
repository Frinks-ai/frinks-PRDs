*,*::before,*::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
html,body{margin:0;padding:0}
html{font-size:16px;height:100vh;overflow-y:hidden}
body{height:100vh;width:100vw;overflow:auto;color:#000;background:#fff;font-family:'Outfit',sans-serif;line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;color-scheme:light}
p,h1,h2,h3{margin:0}
button,input{font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;color:inherit;margin:0;padding:0}
button{background:transparent;background-image:none;cursor:pointer;text-transform:none}
button:disabled{cursor:default}
ul{list-style:none;margin:0;padding:0}
svg{display:block;vertical-align:middle}
a{color:inherit;text-decoration:inherit}
table{text-indent:0;border-color:inherit;border-collapse:collapse}
@media (max-width:1281px){*{font-size:96%}}

/* ---- sidebar (shared/layouts/main/sidebar.jsx) ---- */
.sb{position:fixed;left:0;top:0;z-index:100;display:flex;height:100vh;width:114px;flex-direction:column;align-items:center;border-right:1px solid #d1d5db;background:#1e1c1c;padding:24px 8px;overflow:hidden;white-space:nowrap;box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);transition:all .3s cubic-bezier(.4,0,.2,1)}
.sb.open{width:350px;padding-left:20px;padding-right:20px}
.sb-in{display:flex;min-height:0;width:100%;flex:1;flex-direction:column}
.sb-logo{margin-bottom:40px;margin-top:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:all .3s}
.sb.open .sb-logo{margin-left:-12px}
.sb-logo svg{width:60px;height:60px;transition:all .3s cubic-bezier(.4,0,.2,1)}
.sb.open .sb-logo svg{width:265px}
.sb-menu{margin-top:32px;min-height:0;width:100%;flex:1;overflow-y:auto;overflow-x:hidden}
.sb-menu>ul{display:flex;width:100%;flex-direction:column;gap:8px;padding-bottom:16px}
.sb-li{display:flex;flex-direction:column;border-radius:8px;transition:all .3s}
.sb-li.parent:hover{background:rgba(255,255,255,.1)}
.sb-li.isopen{padding-bottom:12px}
.sb-item{display:flex;align-items:center;border-radius:6px;padding:8px 36px;color:#fff;overflow:hidden;cursor:pointer;transition:all .3s}
.sb-li.leaf .sb-item:hover{background:rgba(255,255,255,.2)}
.sb-ic{display:flex;width:24px;flex-shrink:0;align-items:center;justify-content:center}
.sb-lbl{font-size:18px;line-height:28px;width:0;opacity:0;transition:all .3s}
.sb.open .sb-lbl{width:auto;margin-left:16px;opacity:1}
.sb-chev{margin-left:auto;opacity:0;transition:opacity .3s}
.sb-item:hover .sb-chev{opacity:1}
.sb-sub{margin-left:40px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.sb-subitem{margin-right:24px;display:flex;align-items:center;border-radius:6px;padding:8px 36px;font-size:14px;line-height:20px;color:#fff;cursor:pointer}
.sb-subitem:hover{background:rgba(255,255,255,.2)}
.sb-subitem.grp{margin-right:0}
.sb-subitem.grp.act:hover{background:transparent}
.sb-subsub{margin-left:24px;margin-top:4px;display:flex;flex-direction:column;gap:4px}
.sb-leaf{margin-right:24px;display:flex;align-items:center;border-radius:6px;padding:8px 36px;font-size:12px;line-height:16px;color:#fff;cursor:pointer}
.sb-leaf:hover,.sb-leaf.active{background:rgba(255,255,255,.2)}
.sb-bot{margin-top:8px;display:flex;width:100%;flex-shrink:0;flex-direction:column;gap:8px;padding-top:12px}
.sb-toggle{display:flex;width:100%;align-items:center;justify-content:center;border-radius:6px;padding:8px 0;color:#fff;transition:opacity .15s}
.sb-toggle:hover{opacity:.75}
.sb.open .sb-toggle svg{margin-left:auto}

/* ---- main + heading + page box (index.jsx) ---- */
.main{position:relative;min-height:100vh;width:calc(100% - 114px);margin-left:114px;overflow-x:auto;background:#fff;transition:all .3s cubic-bezier(.4,0,.2,1)}
.main.open{margin-left:350px;width:calc(100% - 350px)}
.heading{margin-top:4px;display:flex;height:60px;align-items:baseline;gap:8px;background:#fff;padding:16px 20px}
.h-main{font-size:30px;line-height:36px;font-weight:500}
.h-sub{display:flex;align-items:baseline;gap:8px;font-size:20px;line-height:28px;font-weight:500}
.h-sub .arrow{width:16px;height:16px}
.self-center{align-self:center}
.box{margin:20px auto;border:1px solid #e5e7eb;border-radius:4px;background:#fff}
.box-in{padding:16px 16px 80px;min-height:84vh}
.dbx{padding:16px;color:#000}
.info-ic{display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;border-radius:9999px;color:#6b7280;transition:transform .15s}
.info-ic:hover{transform:scale(1.1)}
.info-ic.w{color:#fff}

/* ---- InstanceSelector / variant ---- */
.wfull{width:100%}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}.mb6{margin-bottom:24px}
.lbl-sel{margin-bottom:8px;display:block;font-size:14px;line-height:20px;font-weight:600;color:#000}
.lbl-var{margin-bottom:8px;font-size:14px;line-height:20px;font-weight:500}

/* ---- footer (index.jsx) ---- */
.footer{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:1px solid #e5e7eb}
.footer-in{display:flex;justify-content:flex-end;gap:12px;border-top:1px solid #e5e7eb;padding:12px 20px}
.tipw{position:relative;display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;height:fit-content;cursor:pointer;border:1px solid transparent;font-size:14px;line-height:20px;padding:8px 24px;border-radius:6px;background:#ff4301;color:#fff;white-space:nowrap}
.btn:hover{background:rgba(255,67,1,.9)}
.btn.bordered{background:transparent;border-color:#ff4301;color:#ff4301}
.btn.bordered:hover{opacity:.7;background:rgba(255,255,255,.9)}
.btn.flat:hover{opacity:.7;background:#ff4301}
.btn.w24{width:96px}
.btn:disabled,.btn:disabled:hover{background:#d1d5db;color:#6b7280;border-color:transparent;cursor:not-allowed;opacity:1}

/* ---- SelectInput (shared/ui/SelectInput.jsx) ---- */
.rel{position:relative}
.sel{position:relative;display:block;width:100%;min-width:120px;cursor:default;border-radius:6px;border:1px solid #d1d5db;background:#fff;padding:8px 40px 8px 12px;text-align:left;box-shadow:0 1px 2px 0 rgba(0,0,0,.05);font-size:14px;line-height:20px;color:#111827}
.sel.cell{height:24px;display:flex;align-items:center}
.sel:focus,.sel.isopen{outline:none;border-color:#ff4301;box-shadow:0 0 0 1px #ff4301,0 1px 2px 0 rgba(0,0,0,.05)}
.sel-v{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-v.ph{color:#6b7280}
.sel-a{pointer-events:none;position:absolute;top:0;bottom:0;right:0;display:flex;align-items:center;padding-right:8px}
.sel-a svg{width:20px;height:20px}
.dd{position:fixed;z-index:9999;max-height:240px;overflow:auto;border-radius:6px;background:#fff;padding:4px 0;font-size:14px;line-height:20px;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1)}
.dd li{position:relative;cursor:default;user-select:none;padding:8px 16px 8px 40px;color:#111827}
.dd li .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
.dd li.on .t{font-weight:600}
.dd li.hov{background:#ff4301;color:#fff}
.dd li .tick{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;padding-left:12px;color:#000}
.dd li .tick svg{width:20px;height:20px}
.dd li.empty{padding:8px 36px 8px 12px;font-style:italic;color:#6b7280}
.mtip{position:fixed;z-index:10000;pointer-events:none;max-width:300px;border-radius:4px;background:rgba(97,97,97,.92);padding:4px 8px;font-family:Roboto,Helvetica,Arial,sans-serif;font-size:11px;line-height:1.4em;font-weight:500;color:#fff;word-wrap:break-word}

/* ---- Table (shared/ui/Table.jsx) ---- */
.tblroot{display:flow-root;width:100%;overflow-x:auto;overflow-y:visible}
.tblinner{width:max-content;min-width:100%}
table.tbl{min-width:100%}
table.tbl>:not([hidden])~:not([hidden]){border-top:1px solid #d1d5db;border-bottom-width:0}
.tbl thead{position:sticky;top:0;z-index:10}
.tbl thead tr{background:#ff4301;position:relative}
.tbl th{position:sticky;top:0;padding:16px 8px;text-align:center;font-size:16px;line-height:24px;font-weight:500;color:#fff}
.tbl th .rs{position:absolute;bottom:10px;right:0;top:10px;width:2px;cursor:col-resize;border-radius:16px;background:#fff}
.tbl th:last-child .rs{display:none}
.tbl th .thi{display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tbl tbody{background:#fff}
.tbl tbody>:not([hidden])~:not([hidden]){border-top:1px solid #e5e7eb;border-bottom-width:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#f3f4f6}
.tbl td{padding-top:12px;padding-bottom:12px}
.tbl td>.c{display:flex;height:100%;width:100%;align-items:center;justify-content:center;text-align:center}
.cbx{cursor:default}
.fc{display:flex;flex-direction:column;gap:8px}
.fr{display:flex;align-items:center;gap:8px}
.pl{width:40px;font-size:12px;line-height:16px}
.sw5{width:20px;height:20px;border-radius:4px;border:1px solid #e5e7eb}
.sw6{width:24px;height:24px;border-radius:4px;border:1px solid #e5e7eb}
.mw36{min-width:144px}
.correct{display:inline-flex;align-items:center;border-radius:9999px;border:1px solid #bbf7d0;background:#dcfce7;padding:2px 8px;font-size:12px;line-height:16px;font-weight:500;color:#166534}
.err-inline{margin-bottom:16px;text-align:center;font-size:14px;line-height:20px;color:#ef4444}

/* ---- tooltip (shared/components/Tooltip.jsx) ---- */
.tip{position:fixed;z-index:99999;pointer-events:none;width:max-content;max-width:300px;white-space:normal;overflow-wrap:break-word;border-radius:4px;border:1px solid #d1d5db;background:#f3f4f6;padding:4px 8px;font-size:12px;line-height:16px;color:#4b5563;box-shadow:0 1px 2px 0 rgba(0,0,0,.05)}
.tip.sbt{border:0;max-width:200px;background:#ff4301;padding:6px 10px;font-weight:600;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3)}

/* ---- Today / After switch (outside an iframe only) ---- */
.modesw{position:fixed;top:12px;right:16px;z-index:300;display:flex;border:1px solid #d1d5db;border-radius:9999px;background:#fff;padding:2px;box-shadow:0 1px 3px rgba(0,0,0,.12);font-size:12px;line-height:16px}
.modesw button{border-radius:9999px;padding:4px 10px;color:#374151;font-weight:500}
.modesw button.on{background:#1e1c1c;color:#fff}
</style>
</head>

document.addEventListener('mouseover', function (e) {
  var sb = e.target.closest('[data-sbtip]');
  if (sb && !App.sidebarOpen && sb.getAttribute('data-sbtip')) { showTip(sb, sb.getAttribute('data-sbtip'), 'right', true); return; }
  var t = e.target.closest('[data-tip]');
  if (t) showTip(t, t.getAttribute('data-tip'), 'top', false);
});
document.addEventListener('mouseout', function (e) { var t = e.target.closest('[data-tip],[data-sbtip]'); if (t && !t.contains(e.relatedTarget)) hideTip(); });

/* =========================================================================
 * Interactions
 * ========================================================================= */
function afterChange(id) {
  App.inlineError = false;
  if (id === SE_ID) pushSE();          // the Shape Extractor row is shared with the analysed-image screen
  renderMain(); renderFooter();
}
function onSelect(key, val) {
  var p = key.split(':'), field = p[0], id = p[1];
  if (!id) return;                     // instance / variant: one option each
  var v = (field === 'boxWidth' || field === 'labelSize') ? parseInt(val, 10) : val;
  App.cur[field][id] = v;
  afterChange(id);
}
function doSave() {
  if (!dirty()) return;
  var c = App.cur, vals = function (o) { return Object.keys(o).map(function (k) { return o[k]; }); };
  if (vals(c.boxColor).indexOf('') >= 0 || vals(c.boxWidth).indexOf(0) >= 0 || vals(c.labelSize).indexOf(0) >= 0) { App.inlineError = true; renderMain(); return; }
  pushSE();
  App.init = clone(App.cur);           // the page reloads its rows after a save
  renderMain(); renderFooter();
  nav('edge-analysed');
}
function doReset() {
  if (!dirty()) return;
  App.cur = clone(App.init); App.inlineError = false;
  pushSE();
  renderMain(); renderFooter();
}

document.addEventListener('mousedown', function (e) { if (openDD && !layer.contains(e.target) && !e.target.closest('[data-sel="' + openDD + '"]')) closeLayer(); });
document.addEventListener('click', function (e) {
  var t = e.target;
  var sel = t.closest('[data-sel]'); if (sel && !sel.disabled) { openSelect(sel); return; }
  var act = t.closest('[data-act]');
  if (!act) { if (App.sidebarOpen && t.closest('#main')) { App.sidebarOpen = false; renderSidebar(); } return; }
  var a = act.getAttribute('data-act');
  if (a !== 'sb-toggle' && a !== 'sb-expand' && a !== 'sb-sub' && App.sidebarOpen && t.closest('#main')) { App.sidebarOpen = false; renderSidebar(); }
  if (a === 'sb-toggle') { App.sidebarOpen = !App.sidebarOpen; hideTip(); renderSidebar(); }
  else if (a === 'sb-expand') { if (!App.sidebarOpen) { App.sidebarOpen = true; hideTip(); renderSidebar(); } }
  else if (a === 'sb-sub') { App.subOpen = !App.subOpen; renderSidebar(); }
  else if (a === 'save') { if (!act.disabled) doSave(); }
  else if (a === 'reset') { if (!act.disabled) doReset(); }
  else if (a === 'mode') {
    var m = act.getAttribute('data-val'); if (m === MODE) return; MODE = m;
    try { var u = new URL(location.href); u.searchParams.set('mode', m); history.replaceState(null, '', u.toString()); } catch (err) { /* file:// */ }
    closeLayer(); load(); renderAll(); maybeOpenColour();
  }
});
document.addEventListener('change', function (e) {
  var cb = e.target.closest && e.target.closest('[data-show]'); if (!cb) return;
  var id = cb.getAttribute('data-show'); App.cur.show[id] = !App.cur.show[id];
  afterChange(id);
});
window.addEventListener('scroll', function () { placeList(); hideTip(); }, true);
window.addEventListener('resize', function () { placeList(); });

// Shared state changed in another tab / the other screen
window.addEventListener('storage', function (e) {
  if (e.key !== null && e.key !== LS_KEY) return;
  if (!hasSE()) return;
  var S = readShared(), set = function (o) { o.boxColor[SE_ID] = S.color; o.boxWidth[SE_ID] = S.width; o.labelSize[SE_ID] = S.size; o.textPosition[SE_ID] = S.textPosition; o.textPlacement[SE_ID] = S.textPlacement; };
  set(App.init); App.init.show[SE_ID] = S.show; set(App.cur); App.cur.show[SE_ID] = STATE === 'show' ? true : S.show;
  closeLayer(); renderMain(); renderFooter();
});

/* =========================================================================
 * Boot
 * ========================================================================= */
// state=show: the Shape Extractor row's colour list is open.
function maybeOpenColour() {
  if (!(isAfter() && STATE === 'show' && hasSE())) return;
  var b = document.querySelector('[data-sel="boxColor:' + SE_ID + '"]'); if (!b) return;
  if (openDD !== 'boxColor:' + SE_ID) openSelect(b); else placeList();
}
load();
renderAll();
maybeOpenColour();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { placeList(); });
})();
</script>
</body>
</html>
