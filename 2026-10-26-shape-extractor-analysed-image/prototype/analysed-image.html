  /* preflight subset */
  *, *::before, *::after { box-sizing: border-box; border: 0 solid #e5e7eb; margin: 0; padding: 0; }
  html, body { font-size: 16px; height: 100vh; width: 100vw; overflow-y: hidden; color: black; }
  :root {
    font-family: 'Outfit', sans-serif; font-optical-sizing: auto; line-height: 1.5; font-weight: 400;
    color-scheme: light; font-synthesis: none; text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  body { font-family: 'Outfit', sans-serif; line-height: inherit; background: #fff; overflow: auto; }
  button, input { font-family: inherit; font-size: 100%; font-weight: inherit; line-height: inherit; color: inherit; background: transparent; }
  button { cursor: pointer; }
  img, svg { display: block; vertical-align: middle; }
  img { max-width: 100%; height: auto; }
  ul { list-style: none; }
  a { color: inherit; text-decoration: inherit; }
  table { text-indent: 0; border-color: inherit; border-collapse: collapse; }
  @media (max-width: 1281px) { * { font-size: 96%; } }

  /* sidebar (collapsed) */
  .sb { position: fixed; left: 0; top: 0; height: 100vh; width: 114px; display: flex; flex-direction: column; align-items: center;
        border-right: 1px solid #d1d5db; background: #1e1c1c; padding: 24px 8px; overflow: hidden; white-space: nowrap;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1); z-index: 100; }
  .sb-logo { margin-top: 12px; margin-bottom: 40px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .sb-menu { margin-top: 32px; display: flex; width: 100%; flex: 1; flex-direction: column; gap: 8px; }
  .sb-item { display: flex; align-items: center; border-radius: 6px; padding: 8px 36px; color: #fff; overflow: hidden; }
  .sb-item:hover { background: rgba(255,255,255,.2); }
  .sb-ic { display: flex; width: 24px; flex-shrink: 0; align-items: center; justify-content: center; }
  .sb-title { font-size: 18px; line-height: 28px; width: 0; opacity: 0; }
  .sb-bottom { display: flex; width: 100%; flex-direction: column; gap: 8px; }
  .sb-toggle { display: flex; width: 100%; align-items: center; justify-content: center; border-radius: 6px; padding: 8px 0; color: #fff; }

  /* main */
  .main { position: relative; height: 100%; min-height: 100vh; margin-left: 114px; width: calc(100% - 114px); overflow-x: auto; background: #fff; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; background: #fff; }
  .heading { display: flex; align-items: baseline; margin-top: 4px; gap: 8px; height: 60px; padding: 16px 20px; background: #fff; }
  .heading-title { font-size: 30px; line-height: 36px; font-weight: 500; }
  .topright { margin-right: 20px; margin-top: 8px; display: flex; align-items: center; gap: 12px; }
  .seg { display: flex; height: 36px; align-items: center; border-radius: 8px; background: #f3f4f6; padding: 4px; }
  .seg-btn { display: flex; align-items: center; gap: 4px; height: 36px; border-radius: 6px; border: 1px solid transparent; padding: 0 16px; font-size: 14px; line-height: 20px; font-weight: 600; color: #6b7280; }
  .seg-btn.on { background: #ff4301; color: #fff; }
  .seg-btn + .seg-btn { margin-left: 4px; }
  .seg-info { display: flex; height: 16px; width: 16px; align-items: center; justify-content: center; }
  .search { position: relative; display: flex; align-items: center; }
  .search svg { position: absolute; left: 12px; color: #9ca3af; }
  .search input { height: 36px; width: 256px; border-radius: 8px; border: 1px solid #e5e7eb; padding: 0 40px; font-size: 14px; line-height: 20px; outline: none; }
  .search input::placeholder { color: #9ca3af; }

  .content { display: flex; height: calc(100vh - 64px); min-height: 0; min-width: 0; flex: 1; flex-direction: column; background: #fff; }
  .toolbar { position: relative; border-bottom: 1px solid #e5e7eb; padding: 16px 20px 12px; }
  .toolrow { display: flex; align-items: flex-start; gap: 12px; }
  .filters { display: flex; flex: 1; flex-wrap: wrap; align-items: center; gap: 12px; }
  .chip { display: flex; height: 38px; align-items: center; justify-content: space-between; gap: 6px; white-space: nowrap; border-radius: 8px; background: #fff; padding: 0 12px; font-size: 13px; font-weight: 500; color: #374151; }
  .chip:hover { background: #f9fafb; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip svg { flex-shrink: 0; color: #6b7280; }
  .tip { position: relative; display: inline-block; }
  .obtn { display: flex; align-items: center; justify-content: center; height: 32px; width: 38px; border-radius: 6px; background: #ff4301; color: #fff; font-weight: 600; border: 1px solid transparent; }
  .obtn:hover { background: rgba(255,67,1,.9); }
  .actions { display: flex; flex-shrink: 0; align-items: flex-start; gap: 8px; }

  .summary { display: flex; border-bottom: 1px solid #e5e7eb; background: #fff; }
  .sum { display: flex; flex-grow: 1; align-items: center; border-right: 1px solid #e5e7eb; padding: 10px 20px; }
  .sum:last-child { border-right: 0; }
  .sum .l { font-size: 14px; line-height: 20px; font-weight: 500; }
  .sum .v { margin-left: auto; font-size: 14px; line-height: 20px; font-weight: 600; }

  .tablewrap { position: relative; display: flex; min-height: 0; min-width: 0; flex: 1; overflow: hidden; }
  .tablecol { margin-top: 12px; display: flex; min-width: 0; flex: 1; flex-direction: column; }
  .tablepad { display: flex; min-height: 0; min-width: 0; flex: 1; flex-direction: column; overflow: hidden; padding: 0 20px 20px; }
  .rt { display: flex; flex-direction: column; flex: 1; min-height: 0; min-width: 0; height: 100%; }
  .rt-scroll { overflow: auto; flex: 1; min-height: 0; min-width: 0; }
  table.res { width: 100%; min-width: 100%; }
  table.res > :not([hidden]) ~ :not([hidden]) { border-top: 1px solid #d1d5db; }
  .res th { position: sticky; top: 0; z-index: 11; padding: 16px 8px; text-align: center; font-size: 16px; line-height: 24px; font-weight: 500; color: #fff; background: #ff4301; }
  .res th .rh { position: absolute; top: 10px; right: 0; bottom: 10px; width: 2px; border-radius: 16px; background: #fff; cursor: col-resize; }
  .res th:last-child .rh { display: none; }
  .res tbody { background: #fff; }
  .res tbody > tr ~ tr { border-top: 1px solid #e5e7eb; }
  .res td { padding: 8px; color: #000; }
  .res td > div { display: flex; height: 100%; width: 100%; align-items: center; justify-content: center; text-align: center; }
  .pass-t { font-weight: 600; font-size: 14px; line-height: 20px; color: #16a34a; }
  .fail-t { font-weight: 600; font-size: 14px; line-height: 20px; color: #ef4444; }
  .lnk { display: flex; align-items: center; gap: 6px; color: #3b82f6; font-weight: 500; }
  .lnk:hover { color: #3730a3; }
  .pager { display: flex; align-items: center; justify-content: flex-end; gap: 16px; border-top: 1px solid #e5e7eb; padding: 8px 16px; }
  .pager span { font-size: 14px; line-height: 20px; color: #6b7280; }
  .pager button { border-radius: 4px; padding: 4px; }
  .pager button:disabled { opacity: .3; cursor: default; }

  /* image viewer */
  .iv { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.9); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .iv[hidden] { display: none; }
  .iv-inner { position: relative; display: flex; height: 100%; width: 100%; flex-direction: column; padding: 24px; }
  .iv-head { margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; color: #fff; }
  .iv-left { display: flex; flex-direction: column; gap: 4px; }
  .iv-title { font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -0.025em; }
  .iv-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 500; color: #d1d5db; }
  .iv-chip { border-radius: 4px; padding: 2px 8px; font-size: 14px; line-height: 20px; font-weight: 600; }
  .iv-chip.p { background: rgba(34,197,94,.2); color: #4ade80; }
  .iv-chip.f { background: rgba(239,68,68,.2); color: #f87171; }

  // Distance_hole_pitch: Circle_hole centre → Circle_hole_2 centre, Euclidean (visualization.py _viz_distance_reqs)
  var DIM = { id: 'b7e2c4a1-5d3f-4e8a-9c21-6f0d8e3a1b54', min: 21.9, max: 22.1, ratio: 0.05, okColor: '#39FF14', ngColor: '#FF0000' };
  function processLabel(ctx, id, type, pass, color) { writeName(ctx, id + ': ' + type + ' - ' + (pass ? 'PASS' : 'FAIL'), [10, 30], color); }
  function drawHolePitch(ctx) {
    var d = Math.hypot(HOLE2[0] - HOLE[0], HOLE2[1] - HOLE[1]);
    var value = round3(d * DIM.ratio), pass = value >= DIM.min && value <= DIM.max, color = pass ? DIM.okColor : DIM.ngColor;
    cvDot(ctx, HOLE, color, 5); cvDot(ctx, HOLE2, color, 5);
    cvLine(ctx, HOLE, HOLE2, color, 2);
    writeName(ctx, value.toFixed(2) + 'mm', [(HOLE[0] + HOLE2[0]) / 2, (HOLE[1] + HOLE2[1]) / 2], color);
    processLabel(ctx, DIM.id, 'DISTANCE', pass, color);
    return pass;
  }

  // ───────────────────────── build the cycle's images ─────────────────────────
  function buildImages() {
    var cfg = readConfig(), top = renderTop(EDGE_OK), ctx = top.getContext('2d');
    if (MODE === 'after' && cfg.show) drawShapes(ctx, cfg);   // shapes first, dimension drawings on top
    var pass = drawHolePitch(ctx);
    return { list: [
      { captureName: 'Top Camera', name: 'Search Area 1', result: pass, src: top.toDataURL('image/jpeg', 0.92) },
      { captureName: 'Side Camera', name: 'Search Area 1', result: true, src: renderSide().toDataURL('image/jpeg', 0.92) }
    ], start: 0 };
  }

  // ───────────────────────── page: cycle table ─────────────────────────
  var COLS = ['S. No.', 'Timestamp', 'Overall Result', 'Variant', 'Result Images (SAs)', 'Raw Images', 'Result JSON'];
  var thead = document.getElementById('thead'), colsEl = document.getElementById('cols'), tbody = document.getElementById('tbody');
  COLS.forEach(function (label) {
    var th = document.createElement('th'); th.scope = 'col'; th.textContent = label;
    var rh = document.createElement('div'); rh.className = 'rh'; th.appendChild(rh); thead.appendChild(th);
    var col = document.createElement('col'); colsEl.appendChild(col);
  });
  function sizeCols() {
    var w = colsEl.parentNode.parentNode.offsetWidth || 1286, each = Math.min(w / COLS.length, 300);
    Array.prototype.forEach.call(colsEl.children, function (c) { c.style.width = each + 'px'; });
  }
  function fmtTime(sec) {
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60, ap = h >= 12 ? 'pm' : 'am', h12 = h % 12 || 12;
    return '24/10/2026, ' + h12 + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + ' ' + ap;
  }
  function renderTable(firstPass) {
    tbody.innerHTML = '';
    var t0 = 14 * 3600 + 41 * 60 + 7;
    for (var i = 0; i < 10; i++) {
      var ok = i === 0 ? firstPass : i !== 5;
      var tr = document.createElement('tr');
      var cells = [String(i + 1), fmtTime(t0 - i * 9 - (i * 7) % 5),
        '<span class="' + (ok ? 'pass-t' : 'fail-t') + '">' + (ok ? 'Pass' : 'Fail') + '</span>', 'Variant A',
        '<button class="lnk" type="button" data-view="1">View Images </button>',
        '<button class="lnk" type="button">View Raw Images</button>',
        '<span class="lnk" style="cursor:pointer">View JSON</span>'];
      cells.forEach(function (html) { var td = document.createElement('td'); var d = document.createElement('div'); d.innerHTML = html; td.appendChild(d); tr.appendChild(td); });
      var tr2 = document.createElement('tr');
      tbody.appendChild(tr); tbody.appendChild(tr2);
      Array.prototype.forEach.call(tr.children, function (td) { td.rowSpan = 2; });
    }
    document.getElementById('sumPass').textContent = firstPass ? '121' : '120';
    document.getElementById('sumFail').textContent = firstPass ? '7' : '8';
    document.getElementById('sumDef').textContent = (firstPass ? 7 / 128 * 100 : 8 / 128 * 100).toFixed(3) + '%';
  }

  // ───────────────────────── viewer (ImageViewer.jsx) ─────────────────────────
  var MIN_ZOOM = 0.5, MAX_ZOOM = 5, ZOOM_STEP = 0.25, PAN_OVERHEAD = 48;
  var iv = document.getElementById('iv'), img = document.getElementById('ivImg'), stage = document.getElementById('ivStage'), view = document.getElementById('ivView');
  var images = [], cur = 0, zoom = 1, pos = { x: 0, y: 0 }, dragging = false, dragStart = null;

  function clampPos(x, y, z) {
    if (z <= 1) return { x: 0, y: 0 };
    var vr = view.getBoundingClientRect(), bw = img.offsetWidth, bh = img.offsetHeight;
    if (!bw || !bh) return { x: x, y: y };
    var mx = Math.max(0, bw * z - vr.width) / 2 + PAN_OVERHEAD, my = Math.max(0, bh * z - vr.height) / 2 + PAN_OVERHEAD;
    return { x: Math.min(mx, Math.max(-mx, x)), y: Math.min(my, Math.max(-my, y)) };
  }
  function applyTransform() {
    pos = clampPos(pos.x, pos.y, zoom);
    img.style.transform = 'translate(' + pos.x + 'px, ' + pos.y + 'px) scale(' + zoom + ')';
    img.classList.toggle('nodrag', dragging);
    document.getElementById('zPct').textContent = Math.round(zoom * 100) + '%';
    document.getElementById('zOut').disabled = zoom <= MIN_ZOOM;
    document.getElementById('zIn').disabled = zoom >= MAX_ZOOM;
    stage.classList.toggle('grab', zoom > 1 && !dragging); stage.classList.toggle('grabbing', zoom > 1 && dragging);
  }
  function renderViewer() {
    var im = images[cur];
    document.getElementById('ivTitle').textContent = im.captureName || 'Unknown';
    document.getElementById('ivName').textContent = im.name || 'Image';
    var chip = document.getElementById('ivChip');
    chip.style.display = typeof im.result === 'boolean' ? '' : 'none';
    chip.className = 'iv-chip ' + (im.result ? 'p' : 'f'); chip.textContent = im.result ? 'Pass' : 'Fail';
    document.getElementById('ivCount').textContent = '· Image ' + (cur + 1) + ' of ' + images.length;
    if (img.getAttribute('src') !== im.src) img.src = im.src;
    img.alt = im.captureName || im.name;
    var multi = images.length > 1;
    document.getElementById('ivPrev').style.display = multi ? '' : 'none';
    document.getElementById('ivNext').style.display = multi ? '' : 'none';
    document.getElementById('ivThumbsWrap').style.display = multi ? '' : 'none';
    var tw = document.getElementById('ivThumbs'); tw.innerHTML = '';
    images.forEach(function (t, idx) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'iv-tb' + (idx === cur ? ' on' : '');
      b.title = (t.name || 'Image') + (typeof t.result === 'boolean' ? ' — ' + (t.result ? 'Pass' : 'Fail') : '');
      var ti = document.createElement('img'); ti.src = t.src; ti.alt = t.name || ''; b.appendChild(ti);
      if (typeof t.result === 'boolean') { var bd = document.createElement('span'); bd.className = 'iv-badge ' + (t.result ? 'p' : 'f'); bd.textContent = t.result ? 'Pass' : 'Fail'; b.appendChild(bd); }
      if (idx === cur) { var tn = document.createElement('div'); tn.className = 'iv-tint'; b.appendChild(tn); }
      b.addEventListener('click', function () { go(idx); });
      tw.appendChild(b);
    });
    applyTransform();
  }
  function resetView() { zoom = 1; pos = { x: 0, y: 0 }; applyTransform(); }
  function go(idx) { cur = (idx + images.length) % images.length; zoom = 1; pos = { x: 0, y: 0 }; renderViewer(); }
  function zoomIn() { zoom = Math.min(MAX_ZOOM, zoom + ZOOM_STEP); applyTransform(); }
  function zoomOut() { zoom = Math.max(MIN_ZOOM, zoom - ZOOM_STEP); if (zoom <= 1) pos = { x: 0, y: 0 }; applyTransform(); }
  function openViewer(start) { iv.hidden = false; go(start == null ? cur : start); }
  function closeViewer() { iv.hidden = true; }

  document.getElementById('zIn').addEventListener('click', zoomIn);
  document.getElementById('zOut').addEventListener('click', zoomOut);
  document.getElementById('zReset').addEventListener('click', resetView);
  document.getElementById('ivClose').addEventListener('click', closeViewer);
  document.getElementById('ivPrev').addEventListener('click', function () { go(cur - 1); });
  document.getElementById('ivNext').addEventListener('click', function () { go(cur + 1); });
  view.addEventListener('wheel', function (e) { e.preventDefault(); if (e.deltaY < 0) zoomIn(); else zoomOut(); }, { passive: false });
  stage.addEventListener('mousedown', function (e) {
    if (zoom <= 1 || e.button !== 0) return; e.preventDefault();
    dragging = true; dragStart = { x: e.clientX, y: e.clientY, ox: pos.x, oy: pos.y }; applyTransform();
  });
  window.addEventListener('mousemove', function (e) { if (!dragging) return; pos = { x: dragStart.ox + e.clientX - dragStart.x, y: dragStart.oy + e.clientY - dragStart.y }; applyTransform(); });
  window.addEventListener('mouseup', function () { if (dragging) { dragging = false; applyTransform(); } });
  window.addEventListener('keydown', function (e) {
    if (iv.hidden) return;
    if (e.key === 'ArrowLeft') go(cur - 1);
    if (e.key === 'ArrowRight') go(cur + 1);
    if (e.key === 'Escape') closeViewer();
    if (e.key === '+' || e.key === '=') zoomIn();
    if (e.key === '-') zoomOut();
    if (e.key === '0') resetView();
  });
  tbody.addEventListener('click', function (e) { var b = e.target.closest('[data-view]'); if (b) openViewer(START); });


  // ───────────────────────── Today | After change ─────────────────────────
  var ms = document.getElementById('ms');
  var inFrame = true; try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
  if (inFrame || NO_SWITCH) ms.hidden = true;
  function paintSwitch() { Array.prototype.forEach.call(ms.querySelectorAll('button'), function (b) { b.classList.toggle('on', b.getAttribute('data-mode') === MODE); }); }
  ms.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    MODE = b.getAttribute('data-mode');
    try { var u = new URL(location.href); u.searchParams.set('mode', MODE); history.replaceState(null, '', u.toString()); } catch (err) { /* file:// may refuse */ }
    paintSwitch(); refresh(true);
  });

  // ───────────────────────── boot ─────────────────────────
  var START = 0;
  function refresh(keepIndex) {
    var built = buildImages();
    images = built.list; START = built.start;
    var allPass = images.every(function (i) { return i.result !== false; });
    renderTable(allPass);
    if (!keepIndex) cur = START;
    if (cur >= images.length) cur = START;
    if (!iv.hidden) renderViewer();
  }
  window.addEventListener('storage', function (e) { if (!e || e.key === null || e.key === KEY) refresh(true); });
  window.addEventListener('resize', function () { sizeCols(); applyTransform(); });
  sizeCols();
  paintSwitch();
  refresh(false);
  renderViewer();
})();
</script>
</body>
</html>
