const hashString = (str) => { let hash = 0; for (let i = 0; i < str.length; i++) { hash = (hash << 5) - hash + str.charCodeAt(i); hash |= 0; } hash ^= hash >>> 16; hash = Math.imul(hash, 0x45d9f3b); hash ^= hash >>> 16; hash = Math.imul(hash, 0x45d9f3b); hash ^= hash >>> 16; return hash; };
const hslToHex = (h, s, l) => { s /= 100; l /= 100; const k = (n) => (n + h / 30) % 12; const a = s * Math.min(l, 1 - l); const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); const toHex = (x) => Math.round(255 * x).toString(16).padStart(2, '0'); return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`; };
const clsColor = (name) => hslToHex((((hashString('cls-' + name) % 360) + 360) % 360), 85, 38);
const chip = (name, color) => { const c = color || clsColor(name); return `<span class="relative inline-flex items-center rounded-md py-0.5 whitespace-nowrap text-sm font-medium px-2" style="background-color:${c}35;color:${c};border:1px solid ${c}70">${esc(name)}</span>`; };

let statusTimer = null;
function startStatus() {
  S.status = { done: 0 };

  const grid = S.pager ? `<div class="absolute bottom-full right-0 z-50 mb-1 w-80 rounded border border-gray-300 bg-white shadow-lg">
      <div class="border-b border-gray-200 p-3"><input type="text" placeholder="Enter Image number" class="w-full rounded border border-gray-300 px-2 py-1 text-sm focus:border-blue-500 focus:outline-none"></div>
      <div class="p-3"><div class="grid grid-cols-5 gap-2">${Array.from({ length: total }, (_, j) => { const on = j === k, g = S.saved.has(j); return `<div data-act="page" data-i="${j}" class="cursor-pointer rounded-full h-8 w-8 flex items-center justify-center text-sm hover:ring-2 hover:ring-blue-300 transition-all ${on ? 'bg-blue-100 font-semibold ring-2 ring-blue-500' : g ? 'bg-green-500' : 'bg-yellow-500'} ${g ? 'text-white' : 'text-black'}">${j + 1}</div>`; }).join('')}</div></div>
      <div class="border-t border-gray-200 p-3"><div class="flex items-center justify-center gap-1">
        <button disabled class="cursor-pointer rounded p-1 hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-50">${I.f(FE.chevronsLeft, 16)}</button><button disabled class="cursor-pointer rounded p-1 hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-50">${I.f(FE.chevronLeft, 16)}</button>
        <button class="h-8 w-8 rounded-full text-sm cursor-pointer bg-blue-500 text-white font-semibold">1</button>
        <button disabled class="cursor-pointer rounded p-1 hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-50">${I.f(FE.chevronRight, 16)}</button><button disabled class="cursor-pointer rounded p-1 hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-50">${I.f(FE.chevronsRight, 16)}</button>
      </div></div></div>` : '';
  return `<div class="flex w-full content-center justify-center gap-4">
    <nav class="mb-6 flex items-center"><ul class="mx-auto flex gap-1 rounded-full border border-gray-300 px-2 py-1.5">
      <li data-act="page" data-i="${Math.max(k - 5, 0)}" class="cursor-pointer">${I.f(FE.chevronsLeft)}</li>
      <li data-act="page" data-i="${Math.max(k - 1, 0)}" class="cursor-pointer">${I.f(FE.chevronLeft)}</li>
      ${nums.map(li).join('')}
      <li data-act="page" data-i="${Math.min(k + 1, total - 1)}" class="cursor-pointer">${I.f(FE.chevronRight)}</li>
      <li data-act="page" data-i="${Math.min(k + 5, total - 1)}" class="cursor-pointer">${I.f(FE.chevronsRight)}</li>
    </ul></nav>
    <div class="relative"><span class="relative inline-flex"><button data-act="pager" class="flex items-center gap-2 rounded border border-gray-300 bg-white px-3 py-1 text-sm hover:bg-gray-50">${k + 1}${I.f(FE.chevronDown, 16, `transform ${S.pager ? 'rotate-180' : ''} transition-transform`)}</button></span>${grid}
      <p class="mt-1 text-xs text-green-500">Range: 1 to ${total}</p></div>
  </div>`;
}
function jobPage() {
  const k = S.idx, total = files().length, n = files()[k];
  // Loaded boxes come in as user-drawn (frinksvision-frontend core/annotation.ts), so Edge labels hide the Mark Annotated prompt too
  const userDrawn = shapesOf(k).length > 0;
  const annotated = S.saved.has(k) || userDrawn;
  const tools = [
    ['Shortcut', TOOL.shortcut, true], ['Fit to frame', TOOL.fit, true], ['Default Zoom', TOOL.zoom, true],
    ['Rectangular Selection (Ctrl + 1)', TOOL.rect(!!S.selCls), !!S.selCls], ['Polygon Selection (Ctrl + 2)', TOOL.poly, false],
    ['Brush Tool', TOOL.brush, false], ['Line Tool (Ctrl + 3)', TOOL.line, false],
  ].map(([t, svg, on]) => `<span class="relative"><li title="${t}" class="flex select-none flex-col items-center p-2 ${on ? 'opacity-100' : 'cursor-not-allowed opacity-30'}">${svg}</li></span>`).join('');
  return `<div class="grid h-screen grid-cols-12 scroll-auto">
    <div class="col-span-3 grid grid-rows-12 border-r-[1px] border-black" style="height:100vh">
      <div class="relative z-40 col-span-full row-span-11 flex flex-col bg-white">
        <h1 class="flex items-center gap-2 border-b-[1px] px-6 pb-6 pt-6 text-3xl font-bold">Annotation Job</h1>
        <div class="mb-[80px] h-full flex-col items-center justify-center overflow-y-auto overflow-x-hidden">
          <div class="text-md w-full overflow-hidden text-ellipsis whitespace-nowrap px-3 py-3">${n}.png</div>
          <div class="grow"><div class="flex flex-col gap-4 overflow-y-scroll p-3 pb-4">${MODS.map((m, j) => moduleCard(m, k, j + 1)).join('')}</div></div>
          <div class="flex w-full items-center justify-center py-1">${btn('Copy Annotation')}</div>
          ${annotated ? '' : `<div class="mb-15 mt-[20px] border-t-2 pt-4 text-center">No Annotations ? ${btn('Mark Annotated', { act: 'markAnnotated' })}</div>`}
          <div class="mb-20"></div>
        </div>
        <div class="absolute bottom-0 w-full border-t-[1px] border-black bg-white pt-2">
          <div class="flex justify-center pb-2">${btn('Save &amp; Next', { act: 'saveNext' })}</div>
          ${pager(k, total)}
        </div>
      </div>
      <div class="row-span-1 flex items-center border-t-[1px] border-black bg-white px-6">${btn('Exit', { variant: 'border', act: 'exitJob' })}</div>
    </div>
    <div class="col-span-9 row-span-11 flex flex-col items-center justify-center bg-[#EAEDF1]">
      <div class="flex h-full w-full flex-col items-center justify-center gap-4" style="max-height:91.65vh">${canvas(k)}</div>
      <div class="flex w-full grow justify-end border-t-[1px] border-black bg-white px-6"><div class="flex h-full flex-row-reverse items-center justify-between bg-white"><ul class="flex items-center gap-6 px-4">${tools}</ul></div></div>
    </div>
  </div>`;
}
function deleteModal() {
  return modal(`${modalHeader('Delete Annotation')}<div class="overflow-auto p-5"><div class="mb-4">Are you sure you want to delete this annotation?</div>
    <div class="flex flex-row-reverse gap-4">${btn('Cancel', { cls: 'px-4', act: 'delCancel' })}${btn('Confirm', { cls: 'px-4', act: 'delConfirm' })}</div></div>`);
}

/* ═══════════ render ═══════════ */
function view() {
  const st = S.state;
  const effective = !after() && (st === 'wrong-capture') ? 'upload' : st;
  if (effective === 'job' || effective === 'saved') return jobPage() + (S.del !== null ? deleteModal() : '');
  if (effective === 'datasets') return datasetsPage();
  let out = folderPage();
  if (effective === 'upload' || effective === 'wrong-capture') {
    if (after() && !S.status) out += uploadDialog();
    else { if (!S.status) startStatus(); out += uploadStatus(); }
  } else if (S.status) out += uploadStatus();
  return out;
}
function render() {
  document.getElementById('app').innerHTML = `${sidebar()}<div class="h-full min-h-screen md:ml-[80px]" style="height:100vh;overflow-y:auto">${view()}</div>`;
  document.getElementById('dd').innerHTML = ddHtml();
  renderPv();
  bindCanvas();
}

/* select dropdown (shared/ui/SelectInput.tsx) */
function ddHtml() {
  if (!S.dd) return '';
  const { key, rect } = S.dd;
  const opts = key === 'finish' ? MODS[1].classes : MODS[0].classes;
  const cur = key === 'finish' ? finishOf(S.idx) : shapesOf(S.idx)[+key.split(':')[1]].cls;
  return `<div style="position:fixed;left:${rect.left}px;top:${rect.bottom + 4}px;width:${Math.max(rect.width, 160)}px" class="z-[99999] max-h-60 overflow-auto rounded-md bg-white py-1 text-base shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none sm:text-sm">
    ${opts.map((o) => `<div data-act="ddPick" data-v="${o}" class="relative cursor-default select-none py-2 pl-10 pr-4 ${o === cur ? 'bg-f-primary text-white' : 'text-gray-900 hover:bg-gray-100'}"><span class="block truncate ${o === cur ? 'font-semibold' : 'font-normal'}">${o}</span>${o === cur ? '<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-white"><svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd"/></svg></span>' : ''}</div>`).join('')}
  </div>`;
}

/* toast (react-hot-toast, top-center, 4 s) */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = `<div class="rht"><div><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="#61d345"/><path d="M6 10.4l2.6 2.5L14 7.6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="msg">${esc(msg)}</div></div></div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.innerHTML = ''; }, 4000);
}

/* prototype switch (only when opened on its own) */
function renderPv() {
  const el = document.getElementById('pv');
  if (EMBED || Q.get('shot') === '1') { el.innerHTML = ''; return; }
  const labels = { folder: 'Folder', upload: 'Upload', 'wrong-capture': 'Wrong capture', uploaded: 'Uploaded', datasets: 'Datasets & Annotations', job: 'Annotation job', saved: 'After Save & Next' };
  el.innerHTML = `<div class="pv"><button data-pv="today" aria-pressed="${!after()}">Today</button><button data-pv="after" aria-pressed="${after()}">After</button>
    <select id="pvState">${STATES.map((s) => `<option value="${s}" ${s === S.state ? 'selected' : ''}>${labels[s]}</option>`).join('')}</select></div>`;
}

/* ═══════════ events ═══════════ */
document.addEventListener('click', (e) => {
  const pv = e.target.closest('[data-pv]');
  if (pv) { S.mode = pv.dataset.pv; S.shapes = {}; S.finish = {}; S.plain = false; go(S.state); return; }
  const a = e.target.closest('[data-act]');
  if (S.dd && !(a && (a.dataset.act === 'ddPick' || a.dataset.act === 'dd'))) { S.dd = null; render(); if (!a) return; }
  if (!a) { if (S.pager && !e.target.closest('.relative')) { S.pager = false; render(); } return; }
  e.preventDefault();
  const act = a.dataset.act, k = S.idx;
  switch (act) {
    case 'nav': if (a.dataset.to && a.dataset.to !== 'nop') { const t = a.dataset.to; if (t === 'uploaded' && !S.uploadedDone) go('folder'); else go(t, { preset: t !== 'uploaded' && t !== 'datasets' ? true : false }); } return;
    case 'uploadBtn':
      if (after()) { S.choice = 'images'; S.picked = null; S.status = null; S.state = 'upload'; setUrl(); render(); }
      else { S.state = 'upload'; S.status = null; setUrl(); render(); }
      post('vision-upload'); return;
    case 'closeDialog': go('folder'); return;
    case 'choice': S.choice = a.dataset.v; if (S.choice === 'images') S.picked = null; render(); return;
    case 'pick': S.picked = 'hu'; render(); return;
    case 'chooseImages': S.plain = true; S.shapes = {}; S.finish = {}; S.state = 'upload'; startStatus(); render(); return;
    case 'doUpload':
      S.plain = false; S.shapes = {}; S.finish = {}; S.uploadedDone = true; S.saved = new Set();
      S.state = 'uploaded'; setUrl(); startStatus(); render(); post('vision-uploaded'); return;
    case 'statusClose': {
      const wasUpload = S.state === 'upload';
      S.status = null; S.uploadedDone = true; S.saved = new Set(); S.state = 'uploaded'; setUrl(); render();
      if (wasUpload) post('vision-uploaded');
      return;
    }
    case 'startJob': S.uploadedDone = true; S.idx = 0; S.open = 'pin'; S.selCls = null; S.draft = null; S.hl = null; S.sel = null; S.pager = false; S.state = S.saved.size ? 'saved' : 'job'; setUrl(); render(); post('vision-annotate'); return;
    case 'mod': S.open = S.open === a.dataset.m ? null : a.dataset.m; S.selCls = null; S.draft = null; render(); return;
    case 'cls': S.selCls = S.selCls === a.dataset.c ? null : a.dataset.c; S.draft = null; render(); return;
    case 'cancelDraw': S.draft = null; render(); return;
    case 'confirmDraw': if (S.draft) { shapesOf(k).push({ ...S.draft, src: 'user' }); S.draft = null; } render(); return;
    case 'eye': { const i = +a.dataset.i; S.hl = S.hl === i ? null : i; render(); return; }
    case 'editShape': { const i = +a.dataset.i; S.sel = S.sel === i ? null : i; render(); return; }
    case 'delShape': S.del = +a.dataset.i; render(); return;
    case 'delCancel': S.del = null; render(); return;
    case 'delConfirm': shapesOf(k).splice(S.del, 1); S.del = null; S.hl = null; S.sel = null; render(); return;
    case 'dd': { const r = a.getBoundingClientRect(); S.dd = S.dd && S.dd.key === a.dataset.k ? null : { key: a.dataset.k, rect: { left: r.left, bottom: r.bottom, width: r.width } }; render(); return; }
    case 'ddPick': {
      const v = a.dataset.v, key = S.dd.key;
      if (key === 'finish') S.finish[files()[k]] = v; else shapesOf(k)[+key.split(':')[1]].cls = v;
      S.dd = null; render(); return;
    }
    case 'markAnnotated': S.saved.add(k); render(); return;
    case 'saveNext': {
      S.saved.add(k); S.selCls = null; S.draft = null; S.hl = null; S.sel = null; S.pager = false;
      if (S.idx !== Math.min(k + 1, files().length - 1)) S.open = null;
      S.idx = Math.min(k + 1, files().length - 1); S.state = 'saved'; setUrl(); render(); return;
    }
    case 'page': if (S.idx !== +a.dataset.i) S.open = null; S.idx = +a.dataset.i; S.pager = false; S.selCls = null; S.draft = null; S.hl = null; S.sel = null; render(); return;
    case 'pager': S.pager = !S.pager; render(); return;
    case 'exitJob': S.state = 'datasets'; setUrl(); S.selCls = null; render(); post('vision-datasets'); return;
    default:
  }
});
document.addEventListener('change', (e) => { if (e.target.id === 'pvState') { S.shapes = {}; S.finish = {}; S.plain = false; go(e.target.value); } });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (S.dd) { S.dd = null; render(); } else if (S.del !== null) { S.del = null; render(); } else if (['upload', 'wrong-capture'].includes(S.state) && after() && !S.status) go('folder');
});
// Drag a rectangle on the canvas once a class is chosen (Rectangular Selection auto-arms)
function bindCanvas() {
  const cv = document.getElementById('cv');
  if (!cv || !S.selCls) return;
  const pt = (ev) => { const r = cv.getBoundingClientRect(); return [Math.max(0, Math.min(400, ((ev.clientX - r.left) / r.width) * 400)), Math.max(0, Math.min(400, ((ev.clientY - r.top) / r.height) * 400))]; };
  cv.addEventListener('mousedown', (ev) => {
    ev.preventDefault();
    const [x, y] = pt(ev); S.draft = { cls: S.selCls, x1: x, y1: y, x2: x, y2: y };
    const move = (m) => { const [x2, y2] = pt(m); S.draft.x2 = x2; S.draft.y2 = y2; const svg = document.getElementById('cv'); if (svg) { const k = S.idx; const keep = S.draft; render(); S.draft = keep; } };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); if (S.draft && (Math.abs(S.draft.x2 - S.draft.x1) < 3 || Math.abs(S.draft.y2 - S.draft.y1) < 3)) S.draft = null; render(); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  });
}
window.addEventListener('storage', (e) => {
  if (e.key && e.key !== 'edge-testing-v2-dl') return;
  DL = readDl(); S.shapes = {}; S.finish = {}; if (S.idx >= files().length) S.idx = 0; render();
});
render();
</script>
</body>
