<script>
/* ════════════════════════ helpers ════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);

const ICON = {
  warn: '<svg class="h-4 w-4 shrink-0 text-amber-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  err: '<svg class="h-4 w-4 shrink-0 text-red-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>',
  ok: '<svg class="h-4 w-4 shrink-0 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>',
  shield: '<svg class="h-4 w-4 shrink-0 text-emerald-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>',
  folder: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fbbf24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z"/></svg>',
};

/* ════════════════════════ recipe ════════════════════════ */
const CAPS = {
  hu: { v: 'Hinge U', c: 'Right Part', folder: 'hinge_u_right', n: 36, mods: ['pin', 'finish'], ms: 49 },
  br: { v: 'Bracket', c: 'Weld View', folder: 'bracket_weld', n: 30, mods: ['weld'], ms: 52 },
  hs: { v: 'Housing', c: 'Sealant', folder: 'housing_sealant', n: 30, mods: ['bead'], ms: 61 },
  hl: { v: 'Housing', c: 'Label', folder: 'housing_label', n: 30, mods: ['ocr', 'qr'], ms: 54 },
};
const CAP_IDS = Object.keys(CAPS);
const cn = (id) => `${CAPS[id].v} · ${CAPS[id].c}`;
const MODS = {
  pin: { cap: 'hu', name: 'Pin detection', type: 'det', typeName: 'Object detection', classes: ['pin', 'burr'] },
  finish: { cap: 'hu', name: 'Surface finish', type: 'cls', typeName: 'Image classification', classes: ['clean', 'scratch', 'dent'] },
  weld: { cap: 'br', name: 'Weld check', type: 'seg', typeName: 'Segmentation', classes: ['weld', 'spatter', 'porosity'] },
  bead: { cap: 'hs', name: 'Sealant bead', type: 'bead', typeName: 'Bead inspection' },
  ocr: { cap: 'hl', name: 'Label text', type: 'ocr', typeName: 'OCR (Read & Match)' },
  qr: { cap: 'hl', name: 'Label QR code', type: 'code', typeName: 'Code reader' },

const MOD_IDS = Object.keys(MODS);
// Ground truths set in Edit Module Configurations: what an OK part shows
const GT = {
  pin: { pin: 4, burr: 0 },
  finish: 'clean',
  weld: { weld: 1, spatter: 0, porosity: 0 },
  bead: 3, // NG from a gap of this many calipers
  ocr: 'HX-2048-B',
  qr: 'Readable',
};
// Thresholds in EMC when the test ran
const EMC = {
  pin: { pin: 0.45, burr: 0.45 },
  finish: { clean: 0.60, scratch: 0.55, dent: 0.55 },
  weld: { weld: 0.50, spatter: 0.40, porosity: 0.40 },
  bead: { mask: 0.50 },
  ocr: { text: 0.70 },
  qr: {},
};
// Housing · Sealant images without an annotation file (annotated mode only)
const NO_ANNOT = { hs: [1, 2, 4, 5] };

/* ════════════════════════ sample test images ════════════════════════ */
// Each image keeps what the model found with its confidence (so its result can be worked out at any threshold)
// and what was really there (t), which annotation files or a reviewer would give.
const PINS = [[110, 110], [290, 110], [110, 290], [290, 290]];
function gen() {
  const out = {};
  { // Hinge U · Right Part: pins + burr (detection), surface finish (classification)
    const r = rng(11), arr = [];
    const probs = (top, c, second) => { const o = { clean: 0, scratch: 0, dent: 0 }; o[top] = c; const others = Object.keys(o).filter((k) => k !== top); const s = second || others[0]; o[s] = r2((1 - c) * 0.75); o[others.find((k) => k !== s)] = r2(1 - c - o[s]); return o; };
    for (let i = 0; i < 36; i++) {
      const pinC = PINS.map(() => r2(0.72 + 0.25 * r()));
      const noise = r() < 0.45 ? [{ cls: 'burr', conf: r2(0.04 + 0.16 * r()), pos: [120 + r() * 160, 120 + r() * 160] }] : [];
      const burrPos = [80 + r() * 240, r() < 0.5 ? 72 + r() * 10 : 318 + r() * 10];
      arr.push({
        pin: { dets: [...pinC.map((c, j) => ({ cls: 'pin', conf: c, pos: PINS[j] })), ...noise], t: { pin: 4, burr: 0 }, vis: { burrPos } },
        finish: { p: probs('clean', r2(0.76 + 0.22 * r())), t: 'clean', vis: {} },
      });
    }
    const P = (i) => arr[i].pin, F = (i) => arr[i].finish;
    const burr = (i, v, vis = {}) => { P(i).dets.push({ cls: 'burr', conf: v, pos: P(i).vis.burrPos }); P(i).t.burr = 1; Object.assign(P(i).vis, vis); };
    [[3, 0.82], [9, 0.67], [15, 0.91], [22, 0.74], [30, 0.6]].forEach(([i, v]) => burr(i, v));
    [[6, 0.38], [18, 0.41], [27, 0.36]].forEach(([i, v]) => burr(i, v, { small: true }));
    P(33).dets = P(33).dets.filter((d) => d.cls === 'pin'); P(33).t.burr = 1; P(33).vis.faint = true;
    [[11, 0.41], [25, 0.39]].forEach(([i, v]) => { P(i).dets[2].conf = v; P(i).vis.weak = true; });
    P(13).dets = P(13).dets.filter((d) => d.cls === 'pin').concat([{ cls: 'burr', conf: 0.29, pos: [200, 160] }]);
    P(20).dets.push({ cls: 'burr', conf: 0.88, pos: [212, 172] }); P(20).vis.glare = [212, 172];
    P(28).dets.splice(1, 1); P(28).t.pin = 3; P(28).vis.missing = true;
    [[4, 'scratch', 0.86], [10, 'scratch', 0.78], [17, 'dent', 0.83], [24, 'dent', 0.71]].forEach(([i, k, c]) => Object.assign(F(i), { p: probs(k, c), t: k, vis: { kind: k } }));
    [[8, 0.63], [29, 0.65]].forEach(([i, c]) => Object.assign(F(i), { p: probs('clean', c, 'scratch'), t: 'scratch', vis: { kind: 'scratch', faint: true } }));
    [[14, 0.55], [31, 0.52]].forEach(([i, c]) => Object.assign(F(i), { p: probs('clean', c) }));
    Object.assign(F(21), { p: { clean: 0.14, scratch: 0.81, dent: 0.05 }, vis: { shine: true } });
    out.hu = arr.map((m) => ({ m }));
  }
  { // Bracket · Weld View: weld seam (segmentation)
    const r = rng(23), arr = [];
    for (let i = 0; i < 30; i++) {
      const dy = (r() - 0.5) * 30, at = [110 + r() * 180, 200 + dy], glare = [140 + r() * 120, 198 + dy];
      const dets = [{ cls: 'weld', conf: r2(0.78 + 0.2 * r()) }];
      if (r() < 0.4) dets.push({ cls: 'spatter', conf: r2(0.04 + 0.18 * r()), pos: [120 + r() * 160, 165 + dy] });
      if (r() < 0.3) dets.push({ cls: 'porosity', conf: r2(0.04 + 0.15 * r()), pos: [120 + r() * 160, 200 + dy] });
      arr.push({ weld: { dets, t: { weld: 1, spatter: 0, porosity: 0 }, vis: { dy, at, glare } } });
    }
    const W = (i) => arr[i].weld;
    const defect = (i, cls, v, vis = {}) => { W(i).dets.push({ cls, conf: v, pos: W(i).vis.at }); W(i).t[cls] = 1; Object.assign(W(i).vis, { cause: cls }, vis); };
    [[2, 0.71], [11, 0.88], [23, 0.57]].forEach(([i, v]) => defect(i, 'spatter', v));
    defect(15, 'spatter', 0.34, { small: true });
    W(26).dets = W(26).dets.filter((d) => d.cls !== 'spatter').concat([{ cls: 'spatter', conf: 0.31, pos: [160, 168 + W(26).vis.dy] }]);
    [[5, 0.77], [27, 0.64]].forEach(([i, v]) => defect(i, 'porosity', v));
    [[12, 0.33], [21, 0.37]].forEach(([i, v]) => defect(i, 'porosity', v, { small: true }));
    W(9).dets = W(9).dets.filter((d) => d.cls === 'weld'); W(9).t.porosity = 1; Object.assign(W(9).vis, { cause: 'porosity', tiny: true });
    W(17).dets.push({ cls: 'porosity', conf: 0.86, pos: W(17).vis.glare }); W(17).vis.glareOn = true;
    W(7).dets[0].conf = 0.46; W(7).vis.thin = true;
    W(19).dets = W(19).dets.filter((d) => d.cls !== 'weld'); W(19).t.weld = 0; W(19).vis.cause = 'missing';
    out.br = arr.map((m) => ({ m }));
  }
  { // Housing · Sealant: bead, 40 calipers, each with the model's bead confidence
    const r = rng(37), arr = [];
    for (let i = 0; i < 30; i++) {
      const cal = Array.from({ length: 40 }, () => (r() < 0.08 ? r2(0.52 + 0.18 * r()) : r2(0.78 + 0.19 * r())));
      arr.push({ bead: { cal, t: 0, vis: { kind: Array(40).fill('full'), s0: 4 + Math.floor(r() * 30) } } });
    }
    const B = (i) => arr[i].bead;
    const run = (i, len, fn, kind) => { const b = B(i), rr = rng(900 + i); for (let k = 0; k < len; k++) { b.cal[b.vis.s0 + k] = fn(k, rr); b.vis.kind[b.vis.s0 + k] = kind; } };
    [[3, 5], [14, 4], [25, 7]].forEach(([i, g]) => { run(i, g, (k, rr) => r2(0.03 + 0.12 * rr()), 'gap'); B(i).t = g; });
    [[8, 0.55], [20, 0.58]].forEach(([i, v]) => { run(i, 3, (k) => (k === 1 ? v : 0.08 + k * 0.01), 'gap'); B(i).vis.kind[B(i).vis.s0 + 1] = 'gloss'; B(i).t = 3; });
    [[6, 3], [17, 4], [23, 3]].forEach(([i, g]) => run(i, g, (k, rr) => r2(0.36 + 0.1 * rr()), 'faint'));
    out.hs = arr.map((m) => ({ m }));
  }
  { // Housing · Label: printed text (OCR) + QR code
    const r = rng(51), arr = [], gt = GT.ocr;
    const read = (txt) => txt.split('').map((ch) => ({ ch, conf: r2(0.8 + 0.19 * r()) }));
    for (let i = 0; i < 30; i++) arr.push({ ocr: { chars: read(gt), t: gt, printed: gt, vis: {} }, qr: { readable: true, t: 'Readable', vis: {} } });
    const O = (i) => arr[i].ocr;
    [[2, 'HX-2O48-B'], [13, 'HX-2048-8'], [24, 'HX-204B-B']].forEach(([i, t]) => Object.assign(O(i), { chars: read(t), t, printed: t }));
    Object.assign(O(19), { t: 'HX-2O48-B', printed: 'HX-2O48-B' }); O(19).chars[4].conf = 0.73;
    [[5, 2, 0.62], [16, 6, 0.66], [28, 8, 0.68]].forEach(([i, k, v]) => { O(i).chars[k].conf = v; });
    O(11).chars[4] = { ch: 'O', conf: 0.9 };
    Object.assign(arr[24].qr, { readable: false, t: 'Not readable', vis: { damaged: true } });
    out.hl = arr.map((m) => ({ m }));
  }
  for (const c of CAP_IDS) out[c].forEach((img, i) => { img.i = i; img.file = `${CAPS[c].folder}/IMG_${String(i + 1).padStart(4, '0')}.png`; });
  return out;
}
const IMGS = gen();
const short = (i) => `IMG_${String(i + 1).padStart(4, '0')}`;

/* ════════════════════════ results and OK / NG ════════════════════════ */
function longestGap(cal, t) { let best = 0, cur = 0; for (const c of cal) { cur = c < t ? cur + 1 : 0; best = Math.max(best, cur); } return best; }
// What the module reports at thresholds T
function outputOf(id, d, T) {
  const m = MODS[id];
  switch (m.type) {
    case 'det': case 'seg': return Object.fromEntries(m.classes.map((c) => [c, d.dets.filter((x) => x.cls === c && x.conf >= T[c]).length]));
    case 'cls': { const top = m.classes.reduce((a, b) => (d.p[a] >= d.p[b] ? a : b)); return d.p[top] >= T[top] ? top : 'no class'; }

// OK / NG of a result, judged against the EMC ground truth
function verdictOf(id, o) {
  const m = MODS[id];
  switch (m.type) {
    case 'det': case 'seg': return m.classes.every((c) => o[c] === GT[id][c]) ? 'OK' : 'NG';
    case 'bead': return o < GT.bead ? 'OK' : 'NG';
    default: return o === GT[id] ? 'OK' : 'NG';

}
const sameOut = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function fmtOut(id, o) {
  const m = MODS[id];
  switch (m.type) {
    case 'det': case 'seg': return m.classes.map((c) => `${c} ${o[c]}`).join(' · ');
    case 'ocr': return o ? `“${o}”` : 'nothing read';
    case 'bead': return o ? `gap of ${o} caliper${o > 1 ? 's' : ''}` : 'no gap';
    default: return o;
  }
}
function gtText(id) {
  const m = MODS[id];
  if (m.type === 'det' || m.type === 'seg') return m.classes.map((c) => `${c} ${GT[id][c]}`).join(' · ');
  if (m.type === 'bead') return `NG from a gap of ${GT.bead} calipers`;
  return GT[id];
}

/* ─── expected results ─── */
// Saved by the user, or read from annotation files
function expOf(cap, i, id) {
  const s = (S.exp[cap] || {})[i];
  if (s) return s[id];
  if (S.mode === 'annot' && !(NO_ANNOT[cap] || []).includes(i)) return IMGS[cap][i].m[id].t;
  return null;
}
// Images only: the user's OK / NG mark for the whole image
const plain = () => S.mode === 'plain';
const markOf = (cap, i) => (S.mark[cap] || {})[i] || null;
const isSaved = (cap, i) => (plain() ? markOf(cap, i) !== null : expOf(cap, i, CAPS[cap].mods[0]) !== null);
const savedIdx = (cap) => IMGS[cap].map((_, i) => i).filter((i) => isSaved(cap, i));
const totalImgs = () => CAP_IDS.reduce((s, c) => s + CAPS[c].n, 0);
const totalSaved = () => CAP_IDS.reduce((s, c) => s + savedIdx(c).length, 0);
const imgV = (vs) => (vs.includes('NG') ? 'NG' : 'OK');
const modelV = (cap, i, Tall) => imgV(CAPS[cap].mods.map((id) => verdictOf(id, outputOf(id, IMGS[cap][i].m[id], Tall[id]))));
const trueV = (cap, i) => imgV(CAPS[cap].mods.map((id) => verdictOf(id, IMGS[cap][i].m[id].t)));

// match: same result · okng: right OK/NG, different result · wrong: wrong OK/NG
function modState(id, d, exp, T) {
  const o = outputOf(id, d, T);
  if (sameOut(o, exp)) return 'match';
  return verdictOf(id, o) === verdictOf(id, exp) ? 'okng' : 'wrong';
}

        : `<button data-act="pickFolder" data-row="${r.id}" class="rounded-md border border-f-primary px-3 py-1.5 text-sm font-semibold text-f-primary hover:bg-f-primary/5">Choose folder</button>`;

    ? `<div class="flex flex-col gap-2"><div class="flex items-center justify-between text-sm"><span class="flex items-center gap-2"><span class="spin"></span>Uploading images${annot ? ' and annotation files' : ''}</span><span class="tab-num text-gray-600">${S.dr.up} of ${totalImgs()}</span></div><div class="h-2 overflow-hidden rounded-full bg-gray-200"><div class="h-full bg-f-primary" style="width:${(S.dr.up / totalImgs()) * 100}%"></div></div></div>`
    : `<div class="flex flex-wrap items-center justify-between gap-4"><div class="text-sm text-gray-700"><b>${ready}</b> captures will be tested · <span class="text-red-800">1 can't be tested</span></div>
       <div class="flex gap-3"><button class="${btnS}" data-act="toast" data-msg="Closes the drawer.">Cancel</button><button class="${btnP}" data-act="startTest" ${ready ? '' : 'disabled'}>Start Testing</button></div></div>`;
  return `<div class="pointer-events-none select-none opacity-60" aria-hidden="true">${bg}</div>
  <div class="fixed inset-x-0 bottom-0 z-[100] bg-black/50" style="top:var(--vb)"></div>
  <div class="fixed bottom-0 right-0 z-[110] flex w-full max-w-4xl flex-col bg-white shadow-2xl" style="top:var(--vb)" role="dialog" aria-label="Run a new test">
    <div class="flex h-[50px] items-center justify-between border-b px-4 text-lg font-semibold"><span>Run a new test</span><span class="text-2xl leading-none text-gray-600">×</span></div>
    <div class="flex-1 overflow-y-auto"><div class="mx-auto flex max-w-3xl flex-col gap-5 p-6">
      <fieldset class="flex flex-col gap-2"><legend class="mb-2 text-[15px] font-semibold text-gray-900">What's in your test folders?</legend>
        <div class="grid gap-3 sm:grid-cols-2">
          ${modeCard('annot', 'Images with annotations', 'Each image has an annotation file. It fills in the expected result.')}
          ${modeCard('plain', 'Images only', 'No annotation files. You mark the images you check OK or NG.')}
        </div>
      </fieldset>
      <div class="flex flex-col gap-1.5 text-sm text-gray-700">
        <p class="text-[15px] font-semibold text-gray-900">Choose a folder of test images for each capture you want to test.</p>

        <p class="flex items-start gap-1.5 text-gray-500">${ICON.shield}<span>Tests never send PLC signals, trigger integrations or change production reports.</span></p>

    <div class="border-t border-gray-300 bg-white px-6 py-4">${foot}</div>

}

/* ════════════════════════ Screen: results page ════════════════════════ */

function summaryTab() {

  <p class="text-xs text-gray-500">OK / NG at the thresholds the test ran with.</p>`;

/* ─── Module Results: the playground ─── */
function draftFor(cap, i) {
  if (D && D.cap === cap && D.i === i) return D;
  const saved = isSaved(cap, i);
  if (plain()) { D = { cap, i, mark: markOf(cap, i) || modelV(cap, i, S.thr) }; return D; }
  D = { cap, i, m: Object.fromEntries(CAPS[cap].mods.map((id) => [id, saved ? clone(expOf(cap, i, id)) : outputOf(id, IMGS[cap][i].m[id], EMC[id])])) };
  return D;
}
const draftDirty = () => !isSaved(D.cap, D.i) || (plain() ? D.mark !== markOf(D.cap, D.i) : CAPS[D.cap].mods.some((id) => !sameOut(D.m[id], expOf(D.cap, D.i, id))));
function visList(cap) {
  const all = IMGS[cap].map((_, i) => i), f = S.filter;
  if (f === 'todo') return all.filter((i) => !isSaved(cap, i));
  if (f === 'saved') return all.filter((i) => isSaved(cap, i));
  if (f === 'markok' || f === 'markng') return plain() ? all.filter((i) => markOf(cap, i) === (f === 'markok' ? 'OK' : 'NG')) : all;
  if (f === 'wrong') return all.filter((i) => isSaved(cap, i) && imgState(cap, i, S.thr) === 'wrong');
  if (f === 'nofix') { const nf = noFixImgs(); return all.filter((i) => nf.some(([c, j]) => c === cap && j === i)); }
  return all;
}

function playTab() {
  const cap = S.cap, list = visList(cap);
  if (list.length && !list.includes(S.idx)) S.idx = list[0];
  const capChips = CAP_IDS.map((c) => `<button data-act="cap" data-cap="${c}" class="flex items-center gap-2 rounded-lg border px-3 py-2 text-left text-sm ${c === cap ? 'border-f-primary bg-orange-50/70' : 'border-gray-200 hover:border-gray-300'}"><span class="font-semibold">${cn(c)}</span><span class="tab-num rounded-full bg-gray-100 px-2 py-0.5 text-xs font-semibold text-gray-600" title="${plain() ? 'Images marked' : 'Expected results saved'}">${savedIdx(c).length}/${CAPS[c].n}</span></button>`).join('');
  const filters = plain()
    ? [['all', 'All images'], ['todo', 'Not marked'], ['markok', 'Marked OK'], ['markng', 'Marked NG'], ['wrong', "Doesn't match your mark"], ['nofix', 'No threshold fixes']]
    : [['all', 'All images'], ['todo', 'Not saved'], ['saved', 'Saved'], ['wrong', "OK / NG doesn't match"], ['nofix', 'No threshold fixes']];
  const filterSel = `<label class="flex items-center gap-2 text-sm"><span class="text-gray-600">Show</span><select id="filter" class="rounded-md border border-gray-300 bg-white px-2 py-1.5 font-medium">
      ${filters.map(([k, l]) => `<option value="${k}" ${S.filter === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
  const legend = plain() ? ['match', 'wrong', 'none'] : ['match', 'okng', 'wrong', 'none'];
  const head = `<div id="score">${scoreHtml()}</div>
    <div class="flex flex-wrap items-center justify-between gap-3"><div class="flex flex-wrap gap-2">${capChips}</div>${filterSel}</div>
    <div class="flex flex-wrap items-center gap-3"><div id="dots" class="flex flex-wrap gap-1">${dotsHtml()}</div><div class="flex flex-wrap gap-3 text-xs text-gray-600">${legend.map((k) => `<span class="flex items-center gap-1"><span class="inline-block h-2.5 w-2.5 rounded-full" style="background:${STATE[k].dot}"></span>${stLabel(k)}</span>`).join('')}</div></div>`;
  if (!list.length) return `${head}<div class="rounded-xl border border-dashed border-gray-300 px-6 py-10 text-center text-gray-600">No images in ${cn(cap)} match this filter.</div>`;

  const i = S.idx, img = IMGS[cap][i], pos = list.indexOf(i);
  draftFor(cap, i);
  return `${head}
    <div class="grid gap-5 xl:grid-cols-[minmax(0,460px)_minmax(0,1fr)]">
      <figure class="flex min-w-0 flex-col gap-2 xl:sticky xl:self-start" style="top:calc(var(--vb) + 12px)">
        <div class="flex flex-wrap items-center justify-between gap-2 text-sm"><span class="font-mono text-gray-700">${img.file}</span>
          <label class="flex cursor-pointer items-center gap-2 text-gray-700"><span>Show what the model found</span><button data-act="toggleShow" class="sw ${S.show ? 'on' : ''}" aria-pressed="${S.show}" aria-label="Show what the model found"><span></span></button></label></div>
        <div id="ana" class="mx-auto aspect-square w-full max-w-[460px] overflow-hidden rounded-lg border border-[#e0e0e0]">${imgSvg(cap, i, S.show, S.thr)}</div>
        <div class="flex items-center justify-center gap-3 text-sm"><button data-act="move" data-d="-1" class="rounded-full border border-gray-300 px-3 py-1 hover:bg-gray-50 disabled:opacity-40" ${pos ? '' : 'disabled'} aria-label="Previous image">‹</button><span class="tab-num text-gray-600">Image ${pos + 1} of ${list.length}${S.filter !== 'all' ? ' in this filter' : ''}</span><button data-act="move" data-d="1" class="rounded-full border border-gray-300 px-3 py-1 hover:bg-gray-50 disabled:opacity-40" ${pos < list.length - 1 ? '' : 'disabled'} aria-label="Next image">›</button></div>
      </figure>
      <div class="flex min-w-0 flex-col gap-4">
        <div id="imgHead">${imgHeadHtml()}</div>
        ${CAPS[cap].mods.map(cardHtml).join('')}
        <div class="flex flex-wrap items-center justify-end gap-3"><span id="saveState" class="mr-auto text-sm">${saveStateHtml()}</span><button class="${btnS}" data-act="save">${plain() ? 'Save mark' : 'Save expected result'}</button><button class="${btnP}" data-act="saveNext">Save and next</button></div>
      </div>
    </div>`;
}
function scoreHtml() {
  const n = totalSaved(), N = totalImgs();
  const a = imgScore(EMC), b = imgScore(S.thr), best = n ? imgScore(bestAll()) : null, nf = n ? noFixImgs().length : 0, ch = changedKnobs().length;
  const block = (label, body, sub = '') => `<div class="flex min-w-0 flex-col justify-center px-4 py-3"><div class="text-xs font-medium uppercase tracking-wide text-gray-500">${label}</div><div class="mt-0.5 text-xl font-semibold">${body}</div>${sub ? `<div class="text-xs text-gray-500">${sub}</div>` : ''}</div>`;
  const delta = b.right === a.right ? '' : `<span class="ml-1 text-sm font-semibold ${b.right > a.right ? 'text-emerald-700' : 'text-red-700'}">${b.right > a.right ? '+' : ''}${b.right - a.right}</span>`;
  return `<div class="grid overflow-hidden rounded-xl border border-gray-200 bg-gray-50 sm:grid-cols-2 lg:grid-cols-[repeat(4,minmax(0,1fr))_auto] [&>*]:border-gray-200 lg:[&>*:not(:last-child)]:border-r">
    ${block(plain() ? 'Images marked' : 'Expected results saved', `<span class="tab-num">${n}</span> <span class="text-base font-normal text-gray-500">of ${N} images</span>`)}
    ${block(plain() ? 'Right OK / NG on marked images' : 'Right OK / NG on saved images', n ? `<span class="tab-num text-gray-400">${a.right}</span> <span class="text-gray-400">→</span> <span class="tab-num">${b.right}</span> <span class="text-base font-normal text-gray-500">of ${n}</span>${delta}` : '—', 'EMC values → your values')}
    ${block('Best thresholds can do', n ? `<span class="tab-num">${best.right}</span> <span class="text-base font-normal text-gray-500">of ${n}</span> <button data-act="tryBest" class="ml-1 text-sm font-semibold text-f-purple hover:underline">Try these values</button>` : '—')}
    ${block('No threshold fixes', n ? (nf ? `<button data-act="showNoFix" class="tab-num text-red-700 hover:underline">${nf} image${nf > 1 ? 's' : ''}</button>` : '<span class="text-emerald-700">0 images</span>') : '—')}
    <div class="flex flex-col justify-center gap-2 px-4 py-3"><button class="${btnP} w-full whitespace-nowrap" data-act="askApply" ${ch ? '' : 'disabled'}>Update thresholds at EMC${ch ? ` (${ch})` : ''}</button>${plain() ? `<button class="${btnS} w-full whitespace-nowrap" data-act="askDownload">Download images</button>` : ''}</div>
  </div>`;
}
function dotsHtml() {
  const cap = S.cap;
  return IMGS[cap].map((_, i) => {
    const st = isSaved(cap, i) ? imgState(cap, i, S.thr) : 'none';
    return `<button data-act="jump" data-i="${i}" title="${short(i)} · ${stLabel(st)}" aria-label="${short(i)}, ${stLabel(st)}" class="h-4 w-4 rounded-full ${i === S.idx ? 'ring-2 ring-gray-900 ring-offset-1' : ''}" style="background:${STATE[st].dot}"></button>`;
  }).join('');
}
function imgHeadHtml() {
  if (plain()) {
    const { cap, i } = D, mv = modelV(cap, i, S.thr), st = imgState(cap, i, S.thr, D.mark);
    const seg = ['OK', 'NG'].map((v) => `<button data-act="mark" data-v="${v}" aria-pressed="${D.mark === v}" class="px-4 py-1 text-sm font-bold ${D.mark === v ? (v === 'OK' ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white') : 'bg-white text-gray-600 hover:bg-gray-50'}">${v}</button>`).join('');
    return `<div class="flex flex-wrap items-center justify-between gap-3 rounded-lg bg-gray-50 px-4 py-3"><span class="font-semibold">Image result</span>
      <span class="flex flex-wrap items-center gap-2 text-sm text-gray-600">Model ${pillOK(mv)} <span class="ml-2">Your mark</span> <span class="inline-flex overflow-hidden rounded-md border border-gray-300 divide-x divide-gray-300" role="group" aria-label="Your mark">${seg}</span> ${chipHtml(st)}</span></div>`;
  }
  const { cap, i } = D, mods = CAPS[cap].mods, d = IMGS[cap][i].m;
  const mv = imgV(mods.map((id) => verdictOf(id, outputOf(id, d[id], S.thr[id])))), ev = imgV(mods.map((id) => verdictOf(id, D.m[id])));
  const st = imgState(cap, i, S.thr, D.m);
  return `<div class="flex flex-wrap items-center justify-between gap-3 rounded-lg bg-gray-50 px-4 py-3"><span class="font-semibold">Image result</span>
    <span class="flex flex-wrap items-center gap-2 text-sm text-gray-600">Model ${pillOK(mv)} <span>Expected</span> ${pillOK(ev)} <span class="rounded-full px-2.5 py-0.5 text-xs font-semibold ${STATE[st].chip}">${STATE[st].label}</span></span></div>`;
}
function saveStateHtml() {
  if (!isSaved(D.cap, D.i)) return `<span class="text-gray-500">${plain() ? 'Not marked' : 'Expected result not saved'}</span>`;
  return draftDirty() ? '<span class="font-semibold text-amber-800">Changed, not saved</span>' : `<span class="inline-flex items-center gap-1 font-semibold text-emerald-700">${ICON.ok}Saved</span>`;
}

// One card per module: what the model finds at these thresholds, what was expected, and the thresholds
function cardHtml(id) {
  const m = MODS[id], ks = knobs(id);
  const sliders = ks.length
    ? ks.map((k) => `<div class="flex flex-wrap items-center gap-x-3 gap-y-1">
        <span class="w-40 text-sm font-medium">${k.label}</span>
        <input id="rng-${id}-${k.key}" type="range" min="${k.min}" max="${k.max}" step="${k.step}" value="${S.thr[id][k.key]}" data-mod="${id}" data-knob="${k.key}" class="min-w-[140px] flex-1" aria-label="${m.name} ${k.label} threshold">
        <span id="val-${id}-${k.key}" class="tab-num w-11 text-right text-sm font-semibold">${pct(S.thr[id][k.key])}</span>
        <span class="tab-num w-16 text-xs text-gray-500">EMC ${pct(EMC[id][k.key])}</span>
      </div>`).join('')
    : '<p class="text-sm text-gray-500">No thresholds for a code reader.</p>';
  return `<section class="flex flex-col gap-3 rounded-xl border border-gray-200 p-4" aria-label="${m.name}">
    <div class="flex flex-wrap items-start justify-between gap-2"><div><h3 class="font-semibold">${m.name}</h3><div class="text-xs text-gray-500">${m.typeName} · Ground truth in EMC: <span class="font-medium text-gray-700">${gtText(id)}</span></div></div><span id="st-${id}"></span></div>
    <div class="grid gap-3 ${plain() ? '' : 'sm:grid-cols-2'}">
      <div class="flex flex-col gap-2 rounded-lg border border-gray-200 px-3 py-2.5"><div class="text-xs font-medium uppercase tracking-wide text-gray-500">Model finds</div><div id="out-${id}" class="flex flex-wrap items-center justify-between gap-2"></div></div>
      ${plain() ? '' : `<div class="flex flex-col gap-2 rounded-lg border border-f-purple/40 bg-violet-50/40 px-3 py-2.5"><div class="text-xs font-medium uppercase tracking-wide text-f-purple">Expected</div><div class="flex flex-wrap items-center justify-between gap-2"><div class="flex flex-wrap items-center gap-2">${editorHtml(id)}</div><span id="ev-${id}"></span></div></div>`}
    </div>
    <div id="fix-${id}" class="empty:hidden"></div>
    <div class="flex flex-col gap-2 border-t border-gray-100 pt-3">${sliders}</div>
    <div id="foot-${id}" class="text-xs text-gray-600"></div>
  </section>`;
}
function editorHtml(id) {
  const m = MODS[id], v = D.m[id];
  const step = (cls, n) => `<span class="inline-flex items-center gap-1 rounded-md border border-gray-300 bg-white px-1 py-0.5 text-sm"><span class="px-1 font-medium">${cls}</span><button data-act="dec" data-mod="${id}" data-cls="${cls}" class="h-6 w-6 rounded hover:bg-gray-100" aria-label="Fewer ${cls}">−</button><span class="tab-num w-4 text-center font-semibold">${n}</span><button data-act="inc" data-mod="${id}" data-cls="${cls}" class="h-6 w-6 rounded hover:bg-gray-100" aria-label="More ${cls}">+</button></span>`;
  switch (m.type) {
    case 'det': case 'seg': return m.classes.map((c) => step(c, v[c])).join('');
    case 'cls': return `<select id="exp-${id}" data-mod="${id}" class="rounded-md border border-gray-300 bg-white px-2 py-1 text-sm font-medium">${m.classes.map((c) => `<option ${v === c ? 'selected' : ''}>${c}</option>`).join('')}</select>`;
    case 'ocr': return `<input id="exp-${id}" data-mod="${id}" value="${esc(v)}" class="w-36 rounded-md border border-gray-300 bg-white px-2 py-1 font-mono text-sm" aria-label="Expected text" spellcheck="false">`;
    case 'bead': return `<span class="inline-flex items-center gap-1 rounded-md border border-gray-300 bg-white px-1 py-0.5 text-sm"><span class="px-1 font-medium">gap</span><button data-act="dec" data-mod="${id}" class="h-6 w-6 rounded hover:bg-gray-100" aria-label="Shorter gap">−</button><span class="tab-num w-4 text-center font-semibold">${v}</span><button data-act="inc" data-mod="${id}" class="h-6 w-6 rounded hover:bg-gray-100" aria-label="Longer gap">+</button></span><span class="text-xs text-gray-500">calipers</span>`;
    default: return `<select id="exp-${id}" data-mod="${id}" class="rounded-md border border-gray-300 bg-white px-2 py-1 text-sm font-medium">${['Readable', 'Not readable'].map((c) => `<option ${v === c ? 'selected' : ''}>${c}</option>`).join('')}</select>`;
  }
}
// Everything that follows the thresholds or the expected result, without re-rendering the sliders
function refreshLive() {
  if (S.view !== 'results' || S.tab !== 'results' || !D || !$('#ana')) return;
  const { cap, i } = D, d = IMGS[cap][i].m;

  $('#score').innerHTML = scoreHtml();
  $('#dots').innerHTML = dotsHtml();
  $('#imgHead').innerHTML = imgHeadHtml();
  $('#saveState').innerHTML = saveStateHtml();
  for (const id of CAPS[cap].mods) {
    const o = outputOf(id, d[id], S.thr[id]);
    $(`#out-${id}`).innerHTML = `<span class="text-sm font-semibold">${esc(fmtOut(id, o))}</span>${pillOK(verdictOf(id, o))}`;
    knobs(id).forEach((k) => { const e = $(`#val-${id}-${k.key}`); if (e) e.textContent = pct(S.thr[id][k.key]); });
    if (plain()) continue; // Images only: OK / NG is marked for the whole image, not per module
    const st = modState(id, d[id], D.m[id], S.thr[id]);
    $(`#ev-${id}`).innerHTML = pillOK(verdictOf(id, D.m[id]));
    $(`#st-${id}`).innerHTML = `<span class="rounded-full px-2.5 py-0.5 text-xs font-semibold ${STATE[st].chip}">${STATE[st].label}</span>`;
    const fx = canFix(id, d[id], D.m[id], cap, i);
    $(`#fix-${id}`).innerHTML = !fx.verdict
      ? `<div class="flex items-start gap-2 rounded-md bg-red-50 px-3 py-2 text-sm text-red-800">${ICON.err}<span>No threshold gives the expected OK / NG on this image.</span></div>`
      : !fx.output ? `<div class="flex items-start gap-2 rounded-md bg-gray-50 px-3 py-2 text-sm text-gray-700">${ICON.warn}<span>A threshold can give the expected OK / NG here, but not this exact result.</span></div>` : '';
    const sc = modScore(id, S.thr[id]), sa = modScore(id, EMC[id]);
    $(`#foot-${id}`).innerHTML = sc.n ? `Saved images in ${cn(cap)}: right OK / NG on <b class="tab-num">${sc.right} of ${sc.n}</b> at these values · <span class="tab-num">${sa.right}</span> at EMC values` : '';
  }
  save();
}

/* ─── Download images (Images only) ─── */
const DL_OPTS = [['ok', 'OK images'], ['ng', 'NG images'], ['all', 'All images']];
const dlList = (which, cap) => IMGS[cap].map((_, i) => i).filter((i) => which === 'all' || markOf(cap, i) === which.toUpperCase());
const dlName = () => `Hinge Line A - Test 15 - ${S.dl.which === 'all' ? 'All' : S.dl.which.toUpperCase()}.zip`;
function dlHtml() {
  const W = S.dl.which, ch = changedKnobs().length;
  const opts = DL_OPTS.map(([k, label]) => {
    const n = CAP_IDS.reduce((s, c) => s + dlList(k, c).length, 0);
    return `<label data-act="dlWhich" data-v="${k}" class="flex cursor-pointer items-center justify-between gap-3 rounded-lg border-2 px-4 py-3 ${W === k ? 'border-f-primary bg-orange-50/60' : 'border-gray-200 hover:border-gray-300'}">
      <span class="flex items-center gap-3"><input type="radio" name="dlw" value="${k}" class="accent-[#ff4301]" ${W === k ? 'checked' : ''}><span class="font-semibold">${label}</span></span><span class="tab-num text-sm text-gray-600">${n} images</span></label>`;
  }).join('');
  const caps = CAP_IDS.map((c) => {
    const n = dlList(W, c).length, on = S.dl.caps[c] && n > 0;
    return `<label data-act="dlCap" data-cap="${c}" class="flex items-center justify-between gap-3 px-4 py-2.5 ${n ? 'cursor-pointer' : 'cursor-not-allowed text-gray-400'}">
      <span class="flex items-center gap-3"><input type="checkbox" class="h-4 w-4 accent-[#ff4301]" ${on ? 'checked' : ''} ${n ? '' : 'disabled'}><span class="font-medium">${cn(c)}</span></span><span class="tab-num text-sm ${n ? 'text-gray-600' : ''}">${n} images</span></label>`;
  }).join('');
  const total = CAP_IDS.reduce((s, c) => s + (S.dl.caps[c] ? dlList(W, c).length : 0), 0);
  return `<h2 class="text-xl font-semibold">Download images</h2>
    <fieldset class="mt-5 flex flex-col gap-2"><legend class="mb-2 text-sm font-semibold text-gray-900">Images</legend>${opts}</fieldset>
    <fieldset class="mt-5"><legend class="mb-2 text-sm font-semibold text-gray-900">Captures</legend><div class="divide-y divide-gray-100 rounded-lg border border-gray-200">${caps}</div></fieldset>
    <div class="mt-5 flex items-center justify-between gap-3 rounded-md bg-gray-50 px-4 py-2.5 text-sm"><span class="text-gray-600">Labels</span><span class="font-medium">At the thresholds on screen${ch ? ` · ${ch} changed from EMC` : ''}</span></div>
    <div class="mt-6 flex flex-wrap items-center justify-between gap-3"><span class="flex min-w-0 items-center gap-2 text-sm text-gray-600">${ICON.folder}<span class="truncate">${esc(dlName())}</span></span>
      <span class="flex gap-3"><button class="${btnS}" data-act="closeModal">Cancel</button><button class="${btnP}" data-act="dlGo" ${total ? '' : 'disabled'}>Download${total ? ` (${total})` : ''}</button></span></div>`;
}
const setHash = (h) => { try { history.replaceState(null, '', `#${h}`); } catch (e) { /* sandboxed */ } };
function askDownload() {
  modal(dlHtml()); setHash('download');
  if (window.self !== window.top) parent.postMessage({ type: 'testing-v2-nav', to: 'edge-download' }, '*');
}
// What the Vision upload screen shows: the file name and the images in each capture folder
function dlGo() {
  const caps = CAP_IDS.filter((c) => S.dl.caps[c] && dlList(S.dl.which, c).length);
  const files = Object.fromEntries(caps.map((c) => [c, dlList(S.dl.which, c).map(short)]));
  try { localStorage.setItem('edge-testing-v2-dl', JSON.stringify({ which: S.dl.which, caps, files })); } catch (e) { /* storage unavailable */ }
  modal(''); setHash('results');
  toast(`Downloading ${dlName()}`);
}
function askApply() {
  const list = changedKnobs();
  modal(`<h2 class="text-xl font-semibold">Update thresholds at EMC?</h2>
    <ul class="mt-4 divide-y divide-gray-100 rounded-lg border border-gray-200 text-sm">${list.map((d) => `<li class="flex justify-between gap-3 px-4 py-2.5"><span>${MODS[d.id].name} · ${d.k.label}</span><span class="tab-num">${pct(d.a)} → <b>${pct(d.b)}</b></span></li>`).join('')}</ul>
    <p class="mt-3 text-sm text-gray-600">Only Hinge Line A changes; other instances that use these models keep their values.</p>
    <div class="mt-5 flex justify-end gap-3"><button class="${btnS}" data-act="closeModal">Cancel</button><button class="${btnP}" data-act="apply">Update</button></div>`);
}

/* ════════════════════════ render ════════════════════════ */
const VSTEPS = [['run', '1 · Run a new test'], ['summary', '2 · Summary'], ['results', '3 · Module Results']];
const curV = () => (S.view === 'run' ? 'run' : S.tab);
function render() {
  $('#app').innerHTML = S.view === 'run' ? runView() : resultsView();
  const cv = curV();
  $('#vSteps').innerHTML = VSTEPS.map(([k, l]) => `<button data-act="vstep" data-k="${k}" class="viewer-tab rounded px-2.5 py-1 hover:bg-white/10" ${k === cv ? 'aria-current="step"' : ''}>${l}</button>`).join('');
  $$('[data-act="setMode"]', $('#viewerBar')).forEach((b) => { const on = b.dataset.mode === S.mode; b.className = `px-2.5 py-1 ${on ? 'bg-white text-gray-900' : 'hover:bg-white/10'}`; b.setAttribute('aria-pressed', on); });
  $('[data-act="demoFill"]').textContent = plain() ? 'Mark every image (demo)' : 'Fill expected results (demo)';
  try { history.replaceState(null, '', `#${cv}`); } catch (e) { /* sandboxed */ }
  fitBar();
  refreshLive();
  save();
}
// The viewer bar wraps on narrow screens; keep the drawer and rail below it
function fitBar() { document.documentElement.style.setProperty('--vb', `${$('#viewerBar').offsetHeight}px`); }
window.addEventListener('resize', fitBar);

/* ════════════════════════ events ════════════════════════ */
function goStep(k) {
  if (k === 'run') { S.view = 'run'; return; }
  S.view = 'results'; S.tab = k;
}
function setIdx(i) { S.idx = i; D = null; }
// Demo: mark every image with what it really shows
function demoMarks() { for (const c of CAP_IDS) { S.mark[c] = {}; IMGS[c].forEach((_, i) => { S.mark[c][i] = trueV(c, i); }); } }
function saveDraft() {
  const store = plain() ? S.mark : S.exp;
  store[D.cap] = store[D.cap] || {};
  store[D.cap][D.i] = plain() ? D.mark : clone(D.m);
  S.ver++;
}
function nextIdx() {
  const l = visList(S.cap), p = l.indexOf(D.i);
  if (S.filter === 'todo') { const nl = visList(S.cap); return nl[0]; }
  return l[p + 1];
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  if (!(a === 'setMode' && b.tagName === 'INPUT')) e.preventDefault();
  switch (a) {
    case 'vstep': goStep(b.dataset.k); break;
    case 'go': S.view = b.dataset.view; break;
    case 'setMode': S.mode = b.dataset.mode; D = null; S.ver++; if (!(plain() ? ['all', 'todo', 'markok', 'markng', 'wrong', 'nofix'] : ['all', 'todo', 'saved', 'wrong', 'nofix']).includes(S.filter)) S.filter = 'all'; break;
    case 'demoFill':
      if (plain()) { demoMarks(); toast('Every image marked (demo).'); } else {
        for (const c of CAP_IDS) { S.exp[c] = {}; IMGS[c].forEach((img, i) => { S.exp[c][i] = Object.fromEntries(CAPS[c].mods.map((id) => [id, clone(img.m[id].t)])); }); }
        toast('Expected results filled in for every image (demo).');
      }
      D = null; S.ver++; S.view = 'results'; S.tab = 'results'; break;
    case 'mark': D.mark = b.dataset.v; refreshLive(); return;
    case 'askDownload': askDownload(); return;
    case 'dlWhich': S.dl.which = b.dataset.v; modal(dlHtml()); return;
    case 'dlCap': if (dlList(S.dl.which, b.dataset.cap).length) { S.dl.caps[b.dataset.cap] = !S.dl.caps[b.dataset.cap]; modal(dlHtml()); } return;
    case 'dlGo': dlGo(); save(); return;
    case 'reset': S = fresh(); D = null; toast('Prototype reset.'); break;
    case 'toast': toast(b.dataset.msg); return;
    case 'pickFolder': S.dr.f[b.dataset.row] = true; break;
    case 'clearFolder': S.dr.f[b.dataset.row] = false; break;
    case 'startTest': {
      S.dr.up = 1; render();
      const N = totalImgs(), tick = () => { S.dr.up = Math.min(N, S.dr.up + 17); if (S.dr.up >= N) { S.dr.up = null; S.view = 'results'; S.tab = 'results'; render(); toast('Test 15 completed.'); } else { render(); setTimeout(tick, 90); } };
      setTimeout(tick, 90); return;
    }
    case 'tab': S.tab = b.dataset.tab; break;
    case 'cap': S.cap = b.dataset.cap; setIdx(0); break;
    case 'jump': setIdx(+b.dataset.i); if (!visList(S.cap).includes(S.idx)) S.filter = 'all'; break;
    case 'move': { const l = visList(S.cap), p = l.indexOf(S.idx) + +b.dataset.d; if (l[p] !== undefined) setIdx(l[p]); break; }
    case 'toggleShow': S.show = !S.show; break;
    case 'inc': case 'dec': {
      const id = b.dataset.mod, dv = a === 'inc' ? 1 : -1;
      if (b.dataset.cls) D.m[id][b.dataset.cls] = Math.max(0, Math.min(9, D.m[id][b.dataset.cls] + dv));
      else D.m[id] = Math.max(0, Math.min(40, D.m[id] + dv));
      b.parentElement.querySelector('.tab-num').textContent = b.dataset.cls ? D.m[id][b.dataset.cls] : D.m[id];
      refreshLive(); return;
    }
    case 'save': saveDraft(); toast(plain() ? `Marked ${short(D.i)} ${D.mark}.` : `Saved the expected result for ${short(D.i)}.`); refreshLive(); return;
    case 'saveNext': { saveDraft(); const n = nextIdx(); if (n !== undefined) setIdx(n); else toast(`Saved. That was the last image in ${cn(S.cap)} for this filter.`); break; }
    case 'tryBest': S.thr = clone(bestAll()); toast('Thresholds set to the best values for your saved images.'); break;
    case 'showNoFix': { S.filter = 'nofix'; const nf = noFixImgs(); if (nf.length && !nf.some(([c]) => c === S.cap)) S.cap = nf[0][0]; setIdx(visList(S.cap)[0] ?? 0); break; }
    case 'askApply': askApply(); return;
    case 'apply': modal(''); S.applied = true; toast('Thresholds updated in Edit Module Configurations for Hinge Line A.'); return;
    case 'closeModal': modal(''); if (location.hash === '#download') setHash('results'); return;
    default: return;
  }
  render();
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'filter') { S.filter = t.value; D = null; render(); }
  if (t.tagName === 'SELECT' && t.id.startsWith('exp-')) { D.m[t.dataset.mod] = t.value; refreshLive(); }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.knob) { S.thr[t.dataset.mod][t.dataset.knob] = r2(+t.value); refreshLive(); }
  if (t.tagName === 'INPUT' && t.id === 'exp-ocr') { D.m.ocr = t.value.trim(); refreshLive(); }
});
document.addEventListener('keydown', (e) => {
  if (S.view !== 'results' || S.tab !== 'results' || $('#modal').innerHTML) return;
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName) && document.activeElement.type !== 'range') return;
  const l = visList(S.cap), p = l.indexOf(S.idx);
  if (e.key === 'ArrowRight' && l[p + 1] !== undefined) { setIdx(l[p + 1]); render(); }
  if (e.key === 'ArrowLeft' && l[p - 1] !== undefined) { setIdx(l[p - 1]); render(); }
});

// #download: Module Results in Images only mode with the Download images dialog open (marks filled in if there are none)
function openDownload() {
  if (!plain()) { S.mode = 'plain'; D = null; S.ver++; }
  if (!totalSaved()) { demoMarks(); D = null; S.ver++; }
  goStep('results'); render(); modal(dlHtml()); setHash('download');
}
// Open the view named in the link (#run, #summary, #results, #download)
function fromHash() { const h = location.hash.slice(1); if (h === 'download') return openDownload(); modal(''); if (VSTEPS.some(([k]) => k === h) && h !== curV()) { goStep(h); render(); } }
window.addEventListener('hashchange', fromHash);
const h0 = location.hash.slice(1);
if (VSTEPS.some(([k]) => k === h0)) goStep(h0);
// #marked (for screenshots): Images only, every image marked, opened on the first image the model gets wrong
if (h0 === 'marked') {
  S.mode = 'plain'; if (!totalSaved()) demoMarks(); S.ver++; S.cap = 'hu'; S.filter = 'all';
  setIdx(Math.max(0, IMGS.hu.findIndex((_, i) => imgState('hu', i, S.thr) === 'wrong'))); goStep('results');
}
render();
if (h0 === 'download') openDownload();
</script>

</html>
