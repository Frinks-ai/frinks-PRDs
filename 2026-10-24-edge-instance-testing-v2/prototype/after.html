<script>
/* ════════════════════════ helpers ════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
}
const P = (pts) => pts.map((p) => `${(+p[0]).toFixed(1)},${(+p[1]).toFixed(1)}`).join(' ');
const pct = (v) => `${Math.round(v * 100)}%`;
const fmt = (s) => (s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, '0')} s`);
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rotP = (p, deg, c = [200, 200]) => { const a = (deg * Math.PI) / 180, dx = p[0] - c[0], dy = p[1] - c[1]; return [c[0] + dx * Math.cos(a) - dy * Math.sin(a), c[1] + dx * Math.sin(a) + dy * Math.cos(a)]; };
const bbox = (pts) => { const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]); const x = Math.min(...xs), y = Math.min(...ys); return [x, y, Math.max(...xs) - x, Math.max(...ys) - y]; };
const iou = (a, b) => { const ix = Math.max(0, Math.min(a[0] + a[2], b[0] + b[2]) - Math.max(a[0], b[0])); const iy = Math.max(0, Math.min(a[1] + a[3], b[1] + b[3]) - Math.max(a[1], b[1])); const i = ix * iy; return i / (a[2] * a[3] + b[2] * b[3] - i); };
const circlePts = (cx, cy, r, n = 14) => Array.from({ length: n }, (_, k) => [cx + r * Math.cos((k / n) * 2 * Math.PI), cy + r * Math.sin((k / n) * 2 * Math.PI)]);

const ICON = {
  info: '<svg class="mt-[2px] h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  warn: '<svg class="mt-[2px] h-4 w-4 shrink-0 text-amber-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  err: '<svg class="mt-[2px] h-4 w-4 shrink-0 text-red-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>',
  ok: '<svg class="mt-[2px] h-4 w-4 shrink-0 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>',
  lock: '<svg class="mt-[2px] h-4 w-4 shrink-0 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  shield: '<svg class="mt-[2px] h-4 w-4 shrink-0 text-emerald-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>',
  folder: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fbbf24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z"/></svg>',
};

/* ════════════════════════ sample data ════════════════════════ */
// One fixed colour per module (today's testing palette, red and green left out): colour = module, never pass/fail
const MARK = '#FFEF33';
const MODS = {

    classes: ['pin', 'washer', 'missing pin'],
    saved: { pin: [0.45, 0.5], washer: [0.52, 0.5], 'missing pin': [0.4, 0.5] },
    sugg: { pin: [0.41, 0.55], washer: [0.58, 0.5], 'missing pin': [0.47, 0.45] },
    peak: { pin: 0.93, washer: 0.88, 'missing pin': 0.71 },
    cm: { labels: ['pin', 'washer', 'missing pin', 'nothing'], m: [[331, 2, 4, 9], [1, 104, 0, 5], [6, 0, 38, 4], [11, 3, 2, 0]] } },
  finish: { name: 'Surface finish', type: 'cls', typeName: 'Classification', color: '#FFC033', model: 'Plate finish classifier v2', ms: 11,
    classes: ['clean', 'scratch', 'dent'],
    saved: { clean: [0.6], scratch: [0.55], dent: [0.55] },
    sugg: { clean: [0.55], scratch: [0.62], dent: [0.5] },
    peak: { clean: 0.96, scratch: 0.84, dent: 0.74 },
    cm: { labels: ['clean', 'scratch', 'dent'], m: [[84, 4, 2], [3, 13, 1], [1, 1, 5]] } },
  plating: { name: 'Knuckle colour', type: 'color', typeName: 'Colour detection', color: '#33FFD0', ms: 6 },
  hshapes: { name: 'Hole & edge shapes', type: 'shape', typeName: 'Shape extractor', color: '#FFEF33', ms: 24 },
  weld: { name: 'Weld check', type: 'seg', typeName: 'Segmentation', color: '#E033FF', model: 'Weld segmenter v5', ms: 52,
    classes: ['weld', 'spatter', 'porosity'],
    saved: { weld: [0.5, 0.45], spatter: [0.4, 0.45], porosity: [0.35, 0.45] },
    sugg: { weld: [0.48, 0.5], spatter: [0.46, 0.45], porosity: [0.3, 0.4] },
    peak: { weld: 0.95, spatter: 0.79, porosity: 0.66 },
    cm: { labels: ['weld', 'spatter', 'porosity', 'nothing'], m: [[62, 0, 1, 1], [0, 41, 3, 9], [0, 2, 17, 6], [0, 7, 4, 0]] } },
  bshapes: { name: 'Bracket shapes', type: 'shape', typeName: 'Shape extractor', color: '#33A1FF', ms: 19 },
  tilt: { name: 'Bracket tilt', type: 'tilt', typeName: 'Orientation & tilt check', color: '#FFEF33', ms: 8 },
  bead: { name: 'Sealant bead', type: 'bead', typeName: 'Bead inspection', color: '#33A1FF', ms: 61 },
  ocr: { name: 'Label text', type: 'ocr', typeName: 'OCR (Read & Match)', color: '#FFC033', model: 'Label text reader', ms: 45,
    classes: ['text'], saved: { text: [0.7] }, sugg: { text: [0.62] }, peak: { text: 0.94 } },
  qr: { name: 'Label QR code', type: 'code', typeName: 'Code reader', color: '#50DFF3', ms: 9 },
};
const HAS_IOU = (t) => t === 'det' || t === 'seg';

const CAPS = {
  hu: { v: 'Hinge U', c: 'Right Part', mods: ['pin', 'finish'] },
  hy: { v: 'Hinge Y', c: 'Top View', mods: ['plating', 'hshapes'], uncal: true },
  br: { v: 'Bracket', c: 'Weld View', mods: ['weld', 'bshapes', 'tilt'], noDims: true },
  hs: { v: 'Housing', c: 'Sealant', mods: ['bead'] },
  hl: { v: 'Housing', c: 'Label', mods: ['ocr', 'qr'] },
};
const cn = (id) => `${CAPS[id].v} · ${CAPS[id].c}`;
const UNREADABLE = [7, 23, 41, 58, 77, 102]; // Hinge U · Right Part, Test 10

const TESTS = [
  { n: 14, started: '16 Oct 2026, 10:42 AM', took: '3 min 12 s', by: 'you', imgs: { hu: 120, hy: 88, br: 64, hs: 40, hl: 120 }, skipped: { hy: 12 }, status: 'done',
    reason: '', results: true },
  { n: 13, started: '15 Oct 2026, 4:20 PM', took: '1 min 05 s', by: 'Akshat', imgs: { hu: 40, hy: 24 }, status: 'done',
    reason: '', results: true },
  { n: 12, started: '15 Oct 2026, 2:02 PM', took: '12 s', by: 'you', imgs: { hs: 40, hl: 120 }, status: 'failed',
    reason: 'The device ran out of storage space while saving results. Free up space, then run the test again.', results: false },
  { n: 11, started: '14 Oct 2026, 6:10 PM', took: '40 s', by: 'Akshat', imgs: { hu: 30, br: 20, hs: 20, hl: 20 }, status: 'cancelled',
    reason: 'Cancelled by Akshat after 30 of 90 images. Nothing was kept.', results: false },
  { n: 10, started: '14 Oct 2026, 11:40 AM', took: '2 min 14 s', by: 'you', imgs: { hu: 120, hy: 88 }, status: 'errors',
    reason: '6 of 120 images for Hinge U · Right Part could not be read (the files are damaged). They were left out; everything else was tested.', results: true },
];
const STATUS = {
  running: { label: 'Running', cls: 'bg-blue-100 text-blue-800' },
  done: { label: 'Completed', cls: 'bg-emerald-100 text-emerald-800' },
  errors: { label: 'Completed with errors', cls: 'bg-amber-100 text-amber-900' },
  failed: { label: 'Failed', cls: 'bg-red-100 text-red-800' },
  cancelled: { label: 'Cancelled', cls: 'bg-gray-200 text-gray-700' },
};
const pill = (st, extra = '') => `<span class="inline-flex items-center whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-semibold ${STATUS[st].cls}">${STATUS[st].label}${extra}</span>`;

// Run drawer rows. warnC = config warnings (always shown); warnF = folder warnings (only once a folder is chosen)
const ROWS = [
  { id: 'hu', v: 'Hinge U', c: 'Right Part', pick: 'hinge_u_right', imgs: 120, annotated: true },
  { id: 'hy', v: 'Hinge Y', c: 'Top View', pick: 'hinge_y_top', imgs: 88, skip: 12,
    warnF: ["Image size doesn't match this camera: 12 of 88 images are 1920 × 1080, but this camera takes 2448 × 2048 images. Those 12 won't be uploaded; the other 76 will be tested."] },
  { id: 'br', v: 'Bracket', c: 'Weld View', pick: 'bracket_weld', imgs: 64, annotated: true },
  { id: 'hs', v: 'Housing', c: 'Sealant', pick: 'housing_sealant_oct', imgs: 640,
    warnF: ['Not enough free space on the device: these images need about 2.4 GB and only 1.1 GB is free. Free up space or choose fewer images.'] },
  { id: 'hl', v: 'Housing', c: 'Label', pick: 'housing_label', imgs: 120, annotated: true },
  { id: 'hg', v: 'Housing', c: 'Gasket', err: "Can't be tested: bead inspection isn't set up for this capture yet (bead width and gap rules are missing).", link: 'Open Edit Module Configurations' },
];
// Images of the wrong size are skipped at upload; the rest of the folder is tested
const imgsOf = (id) => { const r = ROWS.find((x) => x.id === id); return r.imgs - (r.skip || 0); };

/* ════════════════════════ state ════════════════════════ */
const S = {
  vt: 0, screen: 'list', inst: 'Hinge Line A', instFilter: 'all', pick: false, noHistory: true,
  deploy: false, other: false, recipe: false, annot: false,
  myRun: null, deleted: [], today: false,
  dr: { f: { hu: true, hy: true, br: true, hs: true, hl: false }, up: null },
  res: { test: 14, tab: 'summary', filter: 'all', cap: 'hu', img: 2, mod: { hu: 'pin', hy: 'plating', br: 'weld', hs: 'bead', hl: 'ocr' } },
  thr: {}, saved: {},
};
for (const [id, m] of Object.entries(MODS)) {
  if (!m.classes) continue;
  S.thr[id] = {}; S.saved[id] = {};
  m.classes.forEach((c) => {
    const [conf, iouv = null] = m.saved[c];
    S.thr[id][c] = { conf, iou: iouv }; S.saved[id][c] = { conf, iou: iouv };
  });
}

/* ════════════════════════ test / run model ════════════════════════ */
function activeRun() {
  if (S.other) return { n: 15, by: 'Akshat', pct: 42, state: 'running', caps: ['hu', 'br', 'hl'], started: '11:05 AM' };
  if (S.myRun) return { by: 'you', ...S.myRun };
  return null;
}
function runNumbers(r) {
  const tot = r.caps.reduce((s, c) => s + imgsOf(c), 0);
  const done = Math.round((tot * r.pct) / 100);
  return { tot, done };
}
function runAsTest(r) {
  const { tot, done } = runNumbers(r);
  // Cancelled tests list what was actually tested, capture by capture
  const imgs = {}; let rem = done;
  r.caps.forEach((c) => {
    if (r.state === 'cancelled') { const d = Math.min(imgsOf(c), rem); rem -= d; if (d > 0) imgs[c] = d; }
    else imgs[c] = imgsOf(c);
  });
  const TOTAL = 240;
  const reason = {
    running: '',
    done: '',
    cancelled: `Cancelled by ${r.cancelledBy || r.by} after ${done} of ${tot} images. Nothing was kept.`,
  }[r.state];
  return { n: r.n, started: `16 Oct 2026, ${r.started}`, took: r.state === 'running' ? '—' : fmt(Math.round((TOTAL * r.pct) / 100)), by: r.by, imgs, status: r.state, reason,
    results: r.state === 'done', pct: r.pct, live: true };
}
const allTests = () => { const past = S.noHistory ? [] : TESTS.filter((t) => !S.deleted.includes(t.n)); const r = activeRun(); return r ? [runAsTest(r), ...past] : [...past]; };
const testById = (n) => allTests().find((t) => t.n === n) || TESTS[0];
const curTest = () => testById(S.res.test);
const isBad = (cap, i) => curTest().status === 'errors' && cap === 'hu' && UNREADABLE.includes(i);
const nImgs = (cap) => curTest().imgs[cap] || 0;

function runBlocks() {
  const out = [];
  if (S.deploy) out.push(`A deployment is running on this device. Stop it to run a test.`);
  const r = activeRun();
  if (r && r.state === 'running') {
    out.push(r.by === 'you'
      ? `Your test is running — ${r.pct}%. Only one test can run on a device at a time.`
      : `Test running (by ${r.by}) — ${r.pct}%. Only one test can run on a device at a time.`);
  }
  return out;
}

/* ════════════════════════ page pieces ════════════════════════ */
const INSTANCES = [
  { id: '27836527-a2e4-4cbb-9541-78470fed74fe', name: 'Hinge Line A', created: '7/20/2026, 7:35:00 PM', updated: '10/14/2026, 1:33:21 PM', team: 'Quality Team' },
  { id: 'a3a39f46-13ba-468a-b33c-8c6075ff1e08', name: 'Housing Line B', created: '8/14/2026, 11:28:19 AM', updated: '10/12/2026, 11:39:36 AM', team: 'AE TEAM' },
  { id: 'ddeba5f2-ed69-4d06-b8b2-4ce448c8bb4e', name: 'Bracket Weld Cell', created: '7/7/2026, 4:24:39 PM', updated: '9/30/2026, 1:31:21 PM', team: 'AE TEAM' },
  { id: 'e560395d-8b4a-4f64-81e9-4be747b788dd', name: 'Label Check Station', created: '5/27/2026, 11:58:39 AM', updated: '9/30/2026, 1:32:48 PM', team: 'Quality Team' },
];

          <button data-act="toast" data-msg="Opens Add Instance (unchanged)." class="inline-flex items-center rounded-md bg-f-primary px-6 py-2 text-sm font-semibold text-white hover:bg-f-primary/90">Add Instance</button>
          ${S.pick ? `<div class="absolute right-0 top-full z-50 mt-2 w-72 rounded-lg bg-white p-2 shadow-xl ring-1 ring-gray-200" role="menu">

            <td class="px-4 py-3"><a href="#" data-act="toast" data-msg="Opens Instance Overview for ${x.name} (unchanged)." class="text-gray-900 hover:underline">${x.name}</a></td>

function reasonsHtml() {

/* ─── Screen: Testing tab ─── */
function testingTab() {
  const blocked = runBlocks().length > 0;
  const r = activeRun();
  return `${pageHead()}
  <div class="p-5">${tabsBar()}
    <div class="mx-auto flex max-w-6xl flex-col gap-5">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div>
          <h1 class="text-xl font-bold">Testing</h1>
          <p class="mt-1 text-gray-600">Try this instance's current setup on folders of saved images before you use it on the line.</p>
        </div>
        <button data-act="openDrawer" ${blocked ? 'disabled aria-disabled="true"' : ''} class="inline-flex items-center justify-center rounded-md border border-transparent bg-f-primary px-6 py-2 text-sm font-semibold text-white hover:bg-f-primary/90 disabled:cursor-not-allowed disabled:bg-gray-300 disabled:text-gray-600">Run Test</button>
      </div>
      <div id="reasons" class="flex flex-col gap-2 empty:hidden">${reasonsHtml()}</div>
      <div id="runWrap" class="flex flex-col gap-2 empty:hidden">${r ? runCard(r) : ''}</div>
      ${lastTestCard()}
      ${historyCard()}
    </div>
  </div>`;
}

function runCard(r) {
  const { tot, done } = runNumbers(r);
  const TOTAL = 240, elapsed = Math.round((TOTAL * r.pct) / 100), left = TOTAL - elapsed;
  let rem = done;
  const tiles = r.caps.map((c) => { const n = imgsOf(c); const d = Math.max(0, Math.min(n, rem)); rem -= d; return { c, n, d }; });
  const tile = ({ c, n, d }) => {
    const st = d >= n ? `<span class="flex items-center gap-1 text-emerald-700">${ICON.ok}Done</span>` : d > 0 ? `${d} of ${n}` : '<span class="text-gray-400">Waiting</span>';
    return `<div class="rounded-lg border border-gray-200 bg-gray-50 p-3">
      <div class="text-sm font-semibold text-gray-800">${cn(c)}</div>
      <div class="mt-1 flex items-center justify-between text-xs text-gray-600"><span>${n} images</span>${st}</div>
      <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-gray-200"><div class="h-full rounded-full ${d >= n ? 'bg-emerald-500' : 'bg-f-primary'}" style="width:${(d / n) * 100}%"></div></div>
    </div>`;
  };
  const who = r.by === 'you' ? 'you' : r.by;

  if (r.state === 'running') {
    return `<section class="rounded-xl border-2 border-blue-200 bg-white p-5 shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3"><span class="spin"></span><h2 class="text-lg font-semibold">Test ${r.n} is running${r.by !== 'you' ? ` (by ${r.by})` : ''} — ${r.pct}%</h2></div>
        <div class="flex items-center gap-3">${r.by !== 'you' ? `<span class="text-sm text-gray-500">Started by ${r.by}</span>` : ''}<button data-act="askCancel" class="rounded-md border border-gray-300 bg-white px-4 py-1.5 text-sm font-semibold text-gray-700 hover:bg-gray-50">Cancel test</button></div>
      </div>
      <div class="mt-3 h-2.5 overflow-hidden rounded-full bg-gray-200"><div class="h-full rounded-full bg-f-primary" style="width:${r.pct}%"></div></div>
      <div class="mt-2 text-sm text-gray-600">Started ${r.started} by ${who} · ${fmt(elapsed)} so far · about ${fmt(left)} left · ${done} of ${tot} images tested</div>
      <div class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">${tiles.map(tile).join('')}</div>
      <p class="mt-3 text-sm text-gray-500">You can leave this page. The test keeps running, and its results appear here when it's done.</p>
    </section>
    `;
  }
  // Finished or cancelled tests show in the Last test card and the history
  return '';
}

function lastTestCard() {
  // Only a banner for the last finished test; its details live in the results Summary
  const t = allTests().find((x) => x.status !== 'running');
  if (!t) return '';
  const B = {
    done: ['Testing Completed', 'border-emerald-200 bg-emerald-50', ICON.ok],
    errors: ['Testing Completed with errors', 'border-amber-200 bg-amber-50', ICON.warn],
    failed: ['Testing Failed', 'border-red-200 bg-red-50', ICON.err],
    cancelled: ['Testing Cancelled', 'border-gray-200 bg-gray-50', ICON.info],
  }[t.status];
  return `<section class="flex flex-wrap items-center justify-between gap-4 rounded-xl border ${B[1]} px-5 py-4">
      <div class="flex items-start gap-3">
        ${B[2].replace('mt-[2px] h-4 w-4', 'mt-0.5 h-6 w-6')}
        <div>
          <h2 class="text-lg font-semibold text-gray-900">${B[0]}</h2>
          <p class="text-sm text-gray-600">Test ${t.n} · ${t.started} · by ${t.by}</p>
          ${t.reason ? `<p class="mt-1 max-w-3xl text-sm text-gray-700">${t.reason}</p>` : ''}

        </div>
      </div>
      ${t.results ? `<button data-act="viewResults" data-test="${t.n}" class="inline-flex items-center justify-center rounded-md bg-f-primary px-6 py-2 text-sm font-semibold text-white hover:bg-f-primary/90">View Results</button>` : ''}
    </section>
    `;
}

function historyCard() {
  if (!allTests().length) {
    return `<section class="flex flex-col items-center gap-2 rounded-xl border border-dashed border-gray-300 px-6 py-12 text-center">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.3"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 14h9"/></svg>
      <h2 class="text-lg font-semibold text-gray-800">No tests yet</h2>
      <p class="max-w-md text-sm text-gray-600">Run a test to check this instance's setup on saved images before using it on the line. Tests don't affect the line.</p>
    </section>`;
  }
  return `<section>
      <h2 class="mb-3 text-lg font-semibold">All tests</h2>
      <div class="overflow-x-auto rounded-lg border border-gray-200">
        <table class="w-full min-w-[820px] text-left text-sm">
          <thead class="bg-gray-50 text-gray-600"><tr>
            <th class="px-4 py-3 font-medium">Test</th><th class="px-4 py-3 font-medium">Started</th><th class="px-4 py-3 font-medium">Took</th>
            <th class="px-4 py-3 font-medium">What was tested</th><th class="w-[34%] px-4 py-3 font-medium">Status</th><th class="px-4 py-3"></th>
          </tr></thead>
          <tbody id="histBody" class="divide-y divide-gray-200">${histRows()}</tbody>
        </table>
      </div>
    </section>
    `;
}
function histRows() {
  return allTests().map((t) => {
    const caps = Object.keys(t.imgs);
    const total = caps.reduce((s, c) => s + t.imgs[c], 0);
    let status;
    if (t.status === 'running') {
      status = `<div class="flex items-center gap-2">${pill('running', ` — ${t.pct}%`)}<div class="h-1.5 w-24 overflow-hidden rounded-full bg-gray-200"><div class="h-full bg-f-primary" style="width:${t.pct}%"></div></div></div>`;
    } else {
      status = `${pill(t.status)}${t.reason ? `<div class="mt-1 text-xs leading-snug text-gray-600">${t.reason}</div>` : ''}`;
    }
    let action = '';
    if (t.status === 'running') action = '<button data-act="askCancel" class="font-semibold text-gray-700 hover:underline">Cancel</button>';
    else action = `<div class="flex items-center justify-end gap-4">${t.results ? `<a href="#" data-act="viewResults" data-test="${t.n}" class="whitespace-nowrap font-semibold text-[#6B4EFF] hover:underline">View results</a>` : ''}<button data-act="askDelete" data-test="${t.n}" class="font-semibold text-red-700 hover:underline">Delete</button></div>`;
    return `<tr class="align-top ${t.live ? 'bg-blue-50/40' : ''}">
      <td class="px-4 py-3 font-semibold text-gray-900">Test ${t.n}<div class="text-xs font-normal text-gray-500">by ${t.by}</div></td>
      <td class="px-4 py-3 text-gray-700">${t.started}</td>
      <td class="px-4 py-3 text-gray-700">${t.took}</td>
      <td class="px-4 py-3 text-gray-700">${caps.map(cn).join(', ')}<div class="text-xs text-gray-500">${total} images</div></td>
      <td class="px-4 py-3">${status}</td>
      <td class="px-4 py-3 text-right">${action}</td>
    </tr>`;
  }).join('');
}

/* ─── Screen: Run a new test (drawer) ─── */
function drawerView() {
  return `<div class="pointer-events-none select-none opacity-60" aria-hidden="true">${testingTab()}</div>
  <div class="fixed inset-x-0 bottom-0 z-[100] bg-black/50" style="top:var(--vb)" data-act="closeDrawer"></div>
  <div class="fixed bottom-0 right-0 z-[110] flex w-full max-w-5xl flex-col bg-white shadow-2xl" style="top:var(--vb)" role="dialog" aria-label="Run a new test">

      <span>Run a new test</span>
      <button class="text-2xl leading-none text-gray-600" data-act="closeDrawer" aria-label="Close">×</button>
    </div>
    <div class="flex-1 overflow-y-auto">
      <div class="mx-auto flex max-w-3xl flex-col gap-4 p-6">
        <div class="flex flex-col gap-1.5 text-sm text-gray-700">
          <p class="text-[15px] font-semibold text-gray-900">Choose a folder of test images for each capture you want to test.</p>
          <p>Optional: add an annotation file for every image (same file name; segmentation masks in a "masks" folder) to also get model performance and suggested thresholds.</p>
          <p class="flex items-start gap-1.5 text-gray-500">${ICON.shield}<span>Tests never send PLC signals, trigger integrations or change production reports.</span></p>
        </div>
        <table class="mt-2 w-full">
          <thead><tr class="bg-f-primary">
            <th class="px-3 py-3 text-left text-base font-medium text-white">Variant</th>
            <th class="px-3 py-3 text-left text-base font-medium text-white">Capture</th>
            <th class="px-3 py-3 text-left text-base font-medium text-white">Dataset folder</th>
          </tr></thead>
          <tbody class="divide-y divide-gray-200 bg-white">${ROWS.map(rowHtml).join('')}</tbody>

}
function rowHtml(r) {
  const on = !r.err && S.dr.f[r.id];
  // Errors and warnings sit behind one icon beside the folder; hovering it shows them
  const lines = [];
  if (r.err) lines.push(`<div class="flex items-start gap-2">${ICON.err}<span>${r.err}${r.link ? ` <a href="#" data-act="openEMC" class="font-semibold text-orange-300 underline">${r.link}</a>` : ''}</span></div>`);
  (r.warnC || []).forEach((w) => lines.push(`<div class="flex items-start gap-2">${ICON.warn}<span>${w}</span></div>`));
  if (on) (r.warnF || []).forEach((w) => lines.push(`<div class="flex items-start gap-2">${ICON.warn}<span>${w}</span></div>`));
  const tip = lines.length
    ? `<span class="group relative inline-flex">
        <button class="rounded p-1 ${r.err ? 'text-red-600' : 'text-amber-600'} hover:bg-gray-100" aria-label="${r.err ? 'Error' : 'Warning'}: ${(r.err || (r.warnF || r.warnC)[0]).replace(/"/g, '&quot;')}">${(r.err ? ICON.err : ICON.warn).replace('mt-[2px] h-4 w-4', 'h-5 w-5')}</button>
        <span class="tip ${S.tip === r.id ? '' : 'invisible opacity-0'} absolute right-0 top-full z-20 flex w-[340px] flex-col gap-2 rounded-md bg-gray-900 px-3 py-2.5 text-[13px] leading-snug text-white shadow-lg transition-opacity group-hover:visible group-hover:opacity-100 group-focus-within:visible group-focus-within:opacity-100">${lines.join('')}</span>
      </span>`
    : '';
  const folder = r.err
    ? '<button disabled class="cursor-not-allowed rounded-md border border-gray-200 px-3 py-1.5 text-sm text-gray-400">Choose folder</button>'
    : on
      ? `<div class="inline-flex items-center gap-2 rounded-md p-2 text-sm shadow-md ring-1 ring-gray-100">${ICON.folder}<span class="font-medium">${r.pick}</span><button data-act="clearFolder" data-row="${r.id}" class="px-1 text-gray-500 hover:text-gray-800" aria-label="Remove folder">✕</button></div>`
      : `<button data-act="pickFolder" data-row="${r.id}" class="rounded-md border border-f-primary px-3 py-1.5 text-sm font-semibold text-f-primary hover:bg-f-primary/5">Choose folder</button>`;
  const tone = r.err ? 'bg-red-50/40' : '';
  return `<tr class="${tone}">
    <td class="px-3 pt-3 align-top font-medium ${r.err ? 'text-gray-500' : ''}">${r.v}</td>
    <td class="px-3 pt-3 align-top font-medium ${r.err ? 'text-gray-500' : ''}">${r.c}</td>
    <td class="px-3 py-3 align-top"><div class="flex items-center gap-2">${folder}${tip}</div></td>
  </tr>`;
}
function drCounts() {
  let ready = 0, warn = 0, blocked = 0;
  ROWS.forEach((r) => {
    if (r.err) { blocked++; return; }
    const on = S.dr.f[r.id];
    if (on) ready++;
    if (on && ((r.warnC || []).length + (r.warnF || []).length)) warn++;
  });
  return { ready, warn, blocked };
}
function drFoot() {
  const { ready, warn, blocked } = drCounts();
  const blocks = runBlocks();
  if (S.dr.up) {
    const u = S.dr.up; let acc = 0; let cur = u.caps[0];
    for (const c of u.caps) { acc += imgsOf(c); if (u.done < acc) { cur = c; break; } }
    return `<div class="flex flex-col gap-2">
      <div class="flex items-center justify-between text-sm"><span class="flex items-center gap-2"><span class="spin"></span>Uploading images for <b>${cn(cur)}</b></span><span class="text-gray-600">${u.done} of ${u.total}</span></div>
      <div class="h-2 overflow-hidden rounded-full bg-gray-200"><div class="h-full bg-f-primary" style="width:${(u.done / u.total) * 100}%"></div></div>
    </div>`;
  }
  const canStart = !blocks.length && ready > 0;
  const why = blocks.length ? 'Testing is blocked on this device right now. The Testing tab shows why.' : ready === 0 ? 'Choose at least one folder to start.' : '';
  return `<div class="flex flex-wrap items-center justify-between gap-4">
    <div class="text-sm text-gray-700"><b>${ready}</b> ${ready === 1 ? 'capture' : 'captures'} will be tested · <span class="text-amber-800">${warn} with warnings</span> · <span class="text-red-800">${blocked} can't be tested</span>
      ${why ? `<div class="text-xs text-gray-500">${why}</div>` : ''}</div>
    <div class="flex items-center gap-3">
      <button data-act="closeDrawer" class="inline-flex items-center justify-center rounded-md border border-f-primary px-6 py-2 text-sm font-semibold text-f-primary">Cancel</button>
      <button data-act="startTest" ${canStart ? '' : 'disabled'} class="inline-flex items-center justify-center rounded-md bg-f-primary px-6 py-2 text-sm font-semibold text-white disabled:cursor-not-allowed disabled:bg-gray-300 disabled:text-gray-600">Start Testing</button>
    </div>
  </div>`;
}

/* ─── Screen: results (inside the Testing tab) ─── */
function resultsView() {

  const capSel = `<label class="flex flex-col gap-1"><span class="text-sm font-medium text-gray-600">Variant – Capture</span>
          <span class="relative inline-block">
            <select id="capSel" class="w-[340px] max-w-full appearance-none rounded-lg border border-gray-300 bg-white py-3 pl-5 pr-12 text-lg font-semibold shadow">${opts}</select>
            <svg class="pointer-events-none absolute right-4 top-1/2 h-5 w-5 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </span>
        </label>`;
  return `<div class="mt-1 flex min-h-[60px] flex-wrap items-baseline gap-2 bg-white px-5 py-4">
    <div class="text-3xl font-medium">Instances</div>
    <div class="flex flex-wrap items-baseline gap-2 text-xl font-medium"><span class="text-gray-400">›</span><a href="#" data-act="goList" class="hover:underline">Instance Details</a><span class="text-gray-400">›</span><span>${S.inst}</span><span class="text-gray-400">›</span><a href="#" data-act="backToTests" class="text-f-primary hover:underline">Testing</a><span class="text-gray-400">›</span><span>Test ${t.n}</span></div>
  </div>
  <div class="p-5">
    <div class="mx-auto flex max-w-6xl flex-col gap-5">
      <div><button data-act="backToTests" class="inline-flex items-center gap-1 text-sm font-semibold text-f-primary hover:underline">← Back to all tests</button></div>
      <div>
        <h1 class="flex flex-wrap items-center gap-3 text-2xl font-bold">Test ${t.n} results ${pill(t.status)}</h1>
        ${t.reason ? `<p class="mt-1 max-w-4xl text-sm text-gray-700">${t.reason}</p>` : ''}
      </div>
      ${S.recipe ? `<div class="flex flex-wrap items-center gap-3 rounded-lg border border-yellow-300 bg-yellow-50 px-4 py-3 text-sm text-yellow-900">${ICON.warn}<span class="flex-1">These results use the settings from when the test ran. Settings have changed since — run a new test to see the effect.</span><button data-act="openDrawer" class="rounded-md bg-f-primary px-4 py-1.5 text-sm font-semibold text-white">Run a new test</button></div>

/* ════════════════════════ analysed-image overlays ════════════════════════ */
// Sample Analysed Image Configuration (Inferencing Customization): Pass / Fail colour per module, all "Show" on.
// Shape extractor and dimensions have no row there; the line draws them green / red.
const PASS = '#39FF14', FAIL = '#FF0000';
const AIC = { pin: [PASS, FAIL], finish: ['#3B9CFF', '#FF069B'], plating: [PASS, FAIL], weld: [PASS, FAIL], tilt: [PASS, FAIL], bead: [PASS, FAIL], ocr: [PASS, FAIL], qr: [PASS, FAIL] };
const colOf = (id, ok) => (AIC[id] || [PASS, FAIL])[ok === false ? 1 : 0];
// Sample ground truths set in Edit Module Configurations
const GT = {
  pin: { pin: 4, washer: 1, 'missing pin': 0 },
  weld: { weld: 1, spatter: 0, porosity: 0 },
  dims: [{ key: 'dist', name: 'Hole spacing', min: 108, max: 112, unit: 'px' }, { key: 'ang', name: 'Edge angle', min: 89, max: 91, unit: '°' }],
  ocr: ['LOT 24A-1187', 'EXP 10/2027'],
};
const FOLDER = { hu: 'hinge_u_right', hy: 'hinge_y_top', br: 'bracket_weld', hs: 'housing_sealant_oct', hl: 'housing_label' };
const imgName = (cap, i) => `${FOLDER[cap]}/IMG_${String(i + 1).padStart(4, '0')}.png`;

function oBox(g, [x, y, w, h], col, o = {}) {
  return el('rect', { x, y, width: w, height: h, fill: 'none', stroke: col, 'stroke-width': o.sw || 2 }, g);
}
function oPoly(g, pts, col, o = {}) {
  return el('polygon', { points: P(pts), fill: 'none', stroke: col, 'stroke-width': o.sw || 2, 'stroke-linejoin': 'round' }, g);
}
function oLine(g, a, b, col, o = {}) {
  return el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: col, 'stroke-width': o.sw || 2, 'stroke-linecap': 'round', ...(o.dash ? { 'stroke-dasharray': o.dash } : {}) }, g);
}
// Labels and confidence show on hover: the shape carries its text, a wider invisible line makes thin marks easy to hover
function tip(node, text) {
  node.setAttribute('data-tip', text);
  if (node.getAttribute('fill') === 'none') node.setAttribute('fill', 'transparent');
  return node;
}
function tipStroke(g, pts, text, closed = false) {
  const n = el(closed ? 'polygon' : 'polyline', { points: P(pts), fill: 'none', stroke: 'transparent', 'stroke-width': 14, 'pointer-events': 'stroke' }, g);
  n.setAttribute('data-tip', text);
  return n;
}
const okWord = (ok) => (ok === null ? 'not judged' : ok ? 'OK' : 'NG');

// Confidence filter + overlap merging (non-max suppression), per class
function filterDet(items, modId) {
  const shown = [], hidden = [];
  const by = {};
  items.forEach((d) => (by[d.cls] = by[d.cls] || []).push(d));
  for (const [cls, arr] of Object.entries(by)) {
    const t = S.thr[modId][cls];
    arr.slice().sort((a, b) => b.c - a.c).forEach((d) => {
      if (d.c < t.conf) { hidden.push(d); return; }
      if (t.iou != null && shown.some((s) => s.cls === cls && iou(s.b, d.b) > t.iou)) { hidden.push(d); return; }
      shown.push(d);
    });
  }
  return { shown, hidden };
}
const brItems = (d) => {
  const R = (p) => rotP(p, d.tilt);
  const items = [{ cls: 'weld', pts: [...d.top, ...[...d.bot].reverse()].map(R), c: d.weldC }];
  d.spatter.forEach((s) => items.push({ cls: 'spatter', pts: circlePts(s.x, s.y, s.r + 2).map(R), c: s.c }));
  d.pores.forEach((p) => items.push({ cls: 'porosity', pts: circlePts(p.x, p.y, p.r + 1.6).map(R), c: p.c }));
  items.forEach((it) => (it.b = bbox(it.pts)));
  return items;
};
const countRule = (gt) => Object.entries(gt).map(([c, n]) => `${c} ${n}`).join(' · ');
function counts(shown, gt) {
  const n = {}; Object.keys(gt).forEach((c) => (n[c] = 0));
  shown.forEach((x) => (n[x.cls] = (n[x.cls] || 0) + 1));
  const clsOk = {}; Object.keys(gt).forEach((c) => (clsOk[c] = n[c] === gt[c]));
  return { n, clsOk, ok: Object.values(clsOk).every(Boolean), found: Object.keys(gt).map((c) => `${c} ${n[c]}`).join(' · ') };
}
function beadCalipers(d) {
  const K = 72, N = HSP.length, cal = [];
  for (let k = 0; k < K; k++) {
    const p = HSP[Math.round((k / K) * N) % N];
    cal.push({ p, kind: inR(p.s, d.gap) ? 'gap' : inR(p.s, d.thin) ? 'too thin' : null });
  }
  const run = (kind) => { let best = 0, cur = 0; cal.concat(cal).forEach((c) => { cur = c.kind === kind ? cur + 1 : 0; best = Math.max(best, Math.min(cur, K)); }); return best; };
  return { cal, gap: run('gap'), thin: run('too thin') };
}

// Module results for one image: rule from EMC, what was found, OK / NG (null = no rule set, not judged)
function evaluate(cap, i) {
  const rows = [];
  if (cap === 'hu') {
    const d = dat('hu', i), c = counts(filterDet(d.dets, 'pin').shown, GT.pin);
    rows.push({ id: 'pin', rule: `Count: ${countRule(GT.pin)}`, found: c.found, ok: c.ok, clsOk: c.clsOk });
    const sure = d.score >= S.thr.finish[d.finish].conf;
    rows.push({ id: 'finish', rule: 'Correct class: clean', found: sure ? `${d.finish} (${d.score.toFixed(3)})` : `No class above its threshold (best: ${d.finish} ${d.score.toFixed(3)})`, ok: sure && d.finish === 'clean', sure });
  } else if (cap === 'hy') {
    const d = dat('hy', i);
    rows.push({ id: 'plating', rule: 'Expected colour: Gold', found: d.silver ? 'Silver' : 'Gold', ok: !d.silver });
    const v = { dist: d.dist, ang: d.ang };
    const dims = GT.dims.map((g) => ({ ...g, v: v[g.key], ok: v[g.key] >= g.min && v[g.key] <= g.max }));
    rows.push({ id: 'hshapes', rule: dims.map((g) => `${g.name} ${g.min}–${g.max} ${g.unit}`).join(' · '), found: dims.map((g) => `${g.name} ${g.v.toFixed(g.unit === 'px' ? 2 : 1)} ${g.unit}`).join(' · '), ok: dims.every((g) => g.ok), dims });
  } else if (cap === 'br') {
    const d = dat('br', i), c = counts(filterDet(brItems(d), 'weld').shown, GT.weld);
    rows.push({ id: 'weld', rule: `Count: ${countRule(GT.weld)}`, found: c.found, ok: c.ok, clsOk: c.clsOk });
    rows.push({ id: 'bshapes', rule: 'No dimensions set', found: '2 edges, 1 hole fitted', ok: null });
    rows.push({ id: 'tilt', rule: 'Tilt within ±2.0°', found: `${d.tilt.toFixed(1)}°`, ok: d.tilt <= 2 });
  } else if (cap === 'hs') {
    const b = beadCalipers(dat('hs', i));
    const parts = [b.gap ? `gap over ${b.gap} calipers` : '', b.thin ? `too thin over ${b.thin} calipers` : ''].filter(Boolean);
    rows.push({ id: 'bead', rule: 'Width 2.5–4.0 px · fewer than 3 defective calipers in a row', found: parts.length ? parts.join(' · ') : 'No gaps or thin spots', ok: b.gap < 3 && b.thin < 3, b });
  } else if (cap === 'hl') {
    const d = dat('hl', i), t = S.thr.ocr.text.conf;
    const read = d.lines.filter((ln) => ln.c >= t).map((ln) => ln.read);
    const missing = GT.ocr.filter((x) => !read.includes(x));
    rows.push({ id: 'ocr', rule: `Read & Match: ${GT.ocr.join(' · ')}`, found: read.length ? read.join(' · ') : 'Nothing read', ok: missing.length === 0, missing });
    rows.push({ id: 'qr', rule: 'Any code readable', found: d.qr, ok: true });
  }
  const judged = rows.filter((r) => r.ok !== null);
  return { rows, ok: judged.every((r) => r.ok) };
}

const ANA = {
  hu(g, i) {
    const d = dat('hu', i), res = evaluate('hu', i), pin = res.rows[0], fin = res.rows[1];
    // Classification: box over the whole search area
    tip(oBox(g, [60, 90, 280, 220], colOf('finish', fin.ok)), fin.sure
      ? `Surface finish: ${d.finish} · confidence ${d.score.toFixed(3)} · ${okWord(fin.ok)}`
      : `Surface finish: no class above its threshold · ${okWord(fin.ok)}`);
    // Object detection: one colour per class, from its count rule
    filterDet(d.dets, 'pin').shown.forEach((det) => tip(oBox(g, det.b, colOf('pin', pin.clsOk[det.cls])), `${det.cls} · confidence ${pct(det.c)} · ${okWord(pin.clsOk[det.cls])}`));
  },
  hy(g, i) {
    const d = dat('hy', i), res = evaluate('hy', i), col = res.rows[0], dims = res.rows[1].dims;
    tip(oBox(g, [88, 90, 224, 44], colOf('plating', col.ok)), `Knuckle colour: ${col.found} · ${okWord(col.ok)}`);
    // Distance (axis x): engineering bracket
    const [dist, ang] = dims, dc = dist.ok ? PASS : FAIL, ac = ang.ok ? PASS : FAIL;
    const yb = 170, [a, b] = [d.c1, d.c2];
    [a, b].forEach((c) => { el('circle', { cx: c[0], cy: c[1], r: 4, fill: dc }, g); oLine(g, [c[0], c[1] - 24], [c[0], yb - 7], dc, { sw: 1.5, dash: '4 3' }); });
    oLine(g, [a[0], yb], [b[0], yb], dc);
    [[a[0], 1], [b[0], -1]].forEach(([x, s]) => el('polygon', { points: P([[x, yb], [x + 8 * s, yb - 4], [x + 8 * s, yb + 4]]), fill: dc }, g));
    tipStroke(g, [[a[0], yb], [b[0], yb]], `Hole spacing: ${dist.v.toFixed(2)} px (x) · set ${dist.min}–${dist.max} px · ${okWord(dist.ok)}`);
    // Angle at the bottom-right corner: two edges + arc
    const BR = [330 + d.dx, 300], ul = Math.hypot(-d.dx, -170), u2 = [-d.dx / ul, -170 / ul];
    oLine(g, BR, [BR[0] - 70, 300], ac); oLine(g, BR, [BR[0] + u2[0] * 70, BR[1] + u2[1] * 70], ac);
    el('path', { d: `M${BR[0] - 30} ${BR[1]} A30 30 0 0 1 ${BR[0] + u2[0] * 30} ${BR[1] + u2[1] * 30}`, fill: 'none', stroke: ac, 'stroke-width': 2 }, g);
    tipStroke(g, [[BR[0] - 70, 300], BR, [BR[0] + u2[0] * 70, BR[1] + u2[1] * 70]], `Edge angle: ${ang.v.toFixed(1)}° · set ${ang.min}–${ang.max}° · ${okWord(ang.ok)}`);
    // Fitted shapes
    [a, b].forEach((c) => tip(el('circle', { cx: c[0], cy: c[1], r: 21, fill: 'none', stroke: '#fff', 'stroke-width': 1.5, 'stroke-dasharray': '4 3' }, g), 'Fitted circle (hole)'));
    tipStroke(g, [[40, 300], [BR[0] - 72, 300]], 'Fitted line (bottom edge)');
    oLine(g, [40, 300], [BR[0] - 72, 300], '#fff', { sw: 1.3, dash: '6 4' });
  },
  br(g, i) {
    const d = dat('br', i), R = (p) => rotP(p, d.tilt), res = evaluate('br', i), seg = res.rows[0], tilt = res.rows[2];
    // Segmentation: outlines, coloured per class rule
    filterDet(brItems(d), 'weld').shown.forEach((it) => tip(oPoly(g, it.pts, colOf('weld', seg.clsOk[it.cls])), `${it.cls} · confidence ${pct(it.c)} · ${okWord(seg.clsOk[it.cls])}`));
    // Orientation & tilt: reference line (cyan, fixed) + measured line
    const c = R([200, 300]);
    oLine(g, [45, c[1]], [355, c[1]], '#00FFFF');
    oLine(g, R([45, 300]), R([355, 300]), colOf('tilt', tilt.ok));
    tipStroke(g, [R([45, 300]), R([355, 300])], `Bracket tilt: ${tilt.found} · allowed ±2.0° · ${okWord(tilt.ok)}`);
    // Fitted shapes (Shape extractor without dimensions: not judged)
    const bc = '#33A1FF';
    oLine(g, R([30, 90]), R([370, 90]), bc, { sw: 1.5, dash: '6 4' }); tipStroke(g, [R([30, 90]), R([370, 90])], 'Fitted line (top edge)');
    oLine(g, R([40, 80]), R([40, 312]), bc, { sw: 1.5, dash: '6 4' }); tipStroke(g, [R([40, 80]), R([40, 312])], 'Fitted line (left edge)');
    const h = R([322, 262]);
    tip(el('circle', { cx: h[0], cy: h[1], r: 15, fill: 'none', stroke: bc, 'stroke-width': 1.5, 'stroke-dasharray': '4 3' }, g), 'Fitted circle (mounting hole)');
  },
  hs(g, i) {
    const d = dat('hs', i), N = HSP.length, res = evaluate('hs', i), bead = res.rows[0];
    // Edges of the bead that was found (broken where there is no bead)
    [1, -1].forEach((side) => {
      let cur = [];
      const flush = () => { if (cur.length > 1) el('polyline', { points: P(cur), fill: 'none', stroke: colOf('bead', true), 'stroke-width': 1.4 }, g); cur = []; };
      for (let k = 0; k <= N; k++) {
        const p = HSP[k % N], w = beadW(d, p.s);
        if (w === 0) { flush(); continue; }
        cur.push([p.x + (side * p.nx * w) / 2, p.y + (side * p.ny * w) / 2]);
      }
      flush();
    });
    // Reference path
    el('polyline', { points: P([...HSP, HSP[0]].map((p) => [p.x, p.y])), fill: 'none', stroke: '#fff', 'stroke-width': 1, 'stroke-dasharray': '4 4', opacity: 0.6 }, g);
    tipStroke(g, HSP.map((p) => [p.x, p.y]), `bead1 · ${bead.found} · ${okWord(bead.ok)}`, true);
    // A box on every failing caliper, turned to follow the bead
    bead.b.cal.forEach(({ p, kind }) => {
      if (!kind) return;
      const c = (u, v) => [p.x + p.tx * u + p.nx * v, p.y + p.ty * u + p.ny * v];
      tip(oPoly(g, [c(-4.5, -12), c(4.5, -12), c(4.5, 12), c(-4.5, 12)], colOf('bead', false), { sw: 1.3 }), `Defective caliper: ${kind}`);
    });
  },
  hl(g, i) {
    const d = dat('hl', i), t = S.thr.ocr.text.conf, R = (p) => rotP(p, d.rot);
    d.lines.forEach((ln) => {
      if (ln.c < t) return;
      const [x, y, w, h] = ln.box, pts = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]].map(R);
      const ok = GT.ocr.includes(ln.read) ? true : GT.ocr.some((x2) => x2.slice(0, 3) === ln.read.slice(0, 3)) ? false : null;
      tip(oPoly(g, pts, ok === null ? '#3B9CFF' : colOf('ocr', ok)), `Read: ${ln.read} · confidence ${pct(ln.c)} · ${ok === null ? 'not in the match list' : ok ? 'matches · OK' : 'doesn\'t match · NG'}`);
    });
    const q = [[250, 144], [328, 144], [328, 222], [250, 222]].map(R);
    tip(oPoly(g, q, colOf('qr', true)), `Code: ${d.qr} · OK`);
  },
};

function render() {
  const app = $('#app');
  if (S.screen === 'list') app.innerHTML = instanceList();
  else if (S.screen === 'tab') app.innerHTML = testingTab();
  else if (S.screen === 'drawer') app.innerHTML = drawerView();
  else app.innerHTML = resultsView();
  if (S.screen === 'results') { if (S.res.tab === 'module') { const v = visImgs(); if (v.length && !v.includes(S.res.img)) S.res.img = v[0]; drawImages(); renderUnder(); renderPager(); renderFilter(); updChg(); } else if (S.res.tab === 'summary') renderSummary(); else if (S.res.tab === 'metrics') { drawF1(); drawCM(); } }
  $$('.viewer-tab').forEach((t) => t.setAttribute('aria-selected', String(+t.dataset.vt === S.vt)));
  if (window.self !== window.top) parent.postMessage({ type: 'testing-v2-nav', to: stepOf() }, '*');
}
function stepOf() {
  if (S.screen === 'results') return { summary: 'edge-test-results', module: 'edge-module-results', metrics: 'edge-performance-metrics' }[S.res.tab];
  return ['edge-instances', 'edge-testing-tab', 'edge-run-test', 'edge-test-running', 'edge-test-results'][S.vt];
}
function goScreen(name, keepScroll = false) {
  S.screen = name;
  S.vt = name === 'list' ? 0 : name === 'drawer' ? 2 : name === 'results' ? 4 : S.myRun && S.myRun.state === 'running' ? 3 : 1;
  render();
  if (!keepScroll) window.scrollTo(0, 0);
}
function openResults(n) {
  S.res.test = n;
  const caps = Object.keys(testById(n).imgs);
  if (!caps.includes(S.res.cap)) S.res.cap = caps[0];
  S.res.img = Math.min(2, (testById(n).imgs[S.res.cap] || 1) - 1);
  S.res.tab = 'summary';
  S.vt = 4;

}
function goVT(n) {
  S.vt = n;
  if (n === 0) { S.myRun = null; S.pick = false; S.noHistory = true; S.screen = 'list'; }
  if (n === 1) { S.myRun = null; S.noHistory = true; S.screen = 'tab'; }
  if (n === 2) { S.myRun = null; S.dr = { f: { hu: true, hy: true, br: true, hs: true, hl: false }, up: null }; S.screen = 'drawer'; }
  if (n === 3) { S.noHistory = false; S.myRun = { n: 15, state: 'running', pct: 42, caps: ['hu', 'hy', 'br', 'hs'], started: '11:05 AM' }; S.screen = 'tab'; }

}

}
function modal(html) {

}
const closeModal = () => ($('#modal').innerHTML = '');

function openApply(src = 'table') {
  const id = S.res.mod[S.res.cap], m = MODS[id], hasIou = HAS_IOU(m.type);

  const cell = (c, k) => { const s = S.saved[id][c][k], v = nv(c, k); return Math.abs(s - v) < 0.001 ? `<span class="text-gray-500">${s.toFixed(2)} (no change)</span>` : `${s.toFixed(2)} → <b class="text-f-primary">${v.toFixed(2)}</b>`; };
  const title = src === 'sugg' ? 'Apply suggested thresholds to EMC?' : 'Apply these thresholds to EMC?';

    : `${m.name} · ${m.typeName}. Saves the values from the Thresholds table to this module in Edit Module Configurations. Only ${S.inst} changes; other instances that use this model keep their values.`;

      <thead><tr class="border-b text-left text-gray-500"><th class="py-2 font-medium">Class</th><th class="py-2 font-medium">Confidence (EMC → new)</th>${hasIou ? '<th class="py-2 font-medium">IOU (EMC → new)</th>' : ''}</tr></thead>
      <tbody class="divide-y">${m.classes.map((c) => `<tr><td class="py-2 font-semibold">${c}</td><td class="py-2">${cell(c, 'conf')}</td>${hasIou ? `<td class="py-2">${cell(c, 'iou')}</td>` : ''}</tr>`).join('')}</tbody>
    </table>
    ${S.deploy ? `<div class="mt-4 flex items-start gap-2 rounded-md border border-yellow-300 bg-yellow-50 p-3 text-sm text-yellow-900">${ICON.warn}<span><b>A deployment is running on this device.</b> It keeps using the old values until it restarts.</span></div>` : ''}
    <div class="mt-6 flex flex-wrap justify-end gap-3">

    </div>
  </div>`);
}

/* ─── events ─── */
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'closeModalBg') { if (e.target === a) closeModal(); return; }
  if (a.tagName === 'A') e.preventDefault();
  switch (act) {
    case 'toast': toast(a.dataset.msg); break;
    case 'openDrawer': {
      const b = runBlocks();
      if (b.length) { toast(b[0]); break; }
      S.dr = { f: { hu: true, hy: true, br: true, hs: true, hl: false }, up: null };
      goScreen('drawer', true); break;
    }
    case 'closeDrawer': if (!S.dr.up) goScreen('tab'); break;
    case 'openEMC': toast('Prototype: opens Edit Module Configurations at Housing · Gasket › bead inspection.'); break;
    case 'pickFolder': S.dr.f[a.dataset.row] = true; render(); break;
    case 'clearFolder': S.dr.f[a.dataset.row] = false; render(); break;
    case 'startTest': {
      const caps = ROWS.filter((r) => !r.err && S.dr.f[r.id]).map((r) => r.id);
      const total = caps.reduce((s, c) => s + imgsOf(c), 0);
      S.dr.up = { done: 0, total, caps };
      $('#drFoot').innerHTML = drFoot();
      const iv = setInterval(() => {
        S.dr.up.done = Math.min(total, S.dr.up.done + 25);
        if (S.dr.up.done >= total) {
          clearInterval(iv);
          S.myRun = { n: 15, state: 'running', pct: 0, caps, started: '11:05 AM' };
          S.dr.up = null; goScreen('tab'); toast('Test 15 started.');
        } else $('#drFoot').innerHTML = drFoot();
      }, 60);
      break;
    }
    case 'askCancel':
      modal(`<div class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl" role="dialog" aria-label="Cancel test">
        <h3 class="text-lg font-semibold">Cancel Test 15?</h3>
        <p class="mt-2 text-sm text-gray-700">The images tested so far won't be kept. You can run the test again later.</p>
        <div class="mt-6 flex justify-end gap-3"><button data-act="closeModal" class="rounded-md border border-gray-300 px-5 py-2 text-sm font-semibold text-gray-700">Keep running</button>
        <button data-act="confirmCancel" class="rounded-md bg-red-600 px-5 py-2 text-sm font-semibold text-white">Cancel test</button></div></div>`);
      break;
    case 'confirmCancel': {
      const r = activeRun();
      if (r) S.myRun = { ...r, state: 'cancelled', cancelledBy: 'you' };
      if (S.other) { S.other = false; $('#tgOther').checked = false; }
      closeModal(); render(); break;
    }
    case 'askDelete':
      modal(`<div class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl" role="dialog" aria-label="Delete test">
        <h3 class="text-lg font-semibold">Delete Test ${a.dataset.test}?</h3>
        <p class="mt-2 text-sm text-gray-700">Its images and results are removed from this device. This can't be undone.</p>
        <div class="mt-6 flex justify-end gap-3"><button data-act="closeModal" class="rounded-md border border-gray-300 px-5 py-2 text-sm font-semibold text-gray-700">Keep test</button>
        <button data-act="confirmDelete" data-test="${a.dataset.test}" class="rounded-md bg-red-600 px-5 py-2 text-sm font-semibold text-white">Delete test</button></div></div>`);
      break;
    case 'confirmDelete': S.deleted.push(+a.dataset.test); closeModal(); render(); toast(`Test ${a.dataset.test} deleted.`); break;
    case 'dismissRun': S.myRun = null; goScreen('tab', true); break;
    case 'viewResults': openResults(+a.dataset.test); break;
    case 'backToTests': goScreen('tab'); break;
    case 'goList': S.pick = false; goScreen('list'); break;
    case 'openTesting':
      if (S.instFilter !== 'all') { S.inst = S.instFilter; S.myRun = null; goScreen('tab'); }
      else { S.pick = !S.pick; render(); }
      break;
    case 'pickInst': S.inst = a.dataset.name; S.pick = false; S.myRun = null; goScreen('tab'); break;
    case 'resTab': S.res.tab = a.dataset.tab; render(); break;
    case 'imgGo': S.res.img = +a.dataset.i; drawImages(); renderPager(); break;
    case 'imgFirst': navImg('first'); break;
    case 'imgLast': navImg('last'); break;
    case 'imgPrev': navImg(-1); break;
    case 'imgNext': navImg(1); break;
    case 'imgFilter': {
      S.res.filter = a.dataset.f;
      const v = visImgs();
      if (v.length && !v.includes(S.res.img)) S.res.img = v[0];
      renderFilter(); drawImages(); renderPager(); break;
    }
    case 'resetThr': {
      const id = S.res.mod[S.res.cap];
      MODS[id].classes.forEach((c) => ['conf', 'iou'].forEach((k) => { if (S.saved[id][c][k] != null) setThr(id, c, k, S.saved[id][c][k]); }));
      break;
    }
    case 'applyThr': openApply(); break;
    case 'doApply': {
      const id = S.res.mod[S.res.cap], m = MODS[id], sugg = a.dataset.src === 'sugg';
      m.classes.forEach((c) => {
        S.saved[id][c] = sugg ? { conf: m.sugg[c][0], iou: m.sugg[c][1] ?? null } : { ...S.thr[id][c] };
      });
      closeModal();
      $$('[data-emc]').forEach((td) => (td.textContent = emcText(id, td.dataset.emc)));
      updChg(); updSuggCur();
      const what = sugg ? 'Suggested thresholds saved to EMC.' : 'Thresholds saved to EMC.';
      toast(S.deploy ? `${what} The running deployment uses them after it restarts.` : what);
      break;
    }
    case 'useSugg': openApply('sugg'); break;
    case 'closeModal': closeModal(); break;
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.thr) { const [id, c, k] = t.dataset.thr.split('|'); setThr(id, c, k, t.value / 100); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.thrn) { const [id, c, k] = t.dataset.thrn.split('|'); setThr(id, c, k, Number(t.value) || 0); t.value = S.thr[id][c][k].toFixed(2); }
  if (t.id === 'instFilter') { S.instFilter = t.value; S.pick = false; render(); }
  if (t.id === 'capSel') { S.res.cap = t.value; S.res.img = Math.min(2, nImgs(t.value) - 1); render(); }
  if (t.id === 'modSel') { S.res.mod[S.res.cap] = t.value; const y = window.scrollY; render(); window.scrollTo(0, y); }
});
document.addEventListener('keydown', (e) => {
  if (S.screen !== 'results' || S.res.tab !== 'module' || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) || $('#modal').innerHTML) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    navImg(e.key === 'ArrowRight' ? 1 : -1);
  }
});

// Viewer bar
$$('.viewer-tab').forEach((t) => t.addEventListener('click', () => goVT(+t.dataset.vt)));
[['tgDeploy', 'deploy'], ['tgOther', 'other'], ['tgRecipe', 'recipe'], ['tgAnnot', 'annot']].forEach(([id, k]) =>
  $('#' + id).addEventListener('change', (e) => {
    const r = activeRun();
    if (k === 'deploy' && e.target.checked && r && r.state === 'running') {
      e.target.checked = false;
      toast('A test is already running on this device. Wait for it to finish or cancel it, then start the deployment.');
      return;
    }
    if (k === 'other' && e.target.checked && S.deploy) {
      e.target.checked = false;
      toast('A deployment is running on this device, so no test can start.');
      return;
    }
    S[k] = e.target.checked; const y = window.scrollY; render(); window.scrollTo(0, y);
  }));
const setVB = () => document.documentElement.style.setProperty('--vb', $('#viewerBar').offsetHeight + 'px');
window.addEventListener('resize', setVB); setVB();

// Simulated progress for "your" running test
setInterval(() => {
  if (S.screen !== 'tab' || !S.myRun || S.myRun.state !== 'running' || S.deploy || S.other) return;
  S.myRun.pct = Math.min(100, S.myRun.pct + 1);
  if (S.myRun.pct >= 100) { S.myRun.state = 'done'; render(); toast('Test 15 finished.'); return; }
  const r = activeRun();
  $('#runWrap').innerHTML = runCard(r);
  $('#histBody').innerHTML = histRows();
  $('#reasons').innerHTML = reasonsHtml();
}, 400);

// Deep links for screenshots, e.g. #vt=4&cap=hy&deploy=1&tab=metrics
if (window.self !== window.top) $$('#viewerBar > span, .viewer-tab').forEach((t) => (t.style.display = 'none'));
function applyHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  [['deploy', 'tgDeploy'], ['other', 'tgOther'], ['recipe', 'tgRecipe'], ['annot', 'tgAnnot']].forEach(([k, id]) => { S[k] = q.get(k) === '1'; $('#' + id).checked = S[k]; });
  S.today = q.get('today') === '1';
  S.tip = q.get('tip');
  S.res.filter = ['ok', 'ng'].includes(q.get('filter')) ? q.get('filter') : 'all';
  if (q.get('cap') && CAPS[q.get('cap')]) S.res.cap = q.get('cap');
  if (q.get('img')) S.res.img = +q.get('img');
  if (q.get('mod') && MODS[q.get('mod')]) S.res.mod[S.res.cap] = q.get('mod');
  const vt = q.has('vt') ? Math.max(0, Math.min(4, +q.get('vt'))) : 0;
  goVT(vt);
  // A deployment and a test can't run on the device at the same time
  if (S.deploy && activeRun() && activeRun().state === 'running') { S.deploy = false; $('#tgDeploy').checked = false; render(); }
  if (['module', 'metrics'].includes(q.get('tab')) && S.screen === 'results') { S.res.tab = q.get('tab'); render(); }
  if (q.get('pct') && S.myRun) { S.myRun.pct = +q.get('pct'); render(); }
  if (q.get('apply') === '1' && S.screen === 'results') { S.res.tab = 'module'; render(); const id = S.res.mod[S.res.cap]; const c = MODS[id].classes[0]; setThr(id, c, 'conf', S.thr[id][c].conf - 0.04); openApply(); }
  if (q.get('hist') === '1') { S.noHistory = false; render(); }
  if (q.get('scroll')) { const t = $('#' + q.get('scroll')); if (t) t.scrollIntoView({ block: 'start' }); }
}
applyHash();
window.addEventListener('hashchange', applyHash);
</script>
</body>
</html>
