/* Tailwind preflight (subset) */
*,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
html{line-height:1.5;-webkit-text-size-adjust:100%;tab-size:4}
body{margin:0;line-height:inherit}
img,svg{display:block;vertical-align:middle}
img{max-width:100%;height:auto}
button{font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;color:inherit;margin:0;padding:0;background-color:transparent;background-image:none;cursor:pointer;-webkit-appearance:button}

/* src/index.css */
html,body{font-size:16px;height:100vh;width:100vw;overflow-y:hidden;color:black}
body{overflow:auto}
:root{font-family:'Outfit',sans-serif;font-optical-sizing:auto;line-height:1.5;font-weight:400;font-style:normal;font-size:16px;min-height:100vh;height:fit-content;color-scheme:light;font-synthesis:weight style;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

/* preview-page/index.jsx */
.page{display:flex;min-height:100vh;width:100%;flex-direction:column;align-items:center;justify-content:center;overflow:auto;background:#f3f4f6}
.dash{margin-left:auto;margin-right:auto;background:#fff;width:1280px;height:720px}
.zone{position:relative;width:100%;height:100%}

/* DraggableResize.jsx (react-rnd wrapper, preview: no drag, no hover border) */
.rnd{position:absolute;top:0;left:0;display:inline-block;box-sizing:border-box;flex-shrink:0;overflow:hidden;border-width:0;user-select:auto}
.drag-handle{width:100%;height:100%}

/* TextComponent.jsx (view mode) */
.txt{display:flex;height:100%;width:100%;flex-direction:column;padding:.25rem}

/* ImageComponent.jsx */
.img-wrap{display:flex;height:100%;width:100%;align-items:center;justify-content:center}
.img-fixed{height:100%;width:100%;object-fit:contain;cursor:zoom-in;max-width:100%}
.img-live{position:relative;width:100%;cursor:zoom-in}
.img-live svg{width:100%;height:auto}
.ph{position:relative;display:flex;height:100%;width:100%;align-items:center;justify-content:center;border:1px solid #000}
.ph span{overflow-wrap:break-word;padding-left:.25rem;padding-right:.25rem;text-align:center;font-size:.875rem;line-height:1.25rem;color:#000}

/* mode switching */
body[data-mode="today"] .only-after{display:none!important}
body[data-mode="after"] .only-today{display:none!important}

/* prototype switcher */
html.in-shell .pctl{display:none!important}
body[data-mode="after"].no-top #topTile{display:none}
.pctl{position:fixed;top:16px;right:16px;z-index:1000;display:flex;align-items:center;gap:8px}
.proto{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#4b5563;background:#f9fafb;border:1px dashed #d1d5db;border-radius:999px;padding:1px 8px;line-height:16px}
.seg{display:inline-flex;border:1px solid #d1d5db;border-radius:999px;padding:2px;background:#fff}
.seg button{font-size:12px;font-weight:600;padding:2px 11px;border-radius:999px;color:#6b7280;line-height:18px}
.seg button[aria-pressed="true"]{background:#1e1c1c;color:#fff}
</style>
