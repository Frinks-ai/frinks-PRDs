<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Management prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<style>
/* Tailwind v3 preflight (the parts this screen relies on) */
*,::before,::after{box-sizing:border-box;border:0 solid #e5e7eb}
html{line-height:1.5;-webkit-text-size-adjust:100%;tab-size:4}
body{margin:0;line-height:inherit}
a{color:inherit;text-decoration:inherit}
button{font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;color:inherit;margin:0;padding:0;background:transparent;cursor:pointer;text-transform:none;-webkit-appearance:button}
ul{list-style:none;margin:0;padding:0}
table{text-indent:0;border-color:inherit;border-collapse:collapse}
th{font-weight:inherit}
svg{display:block;vertical-align:middle}

/* src/index.css */
html,body{font-size:16px;height:100vh;width:100vw;overflow-y:hidden;color:black}
body{overflow:auto;background:#fff} /* index.html: <body class="overflow-auto"> */
:root{font-family:'Outfit',sans-serif;font-optical-sizing:auto;line-height:1.5;font-weight:400;font-style:normal;min-height:100vh;height:fit-content;color-scheme:light;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

/* shared/layouts/project/sidebar.tsx */
.sb{position:fixed;left:0;top:0;display:flex;height:100vh;width:80px;flex-direction:column;align-items:center;border-right:1px solid #d1d5db;background:#1e1c1c;padding:24px 8px;box-shadow:0 4px 6px -1px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.1);z-index:9999}
.sb-logo{margin:12px 0 40px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sb-menu{margin-top:32px;display:flex;width:100%;flex-direction:column;gap:8px}
.sb-menu li{position:relative}
.sb-link{display:flex;width:100%;align-items:center;justify-content:center;border-radius:6px;padding:8px 0;overflow:hidden;color:#fff;transition:all .3s}
.sb-link:hover,.sb-link.active{background:rgb(255 255 255/.2)}
.sb-tip{position:absolute;left:100%;top:50%;margin-left:12px;z-index:50;padding:6px 10px;font-size:12px;line-height:16px;font-weight:600;color:#fff;background:#ff4301;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;transform:translate(-4px,-50%);transition:all .3s;pointer-events:none;width:max-content;max-width:200px;white-space:normal}
.sb-tip::before{content:'';position:absolute;top:50%;left:-4px;transform:translateY(-50%);border-right:4px solid #1e293b;border-top:4px solid transparent;border-bottom:4px solid transparent}
.sb-menu li:hover .sb-tip{opacity:1;transform:translate(0,-50%)}
.sb-foot{display:flex;width:100%;flex-grow:1;flex-direction:column;justify-content:flex-end;gap:8px}

/* project layout content column */
.main{height:100%;min-height:100vh;margin-left:80px}

/* shared/layouts/main/heading.tsx */
.heading{display:flex;align-items:center;justify-content:space-between;margin-top:4px;gap:8px;height:60px;padding:16px 20px;background:#fff}
.heading-left{display:flex;align-items:baseline;gap:8px}
.heading-sub{display:flex;align-items:baseline;font-size:20px;line-height:28px;font-weight:500;gap:8px}

/* shared/ui/Breadcrumb.tsx */
.bc{display:flex;align-items:center;font-size:14px;line-height:20px;color:#6b7280;margin-bottom:16px;padding:8px 4px}
.bc>*+*{margin-left:8px}
.bc-home{display:flex;align-items:center;padding:4px 8px;border-radius:6px;transition:all .2s}
.bc-home:hover{background:#f3f4f6;color:#ff4301}
.bc-chev{flex-shrink:0;color:#9ca3af}
.bc-link{display:inline-flex;align-items:center;max-width:200px;padding:4px 8px;font-weight:500;color:#4b5563;border-radius:6px;transition:all .2s}
.bc-link:hover{color:#ff4301;background:#f3f4f6}
.bc-cur{display:inline-flex;align-items:center;max-width:200px;padding:4px 8px;font-weight:600;color:#111827;border-radius:6px}
.bc-label{display:inline-flex;align-items:center;gap:6px;min-width:0}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* shared/components/InfoTooltip.tsx */
.info{position:relative;display:inline-flex;align-items:center}
.info>span{display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;border-radius:9999px;transition:transform .15s;color:#6b7280;cursor:default}
.info>span:hover{transform:scale(1.1)}
.info.on-dark>span{color:#fff}
.info.on-dark>span:hover{transform:none}

/* project-configuration toolbar row */
.bar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 8px}
.filters{position:sticky;top:0;z-index:30;display:flex;flex-direction:row;align-self:flex-end;gap:32px;padding-bottom:4px}
/* shared/ui/FilterBox.tsx (Filter) */
.flt{position:relative;display:inline-block;text-align:left;margin-top:8px}
.flt-badge{position:absolute;right:-4px;top:-4px;display:flex;flex-direction:row;justify-content:center;width:16px;height:16px;border-radius:8px;background:#FF4301;color:#fff;font-weight:600;font-size:.7rem;text-align:center;margin:auto;vertical-align:middle}
.flt-btn{display:inline-flex;width:100%;justify-content:center;column-gap:6px;border-radius:6px;background:#fff;padding:8px 12px;font-size:14px;line-height:20px;cursor:pointer;color:#111827}
.flt-btn:hover{background:#f9fafb}
.flt-btn svg{margin:auto -4px auto 0;padding-top:4px;width:12px;height:12px}
.actions-top{display:flex;align-items:center;gap:8px}
/* shared/ui/Button.tsx — color primary, size lg */
.btn{font-weight:600;height:fit-content;cursor:pointer;border:1px solid transparent;background:#ff4301;color:#fff;font-size:14px;line-height:20px;padding:8px 24px;border-radius:6px}
.btn:hover{background:rgb(255 67 1/.9)}
.btn-flex{display:flex;align-items:center;gap:8px}
.btn-max{min-width:max-content;width:max-content;white-space:nowrap}

/* shared/ui/Table.tsx */
.tbl-pad{padding:0 20px 20px}
.tbl-rel{position:relative;border-radius:8px}
.tbl-flow{display:flow-root;height:auto;width:100%;overflow-x:auto}
.tbl-max{width:max-content;min-width:100%}
table.tbl{min-width:100%}
table.tbl>*+*{border-top:1px solid #d1d5db} /* divide-y divide-gray-300 */
thead{position:sticky;top:0;z-index:10}
thead tr{background:#ff4301;position:relative}
th{position:sticky;top:0;z-index:10;padding:16px 8px;text-align:center;font-size:16px;line-height:24px;font-weight:500;color:#fff}
th .th-in{display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
th .rh{position:absolute;top:10px;right:0;bottom:10px;width:2px;cursor:col-resize;border-radius:16px;background:#fff}
th:last-child .rh{display:none}
tbody{background:#fff}
tbody tr{border-top:1px solid transparent;transition:all .2s}
tbody>tr+tr{border-top:1px solid #e5e7eb} /* divide-y divide-gray-200 */
tbody tr:hover,tbody tr.is-hover{background:rgb(249 250 251/.8)}
td{padding:8px;color:#000;overflow:visible} /* TableBodyData default */
td.cls{padding:0;min-width:0;max-width:0;cursor:pointer} /* className overrides the default td classes */
td.cls-status{padding:0;cursor:pointer}
.td-in{display:flex;height:100%;width:100%;align-items:center;justify-content:center;text-align:center}
.twt{position:relative;width:100%;min-width:0}
.twt>div{width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mip{display:flex;width:100%;min-width:0;align-items:center} /* MasterImageHoverPreview */
.mip-btn{margin-left:6px;margin-right:8px;display:flex;flex-shrink:0;align-items:center;justify-content:center;border-radius:4px;padding:2px;color:#ff4301}
.mip-btn:hover{background:rgb(255 67 1/.1)}
.status{position:relative;display:inline-flex;align-items:center;text-decoration-line:underline}
.status:hover,tr.is-hover .status{opacity:.8}
.tone-green{color:#16a34a}
.tone-red{color:#ef4444}
.act{display:flex;align-items:center;justify-content:center}
.act button{border-radius:4px;padding:4px;color:#4b5563}
.act button:hover{background:#f3f4f6}

/* shared/components/Tooltip.tsx bubble */
.tip{position:fixed;z-index:99999;pointer-events:none;width:max-content;max-width:300px;overflow-wrap:break-word;white-space:normal;border-radius:4px;border:1px solid #d1d5db;background:#f3f4f6;padding:4px 8px;font-size:12px;line-height:16px;color:#4b5563;box-shadow:0 1px 2px 0 rgb(0 0 0/.05)}

/* shared/ui/PortalDropdown.tsx (row actions) */
.menu{position:absolute;z-index:9999;display:flex;flex-direction:column;border-radius:6px;background:#fff;filter:drop-shadow(0 25px 25px rgb(0 0 0/.15));overflow:hidden;min-width:140px;border:1px solid #e5e7eb;color:#374151;transform:translateX(-100%)}
.menu li{cursor:pointer;padding:8px 12px;font-size:14px;line-height:20px}
.menu li:hover{background:#f3f4f6}
.menu li.del{color:#ef4444}

/* prototype-only controls */
.proto-ctl{display:flex;align-items:center;gap:10px}
.proto{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#4b5563;background:#f3f4f6;border:1px dashed #d1d5db;border-radius:999px;padding:2px 10px}
.seg{display:inline-flex;border:1px solid #d1d5db;border-radius:999px;padding:2px;background:#fff}
.seg button{font-size:12px;line-height:18px;font-weight:600;padding:3px 12px;border-radius:999px;color:#6b7280}
.seg button[aria-pressed="true"]{background:#1e1c1c;color:#fff}
</style>
</head>

47088C3.67523 6.22808 3.62343 5.96783 3.62343 5.705C3.62343 5.44217 3.67523 5.18191 3.77588 4.93912C3.87653 4.69632 4.02405 4.47575 4.21 4.29C4.39575 4.10405 4.61632 3.95653 4.85912 3.85588C5.10192 3.75523 5.36217 3.70343 5.625 3.70343C5.88783 3.70343 6.14808 3.75523 6.39088 3.85588C6.63368 3.95653 6.85425 4.10405 7.04 4.29L7.1 4.35C7.33568 4.58054 7.63502 4.73519 7.95941 4.794C8.28381 4.85282 8.61838 4.81311 8.92 4.68H9C9.29577 4.55324 9.54802 4.34275 9.72569 4.07446C9.90337 3.80617 9.99872 3.49179 10 3.17V3C10 2.46957 10.2107 1.96086 10.5858 1.58579C10.9609 1.21071 11.4696 1 12 1C12.5304 1 13.0391 1.21071 13.4142 1.58579C13.7893 1.96086 14 2.46957 14 3V3.09C14.0013 3.41179 14.0966 3.72617 14.2743 3.99447C14.452 4.26276 14.7042 4.47324 15 4.6C15.3016 4.73311 15.6362 4.77282 15.9606 4.714C16.285 4.65519 16.5843 4.50054 16.82 4.27L16.88 4.21C17.0657 4.02405 17.2863 3.87653 17.5291 3.77588C17.7719 3.67523 18.0322 3.62343 18.295 3.62343C18.5578 3.62343 18.8181 3.67523 19.0609 3.77588C19.3037 3.87653 19.5243 4.02405 19.71 4.21C19.896 4.39575 20.0435 4.61632 20.1441 4.85912C20.2448 5.10191 20.2966 5.36217 20.2966 5.625C20.2966 5.88783 20.2448 6.14808 20.1441 6.39088C20.0435 6.63368 19.896 6.85425 19.71 7.04L19.65 7.1C19.4195 7.33568 19.2648 7.63501 19.206 7.95941C19.1472 8.28381 19.1869 8.61838 19.32 8.92V9C19.4468 9.29577 19.6572 9.54802 19.9255 9.72569C20.1938 9.90337 20.5082 9.99872 20.83 10H21C21.5304 10 22.0391 10.2107 22.4142 10.5858C22.7893 10.9609 23 11.4696 23 12C23 12.5304 22.7893 13.0391 22.4142 13.4142C22.0391 13.7893 21.5304 14 21 14H20.91C20.5882 14.0013 20.2738 14.0966 20.0055 14.2743C19.7372 14.452 19.5268 14.7042 19.4 15Z" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

    <li>
      <a class="sb-link" href="#">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 1V4M15 1V4M9 20V23M15 20V23M20 9H23M20 14H23M1 9H4M1 14H4M6 4H18C19.1046 4 20 4.89543 20 6V18C20 19.1046 19.1046 20 18 20H6C4.89543 20 4 19.1046 4 18V6C4 4.89543 4.89543 4 6 4ZM9 9H15V15H9V9Z" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>

<div class="main" id="main"></div>

<script>
(function () {
  // ---- lucide-react icons used on this screen (24px grid, stroke = currentColor) ----
  var LUCIDE = {
    home: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    chevronRight: '<path d="m9 18 6-6-6-6"/>',
    info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
    camera: '<path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/>',
    moreVertical: '<circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>'
  };
  function icon(name, size, sw, cls) {
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 2) + '" stroke-linecap="round" stroke-linejoin="round"' + (cls ? ' class="' + cls + '"' : '') + '>' + LUCIDE[name] + '</svg>';
  }
  // shared/ui/ArrowDown.tsx
  var ARROW_DOWN = '<svg width="8" height="5" viewBox="0 0 8 5" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M4.00018 4.34229L7.37243 1.00796L6.7538 0.395268L4.00018 3.11863L1.24743 0.395268L0.62793 1.00796L4.00018 4.34229Z" fill="#4F4F4F"/></svg>';

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function infoTip(text, size, onDark) {
    return '<span class="info' + (onDark ? ' on-dark' : '') + '" data-tip="' + esc(text) + '"><span role="button" tabindex="0" aria-label="' + esc(text) + '">' + icon('info', size, 2.25) + '</span></span>';
  }

  // ---- copy: src/shared/copy/tooltips.ts ----
  var T = {
    heading: 'One row per recipe: a variant seen through one capture. Configure all four steps here before that capture can be trained or added to an instance.',
    variantName: 'A version of the product being inspected — a different SKU, size or colour that needs its own reference images.',
    capture: 'One camera looking at one position on the part. Each capture is configured, trained and deployed independently.',
    configStatus: 'How far this capture has been set up. You cannot skip ahead — each step unlocks the next.',
    moduleInfo: 'The inspection modules configured on this capture, in the order they run.',
    cameraName: 'The physical camera position this capture is taken from. Shared across variants.',
    complete: 'All four steps done. Ready to train and deploy.',
    algorithmOnly: 'Algorithm-only capture — no sample labels needed.',
    // planned (decided) copy for a finished master-image-only capture
    masterOnlyComplete: 'No inspection modules. Every image is marked OK.'
  };

  // Columns: initialColumns in project-configuration/index.tsx, with Camera Name switched on via Edit Table
  var COLS = [
    { id: 'variant', name: 'Variant Name', tip: T.variantName },
    { id: 'capture', name: 'Capture', tip: T.capture },
    { id: 'config_status', name: 'Configuration Status', tip: T.configStatus },
    { id: 'module_info', name: 'Module Info', tip: T.moduleInfo },
    { id: 'camera_name', name: 'Camera Name', tip: T.cameraName },
    { id: 'actions', name: 'Actions' }
  ];

  // shared prototype state (workflow shell)
  var DEFAULTS = { finished: true, hasSearchArea: false, inInstance: true, analysedOn: true, rawOn: true };
  function readState() {
    var s = {};
    try { var v = JSON.parse(localStorage.getItem('mio-proto-state') || '{}'); if (v && typeof v === 'object') s = v; } catch (e) {}
    var out = {};
    Object.keys(DEFAULTS).forEach(function (k) { out[k] = typeof s[k] === 'boolean' ? s[k] : DEFAULTS[k]; });
    return out;
  }
  var inShell = false;
  try { inShell = window.self !== window.top; } catch (e) { inShell = true; }

  // moduleInfo strings follow formatModuleInfo() in frinksvision-backend/src/utils/module.ts
  function rows(mode) {
    var green = 'tone-green', red = 'tone-red';
    return [
      { id: 'r1', variant: 'Variant A', capture: 'Front View', camera: 'Camera 1', moduleInfo: 'ODC (1)',
        status: { label: 'Complete', tone: green, tip: T.complete } },
      mode === 'today'
        ? { id: 'r2', variant: 'Variant A', capture: 'Top View', camera: 'Camera 2', moduleInfo: 'No modules added yet!',
            status: { label: 'At Step 1/2: Inspection Workflow', tone: red, tip: T.algorithmOnly }, pinned: true }
        : (function () {
            var s = readState();
            return s.finished
              ? { id: 'r2', variant: 'Variant A', capture: 'Top View', camera: 'Camera 2', moduleInfo: s.hasSearchArea ? 'SA (1)' : 'Master image only',
                  status: { label: 'Complete', tone: green, tip: T.masterOnlyComplete }, pinned: true }
              : { id: 'r2', variant: 'Variant A', capture: 'Top View', camera: 'Camera 2', moduleInfo: s.hasSearchArea ? 'SA (1)' : 'No modules added yet!',
                  status: { label: 'At Step 1/2: Inspection Workflow', tone: red, tip: T.algorithmOnly }, pinned: true };
          })(),
      { id: 'r3', variant: 'Variant A', capture: 'Label Side', camera: 'Camera 3', moduleInfo: 'OCR (1)',
        status: { label: 'Complete', tone: green, tip: T.complete } }
    ];
  }

  function twt(text, alwaysShow) {
    return '<div class="twt"' + (alwaysShow ? ' data-tip="' + esc(text) + '"' : '') + '><div>' + esc(text) + '</div></div>';
  }
  function cell(col, r) {
    switch (col.id) {
      case 'variant':
        return '<td class="cls"><div class="td-in">' + twt(r.variant) + '</div></td>';
      case 'capture':
        return '<td class="cls"><div class="td-in"><div class="mip">' + twt(r.capture) +
          '<button type="button" class="mip-btn" title="Preview master image" aria-label="Preview master image">' + icon('camera', 14) + '</button></div></div></td>';
      case 'config_status':
        return '<td class="cls-status"><div class="td-in"><div class="status ' + r.status.tone + '" data-tip="' + esc(r.status.tip) + '"' + (r.pinned ? ' id="pinned-trigger"' : '') + '>' + esc(r.status.label) + '</div></div></td>';
      case 'module_info':
        return '<td class="cls"><div class="td-in">' + twt(r.moduleInfo, true) + '</div></td>';
      case 'camera_name':
        return '<td class="cls"><div class="td-in">' + twt(r.camera) + '</div></td>';
      case 'actions':
        return '<td><div class="td-in"><div class="act"><button type="button" data-menu="' + r.id + '" aria-label="Row actions">' + icon('moreVertical', 16) + '</button></div></div></td>';
    }
    return '';
  }

  var params = new URLSearchParams(location.search);
  var mode = params.get('mode') === 'today' ? 'today' : 'after';

  function render() {
    var colW = COLS.map(function (c) { return c.id === 'actions' ? 100 : null; });
    var html = '';
    html += '<div class="heading">' +
      '<div class="heading-left"><div class="heading-sub">' +
        '<nav aria-label="Breadcrumb" class="bc">' +
          '<a href="#" class="bc-home" title="Go to Home">' + icon('home', 16) + '</a>' +
          icon('chevronRight', 16, 2, 'bc-chev') +
          '<a href="#" class="bc-link" title="Line 1"><span class="bc-label"><span class="truncate">Line 1</span></span></a>' +
          icon('chevronRight', 16, 2, 'bc-chev') +
          '<span class="bc-cur" aria-current="page"><span class="bc-label"><span class="truncate">Recipe Management</span>' + infoTip(T.heading, 15) + '</span></span>' +
        '</nav>' +
      '</div></div>' +
      '<div><div class="proto-ctl"' + (inShell ? ' style="display:none"' : '') + '><span class="proto">Prototype</span><div class="seg" id="seg">' +
        '<button type="button" data-mode="today" aria-pressed="' + (mode === 'today') + '">Today</button>' +
        '<button type="button" data-mode="after" aria-pressed="' + (mode === 'after') + '">After change</button>' +
      '</div></div></div>' +
    '</div>';

    html += '<div class="bar">' +
      '<div class="filters">' +
        '<div class="flt"><div class="flt-badge">0</div><div class="flt-btn">Variant Name' + ARROW_DOWN + '</div></div>' +
        '<div class="flt"><div class="flt-badge">0</div><div class="flt-btn">Reco Status' + ARROW_DOWN + '</div></div>' +
      '</div>' +
      '<div class="actions-top">' +
        '<button type="button" class="btn btn-flex">Add Recipe</button>' +
        '<div style="position:relative"><button type="button" class="btn btn-max">Edit Table</button></div>' +
      '</div>' +
    '</div>';

    html += '<div class="tbl-pad"><div class="tbl-rel"><div class="tbl-flow" id="tbl-flow"><div class="tbl-max">' +
      '<table class="tbl"><colgroup>' + COLS.map(function (c, i) { return '<col data-i="' + i + '">'; }).join('') + '</colgroup>' +
      '<thead><tr>' + COLS.map(function (c) {
        return '<th scope="col">' + (c.tip ? '<span class="th-in">' + esc(c.name) + infoTip(c.tip, 16, true) + '</span>' : esc(c.name)) + '<div class="rh"></div></th>';
      }).join('') + '</tr></thead>' +
      '<tbody>' + rows(mode).map(function (r) {
        return '<tr' + (r.pinned ? ' class="is-hover"' : '') + '>' + COLS.map(function (c) { return cell(c, r); }).join('') + '</tr>';
      }).join('') + '</tbody></table></div></div></div></div>';

    document.getElementById('main').innerHTML = html;
    sizeColumns(colW);
    placePinned();
  }

  // Table.tsx: fullWidth — fixed columns keep their width, the rest share what is left
  function sizeColumns(colW) {
    var flow = document.getElementById('tbl-flow');
    var w = flow.offsetWidth, fixed = 0, flex = 0;
    colW.forEach(function (x) { if (x != null) fixed += x; else flex++; });
    var each = flex ? Math.max((w - fixed) / flex, 0) : 0;
    document.querySelectorAll('colgroup col').forEach(function (col, i) {
      col.style.width = (colW[i] != null ? colW[i] : each) + 'px';
    });
  }

  // Tooltip.tsx getSafeCoords, position "top": centred, 8px above, clamped 8px inside the viewport
  function coords(trigger, tip) {
    var t = trigger.getBoundingClientRect(), b = tip.getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight, GAP = 8, PAD = 8;
    var bottom = t.top - GAP - b.height < PAD;
    var left = t.left + t.width / 2 - b.width / 2;
    left = Math.min(Math.max(left, PAD), Math.max(vw - PAD - b.width, PAD));
    var top = bottom ? t.bottom + GAP : t.top - GAP - b.height;
    if (bottom && top + b.height > vh - PAD) top = t.top - GAP - b.height;
    return { top: top, left: left };
  }
  function makeTip(text) {
    var d = document.createElement('div');
    d.className = 'tip';
    d.setAttribute('role', 'tooltip');
    d.style.visibility = 'hidden';
    d.textContent = text;
    document.body.appendChild(d);
    return d;
  }
  function show(tip, trigger) {
    var c = coords(trigger, tip);
    tip.style.top = c.top + 'px';
    tip.style.left = c.left + 'px';
    tip.style.visibility = 'visible';
  }

  var pinnedTip = null;
  function placePinned() {
    var trig = document.getElementById('pinned-trigger');
    if (pinnedTip) { pinnedTip.remove(); pinnedTip = null; }
    if (!trig) return;
    pinnedTip = makeTip(trig.getAttribute('data-tip'));
    show(pinnedTip, trig);
  }

  // hover tooltips (150ms show delay, as in Tooltip.tsx)
  var hoverTip = null, hoverTimer = null, hoverEl = null;
  function hideHover() {
    clearTimeout(hoverTimer);
    if (hoverTip) { hoverTip.remove(); hoverTip = null; }
    hoverEl = null;
  }
  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest('[data-tip]');
    if (el === hoverEl) return;
    hideHover();
    if (!el || el.id === 'pinned-trigger') return;
    hoverEl = el;
    hoverTimer = setTimeout(function () {
      hoverTip = makeTip(el.getAttribute('data-tip'));
      show(hoverTip, el);
    }, 150);
  });
  document.addEventListener('scroll', hideHover, true);

  // row actions menu (PortalDropdown): opens below the trigger, right-aligned to it
  var menu = null;
  function closeMenu() { if (menu) { menu.remove(); menu = null; } }
  document.addEventListener('mousedown', function (e) {
    if (menu && !menu.contains(e.target) && !e.target.closest('[data-menu]')) closeMenu();
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-menu]');
    if (b) {
      var same = menu && menu.getAttribute('data-for') === b.getAttribute('data-menu');
      closeMenu();
      if (same) return;
      var r = b.getBoundingClientRect();
      menu = document.createElement('ul');
      menu.className = 'menu';
      menu.setAttribute('data-for', b.getAttribute('data-menu'));
      menu.innerHTML = '<li>View / Edit</li><li class="del">Delete</li>';
      menu.style.top = (r.bottom + window.scrollY) + 'px';
      menu.style.left = (r.right + window.scrollX) + 'px';
      document.body.appendChild(menu);
      return;
    }
    if (e.target.closest('.menu li')) { closeMenu(); return; }
    var s = e.target.closest('#seg button[data-mode]');
    if (s && s.getAttribute('data-mode') !== mode) {
      mode = s.getAttribute('data-mode');
      try { history.replaceState(null, '', '?mode=' + mode); } catch (err) { /* file:// may refuse */ }
      hideHover(); closeMenu(); render();
    }
    if (e.target.closest('a[href="#"]')) e.preventDefault();
  });

  window.addEventListener('resize', function () {
    hideHover(); closeMenu();
    sizeColumns(COLS.map(function (c) { return c.id === 'actions' ? 100 : null; }));
    placePinned();
  });

  window.addEventListener('storage', function (e) {
    if (e.key === null || e.key === 'mio-proto-state') { hideHover(); closeMenu(); render(); }
  });

  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placePinned);
  window.addEventListener('load', placePinned);
})();
</script>
