<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe step prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ---- Tailwind v3 preflight (subset) + src/index.css ---- */
*,*::before,*::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
html,body{margin:0;font-size:16px;height:100vh;width:100vw;overflow-y:hidden;color:#000}
:root{font-family:'Outfit',sans-serif;font-optical-sizing:auto;line-height:1.5;font-weight:400;
  color-scheme:light;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
body{background:#fff;line-height:inherit}
button,select{font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;color:inherit;margin:0;padding:0;background:transparent;text-transform:none}
button{cursor:pointer}
img,svg{display:block;vertical-align:middle}
ul{list-style:none;margin:0;padding:0}
a{color:inherit;text-decoration:inherit}

/* ---- shared/layouts/project/sidebar.tsx ---- */
.p-sidebar{position:fixed;left:0;top:0;display:flex;height:100vh;width:80px;flex-direction:column;align-items:center;
  border-right:1px solid #d1d5db;background:#1e1c1c;padding:24px 8px;
  box-shadow:0 4px 6px -1px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.1);z-index:9999}
.p-logo{margin:12px 0 40px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.p-menu{margin-top:32px;display:flex;width:100%;flex-direction:column;gap:8px}
.p-item{position:relative}
.p-link{display:flex;width:100%;align-items:center;justify-content:center;border-radius:6px;padding:8px 0;color:#fff;overflow:hidden;transition:all .3s}
.p-link:hover,.p-link.active{background:rgb(255 255 255/.2)}
.p-tip{position:absolute;left:100%;top:50%;transform:translate(-4px,-50%);margin-left:12px;z-index:50;padding:6px 10px;font-size:12px;line-height:16px;
  font-weight:600;color:#fff;background:#ff4301;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;transition:all .3s;pointer-events:none;width:max-content;max-width:200px}
.p-item:hover .p-tip{opacity:1;transform:translate(0,-50%)}
.p-bottom{display:flex;width:100%;flex-grow:1;flex-direction:column;justify-content:flex-end;gap:8px}

/* ---- page shell ---- */
.p-main{height:100%;min-height:100vh;margin-left:80px}
.layout{display:flex;height:100vh;flex-direction:column;justify-content:stretch}

/* ---- shared/layouts/main/heading.tsx + shared/ui/Breadcrumb.tsx ---- */
.heading{display:flex;align-items:center;justify-content:space-between;margin-top:4px;gap:8px;height:60px;padding:16px 20px;background:#fff}
.heading-sub{display:flex;align-items:baseline;font-size:20px;line-height:28px;font-weight:500;gap:8px}
.crumbs{display:flex;align-items:center;font-size:14px;line-height:20px;color:#6b7280;margin-bottom:16px;padding:8px 4px}
.crumbs>*+*{margin-left:8px}
.crumb-home{display:flex;align-items:center;padding:4px 8px;border-radius:6px;color:#6b7280;transition:all .2s}
.crumb-home:hover{background:#f3f4f6;color:#ff4301}
.crumb-chev{color:#9ca3af;flex-shrink:0}
.crumb{padding:4px 8px;font-weight:500;color:#4b5563;border-radius:6px;display:inline-flex;align-items:center;max-width:200px;transition:all .2s}
.crumb>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.crumb:hover{color:#ff4301;background:#f3f4f6}
.crumb.disabled{cursor:default;user-select:none}
.crumb.current{font-weight:600;color:#111827}

/* ---- module-configuration/index.css ---- */
.step-content-container{height:calc(100vh - 125px);overflow:hidden}
.footer{padding:10px;background:#fff;font-weight:700;border-top:1px solid #000;width:100%;position:relative;display:flex;justify-content:space-between;align-items:center}
.footer-progress-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:16px}
.footer-nav-side{min-width:100px;display:flex;align-items:center}
.footer-nav-side-left{justify-content:flex-end}
.footer-nav-side-right{justify-content:flex-start}

/* shared/ui/Button.tsx (tailwind-variants) */
.btn{font-weight:600;height:fit-content;cursor:pointer;border:1px solid transparent;font-size:14px;line-height:20px;padding:8px 24px;border-radius:6px}
.btn-primary{background:#ff4301;color:#fff}
.btn-primary:hover{background:rgb(255 67 1/.9)}
.btn-border{background:transparent;border:1px solid #ff4301;color:#ff4301}
.btn-border:hover{opacity:.7}
.tipwrap{display:inline-flex;align-items:center;position:relative}
.module-config-icon-button{min-width:40px;width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;
  transition:background-color .15s ease,border-color .15s ease,color .15s ease,opacity .15s ease}
.module-config-finish-button{min-width:90px;height:40px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;
  transition:background-color .15s ease,border-color .15s ease,color .15s ease,opacity .15s ease}
.module-config-nav-button-disabled{background-color:#f3f4f6!important;border:1px solid #d1d5db!important;color:#9ca3af!important;opacity:1!important;box-shadow:none!important;cursor:not-allowed!important}
.module-config-finish-button-disabled{background-color:#d1d5db!important;border:1px solid #d1d5db!important;color:#6b7280!important;opacity:1!important;box-shadow:none!important;cursor:not-allowed!important}
.ico16{width:16px;height:16px}

/* shared/ui/ProgressBar compact */
.progress-compact-container{display:flex;align-items:center;gap:12px;padding:4px 14px;width:290px;border:1px solid #e7e5e4;border-radius:9999px;background:#fafaf9;justify-content:space-between}
.progress-compact-bar{display:flex;align-items:center;gap:8px}
.progress-compact-dot{width:8px;height:8px;border:none;border-radius:9999px;background:#d6d3d1;padding:0;transition:transform .2s ease,background-color .2s ease,opacity .2s ease}
.progress-compact-dot-active{background:#ff4301;transform:scale(1.15)}
.progress-compact-summary{display:flex;align-items:center;gap:6px;color:#292524;font-size:14px;white-space:nowrap;min-width:0;flex:1}
.progress-compact-counter{color:#78716c;font-weight:500}
.progress-compact-dropdown{min-width:0;flex:1}
.progress-compact-select-wrap{display:flex;align-items:center;width:100%;min-width:0;transform:translateY(-6px)}
.progress-compact-select{width:100%;min-width:0;max-width:170px;border:none;background:transparent;color:#292524;font-size:14px;font-weight:600;outline:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transform:translateY(6px);text-align:center;text-align-last:center}
.progress-compact-select option{text-align:left}

/* assembly/components/Actions.tsx */
.actions{display:flex;align-items:center;gap:24px;padding:0 16px}
.act{display:flex;user-select:none;flex-direction:column;align-items:center;padding:8px;cursor:not-allowed;opacity:.3}
.act svg{width:24px;height:24px}

/* ---- moduleWorkflow/index.css ---- */
.area-cover{height:calc(100vh - 125px);overflow:hidden;display:flex;flex-direction:column;justify-content:stretch;z-index:100}
.module-section{background:#f3f3f3;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-grow:1;height:calc(100vh - 125px)}
.konva-section{height:100%;flex:1 1 620rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:hidden;border-right:1px solid #4b5563}
.annot-canvas{width:100%;height:100%;display:flex;justify-content:center;align-items:center;overflow:hidden;background:#F0F0F0}
.annot-canvas svg{width:100%;height:100%}
.canvas-cover{background:#f3f3f3;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;flex:1 1 auto;align-self:stretch;position:relative}
.canvas-cover.with-image{flex-basis:7000px}
.module-empty-upload{display:flex;width:300px;height:80px;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:5px 10px;border:1px solid #333;border-radius:5px;background:#fff;color:#000;font-size:12px;text-align:center}
.module-input{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.module-input>div{display:flex;align-items:center;font-weight:500}
.module-input>div>label{display:flex;align-items:center;justify-content:center;gap:8px;background:#ff4301;color:#fff;padding:5px 10px;border-radius:20px;cursor:pointer}

/* tree (react-konva Stage, Html nodes) */
.tree{position:absolute;left:calc(50% - 150px);top:calc(50% - 240px);width:300px;height:80px}
.tree-svg{position:absolute;left:0;top:0;overflow:visible}
.plus{cursor:pointer}
.plus .ring{stroke-width:0}
.plus:hover .ring{stroke-width:.8}
.node-container{position:absolute;left:0;border:1px solid #333;border-radius:5px;background:#fff;font-size:12px;color:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;text-align:center;padding:5px 10px;width:300px;height:80px}
.master-node-content{position:relative;display:flex;width:100%;min-width:0;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left}
.master-node-content>div:first-child{width:100%;padding-right:24px}
.master-text{display:flex;min-width:0;flex-direction:column;gap:4px;overflow:hidden;font-size:12px}
.master-hint{white-space:normal;color:#B4B6B8}
.master-name{min-width:0;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.master-menu-trigger{position:absolute;top:-1px;right:0}
.delete-option{cursor:pointer;position:relative;height:14px}
.master-menu-trigger .delete-option{height:16px;width:16px}
.module-node-edit{display:flex;width:100%;justify-content:space-between}
.module-placeholder{padding:3px 6px 3px 24px;min-width:200px;text-align:start;background:#fff;border-radius:5px;position:relative;font-size:14px;display:flex;align-items:center;gap:8px}
.module-placeholder>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nameIcon{position:absolute;height:16px;width:16px;top:5px;left:5px}
.node-icons{display:flex;align-items:center;gap:4px;padding-left:4px}
.node-status{margin-top:6px;width:100%;padding:0 4px;text-align:start}

/* ---- shared/components/Tooltip.tsx bubble ---- */
.tt{position:fixed;top:0;left:0;z-index:99999;pointer-events:none;width:max-content;max-width:300px;overflow-wrap:break-word;white-space:normal;
  border-radius:4px;border:1px solid #d1d5db;background:#f3f4f6;padding:4px 8px;font-size:12px;line-height:16px;color:#4b5563;
  box-shadow:0 1px 2px 0 rgb(0 0 0/.05);visibility:hidden;font-weight:400}

/* ---- prototype-only chrome ---- */
.proto{position:fixed;top:14px;right:16px;z-index:100000;display:flex;align-items:center;gap:8px;font-family:'Outfit',sans-serif}
.proto-tag{font-size:10px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#44403c;border-radius:4px;padding:2px 6px}
.seg{display:flex;border:1px solid #d6d3d1;border-radius:6px;overflow:hidden;background:#fff}
.seg button{font-size:11px;line-height:16px;font-weight:500;color:#57534e;padding:4px 9px;border-left:1px solid #e7e5e4;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button:hover{background:#f5f5f4}
.seg button[aria-pressed="true"]{background:#44403c;color:#fff}
</style>
</head>

        '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="104" fill="none" stroke="#4a4e52" stroke-width="6"/>' +
        '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="62" fill="#0d0e0f"/>' +
        '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="62" fill="none" stroke="#9fa3a7" stroke-width="5" stroke-opacity=".7"/>';
    }).join('');
    return '' +
      '<svg viewBox="0 0 2448 2048" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-label="Master image">' +
      '<defs>' +
      '<radialGradient id="bg" cx="50%" cy="48%" r="70%"><stop offset="0" stop-color="#2b2d30"/><stop offset=".65" stop-color="#18191b"/><stop offset="1" stop-color="#0b0c0d"/></radialGradient>' +
      '<linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9da1a5"/><stop offset=".28" stop-color="#c8cbce"/><stop offset=".52" stop-color="#999da1"/><stop offset=".8" stop-color="#7d8185"/><stop offset="1" stop-color="#5f6367"/></linearGradient>' +
      '<linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e5e7"/><stop offset=".5" stop-color="#8e9296"/><stop offset="1" stop-color="#3f4346"/></linearGradient>' +
      '<radialGradient id="boss" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#dfe1e3"/><stop offset=".55" stop-color="#a4a8ac"/><stop offset="1" stop-color="#6a6e72"/></radialGradient>' +
      '<radialGradient id="cbore" cx="60%" cy="62%" r="60%"><stop offset="0" stop-color="#6c7074"/><stop offset="1" stop-color="#2c2f32"/></radialGradient>' +
      '<radialGradient id="bore" cx="58%" cy="60%" r="60%"><stop offset="0" stop-color="#303336"/><stop offset="1" stop-color="#08090a"/></radialGradient>' +
      '<pattern id="brush" width="2448" height="7" patternUnits="userSpaceOnUse"><rect width="2448" height="3" fill="#ffffff" fill-opacity=".035"/></pattern>' +
      '<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
      '<clipPath id="partClip"><rect x="424" y="324" width="1600" height="1400" rx="130"/></clipPath>' +
      '<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="28"/></filter>' +
      '</defs>' +
      '<rect width="2448" height="2048" fill="url(#bg)"/>' +
      '<rect x="454" y="374" width="1600" height="1400" rx="130" fill="#000" opacity=".55" filter="url(#shadow)"/>' +
      '<rect x="424" y="324" width="1600" height="1400" rx="130" fill="url(#bevel)"/>' +
      '<rect x="440" y="340" width="1568" height="1368" rx="116" fill="url(#plate)"/>' +
      '<g clip-path="url(#partClip)"><rect x="424" y="324" width="1600" height="1400" fill="url(#brush)"/>' +
      '<rect x="300" y="200" width="700" height="1700" fill="url(#sheen)" transform="rotate(-28 1224 1024)"/></g>' +
      '<rect x="440" y="340" width="1568" height="1368" rx="116" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="5"/>' +
      holes +
      '<circle cx="1224" cy="1024" r="400" fill="#55595d"/>' +
      '<circle cx="1224" cy="1024" r="386" fill="url(#boss)"/>' +
      '<circle cx="1224" cy="1024" r="318" fill="none" stroke="#5c6064" stroke-width="10"/>' +
      '<circle cx="1224" cy="1024" r="304" fill="none" stroke="#e9ebec" stroke-opacity=".45" stroke-width="5"/>' +
      '<circle cx="1224" cy="1024" r="196" fill="url(#bore)"/>' +
      '<circle cx="1224" cy="1024" r="196" fill="none" stroke="#b5b8bb" stroke-width="12" stroke-opacity=".75"/>' +
      '<circle cx="1224" cy="1024" r="176" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="10"/>' +
      '<circle cx="864" cy="1024" r="38" fill="#0e0f10"/><circle cx="864" cy="1024" r="38" fill="none" stroke="#a5a9ad" stroke-width="4" stroke-opacity=".6"/>' +
      '<circle cx="1584" cy="1024" r="38" fill="#0e0f10"/><circle cx="1584" cy="1024" r="38" fill="none" stroke="#a5a9ad" stroke-width="4" stroke-opacity=".6"/>' +
      '<rect x="1069" y="1520" width="310" height="76" rx="38" fill="#141516"/>' +
      '<rect x="1069" y="1520" width="310" height="76" rx="38" fill="none" stroke="#a5a9ad" stroke-width="4" stroke-opacity=".55"/>' +
      '<rect x="1094" y="452" width="260" height="44" rx="6" fill="none" stroke="#5f6367" stroke-width="5" stroke-opacity=".8"/>' +
      '</svg>';
  }

  /* ---------- tree pieces (moduleNode.tsx + Konva arrow / plus) ---------- */
  function masterNode() {
    return '<div class="node-container" style="top:0;background-color:white">' +
      '<div class="master-node-content">' +
        '<div class="master-text"><div class="master-hint">Master Image as main input to the workflow</div>' +
        '<div class="master-name" title="' + MASTER_NAME + '">' + MASTER_NAME + '</div></div>' +
        '<div class="master-menu-trigger">' + ICON_OPTIONS.replace('style="width:auto"', '') + '</div>' +
      '</div>' +
      '<div class="node-status" style="color:#23C16B"></div>' +
    '</div>';
  }
  function moduleNode(name, top) {
    return '<div class="node-container" style="top:' + top + 'px;background-color:#E7E7FF40">' +
      '<div class="module-node-edit">' +
        '<div class="module-placeholder" title="' + name + '"><span>' + name + '</span>' + ICON_MODULE + '</div>' +
        '<div class="node-icons">' + ICON_EDIT + '<div style="position:relative;display:flex;align-items:center;gap:4px">' + ICON_OPTIONS.replace('style="width:auto"', 'style="width:14px"') + '</div></div>' +
      '</div>' +
      '<div class="node-status" style="color:#B4B6B8">Configure the selected module</div>' +
    '</div>';
  }
  function plus(x, y) {
    return '<g class="plus"><circle class="ring" cx="' + x + '" cy="' + y + '" r="12" fill="transparent" stroke="#ff4301" stroke-dasharray="2 4"/>' +
      '<line x1="' + x + '" y1="' + (y + 6) + '" x2="' + x + '" y2="' + (y - 6) + '" stroke="#ff4301" stroke-width="2" stroke-linecap="round"/>' +
      '<line x1="' + (x - 6) + '" y1="' + y + '" x2="' + (x + 6) + '" y2="' + y + '" stroke="#ff4301" stroke-width="2" stroke-linecap="round"/></g>';
  }
  function arrow(x, y1, y2) {
    // Konva Arrow: pointerLength 4, pointerWidth 7, strokeWidth 2
    return '<line x1="' + x + '" y1="' + y1 + '" x2="' + x + '" y2="' + y2 + '" stroke="#ff4301" stroke-width="2" stroke-linecap="round"/>' +
      '<path d="M' + x + ' ' + y2 + ' L' + (x - 3.5) + ' ' + (y2 - 4) + ' L' + (x + 3.5) + ' ' + (y2 - 4) + ' Z" fill="#ff4301" stroke="#ff4301" stroke-width="2" stroke-linejoin="miter"/>';
  }

  /* ---------- per-state rendering ---------- */
  function renderWorkflow(state) {
    var section = document.getElementById('moduleSection');
    if (state === 'after-no-image') {
      section.innerHTML =
        '<div class="canvas-cover">' +
          '<div class="module-empty-upload"><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">' +
            '<div class="module-input"><div class="upload-image"><label>' +
              '<div style="display:flex;align-items:center;gap:8px;background:#ff4301">' + ICON_UPLOAD +
                '<div style="background:#ff4301">Upload Master Image</div>' +
                '<span class="tipwrap" data-tip="The reference frame for this capture. It sets the capture’s resolution, and every search area is measured against it.">' + ICON_INFO_WHITE + '</span>' +
              '</div>' +
            '</label></div></div>' +
          '</div></div>' +
        '</div>';
      return;
    }
    var withChild = state === 'after-unconfigured';
    var svg = '<svg class="tree-svg" width="300" height="80">' +
      (withChild ? arrow(150, 80, 176) + plus(322, 40) : plus(150, 96)) + '</svg>';
    section.innerHTML =
      '<div class="konva-section"><div class="annot-canvas">' + masterImageSvg() + '</div></div>' +
      '<div class="canvas-cover with-image"><div class="tree">' + svg + masterNode() +
        (withChild ? moduleNode('ODC_1', 184) : '') + '</div></div>';
  }

  function renderNext(state) {
    var slot = document.getElementById('nextSlot');
    var html, pin = null;
    if (state === 'today') {
      html = '<span class="tipwrap" id="nextWrap"><button type="button" class="btn btn-border group module-config-icon-button module-config-nav-button-disabled" aria-label="Next">' + ICON_ARROW_RIGHT + '</button></span>';
      pin = 'Save this step and move to the next one.';
    } else if (state === 'after-unconfigured') {
      html = '<span class="tipwrap" id="nextWrap"><button type="button" class="btn btn-border group module-config-icon-button module-config-nav-button-disabled" aria-label="Next">' + ICON_ARROW_RIGHT + '</button></span>';
      pin = 'Configure ODC_1 to continue.';
    } else if (state === 'after-no-image') {
      html = '<span class="tipwrap" id="nextWrap"><button type="button" class="btn group module-config-finish-button module-config-finish-button-disabled" aria-disabled="true">Finish</button></span>';
      pin = 'Upload a master image first.';
    } else {
      html = '<span class="tipwrap" id="nextWrap" data-tip="Save this configuration and complete the module setup."><button type="button" class="btn btn-primary group module-config-finish-button">Finish</button></span>';
    }
    slot.innerHTML = html;
    return pin;
  }

  /* ---------- Tooltip positioning (shared/components/Tooltip.tsx getSafeCoords) ---------- */
  var GAP = 8, PAD = 8;
  function place(tip, trigger, position) {
    var t = trigger.getBoundingClientRect();
    tip.style.visibility = 'hidden';
    tip.style.left = '0px'; tip.style.top = '0px';
    var r = tip.getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    var placeBottom = false;
    if (t.top - GAP - r.height < PAD) placeBottom = true;
    var left = position === 'top-end' ? t.right + 16 - r.width : t.left + t.width / 2 - r.width / 2;
    left = Math.min(Math.max(left, PAD), Math.max(vw - PAD - r.width, PAD));
    var top = placeBottom ? t.bottom + GAP : t.top - GAP - r.height;
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
    tip.style.visibility = 'visible';
  }

  var pinTip = document.getElementById('pinTip');
  var hoverTip = document.getElementById('hoverTip');
  var pinnedText = null;
  function placePinned() {
    var wrap = document.getElementById('nextWrap');
    if (!pinnedText || !wrap) { pinTip.style.visibility = 'hidden'; return; }
    pinTip.textContent = pinnedText;
    place(pinTip, wrap, 'top');
  }

  var hoverTimer = null;
  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) return;
    if (el.contains(e.relatedTarget)) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(function () {
      hoverTip.textContent = el.getAttribute('data-tip');
      place(hoverTip, el, el.getAttribute('data-pos') || 'top');
    }, 150);
  });
  document.addEventListener('mouseout', function (e) {
    var el = e.target.closest && e.target.closest('[data-tip]');
    if (!el || el.contains(e.relatedTarget)) return;
    clearTimeout(hoverTimer);
    hoverTip.style.visibility = 'hidden';
  });

  /* ---------- state switching ---------- */
  function getState() {
    var s = new URLSearchParams(location.search).get('state');
    return STATES.indexOf(s) >= 0 ? s : 'today';
  }
  function setState(s, push) {
    renderWorkflow(s);
    pinnedText = renderNext(s);
    hoverTip.style.visibility = 'hidden';
    Array.prototype.forEach.call(document.querySelectorAll('#seg button'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-state') === s));
    });
    if (push) {
      try { history.replaceState(null, '', location.pathname + '?state=' + s); } catch (e) {}
    }
    requestAnimationFrame(placePinned);
  }
  document.getElementById('seg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-state]');
    if (b) setState(b.getAttribute('data-state'), true);
  });
  window.addEventListener('resize', placePinned);
  setState(getState(), false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placePinned);
  window.addEventListener('load', placePinned);
})();
</script>
</body>
