<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRINKS.AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tailwind preflight (subset) */
*,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
html{line-height:1.5;-webkit-text-size-adjust:100%;tab-size:4}
body{margin:0;line-height:inherit}
h1,h2,h3,h4,h5,h6,p{font-size:inherit;font-weight:inherit;margin:0}
a{color:inherit;text-decoration:inherit}
button,input,select{font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;color:inherit;margin:0;padding:0}
button,select{text-transform:none}
button{-webkit-appearance:button;background-color:transparent;background-image:none;cursor:pointer}
img,svg{display:block;vertical-align:middle}
img{max-width:100%;height:auto}
ul{list-style:none;margin:0;padding:0}
table{border-collapse:collapse;text-indent:0;border-color:inherit}
input::placeholder{color:#9ca3af;opacity:1}

/* src/index.css */
html,body{font-size:16px;height:100vh;width:100vw;overflow-y:hidden;color:black}
body{overflow:auto}
:root{font-family:'Outfit',sans-serif;font-optical-sizing:auto;line-height:1.5;font-weight:400;font-style:normal;font-size:16px;min-height:100vh;height:fit-content;color-scheme:light;font-synthesis:weight style;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.no-spin::-webkit-outer-spin-button,.no-spin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
[hidden]{display:none!important}

/* shared/layouts/main/sidebar.jsx (collapsed) */
.sb{position:fixed;left:0;top:0;z-index:100;display:flex;height:100vh;width:114px;flex-direction:column;align-items:center;border-right:1px solid #d1d5db;background:#1e1c1c;padding:24px 8px;overflow:hidden;white-space:nowrap;box-shadow:0 4px 6px -1px rgb(0 0 0 / .1),0 2px 4px -2px rgb(0 0 0 / .1)}
.sb-top{display:flex;min-height:0;width:100%;flex:1 1 0%;flex-direction:column}
.sb-logo{margin-top:12px;margin-bottom:40px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sb-nav{margin-top:32px;min-height:0;width:100%;flex:1 1 0%;overflow:hidden}
.sb-nav ul{display:flex;width:100%;flex-direction:column;gap:8px;padding-bottom:16px}
.sb-item{display:flex;align-items:center;border-radius:6px;padding:8px 36px;color:#fff;overflow:hidden;cursor:pointer}
.sb-item:hover{background:rgb(255 255 255 / .1)}
.sb-ico{display:flex;width:24px;flex-shrink:0;align-items:center;justify-content:center}
.sb-bottom{margin-top:8px;display:flex;width:100%;flex-shrink:0;flex-direction:column;gap:8px;padding-top:12px}
.sb-expand{display:flex;width:100%;align-items:center;justify-content:center;border-radius:6px;padding:8px 0;color:#fff}

/* shared/layouts/instance/index.jsx */
.main{position:relative;min-height:100vh;overflow-x:auto;background:#fff;margin-left:114px;width:calc(100% - 114px)}

/* shared/layouts/main/heading.jsx */
.heading{position:relative;margin-top:4px;display:flex;height:60px;align-items:baseline;gap:8px;background:#fff;padding:16px 20px}
.h-main{font-size:30px;line-height:36px;font-weight:500}
.h-sub{display:flex;align-items:baseline;gap:8px;font-size:20px;line-height:28px;font-weight:500}
.crumb{display:flex;align-items:center;gap:8px;cursor:pointer}
.crumb svg{height:16px;width:16px}
.h-info{align-self:center;color:#6b7280;display:inline-flex}

/* modules/dashboard-builder/DashboardBuilder.jsx */
.lp{padding:8px 20px 40px}
.lp-bar{margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.flt{position:relative}
.flt-btn{display:flex;height:38px;width:128px;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap;border-radius:8px;background:#fff;padding:0 12px;font-size:13px;font-weight:500;color:#374151}
.flt-btn:hover{background:#f9fafb}
.flt-btn svg{flex-shrink:0;color:#6b7280;transition:transform .15s}
.flt-btn.open svg{transform:rotate(180deg)}
.flt-menu{position:absolute;left:0;top:100%;z-index:50;margin-top:4px;max-height:240px;min-width:128px;overflow-y:auto;border-radius:8px;border:1px solid #e5e7eb;background:#fff;box-shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1)}
.flt-ph{cursor:pointer;padding:0 12px;font-size:14px;line-height:20px;color:#9ca3af}
.flt-opt{display:flex;cursor:pointer;align-items:center;gap:10px;padding:8px 12px;color:#374151}
.flt-opt:hover{background:#f9fafb}
.flt-rad{display:flex;height:14px;width:14px;flex-shrink:0;align-items:center;justify-content:center;border-radius:999px;border:1px solid #d1d5db;background:#fff}
.flt-opt.sel .flt-rad{border-color:#111827}
.flt-opt.sel .flt-rad::after{content:"";height:8px;width:8px;border-radius:999px;background:#111827}
.flt-opt span{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-lg{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:6px;background:#ff4301;padding:8px 24px;font-size:14px;line-height:20px;font-weight:600;color:#fff;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}
.btn-lg:hover{opacity:.95}

/* shared/ui/Table.jsx */
.tbl-wrap{display:flow-root;width:100%;overflow-x:auto}
.tbl{min-width:100%;table-layout:auto}
.tbl thead{position:sticky;top:0;z-index:10}
.tbl thead tr{background:#ff4301;position:relative}
.tbl th{position:sticky;top:0;padding:16px 8px;text-align:center;font-size:16px;line-height:24px;font-weight:500;color:#fff}
.tbl th .thi{display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tbl th .rz{position:absolute;bottom:10px;right:0;top:10px;width:2px;border-radius:16px;background:#fff;cursor:col-resize}
.tbl th:last-child .rz{display:none}
.tbl tbody{background:#fff}
.tbl tbody tr+tr{border-top:1px solid #e5e7eb}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#f3f4f6}
.tbl tbody tr.act{background:#f0fdf4}
.tbl tbody tr.act:hover{background:#f3f4f6}
.tbl td{overflow:visible;padding:8px;color:#000}
.tbl td>.c{display:flex;height:100%;width:100%;align-items:center;justify-content:center;text-align:center}
.dn{display:block;max-width:220px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:#ff4301}
.dn:hover,.dl a:hover{text-decoration:underline}
.dl{display:flex;max-width:220px;align-items:center;justify-content:center;gap:8px}
.dl a{min-width:0;flex:1 1 0%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ff4301}
.st{border-radius:4px;padding:4px 8px;font-size:14px;line-height:20px;font-weight:500}
.st.on{color:#22c55e}.st.off{color:#ef4444}
.kebab{padding:4px;color:#6b7280}
.kebab:hover{color:#374151}
.empty{padding:8px 0;text-align:center;color:#4b5563}
/* Instance name + Models Remaining tag (same pill as edge-instances.html) */
.ins-nm{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 8px}
.tag-mr{white-space:nowrap;border-radius:9999px;border:1px solid #fef08a;background:#fefce8;color:#a16207;padding:2px 8px;font-size:11px;font-weight:500}
.am{position:absolute;z-index:9999;width:128px;border-radius:6px;border:1px solid #e5e7eb;background:#fff;box-shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1)}
.am button{display:flex;width:100%;align-items:center;gap:8px;padding:8px;text-align:left;font-size:12px;line-height:16px;color:#374151}
.am button:hover{background:#f9fafb}
.am button svg{width:16px;height:16px}
.am button.dis{cursor:not-allowed;color:#d1d5db}
.am button.del{color:#ef4444}
.am button.del.dis{color:#d1d5db}
.am-veil{position:fixed;inset:0;z-index:9998;cursor:default}

/* modules/dashboard/creation-page/index.jsx */
.creation{overflow:hidden;background:#F9FAFB;padding-left:4px}
.row{display:flex;min-height:0;flex-grow:1}
.canvas-col{position:relative;display:flex;height:calc(100vh - 120px);width:80%;flex-direction:column;overflow:hidden;background:#e5e7eb}
.panel-col{width:20%;overflow:hidden}

/* HeadingCreation.jsx */
.tb{position:relative;z-index:10;display:flex;height:56px;width:100%;align-items:center;justify-content:space-between;background:#ff4301;padding:0 16px;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}
.tb-in{display:flex;width:100%;max-width:100%;align-items:center;justify-content:space-between;gap:16px}
.tb-l,.tb-r{display:flex;align-items:center;justify-content:center;gap:16px}
.tb-back{display:block;border-radius:6px;padding:8px;color:#fff;cursor:pointer}
.tb-back:hover{background:rgb(209 213 219 / .35)}
.tb-dims{position:relative;display:flex;align-items:center;gap:16px}
.tb-dims input{height:32px;width:56px;border-radius:6px;padding-left:4px;background:#fff;color:#000}
.tb-zoom{height:32px;width:72px;border-radius:5px;border:1px solid #d1d5db;background:#fff;padding-left:4px;color:#000}
.tb-undo{margin:0 8px 0 24px;display:inline}
.tb-redo{margin:0 8px;display:inline}
.tb-undo svg,.tb-redo svg{width:20px;height:20px;opacity:.5;cursor:not-allowed}
.tb-mid{display:flex;width:100%;border-radius:6px;background:#fff;padding-left:2px}
.tb-name{min-width:0;flex-grow:1}
.tb-name-in{display:flex;height:100%;width:100%;align-items:center}
.tb-name h3{margin-right:8px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:6px;background:#fff;padding:4px;text-align:center;font-weight:700;color:#ff4301;cursor:text}
.tb-view{display:flex;cursor:pointer;align-items:center;gap:8px;border-radius:6px;padding:6px 12px;font-size:16px;line-height:24px;font-weight:700;color:#ff4301}
.tb-view .chev{margin-left:4px;height:16px;width:16px}
.tb-variant{position:relative;min-width:192px}
.tb-variant-btn{display:flex;min-width:192px;cursor:pointer;align-items:center;justify-content:space-between;gap:8px;border-radius:6px;border:1px solid #e5e7eb;background:#fff;padding:4px 8px;font-weight:700;color:#ff4301}
.tb-variant-btn .nm{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vmenu{position:absolute;left:0;top:calc(100% + 4px);z-index:9999;width:100%;border-radius:6px;border:1px solid #e5e7eb;background:#fff;box-shadow:0 10px 15px -3px rgb(0 0 0 / .1)}
.vmenu div{cursor:pointer;border-bottom:1px solid #e5e7eb;padding:8px 16px;color:#374151;font-weight:400}
.vmenu div:hover{background:#f3f4f6}
.tb-ibtn{display:flex;align-items:center;gap:8px;border-radius:6px;border:1px solid #e5e7eb;background:#fff;padding:6px;font-weight:700;color:#ff4301;cursor:pointer;transition:all .2s}
.tb-ibtn:hover{background:#ff4301;color:#fff}
.tb-ibtn.eye{border-color:#fff}

/* MainCreation.jsx */
.mc{height:100%;overflow:auto;border:1px solid #000;padding:4px}
.canvas{transform-origin:top left;border:1px dashed #000;background:#fff;transition:transform .2s}
.zone{position:relative;height:100%;width:100%}
.rnd{position:absolute;top:0;left:0;display:inline-block;box-sizing:border-box;flex-shrink:0;overflow:hidden;border:0 solid #4f46e5;cursor:move}
.rnd.hov:hover,.rnd.sel{border-width:2px}
.drag-handle{width:100%;height:100%}
.txt{display:flex;height:100%;width:100%;flex-direction:column;padding:4px}
.img-wrap{display:flex;height:100%;width:100%;align-items:center;justify-content:center;position:relative}
.img-fixed{height:100%;width:100%;object-fit:contain;max-width:100%}
.ph{position:relative;display:flex;height:100%;width:100%;align-items:center;justify-content:center;border:1px solid #000}
.ph span{overflow-wrap:break-word;padding-left:4px;padding-right:4px;text-align:center;font-size:14px;line-height:20px;color:#000}

/* RightSidebarCreation.jsx */
.rsc{display:flex;height:calc(100vh - 120px);flex-direction:column;border-left:1px solid #9ca3af;background:#e5e7eb}
.cp-h{margin:12px;display:flex;align-items:center;justify-content:space-between}
.cp-h h3{user-select:none;font-size:20px;line-height:28px;font-weight:500}
.cp-hr{border:1px solid #e5e7eb;border-bottom-color:#d1d5db}
.cp-list{display:flex;width:100%;flex-direction:column;padding:8px 0;overflow-y:auto}
.cp-row{display:flex;width:100%;align-items:center;justify-content:space-between;padding:2px 8px;cursor:pointer}
.cp-row:hover{background:#f3f4f6}
.cp-l{display:flex;width:100%;align-items:center;gap:8px;border-radius:8px;padding:4px 8px}
.cp-car{border-radius:2px;padding:4px}
.cp-car:hover,.cp-add:hover{background:#e5e7eb}
.cp-lbl{font-size:14px;line-height:20px;color:#464A4D}
.cp-add{cursor:pointer;border-radius:2px;padding:4px}
.cp-add svg{width:16px;height:16px;color:#4f4f4f}
.cp-sub{display:flex;flex-direction:column;gap:4px;padding-left:24px}
.cp-sub div{margin-left:32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d1d5db;padding:4px 8px;font-size:14px;line-height:20px;color:#464A4D;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-sub div:hover{background:#d1d5db}
.cp-grp{padding:16px 8px 16px 16px}
.cp-grp-h{display:flex;align-items:center;justify-content:space-between}
.cp-grp-h p{user-select:none;padding-bottom:4px;font-size:16px;line-height:24px;font-weight:500}
.cp-grp-h span{cursor:pointer;border-radius:2px;padding:2px}
.cp-grp-h span:hover{background:#f3f4f6}

/* EditComponentSection.jsx */
.ech{display:flex;max-width:100%;justify-content:space-between;gap:4px;border:1px solid #e5e7eb;border-top-color:#d1d5db;background:#fff;padding:4px 8px}
.ech-back{padding:4px 8px}
.ech-back:hover{background:#f3f4f6}
.ech-name{min-width:0;flex-grow:1}
.ech-name-in{display:flex;height:100%;width:100%;align-items:center}
.ech-name-in span{cursor:text;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px}
.ech-acts{display:inline-flex;align-items:center;gap:8px}
.ech-acts span{border-radius:2px;border:1px solid #e5e7eb;padding:6px 8px;font-weight:700;color:#000;cursor:pointer;transition:all .2s}
.ech-acts span:hover{background:#ff4301;color:#fff}
.ech-acts span.del{color:#dc2626}
.ech-acts span.del:hover{color:#fff}
.ec-body{display:flex;min-height:0;flex-grow:1;flex-direction:column;justify-content:space-between}

/* TabConfig / PropertyTab / DefaultProperty / DataTab / PropertyDynamicDataSource */
.tabcfg{height:100%;padding:16px 16px 8px;overflow-y:auto;display:flex;flex-direction:column}
.ptab{display:flex;height:100%;flex-direction:column;gap:16px}
.dp{display:grid;gap:16px}
.dp h3{margin-bottom:8px;font-weight:500}
.dp-row{display:flex;height:fit-content;gap:16px}
.dp-f{display:flex;height:fit-content;align-items:center;justify-content:space-between;gap:8px;flex:1 1 0%;min-width:0}
.dp-f label{text-transform:capitalize}
.dp-f input{width:100%;min-width:40px;border-radius:8px;padding:4px 8px;text-align:center;background:#fff;color:#000}
.dt-lbl{font-weight:500}
.dt{display:flex;width:100%;cursor:pointer;gap:8px;border-radius:8px;background:#e5e7eb}
.dt div{display:flex;align-items:center;justify-content:center;padding:8px 16px;font-size:12px;line-height:16px;color:#9ca3af}
.dt div.on{border-radius:8px;background:#fff;color:#000}
.dds{display:grid;gap:12px;padding-bottom:10vh}
.fx{display:flex;align-items:center}
.fx label{margin-bottom:4px;margin-right:8px;display:inline-flex;cursor:pointer;align-items:center;border-radius:999px;border:1px solid #ff4301;background:#ff4301;padding:4px 12px;color:#fff}
.fx label svg{margin-right:8px}
.fx span{margin-right:8px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* shared/ui/SelectVar.jsx (react-select + customStyles) */
.rs{position:relative;display:block;width:100%;border:1px solid #e5e7eb;color:#d1d5db;background:#fff;border-radius:6px;font-size:14px;line-height:20px}
.rs-control{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;min-height:38px;position:relative;background:#fff;border:1px solid #fcfcfc;border-radius:.375rem;cursor:default;outline:0}
.rs-control:hover{border-color:rgb(245,244,244)}
.rs.focus .rs-control{border-color:#ff4301;box-shadow:0 0 0 1px #ff4301}
.rs-vc{display:grid;flex:1;flex-wrap:wrap;align-items:center;padding:2px 8px;position:relative;overflow:hidden}
.rs-sv{grid-area:1/1/2/3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:hsl(0,0%,20%);margin-left:2px;margin-right:2px}
.rs-ph{grid-area:1/1/2/3;color:hsl(0,0%,50%);margin-left:2px;margin-right:2px}
.rs-ind{display:flex;align-items:center;align-self:stretch;flex-shrink:0}
.rs-dd{display:flex;padding:0 8px;color:#9CA3AF}
.rs-dd svg{width:20px;height:20px}
.rs-menu{position:absolute;bottom:100%;left:0;width:100%;z-index:9999;background:#fff;border-radius:.375rem;box-shadow:0 0 0 1px hsla(0,0%,0%,.1),0 4px 11px hsla(0,0%,0%,.1);margin-bottom:8px;max-height:200px;overflow-y:auto}
.rs-ml{max-height:200px;overflow-y:auto;padding:4px 0}
.rs-nomsg{text-align:center;color:hsl(0,0%,60%);padding:8px 12px}
.rs-opt{position:relative;cursor:default;user-select:none;padding:8px 16px 8px 40px;font-size:14px;line-height:20px;color:#111827}
.rs-opt:hover,.rs-opt.focused{background:#ff4301;color:#fff}
.rs-opt .lbl{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
.rs-opt.selected .lbl{font-weight:600}
.rs-opt .tick{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;padding-left:12px;color:#000}
.rs-opt:hover .tick,.rs-opt.focused .tick{color:#fff}
.rs-opt .tick svg{width:16px;height:16px}
.fol{display:flex;align-items:center}
.chip{display:inline-flex;padding:2px 8px;font-size:14px;line-height:20px;border-radius:12px;color:#000;background:#CBDFAD}
.fol .rest{margin-left:8px}

/* modules/modal + shared/ui/ModalCreateNewDashboard.jsx */
.mdl{position:fixed;left:0;top:0;z-index:99991;height:100vh;width:100vw;background:rgb(107 114 128 / .75)}
.mdl-box{position:relative;top:50%;margin:0 auto;transform:translateY(-50%);width:100%;max-width:512px;border-radius:8px;background:#fff;text-align:left;box-shadow:0 20px 25px -5px rgb(0 0 0 / .1),0 8px 10px -6px rgb(0 0 0 / .1)}
.mdl-h{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d1d5db;padding:16px}
.mdl-h div:first-child{font-size:16px;font-weight:600}
.mdl-x{width:fit-content;cursor:pointer}
.mdl-b{display:flex;flex-direction:column;background:#fff;padding:16px 16px 0}
.mdl-b label,.mdl-u label{margin-bottom:8px;font-weight:600;display:block}
.mdl-b input{border-radius:8px;border:1px solid #e5e7eb;padding:8px 16px;outline:none}
.mdl-u{margin-bottom:16px;display:flex;flex-direction:column;padding:16px 16px 0}
.mdl-url{display:flex;align-items:center;border-radius:8px;border:1px solid #e5e7eb;padding:8px 16px}
.mdl-url span{color:#9ca3af}
.mdl-url input{flex-grow:1;border:none;padding:0;outline:none;min-width:0}
.err{color:#ff2100;padding-left:8px;padding-top:4px;font-size:14px;line-height:20px;font-weight:500}
.mdl-f{display:flex;align-items:center;justify-content:center;gap:16px;border-top:1px solid #d1d5db;padding:12px 16px}
.btn-b{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;border:1px solid #ff4301;background:transparent;padding:8px 24px;font-size:14px;line-height:20px;font-weight:600;color:#ff4301;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}
.btn-b:hover{opacity:.7}
.btn-c{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;border:1px solid transparent;padding:8px 24px;font-size:14px;line-height:20px;font-weight:600;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}
/* react-select default theme (instance selector) */
.rsd{position:relative;display:block;width:100%;min-width:200px;border-radius:6px;border:1px solid #e5e7eb;background:#fff;font-size:14px;line-height:20px}
.rsd-c{display:flex;align-items:center;justify-content:space-between;min-height:38px;border:1px solid hsl(0,0%,80%);border-radius:4px;background:#fff;cursor:default}
.rsd.focus .rsd-c{border-color:#2684FF;box-shadow:0 0 0 1px #2684FF}
.rsd-v{flex:1;padding:2px 8px;color:hsl(0,0%,20%);margin:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsd-v.pl{color:hsl(0,0%,50%)}
.rsd-sep{align-self:stretch;width:1px;margin:8px 0;background:hsl(0,0%,80%)}
.rsd-dd{display:flex;padding:8px;color:hsl(0,0%,80%)}
.rsd.focus .rsd-dd{color:hsl(0,0%,40%)}
.rsd-m{position:absolute;top:100%;left:0;width:100%;z-index:1;margin:8px 0;background:#fff;border-radius:4px;box-shadow:0 0 0 1px hsla(0,0%,0%,.1),0 4px 11px hsla(0,0%,0%,.1);padding:4px 0}
.rsd-o{position:relative;padding:8px 16px 8px 40px;font-size:14px;line-height:20px;color:#111827;cursor:default}
.rsd-o:hover{background:#ff4301;color:#fff}
.rsd-o.sel span{font-weight:600}
.rsd-o .tick{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;padding-left:12px}
.rsd-o .tick svg{width:16px;height:16px}

/* react-hot-toast + shared/components/Tooltip */
.toasts{position:fixed;top:16px;left:0;right:0;z-index:999999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;background:#fff;color:#363636;line-height:1.3;box-shadow:0 3px 10px rgba(0,0,0,.1),0 3px 3px rgba(0,0,0,.05);max-width:350px;padding:8px 10px;border-radius:8px;font-size:16px}
.toast .m{margin:4px 10px}
.tip{position:fixed;z-index:99999;pointer-events:none;width:max-content;max-width:260px;white-space:normal;overflow-wrap:break-word;border-radius:4px;border:1px solid #d1d5db;background:#f3f4f6;padding:4px 8px;font-size:12px;line-height:16px;color:#4b5563;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}

/* prototype mode switch (hidden inside the shell) */
html.in-shell .pctl{display:none!important}
.pctl{position:fixed;right:16px;bottom:16px;z-index:100000;display:inline-flex;border:1px solid #d1d5db;border-radius:999px;padding:2px;background:#fff;box-shadow:0 2px 8px rgb(0 0 0 / .12)}
.pctl button{font-size:12px;font-weight:600;padding:3px 12px;border-radius:999px;color:#6b7280;line-height:18px}
.pctl button[aria-pressed="true"]{background:#1e1c1c;color:#fff}
</style>

      '<div class="ech-name"><div class="ech-name-in"><span title="' + esc(name) + '">' + esc(name) + '</span></div></div>' +
      '<div class="ech-acts"><span>' + I.copy + '</span><span>' + I.faCopy + '</span><span class="del">' + I.trash + '</span></div>' +
      '</div><div class="ec-body"><div class="tabcfg"><div class="ptab">' +
      '<div class="dp"><div><h3>Coordinates</h3><div class="dp-row">' + fld('x', 'X', c.x) + fld('y', 'Y', c.y) + fld('z', 'Z', c.z) + '</div></div>' +
      '<div><h3>Dimensions</h3><div class="dp-row">' + fld('w', 'W', c.w) + fld('h', 'H', c.h) + '</div></div></div>' +
      '<div><label class="dt-lbl">Data</label><div class="dt"><div class="' + (c.origin === 'FIXED' ? 'on' : '') + '">Fixed</div><div class="' + (c.origin === 'DATA_SOURCE' ? 'on' : '') + '">From Data Source</div></div></div>';
    if (c.origin === 'FIXED') {
      h += '<div><div class="fx"><label>' + I.upCloud + 'Change</label><span>' + esc(c.fileName) + '</span></div></div>';
    } else {
      h += '<div class="dds">' + selectHtml('variant', 'Select Variant', 'variant', c.variant, [RECIPE.variant]);
      if (c.variant) h += selectHtml('capture', 'Select Camera Configuration', 'capture', c.capture, RECIPE.captures.map(function (x) { return x.name; }));
      if (c.variant && c.capture) {
        var cap = null; RECIPE.captures.forEach(function (x) { if (x.name === c.capture) cap = x; });
        h += selectHtml('sa', 'Select Search Area', 'searchArea', c.sa, cap ? cap.searchAreas : []);
      }
      h += '</div>';
    }
    h += '</div></div></div></div>';
    p.innerHTML = h;
    $('pBack').addEventListener('click', function () { selected = null; openSelect = null; renderBuilder(); });
    Array.prototype.forEach.call(p.querySelectorAll('.dp-f input'), function (inp) {
      inp.addEventListener('change', function () {
        var v = parseInt(inp.value, 10); if (!(v >= 1)) return;
        c[inp.name] = v; renderBuilder();
      });
    });
    Array.prototype.forEach.call(p.querySelectorAll('.rs'), function (rs) {
      rs.querySelector('.rs-control').addEventListener('mousedown', function (e) {
        e.stopPropagation();
        var k = rs.getAttribute('data-k'); openSelect = openSelect === k ? null : k; renderPanel();
      });
      Array.prototype.forEach.call(rs.querySelectorAll('.rs-opt'), function (o) {
        o.addEventListener('mousedown', function (e) {
          e.stopPropagation();
          var k = rs.getAttribute('data-k'), v = o.getAttribute('data-v');
          if (k === 'variant') { c.variant = v; c.capture = null; c.sa = null; }
          else if (k === 'capture') { c.capture = v; c.sa = null; }
          else { c.sa = v; }
          openSelect = null; renderBuilder();
        });
      });
    });
  }
  function fld(k, l, v) { return '<div class="dp-f"><label>' + l + ':</label><input class="no-spin" type="number" min="1" name="' + k + '" value="' + v + '"></div>'; }
  function chip(pfx, v) { return '<div class="fol" title=" ' + esc(v) + '"><div class="chip">' + pfx + '</div><span class="rest"> ' + esc(v) + '</span></div>'; }
  function selectHtml(k, label, pfx, val, opts) {
    var open = openSelect === k;
    var h = '<div><label>' + label + '</label><div class="rs' + (open ? ' focus' : '') + '" data-k="' + k + '"><div class="rs-control"><div class="rs-vc">' +
      (val ? '<div class="rs-sv">' + chip(pfx, val) + '</div>' : '<div class="rs-ph">Select...</div>') +
      '</div><div class="rs-ind"><div class="rs-dd">' + I.upDown + '</div></div></div>';
    if (open) {
      h += '<div class="rs-menu"><div class="rs-ml">' + (opts.length ? opts.map(function (o) {
        var sel = o === val;
        return '<div class="rs-opt' + (sel ? ' selected' : '') + '" data-v="' + esc(o) + '"><span class="lbl">' + chip(pfx, o) + '</span>' + (sel ? '<span class="tick">' + I.tick + '</span>' : '') + '</div>';
      }).join('') : '<div class="rs-nomsg">No options</div>') + '</div></div>';
    }
    return h + '</div></div>';
  }
  function paletteHtml() {
    var h = '<div class="rsc"><div style="height:100%;display:flex;flex-direction:column"><div class="cp-h"><h3>Components</h3></div><div class="cp-hr"></div><div class="cp-list">';
    PALETTE.forEach(function (t) {
      var op = !!palOpen[t.type];
      h += '<div style="width:100%;cursor:pointer"><div class="cp-row"><div class="cp-l" data-pal="' + t.type + '"><span class="cp-car">' + (op ? I.angD : I.angR) + '</span>' + t.icon + '<div class="cp-lbl">' + t.label + '</div></div><span class="cp-add">' + I.plus + '</span></div>';
      if (op) {
        current.comps.forEach(function (c) {
          if (c.type !== t.type) return;
          h += '<div class="cp-sub"><div data-pick="' + c.id + '">' + esc(compName(c) || c.type) + '</div></div>';
        });
      }
      h += '</div>';
    });
    h += '<div class="cp-hr"></div><div class="cp-grp"><div class="cp-grp-h"><p>Group Components</p><span>' + fe('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', 16, ' color="#4f4f4f"') + '</span></div><div style="padding:8px"></div></div>';
    h += '</div></div></div>';
    return h;
  }
  function bindPalette() {
    var p = $('panel');
    Array.prototype.forEach.call(p.querySelectorAll('[data-pal]'), function (el) {
      el.addEventListener('click', function () { var t = el.getAttribute('data-pal'); palOpen[t] = !palOpen[t]; renderPanel(); });
    });
    Array.prototype.forEach.call(p.querySelectorAll('[data-pick]'), function (el) {
      el.addEventListener('click', function () {
        var c = compById(el.getAttribute('data-pick')); if (!c || c.type === 'TEXT') return;
        selected = c.id; renderBuilder();
      });
    });
  }

  /* ---------- toast + tooltip ---------- */
  function toast(msg, isErr) {
    var t = document.createElement('div'); t.className = 'toast';
    t.innerHTML = (isErr ? I.errToast : I.okToast) + '<div class="m">' + esc(msg) + '</div>';
    $('toasts').appendChild(t); setTimeout(function () { t.remove(); }, 2600);
  }
  var tip = $('tip'), tipT = null;
  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest('[data-tip]');
    if (!el) { tip.hidden = true; clearTimeout(tipT); return; }
    clearTimeout(tipT);
    tipT = setTimeout(function () {
      tip.textContent = el.getAttribute('data-tip'); tip.hidden = false;
      var r = el.getBoundingClientRect(), tr = tip.getBoundingClientRect(), pos = el.getAttribute('data-pos') || 'top', x, y;
      if (pos === 'right') { x = r.right + 8; y = r.top + r.height / 2 - tr.height / 2; }
      else if (pos === 'bottom') { x = r.left + r.width / 2 - tr.width / 2; y = r.bottom + 6; }
      else { x = r.left + r.width / 2 - tr.width / 2; y = r.top - tr.height - 6; }
      tip.style.left = Math.max(4, Math.min(x, innerWidth - tr.width - 4)) + 'px'; tip.style.top = Math.max(4, y) + 'px';
    }, 250);
  });

  /* ---------- mode switch + shared state ---------- */
  $('pctl').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]'); if (!b || b.getAttribute('data-mode') === mode) return;
    var p = new URLSearchParams(location.search); p.set('mode', b.getAttribute('data-mode')); p.delete('view');
    location.search = p.toString();
  });
  window.addEventListener('storage', function (e) { if (e.key === KEY || e.key === null) { S = readState(); render(); if (!$('mdl').hidden) renderModal(); } });
  window.addEventListener('resize', function () { if (view === 'list') sizeCols(); });

  /* ---------- initial ---------- */
  var m = /^tile(\d)$/.exec(openParam);
  if (view === 'builder' && m && compById('cTile' + m[1])) selected = 'cTile' + m[1];
  if (view === 'builder' && openParam === 'logo') selected = 'cLogo';
  render();
  if (view === 'list' && openParam === 'filter') { $('fltMenu').hidden = false; $('fltBtn').classList.add('open'); }
  if (view === 'list' && openParam === 'add') openModal();
  if (view === 'list' && openParam === 'add-instance') { openModal(); $('insMenu').hidden = false; $('insSel').classList.add('focus'); }
})();
</script>
</body>
</html>
