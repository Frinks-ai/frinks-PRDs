<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Module Configurations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
/* ---- Tailwind 3 preflight (subset) + src/index.css ---- */
*,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
html{line-height:1.5;-webkit-text-size-adjust:100%;tab-size:4;font-family:'Outfit',sans-serif}
html,body{font-size:16px;height:100vh;width:100vw;overflow-y:hidden;color:#000}
body.overflow-auto{overflow:auto}
:root{font-family:'Outfit',sans-serif;line-height:1.5;font-weight:400;font-size:16px;color-scheme:light;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
body{margin:0;line-height:inherit;background:#fff}
button,input{font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;letter-spacing:inherit;color:inherit;margin:0;padding:0}
button{text-transform:none;-webkit-appearance:button;background-color:transparent;background-image:none;cursor:pointer}
:disabled{cursor:default}
svg{display:block;vertical-align:middle}
table{text-indent:0;border-color:inherit;border-collapse:collapse}
th{font-weight:inherit}
ul{list-style:none;margin:0;padding:0}
h3,p{margin:0;font-size:inherit;font-weight:inherit}
label{cursor:default}
input::placeholder{opacity:1;color:#9ca3af}
::-webkit-inner-spin-button,::-webkit-outer-spin-button{height:auto}
@media (max-width:1281px){*{font-size:96%}}

/* ---- Sidebar (shared/layouts/main/sidebar.jsx, collapsed = default) ---- */
.sb{position:fixed;left:0;top:0;z-index:100;display:flex;flex-direction:column;align-items:center;height:100vh;width:114px;border-right:1px solid #d1d5db;background:#1e1c1c;padding:24px 8px;overflow:hidden;white-space:nowrap;box-shadow:0 4px 6px -1px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.1)}
.sb-top{display:flex;min-height:0;width:100%;flex:1 1 0%;flex-direction:column}
.sb-logo{margin:12px 0 40px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sb-nav{margin-top:32px;min-height:0;width:100%;flex:1 1 0%;overflow:hidden}
.sb-nav>ul{display:flex;width:100%;flex-direction:column;gap:8px;padding-bottom:16px}
.sb-grp{display:flex;flex-direction:column;border-radius:8px}
.sb-grp:hover{background:rgb(255 255 255/.1)}
.sb-grp.open{padding-bottom:12px}
.sb-item{display:flex;align-items:center;border-radius:6px;padding:8px 36px;color:#fff;overflow:hidden;cursor:pointer;text-decoration:none}
a.sb-item:hover{background:rgb(255 255 255/.2)}
.sb-ico{display:flex;width:24px;flex-shrink:0;align-items:center;justify-content:center}
.sb-bottom{margin-top:8px;display:flex;width:100%;flex-shrink:0;flex-direction:column;gap:8px;padding-top:12px}
.sb-expand{display:flex;width:100%;align-items:center;justify-content:center;border-radius:6px;padding:8px 0;color:#fff}

/* ---- Main layout + Heading (shared/layouts/main/index.jsx, heading.jsx) ---- */
.main{position:relative;height:100%;min-height:100vh;width:calc(100% - 114px);margin-left:114px;overflow-x:auto;background:#fff}
.heading{margin-top:4px;display:flex;height:60px;align-items:baseline;gap:8px;background:#fff;padding:16px 20px}
.h-main{font-size:30px;line-height:36px;font-weight:500}
.h-sub{display:flex;align-items:baseline;gap:8px;font-size:20px;line-height:28px;font-weight:500}
.self-center{align-self:center}
.tip{position:relative;display:inline-flex;align-items:center}
.tip-i{display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;border-radius:9999px;color:#6b7280;transition:transform .15s;cursor:default}
.tip-i:hover{transform:scale(1.1)}
.tip-i.white{color:#fff}
.tip-i:focus{outline:none}
.tip-i:focus-visible{box-shadow:0 0 0 2px #ff4301}
/* Tooltip bubble (shared/components/Tooltip.jsx:208-221) */
.tt{position:fixed;z-index:99999;max-width:300px;width:max-content;white-space:normal;overflow-wrap:break-word;pointer-events:none;border-radius:4px;border:1px solid #d1d5db;background:#f3f4f6;padding:4px 8px;font-size:12px;line-height:16px;color:#4b5563;box-shadow:0 1px 2px 0 rgb(0 0 0/.05)}

/* ---- Inferencing Customization card + fixed footer (inferencing-customizations/index.jsx) ---- */
.box{margin:20px auto;border:1px solid #e5e7eb;border-radius:4px;background:#fff}
.box-in{padding:16px 16px 80px;min-height:84vh}
.foot{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:1px solid #e5e7eb}
.foot-in{display:flex;justify-content:flex-end;gap:12px;border-top:1px solid #e5e7eb;padding:12px 20px}
.ib{position:relative;display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;height:fit-content;cursor:pointer;border:1px solid transparent;font-size:14px;line-height:20px;padding:8px 24px;border-radius:6px}
.w24{width:96px}
.btn-border{background:transparent;border-color:#ff4301;color:#ff4301}
.btn-flat,.btn-pri{color:#fff;background:#ff4301;border-color:transparent}
.btn:not(:disabled):hover{opacity:.7}
.btn-pri:not(:disabled):hover{opacity:1;background:rgb(255 67 1/.9)}
.btn:disabled{background:#d1d5db;color:#6b7280;border-color:transparent;cursor:not-allowed;pointer-events:none}

/* ---- EMC (EditModuleConfigurations.jsx, InstanceSelector.jsx) ---- */
.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.col4{display:flex;flex-direction:column;gap:16px}
.col6{display:flex;flex-direction:column;gap:24px}
.w-full{width:100%}
.lbl-inst{margin-bottom:8px;display:block;font-size:14px;line-height:20px;font-weight:600;color:#000}
.lbl{margin-bottom:4px;display:block;font-size:14px;line-height:20px;font-weight:500;color:#000}
.lbl-row{margin-bottom:4px;display:flex;align-items:center;gap:8px}
.lbl-row .lbl{margin-bottom:0}
.banner{margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;padding:14px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;color:#065f46;font-size:12px;line-height:16px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05)}
.banner a{font-weight:600;text-decoration:underline;margin-left:4px;color:#064e3b}
.banner .x{color:#059669;padding:4px;cursor:pointer}

/* SelectInput (shared/ui/SelectInput.jsx) */
.sel{position:relative}
.sel-btn{position:relative;width:100%;min-width:120px;cursor:default;border-radius:6px;border:1px solid #d1d5db;background:#fff;padding:8px 40px 8px 12px;text-align:left;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);font-size:14px;line-height:20px;color:#111827}
.sel-btn:focus{outline:none;border-color:#ff4301;box-shadow:0 0 0 1px #ff4301}
.sel-btn:disabled{cursor:not-allowed;background:#f3f4f6;color:#9ca3af}
.sel-txt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-ph{color:#6b7280}
.sel-arr{pointer-events:none;position:absolute;top:0;bottom:0;right:0;display:flex;align-items:center;padding-right:8px}
.sel-arr svg{height:20px;width:20px}
.sel-list{position:fixed;z-index:9999;max-height:240px;overflow:auto;border-radius:6px;background:#fff;padding:4px 0;font-size:14px;line-height:20px;box-shadow:0 0 0 1px rgb(0 0 0/.05),0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -4px rgb(0 0 0/.1)}
.sel-list li{position:relative;cursor:default;user-select:none;padding:8px 16px 8px 40px;color:#111827}
.sel-list li.on{background:#ff4301;color:#fff}
.sel-list li .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
.sel-list li.sel-d .t{font-weight:600}
.sel-list li .tick{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;padding-left:12px;color:#000}
.sel-list li .tick svg{height:20px;width:20px}

/* Table (shared/ui/Table.jsx) */
.tbl{display:flow-root;width:100%;overflow-x:auto;overflow-y:visible}
.tbl table{min-width:100%}
.tbl table>thead+tbody{border-top:1px solid #d1d5db}
.tbl thead{position:sticky;top:0;z-index:10}
.tbl thead tr{background:#ff4301;position:relative}
.tbl th{position:sticky;top:0;padding:16px 8px;text-align:center;font-size:16px;line-height:24px;font-weight:500;color:#fff}
.th-in{display:inline-flex;align-items:center;justify-content:center;gap:4px}
.rh{position:absolute;bottom:10px;right:0;top:10px;width:2px;cursor:col-resize;border-radius:16px;background:#fff}
.tbl th:last-child .rh{display:none}
.tbl tbody{background:#fff}
.tbl tbody>tr+tr{border-top:1px solid #e5e7eb}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#f3f4f6}
.tbl td{overflow:visible;padding:8px;color:#000}
.td-in{display:flex;height:100%;width:100%;align-items:center;justify-content:center;text-align:center}
.fc{display:flex;flex-direction:column}
.fc-c{display:flex;flex-direction:column;align-items:center}
.fr-c{display:flex;width:100%;align-items:center;justify-content:center;gap:8px}
.cls{font-size:14px;font-weight:500;color:#000}
.h4{height:16px}
.err{height:16px;font-size:11px;line-height:16px;color:#ef4444}
.num{width:100%;min-width:80px;border-radius:5px;border:1px solid #e5e7eb;padding:8px;font-size:14px;line-height:14px;background:#fff}
.num:focus,.th-num:focus,.txt:focus{outline:2px solid #000;outline-offset:0}
.th-num{width:100%;min-width:120px;border-radius:5px;border:1px solid #e5e7eb;padding:8px;font-size:12px;line-height:16px;background:#fff}

/* Locked threshold cell (model-tied setting, no model yet) */
.lockw{position:relative;display:block;width:100%}
.lockw input{pointer-events:none;background:#f3f4f6;color:#9ca3af;cursor:not-allowed;padding-right:30px}
.lockw .lk{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#9ca3af;pointer-events:none}
.lockw.xs{width:96px}
.lock-hint{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:12px;line-height:16px;font-weight:400;color:#6b7280;text-transform:none;letter-spacing:0;vertical-align:middle}
.lock-hint svg{color:#9ca3af}

/* Sections (sections/*.jsx) */
.sec{display:flex;flex-direction:column;gap:16px}
.sec-title{font-size:16px;font-weight:600}
.sub-lbl{font-size:14px;font-weight:500}
.b14{font-size:14px;font-weight:700;color:#000}
.g2{gap:8px}
.ro{width:100%;border-radius:5px;border:1px solid #e5e7eb;background:#f9fafb;padding:8px;font-size:12px;line-height:16px;color:#374151;text-align:left}
.txt{width:100%;border-radius:5px;border:1px solid #d1d5db;padding:8px;font-size:12px;line-height:16px;background:#fff;color:#000}
.txt.bad{border-color:#ef4444}
.rm-row{display:flex;max-width:448px;align-items:center;gap:12px}
.rm-lbl{white-space:nowrap;font-size:14px;font-weight:500;color:#000}
.sw{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.sw input{position:absolute;width:1px;height:1px;opacity:0}
.sw .tr{position:relative;height:24px;width:44px;border-radius:9999px;background:#e5e7eb}
.sw .tr::after{content:'';position:absolute;left:2px;top:2px;height:20px;width:20px;border-radius:9999px;border:1px solid #d1d5db;background:#fff;transition:all .15s}
.sw input:checked+.tr{background:#ff4301}
.sw input:checked+.tr::after{transform:translateX(100%);border-color:#fff}
.ang-in{width:100%;border:1px solid #e5e7eb;border-radius:4px;padding:8px;font-size:13px;line-height:19px;outline:none;color:#000}
.ang-in:focus,.f13:focus{border-color:#000;box-shadow:0 0 0 1px #000}
.l13{font-size:13px;font-weight:500;color:#000}
.req{color:#ef4444}
.f13{width:100%;border:1px solid #e5e7eb;border-radius:4px;padding:8px;font-size:13px;line-height:19px;outline:none;color:#000}
.pv{width:100%;max-width:150px;min-width:80px;border:1px solid #e5e7eb;border-radius:4px;padding:6px 8px;font-size:12px;line-height:1;outline:none;color:#000}
.pv:focus{border-color:#000;box-shadow:0 0 0 1px #000}
.drag{position:absolute;left:16px;cursor:grab;color:#000}
.cr-q{margin-bottom:12px;display:block;font-size:14px;line-height:20px;font-weight:600;color:#000}
.cr-grid{display:grid;width:60%;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cr-opt{display:flex;align-items:center;gap:12px;cursor:pointer}
.cr-opt input{width:16px;height:16px;margin:0}
.cr-opt span{font-size:14px;line-height:20px;font-weight:500;color:#000}
.cr-in{width:100%;border-radius:6px;border:1px solid #d1d5db;padding:10px;font-size:14px;line-height:20px;outline:none}
.cr-in:focus{border-color:#3b82f6;box-shadow:0 0 0 1px #3b82f6}

/* Bead Inspection (BeadInspectionConfigEditor.jsx, bead-emc/*) */
.bd-h{font-size:13px;line-height:19px;font-weight:700;color:#1f2937;text-transform:uppercase;letter-spacing:.05em}
.bd-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;width:100%;align-items:start}
.bd-set{grid-column:span 4/span 4;display:flex;flex-direction:column;gap:20px;padding:20px;background:rgb(249 250 251/.5);border:1px solid #e5e7eb;max-height:85vh;overflow-y:auto}
.bd-can{grid-column:span 8/span 8;background:#fff;border:1px solid #e5e7eb}
.bd-row{display:flex;gap:6px;width:100%}
.bd-l{font-size:14px;line-height:20px;font-weight:700;color:#1f2937;width:50%;padding-top:8px;user-select:none}
.bd-l2{display:flex;align-items:center;gap:6px;width:50%;user-select:none}
.bd-l2 span.t{font-size:14px;line-height:20px;font-weight:700;color:#1f2937}
.bd-v{width:50%;padding:8px 12px;font-size:14px;line-height:20px;font-weight:600;overflow-wrap:anywhere}
.bd-div{height:1px;background:#e5e7eb;margin:4px 0}
.bd-t{font-size:14px;line-height:20px;font-weight:700;color:#1f2937}
.ic-g{color:#9ca3af;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ic-g:hover{color:#4b5563}
.btn-edit{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-size:12px;line-height:16px;font-weight:600;color:#e8542b;border:1px solid rgb(232 84 43/.4);border-radius:6px;background:transparent}
.btn-edit:hover{background:#fff7ed;border-color:#e8542b}
.btn-edit:disabled{opacity:.4;cursor:not-allowed}
.bd-stats{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:#4b5563;font-weight:500}
.bd-note{font-size:11px;line-height:1.625;color:#6b7280}
.bd-recalc{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px solid #f3f4f6}
.btn-rc{width:100%;padding:6px 12px;border-radius:6px;font-size:12px;line-height:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-rc.on{background:#e8542b;color:#fff;box-shadow:0 4px 6px -1px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.1);cursor:pointer}
.btn-rc.on:hover{background:#d44820}
.btn-rc.off{background:#f3f4f6;color:#9ca3af;border:1px solid #e5e7eb;cursor:not-allowed}
.rc-ok{font-size:11px;line-height:1.25;color:#047857;font-weight:500}
.rc-warn{font-size:11px;line-height:1.25;color:#b45309;font-weight:600}
.inp{width:100%;border-radius:6px;border:1px solid #d1d5db;padding:8px 12px;font-size:14px;line-height:20px;background:#fff;outline:1px solid transparent}
.inp:focus{border-color:#ff4301;outline:2px solid #ff4301}
.inp.bad{border-color:#ef4444}
.inp.xs{padding:4px 8px;font-size:16px;line-height:24px}
.inp:disabled{background:rgb(239 239 239/.3)}
.unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:500;color:#9ca3af;pointer-events:none;user-select:none;text-transform:lowercase}
.unit.s{right:8px;font-size:10px}
.rel{position:relative}
.bw-err{font-size:12px;line-height:16px;color:#ef4444;font-weight:500;margin-top:2px}
.ed-box{display:flex;flex-direction:column;gap:12px;padding:12px;background:rgb(236 253 245/.7);border:1px solid #6ee7b7;border-radius:8px}
.ed-t{font-size:12px;font-weight:700;color:#064e3b;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-pill{padding:2px 8px;font-size:11px;font-weight:700;background:#fff;color:#065f46;border:1px solid #a7f3d0;border-radius:9999px}
.ed-b{padding:2px 8px;font-size:12px;line-height:16px;font-weight:500;background:#fff;border:1px solid #d1d5db;border-radius:4px;color:#374151}
.ed-b:hover{background:#f9fafb}
.ed-b:disabled{opacity:.4;cursor:not-allowed}
.ed-f{padding:2px 10px;font-size:12px;line-height:16px;font-weight:600;background:#e8542b;color:#fff;border-radius:4px}
.ed-f:disabled{opacity:.4;cursor:not-allowed}
.ed-p{font-size:11px;line-height:1.375;color:#065f46;padding-top:4px;border-top:1px solid rgb(167 243 208/.6)}
.stage{position:relative;width:100%;overflow:hidden;user-select:none;background:#1b1c1e}
.stage svg.cv{display:block;width:100%}
.c-tools{position:absolute;top:12px;right:12px;z-index:30;display:flex;align-items:center;gap:6px;background:rgb(255 255 255/.95);border:1px solid #e5e7eb;box-shadow:0 4px 6px -1px rgb(0 0 0/.1);padding:4px;border-radius:8px}
.c-b{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;color:#374151}
.c-b:hover{background:#f3f4f6;color:#e8542b}
.c-b.on{background:#fff7ed;color:#e8542b}
.c-rep{display:flex;align-items:center;gap:6px;padding:0 10px;height:32px;border-radius:6px;font-size:12px;font-weight:600;color:#374151}
.c-rep:hover{background:#f3f4f6;color:#111827}
.c-rep:disabled{opacity:.4;cursor:not-allowed}
.c-sep{width:1px;height:16px;background:#e5e7eb}
.c-leg{position:absolute;bottom:12px;right:12px;z-index:30;display:flex;align-items:center;gap:12px;background:rgb(255 255 255/.95);border:1px solid #e5e7eb;box-shadow:0 4px 6px -1px rgb(0 0 0/.1);padding:6px 12px;border-radius:8px;font-size:12px;line-height:16px}
.c-st{display:flex;align-items:center;gap:6px;padding-right:8px;border-right:1px solid #e5e7eb;color:#047857;font-weight:500}
.dotg{width:8px;height:8px;border-radius:9999px;background:#10b981}
.c-lg{display:flex;align-items:center;gap:12px;color:#4b5563;font-weight:500}
.c-lg span{display:inline-flex;align-items:center;gap:6px}
.sq{width:10px;height:10px;border-radius:2px}
.c-pill{position:absolute;top:12px;left:12px;z-index:30;padding:6px 12px;background:#e8542b;color:#fff;font-size:12px;font-weight:700;border-radius:6px;box-shadow:0 4px 6px -1px rgb(0 0 0/.1)}
.c-note{position:absolute;bottom:12px;left:12px;z-index:30;max-width:448px;background:#fffbeb;border:1px solid #fcd34d;color:#78350f;padding:10px;border-radius:8px;font-size:12px;display:flex;gap:10px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Modal (modules/modal/index.jsx), UnsavedChangesModal, WarningModal */
.ov{position:fixed;left:0;top:0;z-index:99991;width:100vw;height:100vh;background:rgb(107 114 128/.75);display:flex;align-items:center;justify-content:center}
.mdl{background:#fff;border-radius:8px;text-align:left;box-shadow:0 20px 25px -5px rgb(0 0 0/.1),0 8px 10px -6px rgb(0 0 0/.1)}
.mdl.third{width:33.3333%}
.mdl.md{max-width:448px}
.mdl.lg{max-width:512px;width:100%;padding:24px;border-radius:12px;border:1px solid #e5e7eb}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 24px}
.mh.bb{border-bottom:1px solid #e5e7eb}
.mh h3{font-weight:600}
.mh .x{cursor:pointer}
.mb{padding:16px 24px}
.mb.bb{border-bottom:1px solid #e5e7eb}
.mt2{padding-top:8px}
.mf{display:flex;justify-content:flex-end;gap:12px;padding:16px 24px}
.mf.sp{justify-content:space-between;gap:16px}
.pill-b{height:40px;border-radius:9999px;border:1px solid #e5e7eb;padding:0 16px;cursor:pointer}
.pill-p{height:40px;border-radius:9999px;border:1px solid #e5e7eb;padding:0 16px;background:#ff4301;color:#fff;cursor:pointer}
.px6{padding-left:24px;padding-right:24px}

/* react-hot-toast (top-center) */
.toaster{position:fixed;z-index:9999;top:16px;left:16px;right:16px;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.toast{display:flex;align-items:center;background:#fff;color:#363636;line-height:1.3;box-shadow:0 3px 10px rgba(0,0,0,.1),0 3px 3px rgba(0,0,0,.05);max-width:350px;pointer-events:auto;padding:8px 10px;border-radius:8px;font-size:16px;animation:tin .35s cubic-bezier(.21,1.02,.73,1) forwards}
.toast .msg{margin:4px 10px;display:flex;justify-content:center;flex:1 1 auto;white-space:pre-line}
.toast .ok{width:20px;height:20px;border-radius:10px;background:#61d345;position:relative;flex-shrink:0}
.toast .ok::after{content:'';box-sizing:border-box;position:absolute;border-right:2px solid #fff;border-bottom:2px solid #fff;bottom:6px;left:6px;height:10px;width:6px;transform:rotate(45deg)}
.toast .er{width:20px;height:20px;border-radius:10px;background:#ff4b4b;position:relative;flex-shrink:0}
.toast .er::before,.toast .er::after{content:'';position:absolute;border-radius:3px;background:#fff;top:9px;left:4px;height:2px;width:12px;transform:rotate(45deg)}
.toast .er::after{transform:rotate(-45deg)}
@keyframes tin{0%{transform:translate3d(0,-200%,0) scale(.6);opacity:.5}100%{transform:translate3d(0,0,0) scale(1);opacity:1}}

/* Today | After change switch (standalone only) */
.mode-sw{position:fixed;left:134px;bottom:13px;z-index:60;display:inline-flex;border:1px solid #d1d5db;border-radius:999px;padding:2px;background:#fff;box-shadow:0 4px 6px -1px rgb(0 0 0/.1)}
.mode-sw button{font-size:12px;line-height:18px;font-weight:600;padding:4px 12px;border-radius:999px;color:#6b7280}
.mode-sw button[aria-pressed="true"]{background:#1e1c1c;color:#fff}
.in-shell .mode-sw{display:none}
</style>

      cur.beads.forEach(function (x) { x.correctCaliperPercentage = cv; }); return edited(false);
    }
  });
  emc.addEventListener('keydown', function (e) {
    var f = e.target.getAttribute && e.target.getAttribute('data-f');
    if ((f === 'odc-c0' || f === 'odc-c1') && ['e', 'E', '+', '-', '.'].indexOf(e.key) >= 0) e.preventDefault();
    if ((f === 'amin' || f === 'amax') && ['e', 'E', '+'].indexOf(e.key) >= 0) e.preventDefault();
  });
  emc.addEventListener('change', function (e) {
    var t = e.target, f = t.getAttribute('data-f');
    if (f === 'combine') { cur.combine = t.checked; edited(false); }
    if (f === 'cr-match') { cur.match = t.value === '1'; edited(true); }
    if (f === 'cr-mt') { cur.matchType = Number(t.value); edited(false); }
  });
  emc.addEventListener('click', function (e) {
    var a = e.target.closest('[data-act]');
    if (!a || a.disabled) return;
    var act = a.getAttribute('data-act'), b = cur && cur.beads ? activeBead() : null;
    if (act === 'godeploy') { e.preventDefault(); nav('edge-deploy'); return; }
    if (act === 'banner-x') { bead.banner = false; render(); return; }
    if (act === 'eye') { bead.showWidth = !bead.showWidth; refreshBead(); return; }
    if (act === 'boxes') { bead.showBoxes = !bead.showBoxes; refreshBead(); return; }
    if (act === 'fit') return fit(false);
    if (act === 'one') return fit(true);
    if (act === 'zin') return zoom(1.2);
    if (act === 'zout') return zoom(1 / 1.2);
    if (act === 'dismiss') { bead.replaced = false; refreshBead(); return; }
    if (act === 'replace') { openModal('replace'); return; }
    if (act === 'edit') {
      bead.editing = true; bead.pts = clone(b.dots); bead.snap = { pts: clone(b.dots) }; bead.undo = [];
      if (b.gtOperator == null || !Array.isArray(b.gtWidth) || empty(b.gtWidth[0])) { bead.snap.auto = { gtOperator: b.gtOperator, gtWidth: b.gtWidth, channelWidth: b.channelWidth }; b.gtOperator = 0; b.gtWidth = ['50']; b.channelWidth = 50; }
      return render();
    }
    if (act === 'undo') { if (bead.undo.length) bead.pts = bead.undo.pop(); return refreshBead(); }
    if (act === 'clear') { if (!bead.pts.length) return; pushUndo(); bead.pts = []; toast('Bead cleared. Click on the image to draw the path from the start.'); return refreshBead(); }
    if (act === 'cancel') {
      if (bead.snap && bead.snap.auto) { b.gtOperator = bead.snap.auto.gtOperator; b.gtWidth = bead.snap.auto.gtWidth; b.channelWidth = bead.snap.auto.channelWidth; }
      bead.editing = false; bead.pts = null; bead.snap = null; bead.undo = []; return edited(true);
    }
    if (act === 'finish') {
      if (!bead.pts.length) { toast('Draw at least one point before finishing, or press Cancel to leave the path unchanged.', true); return; }
      b.dots = bead.pts; bead.editing = false; bead.pts = null; bead.snap = null; bead.undo = [];
      toast('Path editing finished. Recalculate crop boxes before saving.');
      return edited(true);
    }
    if (act === 'recalc') {
      bead.calc = true; bead.status = 'recalc'; refreshBead();
      setTimeout(function () {
        cur.beads.forEach(function (x) { x.boxes = calcBoxes(x.dots, x.boxSize || 512); });
        bead.lastSig = sig(cur.beads); bead.status = 'ok'; bead.calc = false;
        toast('Crop boxes recalculated successfully.');
        edited(true);
      }, 400);
    }
  });

  // ---------- Save / Reset ----------
  document.getElementById('btnReset').addEventListener('click', function () {
    if (!init) return;
    cur = clone(init);
    var keep = bead && bead.banner; bead = freshBeadUi(); bead.banner = !!keep;
    saveHeldOff = false; render(); toast('Reset done');
  });
  // index.jsx:171-191 asks /instance/container-mapping first; Line 2 Assembly is deployed on this Edge, so the confirmation always opens.
  document.getElementById('btnSave').addEventListener('click', function () { openModal('deploy'); });
  function doSave() {
    init = clone(cur);
    if (store() === 'beadInspection') { bead.lastSig = sig(cur.beads); bead.banner = true; }
    render();
    toast('Changes saved');
    toast('Module Configuration updated and deployment reloaded.');
    setTimeout(function () { nav(modelsParam === 'some' ? 'edge-test-some' : 'edge-deploy'); }, 1200);
  }

  // ---------- Modals ----------
  var modals = document.getElementById('modals');
  function openModal(kind) {
    tipHide(); closeList();
    var h = '';
    if (kind === 'deploy') {
      h = '<div class="ov" data-close="1"><div class="mdl third" role="dialog" aria-modal="true">' +
        '<div class="mh bb"><h3>Confirmation Message</h3><div class="x" data-m="cancel">' + I_CLOSE + '</div></div>' +
        '<div class="mb bb"><p>There is an inferencing deployment running currently.</p><p class="mt2">Do you want to proceed to save these changes &amp; reload the configurations in the running deployment?</p></div>' +
        '<div class="mf sp"><button type="button" class="pill-b" data-m="cancel">Cancel</button><button type="button" class="pill-p" data-m="confirm">Confirm</button></div></div></div>';
    } else if (kind === 'unsaved') {
      h = '<div class="ov"><div class="mdl md" role="dialog" aria-modal="true"><div class="mh"><h3 style="color:#1f2937">Unsaved Changes</h3><div class="x" data-m="keep">' + I_CLOSE + '</div></div>' +
        '<div style="padding:24px"><p style="font-size:14px;line-height:20px;color:#374151">You have unsaved changes. Would you like to keep editing, or discard them?</p></div>' +
        '<div class="mf"><button type="button" class="btn btn-border px6" data-m="discard">Discard</button><button type="button" class="btn btn-pri px6" data-m="keep">Keep Editing</button></div></div></div>';
    } else if (kind === 'rm') {
      h = '<div class="ov"><div class="mdl md" role="dialog" aria-modal="true"><div class="mh"><h3 style="color:#1f2937">Change Reading Mode</h3><div class="x" data-m="close">' + I_CLOSE + '</div></div>' +
        '<div style="padding:24px;font-size:14px;line-height:20px;color:#374151">Upon saving, GT Text data will be lost. Are you sure you want to change the Reading Mode?</div>' +
        '<div class="mf"><button type="button" class="btn btn-border px6" data-m="close">Cancel</button><button type="button" class="btn btn-pri px6" data-m="toread">Change to Read</button></div></div></div>';
    } else if (kind === 'replace') {
      h = '<div class="ov" style="background:rgb(0 0 0/.5);z-index:50"><div class="mdl lg" role="dialog" aria-modal="true"><h3 style="font-size:16px;font-weight:700;color:#111827;margin-bottom:8px">Replace bead image</h3>' +
        '<p style="font-size:12px;line-height:1.625;color:#4b5563;margin-bottom:16px">This is the reference image the bead paths and crop boxes are drawn on. The new image must be <span style="font-weight:700;color:#111827">' + IMG.w + ' × ' + IMG.h + ' px</span>, the same size as the current one. Bead paths and crop boxes stay exactly where they are.</p>' +
        '<div style="border:1px dashed #d1d5db;border-radius:8px;padding:16px;background:#f9fafb;display:flex;flex-direction:column;align-items:center;gap:12px"><input type="file" id="repFile" accept="image/png,image/jpeg,image/bmp" style="display:block;width:100%;font-size:12px;color:#6b7280">' +
        '<div id="repMsg" style="font-size:12px;text-align:center"></div></div>' +
        '<div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:24px"><button type="button" data-m="close" style="padding:6px 16px;font-size:12px;font-weight:500;color:#374151;background:#fff;border:1px solid #d1d5db;border-radius:6px">Cancel</button>' +
        '<button type="button" id="repUse" data-m="use" disabled style="padding:6px 16px;font-size:12px;font-weight:600;color:#fff;background:#e8542b;border-radius:6px;opacity:.4">Use this image</button></div></div></div>';
    }
    modals.innerHTML = h; modals.setAttribute('data-kind', kind);
  }
  function closeModal() { modals.innerHTML = ''; modals.removeAttribute('data-kind'); }
  var repUrl = null;
  modals.addEventListener('change', function (e) {
    if (e.target.id !== 'repFile') return;
    var file = e.target.files && e.target.files[0], msg = document.getElementById('repMsg'), use = document.getElementById('repUse');
    if (!file) return;
    repUrl = null; use.disabled = true; use.style.opacity = '.4'; msg.textContent = '';
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      if (img.naturalWidth !== IMG.w || img.naturalHeight !== IMG.h) {
        msg.style.color = '#dc2626'; msg.style.fontWeight = '500';
        msg.textContent = 'This image is ' + img.naturalWidth + ' × ' + img.naturalHeight + ' px. It must be ' + IMG.w + ' × ' + IMG.h + ' px to match the current bead image.';
      } else {
        repUrl = url; use.disabled = false; use.style.opacity = '1';
        msg.style.color = '#059669'; msg.style.fontWeight = '600'; msg.textContent = '✓ ' + file.name + ' (' + IMG.w + ' × ' + IMG.h + ' px)';
      }
    };
    img.onerror = function () { msg.style.color = '#dc2626'; msg.textContent = 'Could not read that file. Please select a valid PNG or JPEG image.'; };
    img.src = url;
  });
  modals.addEventListener('mousedown', function (e) {
    // modules/modal useClickOutSide: a press outside the deployment dialog closes it like Cancel.
    if (modals.getAttribute('data-kind') === 'deploy' && e.target.classList.contains('ov')) { closeModal(); saveHeldOff = true; syncFooter(); }
  });
  modals.addEventListener('click', function (e) {
    var b = e.target.closest('[data-m]'); if (!b || b.disabled) return;
    var m = b.getAttribute('data-m');
    if (m === 'cancel') { closeModal(); saveHeldOff = true; syncFooter(); }
    else if (m === 'confirm') { closeModal(); doSave(); }
    else if (m === 'keep') { closeModal(); pending = null; }
    else if (m === 'discard') { closeModal(); var p = pending; pending = null; if (p) apply(p); }
    else if (m === 'close') closeModal();
    else if (m === 'toread') { closeModal(); cur.readingMode = 0; edited(true); }
    else if (m === 'use') {
      closeModal(); bead.img = repUrl; bead.replaced = true;
      init.__img = (init.__img || 0); cur.__img = (cur.__img || 0) + 1; // the editor marks the module changed (BeadInspectionConfigEditor.jsx:390-394)
      refreshBead(); toast('Bead reference image replaced');
    }
  });

  // ---------- Toasts (react-hot-toast, top-center) ----------
  var toaster = document.getElementById('toaster');
  function toast(msg, err) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = '<div class="' + (err ? 'er' : 'ok') + '"></div><div class="msg" role="status">' + esc(msg) + '</div>';
    toaster.insertBefore(el, toaster.firstChild);
    setTimeout(function () { el.remove(); }, err ? 4000 : 2000);
  }

  // ---------- Tooltip (shared/components/Tooltip.jsx): grey bubble, 150 ms delay, flips when there is no room ----------
  var tipEl = null, tipFor = null, tipTimer = null, tipPinned = false;
  function tipShow(w) {
    tipHide(true);
    tipFor = w;
    tipEl = document.createElement('div'); tipEl.className = 'tt'; tipEl.setAttribute('role', 'tooltip'); tipEl.style.visibility = 'hidden';
    tipEl.textContent = w.getAttribute('data-tt');
    document.body.appendChild(tipEl);
    var t = w.getBoundingClientRect(), b = tipEl.getBoundingClientRect(), wantBottom = w.getAttribute('data-tt-pos') === 'bottom';
    var bottom = wantBottom ? !(t.bottom + 8 + b.height > window.innerHeight - 8) : (t.top - 8 - b.height < 8);
    var left = Math.min(Math.max(t.left + t.width / 2 - b.width / 2, 8), Math.max(window.innerWidth - 8 - b.width, 8));
    tipEl.style.left = left + 'px'; tipEl.style.top = (bottom ? t.bottom + 8 : t.top - 8 - b.height) + 'px'; tipEl.style.visibility = 'visible';
  }
  function tipHide(keepPin) {
    clearTimeout(tipTimer);
    if (!keepPin) tipPinned = false;
    if (tipEl) { tipEl.remove(); tipEl = null; }
    tipFor = null;
  }
  document.addEventListener('mouseover', function (e) {
    var w = e.target.closest && e.target.closest('[data-tt]');
    if (!w || (e.relatedTarget && w.contains(e.relatedTarget)) || tipFor === w) return;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(function () { if (document.contains(w)) tipShow(w); }, 150);
  });
  document.addEventListener('mouseout', function (e) {
    var w = e.target.closest && e.target.closest('[data-tt]');
    if (!w || (e.relatedTarget && w.contains(e.relatedTarget)) || tipPinned) return;
    tipHide();
  });
  document.addEventListener('focusin', function (e) { var w = e.target.closest && e.target.closest('[data-tt]'); if (w && e.target.matches(':focus-visible')) tipShow(w); });
  document.addEventListener('focusout', function () { if (!tipPinned) tipHide(); });
  document.addEventListener('mousedown', function () { tipHide(); }, true);
  document.addEventListener('scroll', function () { if (!tipPinned) tipHide(); }, true);

  // ---------- Today | After change ----------
  document.querySelectorAll('#modeSw button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === mode)); });
  document.getElementById('modeSw').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]'); if (!b || b.getAttribute('data-mode') === mode) return;
    var q = new URLSearchParams(location.search); q.set('mode', b.getAttribute('data-mode')); q.set('state', stateFor());
    q.delete('open');
    location.search = q.toString();
  });
  function stateFor() { for (var k in STATES) if (STATES[k][1] === sel.mod) return k; return stateKey; }

  // ---------- Shared state sync ----------
  window.addEventListener('storage', function (e) {
    if (e.key !== KEY) return;
    var before = !!shared.modelsUploaded;
    shared = readShared();
    if (before !== !!shared.modelsUploaded && !hasChanges()) loadModule();
    render();
  });

  loadModule();
  render();
  var scrollParam = Number(params.get('scroll') || 0);
  if (scrollParam) document.querySelector('.main').scrollTop = scrollParam; // the layout's main column is the scroller (overflow-x-auto)
  if (openParam === 'tip') {
    var first = document.querySelector('.lockw');
    if (first) { tipShow(first); tipPinned = true; }
  }
})();
</script>
</body>
</html>
