<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRINKS.AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<style>
/* Tailwind preflight (subset) */
*,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
html{line-height:1.5;-webkit-text-size-adjust:100%;tab-size:4}
body{margin:0;line-height:inherit}
h1,h2,h3,h4,h5,h6,p{font-size:inherit;font-weight:inherit;margin:0}
a{color:inherit;text-decoration:inherit}
button,input,select,textarea{font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;color:inherit;margin:0;padding:0}
button{-webkit-appearance:button;background-color:transparent;background-image:none;cursor:pointer;text-transform:none}
button:disabled{cursor:default}
img,svg,canvas{display:block;vertical-align:middle}
img{max-width:100%;height:auto}
ul{list-style:none;margin:0;padding:0}
table{border-collapse:collapse;text-indent:0;border-color:inherit}
input::placeholder,textarea::placeholder{color:#9ca3af;opacity:1}
[hidden]{display:none!important}

/* src/index.css */
html,body{font-size:16px;height:100vh;width:100vw;overflow-y:hidden;color:black}
body{overflow:auto}
:root{font-family:'Outfit',sans-serif;font-optical-sizing:auto;line-height:1.5;font-weight:400;font-style:normal;font-size:16px;min-height:100vh;height:fit-content;scroll-behavior:smooth;color-scheme:light;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
input[type='time']{border:2px solid black;border-radius:5px;padding:3px;margin-left:0!important;font-size:medium}

/* shared/layouts/main/sidebar.jsx */
.sb{position:fixed;left:0;top:0;z-index:100;display:flex;height:100vh;width:114px;flex-direction:column;align-items:center;border-right:1px solid #d1d5db;background:#1e1c1c;padding:24px 8px;overflow:hidden;white-space:nowrap;box-shadow:0 4px 6px -1px rgb(0 0 0 / .1),0 2px 4px -2px rgb(0 0 0 / .1)}
.sb.anim{transition:width .3s,padding .3s}
.sb.open{width:350px;padding:24px 20px}
.sb-logo{margin-top:12px;margin-bottom:40px;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:all .3s}
.sb.open .sb-logo{margin-left:-12px}
.sb-logo svg{width:60px;height:60px;transition:all .3s cubic-bezier(.4,0,.2,1)}
.sb.open .sb-logo svg{width:265px}
.sb-nav{margin-top:32px;display:flex;width:100%;flex:1 1 0%;flex-direction:column;gap:8px}
.sb-item{display:flex;align-items:center;gap:0;border-radius:6px;padding:8px 36px;color:#fff;overflow:hidden;transition-duration:.3s}
.sb-item:hover{background:rgb(255 255 255 / .2)}
.sb-ico{display:flex;width:24px;flex-shrink:0;align-items:center;justify-content:center}
.sb-t{font-size:18px;line-height:28px;width:0;opacity:0;transition:all .3s}
.sb.open .sb-t{width:auto;margin-left:16px;opacity:1}
.sb-bottom{display:flex;width:100%;flex-direction:column;gap:8px}
.sb-tog{display:flex;width:100%;align-items:center;justify-content:center;border-radius:6px;padding:8px 0;color:#fff;transition:opacity .15s}
.sb-tog:hover{opacity:.75}
.sb-tog .ex{display:none;margin-left:auto}
.sb.open .sb-tog .co{display:none}
.sb.open .sb-tog .ex{display:block}

/* shared/layouts/main/index.jsx */
.main{position:relative;height:100%;min-height:100vh;overflow-x:auto;background:#fff;margin-left:114px;width:calc(100% - 114px)}
.main.anim{transition:margin-left .3s,width .3s}
.main.wide{margin-left:350px;width:calc(100% - 350px)}

/* analytics/index.jsx: header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;background:#fff}
.heading{margin-top:4px;display:flex;height:60px;align-items:baseline;gap:8px;background:#fff;padding:16px 20px}
.heading .h{font-size:30px;line-height:36px;font-weight:500}
.top-r{margin-right:20px;margin-top:8px;display:flex;align-items:center;gap:12px}
.tabs{display:flex;height:36px;align-items:center;border-radius:8px;background:#f3f4f6;padding:4px}
.tab{height:36px;border-radius:6px;border:1px solid transparent;padding:0 16px;font-size:14px;line-height:20px;font-weight:600;background:transparent;color:#6b7280}
.tab:hover{color:#1f2937}
.tab.on{background:#ff4301;color:#fff}
.tab.mw{margin-left:4px;display:flex;align-items:center;gap:4px}
.tab .inf{display:flex;height:16px;width:16px;align-items:center;justify-content:center;color:#6b7280}
.tab.on .inf{color:#fff}
.srch{position:relative;display:flex;align-items:center}
.srch>svg{position:absolute;left:12px;color:#9ca3af}
.srch input{height:36px;width:256px;border-radius:8px;border:1px solid #e5e7eb;padding:0 40px;font-size:14px;line-height:20px;transition:all .15s}
.srch input:focus{border-color:#ff4301;outline:none;box-shadow:0 0 0 1px #ff4301}
.srch .clr{position:absolute;right:12px;cursor:pointer;color:#9ca3af}
.srch .clr:hover{color:#4b5563}

/* shared/components/Tooltip.jsx */
.tt{position:relative;display:inline-block}
.tt-b{position:absolute;z-index:50;padding:4px 8px;font-size:12px;line-height:16px;font-weight:400;color:#4b5563;background:#f3f4f6;border:1px solid #d1d5db;border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none;width:max-content;max-width:200px;white-space:normal;overflow-wrap:break-word;left:50%;transform:translateX(-50%)}
.tt-b.t{bottom:100%;margin-bottom:8px}
.tt-b.b{top:100%;margin-top:8px}
.tt:hover>.tt-b{opacity:1}

/* analytics/index.jsx: body */
.content{display:flex;height:calc(100vh - 64px);min-height:0;min-width:0;flex:1 1 0%;flex-direction:column;background:#fff}
.tb{position:relative;border-bottom:1px solid #e5e7eb;padding:16px 20px 12px}
.tb-row{display:flex;align-items:flex-start;gap:12px}
.tb-left{display:flex;flex:1 1 0%;flex-wrap:wrap;align-items:center;gap:12px}
.tb-right{display:flex;flex-shrink:0;align-items:flex-start;gap:8px}
.rel{position:relative}
.chip{display:flex;height:38px;align-items:center;gap:6px;white-space:nowrap;border-radius:8px;background:#fff;padding:0 12px;font-size:13px;font-weight:500;color:#374151;transition:background-color .15s}
.chip:hover{background:#f3f4f6}
.chip svg{color:#6b7280;transition:transform .15s;flex-shrink:0}
.chip.open svg{transform:rotate(180deg)}
.fbtn{display:flex;height:38px;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap;border-radius:8px;background:#fff;padding:0 12px;font-size:13px;font-weight:500;color:#374151;transition:background-color .15s;width:auto;max-width:131px}
.fbtn:hover{background:#f9fafb}
.fbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn svg,.mbtn svg{flex-shrink:0;color:#6b7280;transition:transform .15s}
.fbtn.open svg,.mbtn.open svg{transform:rotate(180deg)}
.fbtn:disabled,.mbtn:disabled{cursor:not-allowed;opacity:.6}
.mbtn{position:relative;display:flex;height:38px;align-items:center;justify-content:space-between;gap:8px;border-radius:8px;background:#fff;padding:8px 12px;font-size:13px;font-weight:500;color:#374151;transition:background-color .15s}
.mbtn:hover:not(:disabled){background:#f9fafb}
.mbtn span.l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{position:absolute;top:-4px;right:-4px;display:flex;height:16px;width:16px;align-items:center;justify-content:center;border-radius:999px;background:#ff4301;font-size:10px;line-height:1;color:#fff;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}
.menu{position:absolute;left:0;top:100%;z-index:50;margin-top:4px;max-height:240px;overflow-y:auto;border-radius:8px;border:1px solid #e5e7eb;background:#fff;box-shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1)}
.opt{display:flex;cursor:pointer;align-items:center;gap:10px;padding:8px 12px;color:#374151;transition:background-color .15s}
.opt:hover{background:#f9fafb}
.opt span{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rad,.chk{display:flex;height:14px;width:14px;flex-shrink:0;align-items:center;justify-content:center;border:1px solid #d1d5db;background:#fff}
.rad{border-radius:999px}
.chk{border-radius:2px}
.on>.rad,.on>.chk{border-color:#111827}
.on>.rad::after{content:"";height:8px;width:8px;border-radius:999px;background:#111827}
.on>.chk::after{content:"";height:8px;width:8px;border-radius:1px;background:#111827}
.ib{display:flex;align-items:center;justify-content:center;height:32px;width:38px;padding:0;border-radius:6px;border:1px solid transparent;background:#ff4301;color:#fff;font-size:14px;font-weight:600;position:relative}
.ib:hover:not(:disabled){background:rgb(255 67 1 / .9)}
.ib:disabled{background:#d1d5db;color:#6b7280;cursor:not-allowed}
.dd{position:absolute;right:0;top:100%;margin-top:4px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;box-shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1)}
.dd-h{padding:0 16px 8px;font-size:12px;line-height:16px;font-weight:600;text-transform:uppercase;letter-spacing:.025em;color:#6b7280}
.dd-r{display:flex;cursor:pointer;align-items:center;gap:10px;padding:8px 16px;color:#374151}
.dd-r:hover{background:#f9fafb}
.dd-r span.l{font-size:14px;line-height:20px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-r.lk{cursor:not-allowed;color:#9ca3af}
.dd-r.lk:hover{background:transparent}
.dd-r.lk .chk{opacity:.5}
.btn-b{flex:1 1 0%;border-radius:8px;border:1px solid #ff4301;color:#ff4301;background:transparent;font-size:12px;line-height:16px;padding:4px 8px}
.btn-b:hover{opacity:.7}
.btn-p{flex:1 1 0%;border-radius:8px;border:1px solid transparent;color:#fff;background:#ff4301;font-size:12px;line-height:16px;padding:4px 8px}
.btn-p:hover{background:rgb(255 67 1 / .9)}
.ovl{position:fixed;inset:0;z-index:20}

/* TimeRangeDropdown (react-datepicker, frinks-dp overrides) */
.trp{position:absolute;left:0;top:100%;margin-top:4px;width:380px;z-index:40;overflow:hidden;border-radius:8px;border:1px solid #e5e7eb;background:#fff;box-shadow:0 20px 25px -5px rgb(0 0 0 / .1),0 8px 10px -6px rgb(0 0 0 / .1)}
.trp-tabs{display:flex;border-bottom:1px solid #f3f4f6}
.trp-tabs button{flex:1 1 0%;padding:10px 12px;font-size:12px;line-height:16px;font-weight:600;background:#f9fafb;color:#4b5563;transition:background-color .15s}
.trp-tabs button:hover{background:#f3f4f6}
.trp-tabs button.on{background:#ff4301;color:#fff}
.dp{width:100%;padding:8px}
.dp-h{position:relative;background:#fff;border-bottom:1px solid #f0f0f0;padding:12px 0 8px;text-align:center}
.dp-m{font-size:15px;font-weight:600;color:#111;margin-bottom:8px}
.dp-nav{position:absolute;top:14px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.dp-nav.p{left:2px}.dp-nav.n{right:2px}
.dp-nav i{display:block;width:9px;height:9px;border-style:solid;border-color:#9ca3af;border-width:2px 2px 0 0}
.dp-nav.p i{transform:rotate(225deg)}.dp-nav.n i{transform:rotate(45deg)}
.dp-dn{display:flex;justify-content:space-around;padding:0 4px}
.dp-dn div{color:#9ca3af;font-size:12px;font-weight:500;width:calc(100% / 7);line-height:36px;text-align:center}
.dp-mo{padding:0 4px 4px}
.dp-w{display:flex;justify-content:flex-start}
.dp-d{width:calc(100% / 7);line-height:39px;height:39px;border-radius:50%;font-size:13px;color:#374151;display:inline-flex;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:all .2s ease}
.dp-d:hover:not(.rs):not(.re):not(.sg):not(.dis){background-image:radial-gradient(circle,#fff3ee 17px,transparent 18px);color:#e85d04}
.dp-d.td{font-weight:800;text-decoration:underline}
.dp-d.dis{color:#d1d5db;cursor:not-allowed}
.dp-d.ir{background-image:linear-gradient(#fff3ee,#fff3ee);background-size:100% 34px;background-repeat:no-repeat;background-position:center;color:#e85d04;border-radius:0}
.dp-d.rs{background-image:radial-gradient(circle,#e85d04 17px,transparent 18px),linear-gradient(to right,transparent 50%,#fff3ee 50%);background-size:100% 100%,100% 34px;background-position:center,center;background-repeat:no-repeat,no-repeat;color:#fff;border-radius:0;font-weight:600}
.dp-d.re{background-image:radial-gradient(circle,#e85d04 17px,transparent 18px),linear-gradient(to left,transparent 50%,#fff3ee 50%);background-size:100% 100%,100% 34px;background-position:center,center;background-repeat:no-repeat,no-repeat;color:#fff;border-radius:0;font-weight:600}
.dp-d.rs.re,.dp-d.sg{background:radial-gradient(circle,#e85d04 17px,transparent 18px) center no-repeat;border-radius:50%;color:#fff;font-weight:600}
.trp-t{display:flex;align-items:center;gap:8px;border-top:1px solid #f3f4f6;padding:12px 16px}
.trp-t span{width:48px;font-size:12px;line-height:16px;font-weight:500;color:#6b7280}
.trp-t input{flex:1 1 0%;border-radius:6px;border:1px solid #e5e7eb!important;background:#f9fafb;padding:6px 12px;font-size:14px;line-height:20px}
.trp-t input:focus{border-color:#ff4301!important;background:#fff;outline:none;box-shadow:0 0 0 1px #ff4301}

/* summary bar */
.sum{display:flex;border-bottom:1px solid #e5e7eb;background:#fff}
.sc{display:flex;flex-grow:1;align-items:center;border-right:1px solid #e5e7eb;padding:10px 20px;font-size:14px;line-height:20px}
.sc:last-child{border-right:0}
.sc .k{font-weight:500}
.sc .v{margin-left:auto;font-weight:600}
.sc.t .k{color:#4b5563}
.sc.p{background:#f0fdf4}.sc.p .k,.sc.p .v{color:#15803d}
.sc.f{background:#fef2f2}.sc.f .k,.sc.f .v{color:#dc2626}
.sc.d{background:#fff7ed}.sc.d .k,.sc.d .v{color:#ea580c}
.sc.r{background:#eff6ff}.sc.r .k{color:#2563eb}

/* ResultTable.jsx + shared/ui/Table.jsx */
.ta{position:relative;display:flex;min-height:0;min-width:0;flex:1 1 0%;overflow:hidden}
.ta-in{margin-top:12px;display:flex;min-width:0;flex:1 1 0%;flex-direction:column}
.ta-pad{display:flex;min-height:0;min-width:0;flex:1 1 0%;flex-direction:column;overflow:hidden;padding:0 20px 20px}
.rt{display:flex;flex-direction:column;flex:1 1 0%;min-height:0;min-width:0;height:100%}
.rt-sc{overflow:auto;flex:1 1 0%;min-height:0;min-width:0}
.tw{display:flow-root;width:100%;max-height:100%}
table.tbl{width:100%;min-width:100%;max-height:100%}
table.tbl>tbody{border-top:1px solid #d1d5db;background:#fff}
table.tbl>tbody>tr+tr{border-top:1px solid #e5e7eb}
table.tbl thead{position:sticky;top:0;z-index:11}
table.tbl th{position:sticky;top:0;z-index:11;padding:16px 8px;text-align:center;font-size:16px;line-height:24px;font-weight:500;color:#fff;background:#ff4301}
table.tbl th .rh{position:absolute;top:10px;right:0;bottom:10px;width:2px;cursor:col-resize;border-radius:16px;background:#fff}
table.tbl th:last-child .rh{display:none}
table.tbl td{padding:8px;color:#000;overflow:visible}
table.tbl td>div{display:flex;height:100%;width:100%;align-items:center;justify-content:center;text-align:center}
table.tbl td.empty{background:#fff;padding:8px 0;text-align:center;font-size:16px;line-height:24px;color:#4b5563}
.res{font-weight:600;font-size:14px;line-height:20px}
.res.ps{color:#16a34a}
.res.fl{color:#ef4444}
.res.ni{color:#6b7280}
.ni-t{color:#6b7280}
.lnk{display:flex;align-items:center;gap:6px;color:#3b82f6;font-weight:500;transition:color .15s}
.lnk:hover{color:#3730a3}
.jsn{cursor:pointer;color:#3b82f6;font-weight:500}
.jsn:hover{color:#3730a3}
.mk{border-radius:6px;border:1px solid transparent;background:#ff4301;color:#fff;font-size:14px;line-height:20px;font-weight:600;padding:4px 12px}
.mk:hover{background:rgb(255 67 1 / .9)}
.pg{display:flex;align-items:center;justify-content:flex-end;gap:16px;border-top:1px solid #e5e7eb;padding:8px 16px}
.pg span{font-size:14px;line-height:20px;color:#6b7280}
.pg button{border-radius:4px;padding:4px}
.pg button:hover{background:#f3f4f6}
.pg button:disabled{opacity:.3}
.pg button:disabled:hover{background:transparent}

/* ImageViewer.jsx */
.iv{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgb(0 0 0 / .9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.iv-in{position:relative;display:flex;height:100%;width:100%;flex-direction:column;padding:24px}
.iv-hd{margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.iv-ti{display:flex;flex-direction:column;gap:4px}
.iv-ti h3{font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.025em}
.iv-sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;line-height:20px;font-weight:500;color:#d1d5db}
.iv-sub .n{color:#6b7280}
.iv-rb{border-radius:4px;padding:2px 8px;font-size:14px;line-height:20px;font-weight:600}
.iv-rb.ps{background:rgb(34 197 94 / .2);color:#4ade80}
.iv-rb.fl{background:rgb(239 68 68 / .2);color:#f87171}
.iv-ctl{display:flex;align-items:center;gap:8px}
.iv-zm{display:flex;align-items:center;gap:4px;border-radius:999px;background:rgb(255 255 255 / .1);padding:4px}
.iv-zb{border-radius:999px;padding:8px;transition:background-color .15s}
.iv-zb:hover{background:rgb(255 255 255 / .15)}
.iv-zb:disabled{cursor:not-allowed;opacity:.3}
.iv-zb:disabled:hover{background:transparent}
.iv-rs{display:flex;min-width:72px;align-items:center;justify-content:center;gap:4px;border-radius:999px;padding:6px 8px;font-size:14px;line-height:20px;font-weight:600;transition:background-color .15s}
.iv-rs:hover{background:rgb(255 255 255 / .15)}
.iv-x{border-radius:999px;background:rgb(255 255 255 / .1);padding:10px;color:#fff;transition:all .15s}
.iv-x:hover{transform:scale(1.1);background:rgb(255 255 255 / .2)}
.iv-x:active{transform:scale(.95)}
.iv-vp{position:relative;display:flex;flex:1 1 0%;min-height:0;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;background:rgb(0 0 0 / .4)}
.iv-nv{position:absolute;z-index:10;border-radius:999px;background:rgb(0 0 0 / .6);padding:16px;color:#fff;box-shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:all .15s}
.iv-nv:hover{background:#fff;color:#000}
.iv-nv:active{transform:scale(.9)}
.iv-nv.p{left:24px}.iv-nv.n{right:24px}
.iv-st{position:relative;display:flex;height:100%;width:100%;align-items:center;justify-content:center;padding:16px;cursor:default}
.iv-st.pan{cursor:grab}.iv-st.drag{cursor:grabbing}
.iv-st img{max-height:100%;max-width:100%;-webkit-user-select:none;user-select:none;object-fit:contain;box-shadow:0 0 50px rgba(0,0,0,.5);transition:transform .2s ease-out}
.iv-st.drag img{transition:none}
.iv-th{margin-top:32px;display:flex;justify-content:center;gap:12px;overflow-x:auto;padding:0 16px 8px}
.iv-th>div{display:flex;gap:12px}
.iv-tb{position:relative;height:80px;width:128px;flex-shrink:0;overflow:hidden;border-radius:8px;border:2px solid rgb(255 255 255 / .1);opacity:.4;transition:all .2s}
.iv-tb:hover{transform:scale(1.05);opacity:1;border-color:rgb(255 255 255 / .3)}
.iv-tb.on{border-color:#ff4301;box-shadow:0 0 0 4px rgb(255 67 1 / .3);opacity:1}
.iv-tb.on:hover{border-color:#ff4301}
.iv-tb img{height:100%;width:100%;object-fit:cover}
.iv-tb .ov{position:absolute;inset:0;background:rgb(255 67 1 / .1)}
.iv-tb .tr{position:absolute;bottom:4px;left:4px;border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;line-height:1;color:#fff}
.iv-tb .tr.ps{background:rgb(22 163 74 / .9)}
.iv-tb .tr.fl{background:rgb(220 38 38 / .9)}

/* modules/modal + CommentModal */
.mdl{position:fixed;left:0;top:0;z-index:99999;height:100vh;width:100vw;background:rgb(107 114 128 / .75)}
.mdl-c{position:relative;top:50%;margin:0 auto;transform:translateY(-50%);border-radius:8px;background:#fff;box-shadow:0 20px 25px -5px rgb(0 0 0 / .1),0 8px 10px -6px rgb(0 0 0 / .1);width:100%;max-width:512px}
.mdl-h{display:flex;align-items:center;justify-content:space-between;padding:16px 24px}
.mdl-h h3{font-weight:600;color:#1f2937}
.mdl-b{padding:0 24px}
.mdl-b textarea{width:100%;height:128px;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;line-height:20px;resize:vertical}
.mdl-b textarea:focus{outline:none;box-shadow:0 0 0 1px #ff4301}
.mdl-f{display:flex;justify-content:flex-end;gap:12px;padding:16px 24px}
.mdl-f button{font-size:14px;line-height:20px;font-weight:600;padding:8px 24px;border-radius:6px;border:1px solid transparent}
.mdl-f .c{border-color:#ff4301;color:#ff4301}
.mdl-f .c:hover{opacity:.7}
.mdl-f .o{background:#ff4301;color:#fff}

/* react-hot-toast */
.toasts{position:fixed;top:16px;left:16px;right:16px;z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:#fff;color:#363636;line-height:1.3;padding:8px 10px;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.1),0 3px 3px rgba(0,0,0,.05);max-width:350px;font-size:16px}
.toast i{display:flex;width:20px;height:20px;border-radius:10px;background:#61d345;align-items:center;justify-content:center;flex-shrink:0}

/* prototype mode switch */
html.in-shell .pctl{display:none!important}
.pctl{position:fixed;right:16px;bottom:16px;z-index:100000;display:inline-flex;border:1px solid #d1d5db;border-radius:999px;padding:2px;background:#fff;box-shadow:0 2px 8px rgb(0 0 0 / .12)}
.pctl button{font-size:12px;font-weight:600;padding:3px 12px;border-radius:999px;color:#6b7280;line-height:18px}
.pctl button[aria-pressed="true"]{background:#1e1c1c;color:#fff}
</style>

  /* ---------- synthetic camera images ---------- */

    rr(ctx, -372, -214, 744, 72, 12); ctx.fill();
    ctx.strokeStyle = g(88 * L); ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(-364, -210, 728, 4);

    ctx.translate(IW / 2 + p.dx, IH / 2 + p.dy);

    ctx.save(); ctx.filter = 'blur(16px)'; ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.beginPath(); ctx.arc(10, 14, 330, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    // flange disk
    ctx.fillStyle = rad(ctx, 0, 0, 20, 330, [[0, g(176 * L)], [0.7, g(140 * L)], [1, g(96 * L)]], -90, -90);
    ctx.beginPath(); ctx.arc(0, 0, 320, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 8; ctx.strokeStyle = g(196 * L); ctx.beginPath(); ctx.arc(0, 0, 314, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeStyle = g(80 * L); ctx.beginPath(); ctx.arc(0, 0, 320, 0, Math.PI * 2); ctx.stroke();
    // turning marks
    for (var r = 140; r < 305; r += 5) { ctx.strokeStyle = 'rgba(255,255,255,' + (0.025 + (r % 15 === 0 ? 0.03 : 0)) + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke(); }
    // holes
    for (var i = 0; i < HOLES; i++) {
      var a = i * Math.PI * 2 / HOLES, hx = HOLE_R * Math.cos(a), hy = HOLE_R * Math.sin(a);
      if (blockedHole && i === 2) {
        ctx.fillStyle = rad(ctx, hx, hy, 2, 26, [[0, g(150 * L)], [1, g(118 * L)]], hx - 6, hy - 6);
        ctx.beginPath(); ctx.arc(hx, hy, 26, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(hx, hy, 12, 0, Math.PI * 2); ctx.stroke();
        continue;
      }
      ctx.fillStyle = g(205 * L); ctx.beginPath(); ctx.arc(hx, hy, 31, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = rad(ctx, hx, hy, 4, 26, [[0, g(10)], [0.8, g(22)], [1, g(52)]]);
      ctx.beginPath(); ctx.arc(hx, hy, 26, 0, Math.PI * 2); ctx.fill();
    }
    // dowel pin
    ctx.fillStyle = rad(ctx, 160 * Math.cos(0.52), 160 * Math.sin(0.52), 1, 14, [[0, g(235 * L)], [1, g(120 * L)]]);
    ctx.beginPath(); ctx.arc(160 * Math.cos(0.52), 160 * Math.sin(0.52), 12, 0, Math.PI * 2); ctx.fill();
    // boss
    ctx.fillStyle = rad(ctx, 0, 0, 10, 128, [[0, g(196 * L)], [1, g(132 * L)]], -40, -40);
    ctx.beginPath(); ctx.arc(0, 0, 126, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = g(96 * L); ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = g(220 * L); ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, 0, 80, 0, Math.PI * 2); ctx.stroke();
    // bore + keyway
    ctx.fillStyle = g(14); ctx.beginPath(); ctx.arc(0, 0, 66, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(-14, -82, 28, 24);
    ctx.strokeStyle = g(60); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 66, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  function finish(ctx, p) {
    ctx.fillStyle = rad(ctx, IW * 0.35, IH * 0.3, 10, 700, [[0, 'rgba(255,255,255,.07)'], [1, 'rgba(255,255,255,0)']]);
    ctx.fillRect(0, 0, IW, IH);
    ctx.fillStyle = rad(ctx, IW / 2, IH / 2, IH * 0.42, IW * 0.78, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.55)']]);
    ctx.fillRect(0, 0, IW, IH);
    var id = ctx.getImageData(0, 0, IW, IH), d = id.data, r = rng(p.seed), n;
    for (var i = 0; i < d.length; i += 4) { n = (r() - 0.5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    ctx.putImageData(id, 0, 0);
  }
  var rawCache = {}, rawCanvas = {};
  function rawCanvasFor(cycle, capKey) {
    var k = cycle.id + '-' + capKey;
    if (rawCanvas[k]) return rawCanvas[k];
    var c = document.createElement('canvas'); c.width = IW; c.height = IH;
    var ctx = c.getContext('2d'), p = pose(cycle.id, capKey);
    if (capKey === 'front') drawFront(ctx, p, cycle.fail === 'sa-bolt'); else drawTop(ctx, p, cycle.fail === 'sa-hole');
    finish(ctx, p);
    rawCanvas[k] = c;
    return c;
  }
  function rawUrl(cycle, capKey) {
    var k = cycle.id + '-' + capKey;
    if (!rawCache[k]) rawCache[k] = rawCanvasFor(cycle, capKey).toDataURL('image/jpeg', 0.9);
    return rawCache[k];
  }
  // Analysed search-area image: the search area cut from the capture, with its detections boxed.
  var saCache = {};
  function saUrl(img) {
    var cycle = img.cycle, k = cycle.id + '-' + img.sId;
    if (saCache[k]) return saCache[k];
    var src = rawCanvasFor(cycle, img.capKey), p = pose(cycle.id, img.capKey);
    var region, boxes = [];
    var ox = IW / 2 + p.dx, oy = IH / 2 + p.dy;
    if (img.sId === 'sa-bolt') {
      oy -= 30; region = { x: ox - 400, y: oy - 250, w: 800, h: 150 };
      BOLTS.forEach(function (b, bi) { boxes.push({ x: b[0] - 36, y: b[1] - 36, w: 72, h: 72, ok: !(cycle.fail === 'sa-bolt' && bi === 1) }); });
    } else if (img.sId === 'sa-conn') {
      oy -= 30; region = { x: ox + 120, y: oy - 130, w: 230, h: 250 };
      boxes.push({ x: CONN.x - 6, y: CONN.y - 6, w: CONN.w + 12, h: CONN.h + 12, ok: true });
    } else {
      region = { x: ox - 340, y: oy - 340, w: 680, h: 680 };
      for (var i = 0; i < HOLES; i++) {
        var a = i * Math.PI * 2 / HOLES;
        boxes.push({ x: HOLE_R * Math.cos(a) - 36, y: HOLE_R * Math.sin(a) - 36, w: 72, h: 72, ok: !(cycle.fail === 'sa-hole' && i === 2) });
      }
    }
    var sc = Math.min(960 / region.w, 720 / region.h);
    var c = document.createElement('canvas'); c.width = Math.round(region.w * sc); c.height = Math.round(region.h * sc);
    var ctx = c.getContext('2d');
    ctx.drawImage(src, region.x, region.y, region.w, region.h, 0, 0, c.width, c.height);
    ctx.save();
    ctx.scale(sc, sc); ctx.translate(-region.x, -region.y); ctx.translate(ox, oy); ctx.rotate(p.rot);
    boxes.forEach(function (b) { ctx.strokeStyle = b.ok ? '#22c55e' : '#ef4444'; ctx.lineWidth = 4 / sc; ctx.strokeRect(b.x, b.y, b.w, b.h); });
    ctx.restore();
    saCache[k] = c.toDataURL('image/jpeg', 0.9);
    return saCache[k];
  }
  function imageSrc(img) { return img.kind === 'raw' ? rawUrl(img.cycle, img.capKey) : saUrl(img); }

  /* ---------- ImageViewer ---------- */
  var MIN_ZOOM = 0.5, MAX_ZOOM = 5, ZOOM_STEP = 0.25, PAN_OVERHEAD = 48;
  var V = null;
  function openViewer(images, index) {
    if (!images || !images.length) return;
    V = { images: images, index: index || 0, zoom: 1, x: 0, y: 0, dragging: false };
    renderViewer(true);
  }
  function closeViewer() { V = null; $('viewerRoot').innerHTML = ''; }
  function clampPos(x, y, z) {
    if (z <= 1) return { x: 0, y: 0 };
    var vp = document.querySelector('.iv-vp'), im = document.querySelector('.iv-st img');
    if (!vp || !im) return { x: x, y: y };
    var r = vp.getBoundingClientRect(), bw = im.offsetWidth, bh = im.offsetHeight;
    if (!bw || !bh) return { x: x, y: y };
    var mx = Math.max(0, bw * z - r.width) / 2 + PAN_OVERHEAD, my = Math.max(0, bh * z - r.height) / 2 + PAN_OVERHEAD;
    return { x: Math.min(mx, Math.max(-mx, x)), y: Math.min(my, Math.max(-my, y)) };
  }
  function setZoom(z) {
    V.zoom = z;
    if (z <= 1) { V.x = 0; V.y = 0; } else { var c = clampPos(V.x, V.y, z); V.x = c.x; V.y = c.y; }
    renderViewer(false);
  }
  function setIndex(i) { V.index = i; V.zoom = 1; V.x = 0; V.y = 0; renderViewer(true); }
  function renderViewer(full) {
    if (!V) return;
    var cur = V.images[V.index], url = imageSrc(cur), many = V.images.length > 1;
    var hasRes = typeof cur.result === 'boolean';
    if (full) {
      var h = '<div class="iv"><div class="iv-in">' +
        '<div class="iv-hd"><div class="iv-ti"><h3>' + esc(cur.captureName || 'Unknown') + '</h3><div class="iv-sub"><span>' + esc(cur.name || 'Image') + '</span>' +
        (hasRes ? '<span class="iv-rb ' + (cur.result ? 'ps' : 'fl') + '">' + (cur.result ? 'Pass' : 'Fail') + '</span>' : '') +
        '<span class="n">· Image ' + (V.index + 1) + ' of ' + V.images.length + '</span></div></div>' +
        '<div class="iv-ctl"><div class="iv-zm"><button type="button" class="iv-zb" data-iv="out" title="Zoom out (-)">' + fe(P.zoomOut, 20) + '</button>' +
        '<button type="button" class="iv-rs" data-iv="reset" title="Reset zoom (0)">' + fe(P.rotCcw, 16) + '<span id="ivPct">100%</span></button>' +
        '<button type="button" class="iv-zb" data-iv="in" title="Zoom in (+)">' + fe(P.zoomIn, 20) + '</button></div>' +
        '<button type="button" class="iv-x" data-iv="close" title="Close (Esc)">' + fe(P.x, 28) + '</button></div></div>' +
        '<div class="iv-vp" id="ivVp">' +
        (many ? '<button type="button" class="iv-nv p" data-iv="prev" title="Previous (Left Arrow)">' + fe(P.chevL, 36) + '</button><button type="button" class="iv-nv n" data-iv="next" title="Next (Right Arrow)">' + fe(P.chevR, 36) + '</button>' : '') +
        '<div class="iv-st" id="ivSt"><img src="' + url + '" alt="' + esc(cur.captureName || cur.name) + '" draggable="false"></div></div>' +
        (many ? '<div class="iv-th"><div>' + V.images.map(function (im, i) {
          var r = typeof im.result === 'boolean';
          return '<button type="button" class="iv-tb' + (i === V.index ? ' on' : '') + '" data-ivi="' + i + '" title="' + esc((im.name || 'Image') + (r ? ' — ' + (im.result ? 'Pass' : 'Fail') : '')) + '">' +
            '<img src="' + imageSrc(im) + '" alt="' + esc(im.name) + '" loading="lazy">' +
            (r ? '<span class="tr ' + (im.result ? 'ps' : 'fl') + '">' + (im.result ? 'Pass' : 'Fail') + '</span>' : '') +
            (i === V.index ? '<div class="ov"></div>' : '') + '</button>';
        }).join('') + '</div></div>' : '') +
        '</div></div>';
      $('viewerRoot').innerHTML = h;
    }
    var img = document.querySelector('.iv-st img'), stg = $('ivSt');
    if (img) img.style.transform = 'translate(' + V.x + 'px, ' + V.y + 'px) scale(' + V.zoom + ')';
    if (stg) stg.className = 'iv-st' + (V.zoom > 1 ? (V.dragging ? ' pan drag' : ' pan') : '');
    var pct = $('ivPct'); if (pct) pct.textContent = Math.round(V.zoom * 100) + '%';
    var bo = document.querySelector('[data-iv="out"]'), bi = document.querySelector('[data-iv="in"]');
    if (bo) bo.disabled = V.zoom <= MIN_ZOOM;
    if (bi) bi.disabled = V.zoom >= MAX_ZOOM;
  }
  $('viewerRoot').addEventListener('click', function (e) {
    if (!V) return;
    var b = e.target.closest('[data-iv],[data-ivi]'); if (!b) return;
    var a = b.getAttribute('data-iv');
    if (b.hasAttribute('data-ivi')) { setIndex(+b.getAttribute('data-ivi')); return; }
    if (a === 'close') closeViewer();
    else if (a === 'in') setZoom(Math.min(MAX_ZOOM, V.zoom + ZOOM_STEP));
    else if (a === 'out') setZoom(Math.max(MIN_ZOOM, V.zoom - ZOOM_STEP));
    else if (a === 'reset') setZoom(1);
    else if (a === 'prev') setIndex(V.index > 0 ? V.index - 1 : V.images.length - 1);
    else if (a === 'next') setIndex(V.index < V.images.length - 1 ? V.index + 1 : 0);
  });
  $('viewerRoot').addEventListener('wheel', function (e) {
    if (!V || !e.target.closest('#ivVp')) return;
    e.preventDefault();
    if (e.deltaY < 0) setZoom(Math.min(MAX_ZOOM, V.zoom + ZOOM_STEP)); else setZoom(Math.max(MIN_ZOOM, V.zoom - ZOOM_STEP));
  }, { passive: false });
  var drag = null;
  $('viewerRoot').addEventListener('mousedown', function (e) {
    if (!V || V.zoom <= 1 || e.button !== 0 || !e.target.closest('#ivSt')) return;
    e.preventDefault();
    drag = { x: e.clientX, y: e.clientY, ox: V.x, oy: V.y }; V.dragging = true; renderViewer(false);
  });
  window.addEventListener('mousemove', function (e) {
    if (!drag || !V) return;
    var c = clampPos(drag.ox + (e.clientX - drag.x), drag.oy + (e.clientY - drag.y), V.zoom); V.x = c.x; V.y = c.y; renderViewer(false);
  });
  window.addEventListener('mouseup', function () { if (drag && V) { V.dragging = false; renderViewer(false); } drag = null; });

  /* ---------- toast + comment modal ---------- */
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast';
    t.innerHTML = '<i><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></i><div>' + esc(msg) + '</div>';
    $('toasts').appendChild(t);
    setTimeout(function () { t.remove(); }, 2400);
  }
  function openComment(row) {
    $('modalRoot').innerHTML = '<div class="mdl"><div class="mdl-c" data-keep="1"><div class="mdl-h"><h3>Add Comment</h3><div style="cursor:pointer" data-mdl="close">' +
      '<svg width="25" height="25" viewBox="0 0 32 32" fill="none"><path d="M24 8L8 24M8 8L24 24" stroke="#0E0F0F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>' +
      '<div class="mdl-b"><textarea id="cmtText" placeholder="Enter your comment here...">' + esc(row.comment || '') + '</textarea></div>' +
      '<div class="mdl-f"><button type="button" class="c" data-mdl="close">Cancel</button><button type="button" class="o" data-mdl="ok">Confirm</button></div></div></div>';
    $('modalRoot').onclick = function (e) {
      var b = e.target.closest('[data-mdl]');
      if (!e.target.closest('.mdl-c') || (b && b.getAttribute('data-mdl') === 'close')) { $('modalRoot').innerHTML = ''; return; }
      if (b && b.getAttribute('data-mdl') === 'ok') { row.comment = $('cmtText').value.trim(); $('modalRoot').innerHTML = ''; toast('Comment added successfully'); render(); }
    };
  }

  /* ---------- events ---------- */
  $('tabs').addEventListener('click', function (e) {
    if (e.target.closest('[data-stop]')) { e.stopPropagation(); return; }
    var b = e.target.closest('[data-tab]'); if (!b) return;
    st.tab = b.getAttribute('data-tab'); st.open = ''; render();
    try {
      var p = new URLSearchParams(location.search);
      if (st.tab === 'minute') p.set('view', 'minute'); else p.delete('view');
      var qs = p.toString();
      history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
    } catch (err) { /* view stays in page state only */ }
  });
  $('search').addEventListener('input', function () { st.search = this.value; $('searchClr').hidden = !this.value; render(); });
  $('searchClr').addEventListener('click', function () { st.search = ''; $('search').value = ''; this.hidden = true; render(); });

  $('toolbar').addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-day]'))) {
      var d = new Date(+t.getAttribute('data-day'));
      if (st.trTab === 'start') { d.setHours(st.startDate ? st.startDate.getHours() : 0, st.startDate ? st.startDate.getMinutes() : 0, 0, 0); st.startDate = d; st.endDate = null; st.trTab = 'end'; }
      else { d.setHours(23, 59, 59, 999); st.endDate = d; st.open = ''; }
      render(); return;
    }
    if ((t = e.target.closest('[data-cal]'))) { st.calMonth = new Date(st.calMonth.getFullYear(), st.calMonth.getMonth() + (+t.getAttribute('data-cal')), 1); render(); return; }
    if ((t = e.target.closest('[data-trtab]'))) { st.trTab = t.getAttribute('data-trtab'); render(); return; }
    if ((t = e.target.closest('[data-inst]'))) { st.instanceId = st.instanceId ? '' : 'inst-1'; st.variantId = st.instanceId ? [] : []; st.className = []; st.enabledFilters = {}; render(); return; }
    if ((t = e.target.closest('[data-multi]'))) {
      var id = t.getAttribute('data-multi'), v = t.getAttribute('data-val');
      var arr = id === 'variant' ? st.variantId : id === 'outcome' ? st.outcome : st.className;
      var next = arr.indexOf(v) >= 0 ? arr.filter(function (x) { return x !== v; }) : arr.concat([v]);
      if (id === 'variant') { st.variantId = next; st.className = []; } else if (id === 'outcome') st.outcome = next; else st.className = next;
      render(); return;
    }
    if ((t = e.target.closest('[data-col]'))) { e.preventDefault(); toggleCol(t.getAttribute('data-col')); render(); return; }
    if ((t = e.target.closest('[data-flt]'))) {
      e.preventDefault();
      if (st.enabledFilters.className) { delete st.enabledFilters.className; st.className = []; } else st.enabledFilters.className = true;
      render(); return;
    }
    if ((t = e.target.closest('[data-act]'))) {
      if (t.disabled) return;
      var a = t.getAttribute('data-act');
      if (a === 'colReset') { if (st.tab === 'minute') st.minuteCols = DEFAULT_MINUTE_KEYS.slice(); else st.cycleCols = DEFAULT_COLUMN_KEYS.slice(); render(); return; }
      if (a === 'colDone') { st.open = ''; render(); return; }
      if (a === 'refresh' || a === 'download') return;
      if (a === 'time') {
        if (st.open !== 'time') { st.open = 'time'; st.trTab = 'start'; st.calMonth = new Date((st.startDate || TODAY).getFullYear(), (st.startDate || TODAY).getMonth(), 1); }
        else if (st.startDate && st.endDate) st.open = '';
        render(); return;
      }
      st.open = st.open === a ? '' : a;
      render();
    }
  });
  $('toolbar').addEventListener('change', function (e) {
    if (e.target.id !== 'trTime' || !e.target.value) return;
    var hm = e.target.value.split(':').map(Number);
    var sel = st.trTab === 'start' ? st.startDate : st.endDate;
    var base = sel ? new Date(sel) : new Date(st.trTab === 'start' ? TODAY : (st.startDate || TODAY));
    base.setHours(hm[0], hm[1], 0, 0);
    if (st.trTab === 'start') { if (st.endDate && base >= st.endDate) st.endDate = new Date(base.getTime() + 60000); st.startDate = base; }
    else { st.endDate = st.startDate && base <= st.startDate ? new Date(st.startDate.getTime() + 60000) : base; }
    render();
  });
  // close dropdowns on outside mousedown (Filter/MultiSelectFilter/TimeRange behaviour)
  document.addEventListener('mousedown', function (e) {
    if (!st.open) return;
    if (e.target.closest('[data-keep]') || e.target.closest('[data-act="' + st.open + '"]')) return;
    if (st.open === 'time') { if (!st.startDate || !st.endDate) return; }
    if (st.open === 'edit' || st.open === 'filter') return; // closed by the overlay
    st.open = ''; render();
  });
  $('ovl').addEventListener('click', function () { st.open = ''; render(); });

  $('tableArea').addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-view]'))) {
      var row = viewRows[+t.getAttribute('data-row')];
      openViewer(t.getAttribute('data-view') === 'raw' ? rawImagesFor(row) : resultImagesFor(row), 0);
      return;
    }
    if ((t = e.target.closest('[data-rj]'))) {
      var r = viewRows[+t.getAttribute('data-rj')], orig = ALL_ROWS.filter(function (x) { return x.id === r.id; })[0];
      orig.user_feedback = 'BYPASS'; toast('Reverse Judgement triggered'); render(); return;
    }
    if ((t = e.target.closest('[data-cmt]'))) {
      var rc = viewRows[+t.getAttribute('data-cmt')];
      openComment(ALL_ROWS.filter(function (x) { return x.id === rc.id; })[0]); return;
    }
  });

  window.addEventListener('keydown', function (e) {
    if (!V) return;
    if (e.key === 'ArrowLeft') setIndex(V.index > 0 ? V.index - 1 : V.images.length - 1);
    else if (e.key === 'ArrowRight') setIndex(V.index < V.images.length - 1 ? V.index + 1 : 0);
    else if (e.key === 'Escape') closeViewer();
    else if (e.key === '+' || e.key === '=') setZoom(Math.min(MAX_ZOOM, V.zoom + ZOOM_STEP));
    else if (e.key === '-') setZoom(Math.max(MIN_ZOOM, V.zoom - ZOOM_STEP));
    else if (e.key === '0') setZoom(1);
  });

  // sidebar (collapsed by default; opens on the toggle, closes on a click in the page)
  function setSidebar(open) {
    sidebarOpen = open;
    $('sb').classList.add('anim'); $('main').classList.add('anim');
    $('sb').classList.toggle('open', open); $('main').classList.toggle('wide', open);
    setTimeout(function () { $('sb').classList.remove('anim'); $('main').classList.remove('anim'); render(); }, 320);
  }
  $('sbTog').addEventListener('click', function () { setSidebar(!sidebarOpen); });
  $('sbItem').addEventListener('click', function () { if (!sidebarOpen) setSidebar(true); });
  $('sbLogo').addEventListener('click', function (e) { e.preventDefault(); });
  $('main').addEventListener('click', function () { if (sidebarOpen) setSidebar(false); });

  /* ---------- mode switch + shared state ---------- */
  $('pctl').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]'); if (!b || b.getAttribute('data-mode') === mode) return;
    var p = new URLSearchParams(location.search); p.set('mode', b.getAttribute('data-mode')); p.delete('open');
    location.search = p.toString();
  });
  window.addEventListener('storage', function (e) { if (e.key === KEY || e.key === null) { instanceName = readName(); render(); } });
  window.addEventListener('resize', render);

  /* ---------- initial ---------- */
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  if (openParam === 'raw' && AFTER && st.tab === 'cycle') {
    var firstNi = -1;
    viewRows.some(function (r, i) { if (r.notInspected) { firstNi = i; return true; } return false; });
    if (firstNi >= 0) openViewer(rawImagesFor(viewRows[firstNi]), 0);
  }
})();
