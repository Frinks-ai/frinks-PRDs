<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision Model Selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=block" rel="stylesheet">
<style>
/* ---- Tailwind v3 preflight (subset) + src/index.css ---- */
*,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
html{line-height:1.5;-webkit-text-size-adjust:100%;tab-size:4}
html,body{font-size:16px;height:100vh;width:100vw;overflow-y:hidden;color:black}
:root{font-family:'Outfit',sans-serif;font-optical-sizing:auto;line-height:1.5;font-weight:400;font-style:normal;min-height:100vh;height:fit-content;color-scheme:light;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;line-height:inherit;overflow:hidden;background:#fff}
h1,h3,p{margin:0}
h1,h3{font-size:inherit;font-weight:inherit}
a{color:inherit;text-decoration:inherit}
ul{list-style:none;margin:0;padding:0}
button,input{font-family:inherit;font-feature-settings:inherit;font-variation-settings:inherit;font-size:100%;font-weight:inherit;line-height:inherit;letter-spacing:inherit;color:inherit;margin:0;padding:0;text-transform:none}
button{-webkit-appearance:button;background-color:transparent;background-image:none}
input::placeholder{opacity:1;color:#9ca3af}
table{text-indent:0;border-color:inherit;border-collapse:collapse}
svg{display:block;vertical-align:middle}
sup{font-size:75%;line-height:0;position:relative;vertical-align:baseline;top:-.5em}
[hidden]{display:none !important}

/* ---- Project sidebar (shared/layouts/project/sidebar.tsx:150, z-index 9999) ---- */
.psb{position:fixed;left:0;top:0;display:flex;height:100vh;width:80px;flex-direction:column;align-items:center;border-right:1px solid #d1d5db;background:#1e1c1c;padding:24px 8px;box-shadow:0 4px 6px -1px rgb(0 0 0 / .1),0 2px 4px -2px rgb(0 0 0 / .1);z-index:9999}
.psb-logo{margin-bottom:40px;margin-top:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.psb ul{margin-top:32px;display:flex;width:100%;flex-direction:column;gap:8px}
.psb li{position:relative}
.psb-link{display:flex;width:100%;align-items:center;justify-content:center;border-radius:6px;padding:8px 0;overflow:hidden;color:#fff}
.psb-link.active{background:rgb(255 255 255 / .2)}
.psb-bottom{display:flex;width:100%;flex-grow:1;flex-direction:column;justify-content:flex-end;gap:8px}

/* ---- Instances page (modules/project/instances/index.tsx) ---- */
.page{margin-left:80px;height:100%;min-height:100vh;position:relative;z-index:0}
.heading{display:flex;align-items:center;justify-content:space-between;margin-top:4px;gap:8px;height:60px;padding:16px 20px;background:#fff}
.heading-l{display:flex;align-items:baseline;gap:8px}
.heading-sub{display:flex;align-items:baseline;font-size:20px;line-height:28px;font-weight:500;gap:8px}
.bc{display:flex;align-items:center;font-size:14px;line-height:20px;color:#6b7280;margin-bottom:16px;padding:8px 4px}
.bc > * + *{margin-left:8px}
.bc-home{display:flex;align-items:center;padding:4px 8px;border-radius:6px;color:#6b7280}
.bc-chev{color:#9ca3af;flex-shrink:0}
.bc-link{padding:4px 8px;font-weight:500;color:#4b5563;border-radius:6px;display:inline-flex;align-items:center;max-width:200px}
.bc-cur{padding:4px 8px;font-weight:600;color:#111827;border-radius:6px;display:inline-flex;align-items:center;max-width:200px}
.bc-lbl{display:inline-flex;align-items:center;gap:6px;min-width:0}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.create-row{display:flex;align-items:center;justify-content:flex-end;padding:24px 20px 14px}
.list-wrap{padding:0 20px 20px}

/* ---- shared/ui/Table.tsx ---- */
.tbl{display:flow-root;width:100%;overflow-x:auto}
.tbl-in{width:max-content;min-width:100%}
.tbl table{min-width:100%}
.tbl table > :not([hidden]) ~ :not([hidden]){border-top:1px solid #d1d5db}
.tbl thead{position:sticky;top:0;z-index:10}
.tbl thead tr{background:#ff4301;position:relative}
.tbl th{position:sticky;top:0;z-index:10;padding:16px 8px;text-align:center;font-size:16px;line-height:24px;font-weight:500;color:#fff}
.th-in{display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.th-rs{position:absolute;top:10px;right:0;bottom:10px;width:2px;cursor:col-resize;border-radius:16px;background:#fff}
.tbl th:last-child .th-rs{display:none}
.tbl tbody{background:#fff}
.tbl tbody > tr:not([hidden]) ~ tr:not([hidden]){border-top:1px solid #e5e7eb}
.tbl td{padding:8px;color:#000;overflow:visible}
.tbl td.empty{font-style:italic;color:#6b7280}
.td-in{display:flex;height:100%;width:100%;align-items:center;justify-content:center;text-align:center}
.req{color:#ef4444}

/* index.tsx:571-603 — instance name, draft markers */
.inst-link{font-weight:500;color:#ff4301;text-decoration:underline}
.inst-draft{font-weight:500;color:#000}
.inst-draft sup{font-size:14px;line-height:20px;color:#FF1212}
.red{color:#FF1212}
.dl-cell{position:relative;display:flex;justify-content:center;align-items:center}
.dl-trig{cursor:pointer;display:flex}
.tt-trig{position:relative;display:inline-flex;align-items:center}
/* index.tsx:633-690 — Download dropdown */
.dl-menu{position:absolute;z-index:100;margin-top:4px;width:240px;min-width:max-content;right:0;top:100%;border-radius:6px;border:1px solid #e5e7eb;background:#fff;padding:4px 0;box-shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1)}
.dl-menu button{display:block;width:100%;padding:8px 16px;text-align:left;font-size:14px;line-height:20px;cursor:pointer;white-space:nowrap}
.dl-menu button:hover{background:#f3f4f6}
/* Status pill — same classes as annotation/recommender/RunRecommenderModal.tsx:31-37,165 */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:9999px;padding:2px 8px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.pill.draft{background:#fee2e2;color:#991b1b}
.pill.remaining{background:#fef3c7;color:#92400e}
.pill.completed{background:#dcfce7;color:#166534}
/* shared/ui/CircularProgress.tsx */
.cprog{position:relative;display:inline-block;width:calc(1.4vw * 2);height:calc(1.4vw * 2);cursor:pointer}
.cprog svg{width:100%;height:100%;transform:rotate(180deg)}
.cprog span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.63vw;font-weight:600;color:#000}

/* ---- modules/team-user/Action.tsx + shared/ui/PortalDropdown.tsx ---- */
.actn{display:flex;width:100%;justify-content:center}
.act-trig{position:relative;display:flex;width:fit-content;justify-content:flex-end;border-radius:6px;padding:4px 2px;cursor:pointer}
.act-trig:hover{background:#f3f4f6}
.act-menu{position:absolute;z-index:9999;display:flex;flex-direction:column;border-radius:6px;background:#fff;filter:drop-shadow(0 25px 25px rgb(0 0 0 / .15));overflow:hidden;border:1px solid #e5e7eb;color:#4b5563;width:fit-content;min-width:96px;transform:translateX(-100%);list-style:none;margin:0;padding:0}
.act-menu li{display:flex;cursor:pointer;align-items:center;gap:8px;white-space:nowrap;padding:8px;font-size:12px;line-height:16px}
.act-menu li:hover{background:#f3f4f6}
.act-menu li.del{color:#ef4444}

/* ---- info icon (shared/components/InfoTooltip.tsx, lucide Info) ---- */
.info-ico{position:relative;display:inline-flex;align-items:center;pointer-events:auto}
.info-ico > span{display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;border-radius:9999px;color:#6b7280}
.info-ico.white > span{color:#fff}

/* ---- shared/ui/Button.tsx ---- */
.btn{font-weight:600;height:fit-content;cursor:pointer;border:1px solid transparent;font-size:14px;line-height:20px;padding:8px 24px;border-radius:6px;background:#ff4301;color:#fff;white-space:nowrap}
.btn:hover{background:rgb(255 67 1 / .9)}
.btn.border{background:transparent;border-color:#ff4301;color:#ff4301}
.btn.border:hover{opacity:.7}
.btn.sm{font-size:12px;line-height:16px;padding:4px 8px;border-radius:2px;font-weight:400}
.btn.flat:hover{background:#ff4301;opacity:.7}
.btn:disabled{cursor:not-allowed;border-color:transparent;background:#d1d5db;color:#6b7280;opacity:1}
.btn-tt{display:inline-flex;align-items:center}

/* ---- shared/ui/Drawer.tsx ---- */
.backdrop{position:fixed;left:0;top:0;z-index:9;display:flex;height:100%;width:100%;background:rgb(180 182 184 / .5)}
.drawer{position:fixed;top:0;right:0;z-index:10;height:100%;width:100%;max-width:1280px;background:#fff}
.dr-head{display:flex;font-size:18px;line-height:28px;justify-content:space-between;border:1px solid #e5e7eb;padding:12px 16px 8px;font-weight:600;height:50px}
.dr-title{display:flex;align-items:center;gap:6px}
.dr-close{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.dr-body{overflow-y:auto;padding:8px 12px;height:calc(100vh - 130px)}
.dr-foot{display:flex;justify-content:flex-end;border-top:1px solid #e5e7eb;padding:8px 12px 0;height:80px}
.foot-grid{display:grid;width:100%}
.foot-cell{grid-column-start:5;grid-column-end:span 8;display:flex;align-items:center;justify-content:space-between;gap:16px}
.foot-l{display:flex;align-items:center;gap:8px}

/* ---- CreateInstanceDrawer.tsx:147-168 ---- */
.cid{display:grid;height:100%;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.cid-left{grid-column:span 3/span 3;border-right:1px solid #d1d5db;padding:24px}
.cid-right{grid-column:span 9/span 9;height:100%;overflow-y:auto;padding:24px}
.cid-right.ms{overflow:hidden;padding:0}

/* ---- ai-training-new/components/timeline.tsx ---- */
.tl{position:relative;display:flex;flex-direction:column;gap:80px}
.tl-track{position:absolute;left:10px;top:0;height:100%;width:2px;background:#e5e7eb}
.tl-fill{width:100%;background:#ff4301;transition-duration:75ms}
.tl-row{z-index:20;display:flex;align-items:center;gap:16px;background:#fff;padding:16px 0}
.tl-dot{display:flex;height:24px;width:24px;flex-shrink:0;align-items:center;justify-content:center;border-radius:9999px;text-align:center;font-weight:700;color:#fff;background:#fff;border:1px solid #e5e7eb}
.tl-dot.on{background:#ff4301;border-width:0}
.tl-lbl{display:inline-flex;align-items:center;gap:4px}

/* ---- step headings (steps/*.tsx) ---- */
.st-h1{font-size:24px;line-height:32px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.st-p{margin:16px 0}
.st-p.fm{font-weight:500}

/* ---- steps/BasicInformation.tsx form + shared/ui/Label, Input, SelectInput ---- */
.form{display:flex;flex-direction:column;gap:16px}
.lbl{display:inline-block;color:#000;user-select:none;cursor:pointer;margin-bottom:4px;font-size:14px;line-height:20px;font-weight:600}
.lbl-in{display:inline-flex;align-items:center;gap:4px}
.inp-wrap{position:relative}
.inp{border-radius:6px;border:1px solid #e5e7eb;width:100%;outline-width:1px;font-size:14px;line-height:20px;font-weight:400;padding:8px 12px}
.inp:focus{border-color:#ff4301;outline:2px solid #ff4301;outline-offset:0}
.si{position:relative;width:100%}
.si-btn{position:relative;width:100%;min-width:95px;cursor:default;border-radius:6px;background:#fff;padding:8px 40px 8px 12px;text-align:left;border:1px solid #d1d5db;font-size:14px;line-height:20px;color:#111827}
.si-btn:focus{outline:none;border-color:#ff4301;box-shadow:0 0 0 1px #ff4301}
.si-val{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si-val.ph{color:#6b7280}
.si-arrow{pointer-events:none;position:absolute;top:0;bottom:0;right:0;display:flex;align-items:center;padding-right:8px}
.si-list{position:fixed;z-index:99999;max-height:240px;overflow:auto;border-radius:6px;background:#fff;padding:4px 0;font-size:14px;line-height:20px;box-shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1),0 0 0 1px rgb(0 0 0 / .05);margin-top:4px}
.si-list li{position:relative;cursor:default;user-select:none;padding:8px 16px 8px 40px;color:#111827}
.si-list li.act{background:#ff4301;color:#fff}
.si-list li .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si-list li.sel .nm{font-weight:600}
.si-list li .tk{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;padding-left:12px}
.si-list li.act .tk path{fill:#fff}

/* ---- steps/MapCameraIp.tsx / CameraConfig.tsx tables ---- */
.shadow-tbl{margin-top:16px;box-shadow:0 4px 6px -1px rgb(0 0 0 / .1),0 2px 4px -2px rgb(0 0 0 / .1);border-radius:8px;position:relative}
.shadow-tbl.ov{overflow:auto}
.cb{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid #D9D9D9;border-radius:6px;box-shadow:0 1px 3px 0 #7A7E80,0 1px 2px -1px #7A7E80;background:#fff;cursor:pointer}
.cb.on{background:#ff4301}

/* ---- steps/ModelSelection.tsx + steps/Finish.tsx ---- */
.ms-root{display:flex;height:100%;flex-direction:column}
.ms-head{flex-shrink:0;z-index:10;background:#fff;padding:16px;box-shadow:0 4px 6px -1px rgb(0 0 0 / .1),0 2px 4px -2px rgb(0 0 0 / .1)}
.ms-body{flex:1 1 0%;overflow-y:auto;padding:32px 16px}
.ms-group{margin-bottom:40px}
.vch{display:flex;align-items:center;font-size:18px;line-height:28px;font-weight:700;margin-bottom:8px}
.vch-in{color:#111827;border-left:4px solid #ef4444;padding-left:8px;display:flex;align-items:center}
.vch .mr1{margin-right:4px}
.vch .sep{font-weight:400;color:#000;margin:0 4px}
.ms-rule{border-top:1px solid #e5e7eb;width:100%;margin-bottom:24px}
.ms-mod{margin-bottom:32px;padding-left:16px}
.ms-mod-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.ms-cap{font-size:10px;line-height:15px;color:#9ca3af;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:4px}
.ms-name{display:flex;align-items:center;color:#111827;font-weight:700;font-size:18px;line-height:28px;cursor:pointer;user-select:none}
.ms-name svg{width:20px;height:20px;transition:transform .15s}
.ms-name.open svg{transform:rotate(180deg)}
.ms-cls{display:flex;gap:8px;flex-wrap:wrap;max-width:24rem;justify-content:flex-end}
.chip{position:relative;display:inline-flex;align-items:center;border-radius:6px;padding:2px 8px;white-space:nowrap;font-size:14px;line-height:20px;font-weight:500}
.ms-task{padding-left:24px}
.ms-task.mb{margin-bottom:24px}
.ms-task-h{display:flex;align-items:center;color:#7e22ce;font-weight:700;font-size:14px;line-height:20px;margin-bottom:4px}
.ms-task-h .dot{width:8px;height:8px;border-radius:9999px;background:#7e22ce;margin-right:8px}
.ms-task-p{font-size:12px;line-height:16px;color:#6b7280;font-style:italic;margin-bottom:12px}
.radio{width:24px;height:24px;border-radius:9999px;display:flex;align-items:center;justify-content:center;border:1px solid #e5e7eb;cursor:pointer;filter:drop-shadow(0 1px 2px rgb(0 0 0 / .1)) drop-shadow(0 1px 1px rgb(0 0 0 / .06));color:#fff}
.radio:hover{filter:drop-shadow(0 20px 13px rgb(0 0 0 / .03)) drop-shadow(0 8px 5px rgb(0 0 0 / .08))}
.radio.on{background:#ff4301;border-color:#ff4301}
.radio i{width:8px;height:8px;border-radius:9999px;background:#fff;transform:scale(0);transition:transform .2s ease-in-out}
.radio.on i{transform:scale(1)}
.fin-line{margin:8px 0;font-weight:400}
.fin-line b{font-weight:700}

/* ---- shared/ui/Modal.tsx ---- */
.mo-ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgb(0 0 0 / .5)}
.mo{position:relative;width:100%;max-width:28rem;border-radius:8px;background:#fff;box-shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1);outline:none}
.mo.wide{width:max-content;min-width:min(100%, 28rem);max-width:90vw}
.mo-h{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding:20px}
.mo-h h3{font-weight:600;display:flex;align-items:center;gap:6px}
.mo-x{cursor:pointer}
.mo-b{overflow:auto;padding:20px}
.mo-f{border-top:1px solid #e5e7eb;padding:20px}
.mo-f-row{display:flex;justify-content:flex-end}
.mo-f-row > * + *{margin-left:12px}
.sp2 > * + *{margin-top:8px}
.sp3 > * + *{margin-top:12px}
.sbv-p{font-size:14px;line-height:20px;color:#6b7280}
.ck-row{display:flex;align-items:center}
.ck-row > * + *{margin-left:12px}
.ck-row input{width:16px;height:16px;cursor:pointer;flex-shrink:0;margin:0}
.ck-row label{cursor:pointer;font-size:14px;line-height:20px;display:inline-flex;align-items:center;gap:4px}
.mdl-h{font-size:14px;line-height:20px;font-weight:500;color:#374151}
.mdl-list{padding-left:16px;padding-right:8px;height:120px;overflow-y:auto}
.pkg-v{font-size:14px;line-height:20px;color:#111827}

/* ---- shared/components/Tooltip.tsx bubble ---- */
.tip{position:fixed;pointer-events:none;width:max-content;max-width:300px;overflow-wrap:break-word;white-space:normal;border-radius:4px;border:1px solid #d1d5db;background:#f3f4f6;padding:4px 8px;font-size:12px;line-height:16px;color:#4b5563;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05);z-index:100001}

/* ---- react-hot-toast (main.tsx Toaster: top-center, maxWidth 700px) ---- */
.toast-wrap{position:fixed;z-index:100002;top:16px;left:16px;right:16px;display:flex;justify-content:center;pointer-events:none}
.toast{display:flex;align-items:center;background:#fff;color:#363636;line-height:1.3;box-shadow:0 3px 10px rgba(0,0,0,.1),0 3px 3px rgba(0,0,0,.05);max-width:700px;pointer-events:auto;padding:8px 10px;border-radius:8px}
.toast-msg{display:flex;justify-content:center;margin:4px 10px;color:inherit;flex:1 1 auto;white-space:pre-line}
.spin{width:12px;height:12px;box-sizing:border-box;border:2px solid #e0e0e0;border-right-color:#616161;border-radius:100%;animation:rot 1s linear infinite;margin:4px}
@keyframes rot{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* ---- prototype-only switcher ---- */
.proto{position:fixed;bottom:24px;right:160px;z-index:100000;display:flex;align-items:center;gap:8px;font-family:'Outfit',sans-serif}
.seg{display:flex;padding:2px;border-radius:7px;background:#f3f4f6;border:1px solid #e5e7eb;box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.seg button{font-size:12px;line-height:16px;font-weight:500;padding:4px 12px;border-radius:5px;color:#4b5563;cursor:pointer}
.seg button.on{background:#1f2937;color:#fff}
</style>
</head>

        if (PAGE === 'models') { picks = {}; OURS.saved.forEach(function(k){ picks[k] = true; }); openWizard(true, 1); }
        else if (framed) nav('vision-add-models');
        else location.href = 'vision-model-selection.html?state=edit&mode=' + mode;
      }
      return;
    }
    if (t.closest('#actDelete')) { var dr = rows[menuFor]; closeMenu(); if (dr) { modal = { kind: 'delete', row: dr }; renderModal(); } return; }
    // download icon + dropdown (index.tsx:396-414, 618-690)
    var dlc = t.closest('[data-dlc]'); if (dlc) { var r1 = rows[+dlc.getAttribute('data-dlc')]; dlMenuFor = null; renderRows(); openDownload(r1, 'complete'); return; }
    var dls = t.closest('[data-dls]'); if (dls) { var r2 = rows[+dls.getAttribute('data-dls')]; dlMenuFor = null; renderRows(); openDownload(r2, 'selective'); return; }
    var dl = t.closest('[data-dl]');
    if (dl) {
      var di = +dl.getAttribute('data-dl'), dr2 = rows[di];
      if (isDraft(dr2) || isUnplaced(dr2) || downloading) return;
      if (after && dr2.status === 'remaining') { dlMenuFor = null; renderRows(); openDownload(dr2, 'complete'); return; }
      dlMenuFor = dlMenuFor === di ? null : di; renderRows(); return;
    }
    if (t.closest('#createBtn')) { if (PAGE === 'models' && rows.indexOf(OURS) < 0) { picks = {}; openWizard(false, 1); } return; }
    if (!wizardOpen) return;
    // wizard
    if (t.closest('#wzClose') || t.closest('#wzCancel') || t.closest('#wzBackdrop')) { closeWizard(); return; }
    if (t.closest('#wzBack')) { if (step > 1) { step--; renderStep(); } return; }
    if (t.closest('#wzLater')) {
      // After change: saves the picks (POST /instance/link-model) and activates; Status = Models Remaining; back to the table
      var hadEdit = wzEdit, some = pickedCount() > 0;
      finishInstance();
      afterFinish(hadEdit, some);
      return;
    }
    if (t.closest('#wzNext')) {
      if (document.getElementById('wzNext').disabled) return;
      if (step < 5) { step++; renderStep(); return; }
      var wasEdit = wzEdit, any = pickedCount() > 0;
      finishInstance();
      afterFinish(wasEdit, any);
      return;
    }
    var col = t.closest('[data-col]'); if (col) { var id = col.getAttribute('data-col'); collapsed[id] = !collapsed[id]; renderStep(); return; }
    var pk = t.closest('[data-pick]'); if (pk) { picks[pk.getAttribute('data-pick')] = true; renderStep(); return; }
    var cbx = t.closest('[data-cap]'); if (cbx) { var cid = cbx.getAttribute('data-cap'); if (selectedCaps[cid]) delete selectedCaps[cid]; else selectedCaps[cid] = true; renderStep(); return; }
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { closeMenu(); closeSelect(); if (modal) closeModal(); } });

  /* Tooltip.tsx hover bubble */
  var hoverTip = document.getElementById('hoverTip'), timer = null, cur = null;
  function place(tip, trig, pos){
    var r = trig.getBoundingClientRect(), tr = tip.getBoundingClientRect(), P = 8, G = 8, top, left;
    if (pos === 'left' || pos === 'right') {
      var right = pos === 'right';
      if (right && r.right + G + tr.width > innerWidth - P) right = false;
      else if (!right && r.left - G - tr.width < P) right = true;
      top = Math.min(Math.max(r.top + r.height / 2 - tr.height / 2, P), Math.max(innerHeight - P - tr.height, P));
      left = right ? r.right + G : r.left - G - tr.width;
    } else {
      var bottom = false; if (r.top - G - tr.height < P) bottom = true;
      left = Math.min(Math.max(r.left + r.width / 2 - tr.width / 2, P), Math.max(innerWidth - P - tr.width, P));
      top = bottom ? r.bottom + G : r.top - G - tr.height;
    }
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
  }
  document.addEventListener('mouseover', function(e){
    var el = e.target.closest && e.target.closest('[data-tip]');
    if (el === cur) return;
    cur = el; clearTimeout(timer); hoverTip.hidden = true;
    if (!el || !el.getAttribute('data-tip')) return;
    timer = setTimeout(function(){ hoverTip.textContent = el.getAttribute('data-tip'); hoverTip.hidden = false; place(hoverTip, el, el.getAttribute('data-pos')); }, 150);
  });

  /* ---------- mode switch (standalone only) ---------- */
  document.querySelectorAll('.seg button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-mode') === mode);
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var u = new URL(location.href); u.searchParams.set('mode', b.getAttribute('data-mode')); location.href = u.toString();
    });
  });
  if (framed) document.getElementById('proto').hidden = true;

  /* ---------- shared-state sync ---------- */
  window.addEventListener('storage', function(e){
    if (e.key !== KEY && e.key !== null) return;
    S = readState(); renderRows(); if (wizardOpen) renderStep(); if (modal) renderModal();
  });

  /* ---------- boot ---------- */
  function boot(){
    sizeList(); renderRows();
    if (PAGE === 'models') {
      if (state === 'edit' || state === 'edit-some') {
        OURS.saved.forEach(function(k){ picks[k] = true; });                 // GET /instance/deployed-models
        if (pickedAll) TRAINED.forEach(function(k){ picks[k] = true; });
        openWizard(true, 4);
        if (state === 'edit' || pickedAll) { var mb = document.querySelector('#stepHost .ms-body'); if (mb) mb.scrollTop = mb.scrollHeight; }   // Top View in view
      } else {
        openWizard(false, 4);
      }
    } else if (openParam === 'download') {
      openDownload(OURS, state === 'completed' ? 'selective' : 'complete', true);
    }
  }
  boot();
  addEventListener('resize', function(){ sizeList(); renderRows(); if (wizardOpen) renderStep(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ sizeList(); renderRows(); if (wizardOpen) renderStep(); });
})();
</script>
</body>
