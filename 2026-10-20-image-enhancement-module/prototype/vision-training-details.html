<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision Training Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=block" rel="stylesheet">
<style>
/* ---- Tailwind v3 preflight (subset) + src/index.css ---- */
*,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
html{line-height:1.5;-webkit-text-size-adjust:100%;tab-size:4}
html,body{font-size:16px;height:100vh;width:100vw;overflow-y:hidden;color:black}
:root{font-family:'Outfit',sans-serif;font-optical-sizing:auto;line-height:1.5;font-weight:400;font-style:normal;min-height:100vh;height:fit-content;color-scheme:light;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;line-height:inherit;overflow:hidden;background:#fff}
h1,h3,p{margin:0}
a{color:inherit;text-decoration:inherit}
ul{list-style:none;margin:0;padding:0}
button{font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;color:inherit;margin:0;padding:0;-webkit-appearance:button;background-color:transparent;background-image:none}
table{text-indent:0;border-color:inherit;border-collapse:collapse}
svg{display:block;vertical-align:middle}
[hidden]{display:none !important}

/* ---- Project sidebar (shared/layouts/project/sidebar.tsx) ---- */
.psb{position:fixed;left:0;top:0;display:flex;height:100vh;width:80px;flex-direction:column;align-items:center;border-right:1px solid #d1d5db;background:#1e1c1c;padding:24px 8px;box-shadow:0 4px 6px -1px rgb(0 0 0 / .1),0 2px 4px -2px rgb(0 0 0 / .1);z-index:9999}
.psb-logo{margin-bottom:40px;margin-top:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.psb ul{margin-top:32px;display:flex;width:100%;flex-direction:column;gap:8px}
.psb li{position:relative;transition:all .3s}
.psb-link{display:flex;width:100%;align-items:center;justify-content:center;border-radius:6px;padding:8px 0;overflow:hidden;color:#fff;transition-duration:.3s}
.psb-link:hover,.psb-link.active{background:rgb(255 255 255 / .2)}
/* sidebar.tsx:190-196 — role="tooltip" name bubble */
.psb-tip{position:absolute;left:100%;top:50%;transform:translate(-4px,-50%);margin-left:12px;z-index:50;padding:6px 10px;font-size:12px;line-height:16px;font-weight:600;color:#fff;background:#ff4301;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;transition:all .3s;pointer-events:none;width:max-content;max-width:200px;white-space:normal}
.psb-tip::before{content:'';position:absolute;top:50%;transform:translateY(-50%);left:-4px;border-right:4px solid #1e293b;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:0}
.psb li:hover .psb-tip{opacity:1;transform:translate(0,-50%)}
.psb-bottom{display:flex;width:100%;flex-grow:1;flex-direction:column;justify-content:flex-end;gap:8px}

/* ---- shared/layouts/project/index.tsx + main/heading.tsx + ui/Breadcrumb.tsx ---- */
.page{margin-left:80px;height:100%;min-height:100vh}
.heading{display:flex;align-items:center;justify-content:space-between;margin-top:4px;gap:8px;height:60px;padding:16px 20px;background:#fff}
.heading-l{display:flex;align-items:baseline;gap:8px}
.heading-sub{display:flex;align-items:baseline;font-size:20px;line-height:28px;font-weight:500;gap:8px}
.bc{display:flex;align-items:center;font-size:14px;line-height:20px;color:#6b7280;margin-bottom:16px;padding:8px 4px}
.bc > * + *{margin-left:8px}
.bc-home{display:flex;align-items:center;padding:4px 8px;border-radius:6px;color:#6b7280;transition:all .2s}
.bc-home:hover{color:#ff4301;background:#f3f4f6}
.bc-chev{color:#9ca3af;flex-shrink:0}
.bc-link{padding:4px 8px;font-weight:500;color:#4b5563;border-radius:6px;display:inline-flex;align-items:center;max-width:200px;transition:all .2s}
.bc-link:hover{color:#ff4301;background:#f3f4f6}
.bc-cur{padding:4px 8px;font-weight:600;color:#111827;border-radius:6px;display:inline-flex;align-items:center;max-width:200px}
.bc-lbl{display:inline-flex;align-items:center;gap:6px;min-width:0}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- ai-training-new/layout.tsx:62-66 ---- */
.lay{display:flex;height:calc(100vh - 90px)}
.lay-in{flex:1 1 0%;overflow-y:auto;padding:0 0 32px}

/* ---- ai-detail/index.jsx:205-241 (tabs + content) ---- */
.tabs-w{width:100%;background:#fff;padding:0 20px}
.tabs{display:flex;align-items:center;justify-content:center;gap:0;background:#fff;padding:8px 0}
.tab{display:inline-block;border-top-left-radius:8px;border-top-right-radius:8px;border-bottom:2px solid #d1d5db;padding:16px;font-size:18px;line-height:28px;color:#6b7280;background:#fff;transition:color .2s,border-color .2s}
.tab:hover{border-color:#ff4301;color:#ff4301}
.tab.on{border-color:#ff4301;color:#ff4301}
.tab span{display:inline-flex;align-items:center;gap:4px}
.ct{background:#fff}
.ct-in{padding:40px 10%;max-height:70vh}

/* ---- ai-detail/Detail.jsx ---- */
.dt{display:flex;max-height:50vh;flex-shrink:0;flex-direction:column;gap:8px;overflow-y:auto;border-radius:8px;padding:0 40px 40px}
.b7{font-weight:700}
.fx{display:flex;gap:8px}
.fx-c{display:flex;align-items:center;gap:4px}
.dt-h{display:flex;align-items:center;gap:6px;font-size:20px;line-height:28px;font-weight:700;margin-top:20px}
.dt-h.m8{margin-top:32px;margin-bottom:4px}
.ds-wrap{width:100%}
.ds-pad{padding:16px 0}
.ds-list{display:flex;flex-direction:column;gap:16px}
.ds-grp{margin-bottom:16px}
.ds-hd{margin-bottom:4px;display:flex;align-items:flex-end;justify-content:space-between;font-size:14px}
.ds-rule{border-top:1px solid #e5e7eb;width:100%;margin-bottom:12px}
.ds-n{color:#22c55e;font-weight:500}
.cls-list{display:flex;align-items:center;gap:4px}
.cls-wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px}
.col1{display:flex;flex-direction:column;gap:4px}
.col1.l{text-align:left}

/* ---- BuildNTrainDrawer.tsx/components/VariantCaptureHeading.tsx ---- */
.vch{display:flex;align-items:center;font-size:18px;line-height:28px;font-weight:700}
.vch-in{color:#111827;border-left:4px solid #ef4444;padding-left:8px;display:flex;align-items:center}
.vch .mr1{margin-right:4px}
.vch .sep{font-weight:400;color:#000;margin:0 4px}

/* ---- shared/components/ClassChip.tsx ---- */
.chip{position:relative;display:inline-flex;align-items:center;border-radius:6px;padding:2px 8px;white-space:nowrap;font-size:14px;line-height:20px;font-weight:500}

/* ---- shared/ui/Table.tsx ---- */
.tbl{display:flow-root;height:100%;width:100%;overflow-x:auto}
.tbl-in{width:max-content;min-width:100%}
.tbl table{min-width:100%}
.tbl table > :not([hidden]) ~ :not([hidden]){border-top:1px solid #d1d5db}
.tbl thead{position:sticky;top:0;z-index:10}
.tbl thead tr{background:#ff4301;position:relative}
.tbl th{position:sticky;top:0;z-index:10;padding:16px 8px;text-align:center;font-size:16px;line-height:24px;font-weight:500;color:#fff}
.th-rs{position:absolute;top:10px;right:0;bottom:10px;width:2px;cursor:col-resize;border-radius:16px;background:#fff}
.tbl th:last-child .th-rs{display:none}
.tbl tbody{background:#fff}
.tbl tbody > tr:not([hidden]) ~ tr:not([hidden]){border-top:1px solid #e5e7eb}
.tbl td{padding:8px;color:#000;overflow:visible}
.td-in{display:flex;height:100%;width:100%;align-items:center;justify-content:center;text-align:center}

/* ---- shared/components/InfoTooltip.tsx (lucide Info) ---- */
.info-ico{position:relative;display:inline-flex;align-items:center;pointer-events:auto}
.info-ico > span{display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;border-radius:9999px;color:#6b7280;transition:transform .15s}
.info-ico > span:hover{transform:scale(1.1)}

/* ---- shared/components/Tooltip.tsx bubble ---- */
.tip{position:fixed;pointer-events:none;width:max-content;max-width:300px;overflow-wrap:break-word;white-space:normal;border-radius:4px;border:1px solid #d1d5db;background:#f3f4f6;padding:4px 8px;font-size:12px;line-height:16px;color:#4b5563;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05);z-index:99999}

/* ---- prototype-only switcher ---- */
.proto{position:fixed;top:10px;right:58px;z-index:100000;display:flex;align-items:center;gap:8px;font-family:'Outfit',sans-serif}
.seg{display:flex;padding:2px;border-radius:7px;background:#f3f4f6;border:1px solid #e5e7eb}
.seg button{font-size:12px;line-height:16px;font-weight:500;padding:4px 12px;border-radius:5px;color:#4b5563;cursor:pointer}
.seg button.on{background:#1f2937;color:#fff}
</style>
</head>

<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var mode = params.get('mode') === 'today' ? 'today' : 'after';
  // Inside the workflow shell the shell's own Today | After change switch drives ?mode
  var framed = false;
  try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (framed) document.getElementById('proto').hidden = true;

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  /* ---------- filters (same ids, names and values as vision-module-config.html FILTERS / FILTER_PARAMS) ---------- */
  var FILTERS = {
    invert: { name: 'Invert' }, equalize: { name: 'Equalize' }, stretch: { name: 'Stretch' }, clip: { name: 'Clip', p: 'clip' },
    opticaldensity: { name: 'Optical Density' }, greydist: { name: 'Greyscale Distance', p: 'grey' },
    binarize: { name: 'Binarize' }, thresholdrange: { name: 'Threshold Range', p: 'range' },
    lowpass: { name: 'Low Pass', p: 'kernel' }, localmedian: { name: 'Local Median', p: 'kernel' },
    sharpen: { name: 'Sharpen', p: 'kernel' }, highpass: { name: 'High Pass', p: 'kernel' }, gradfull: { name: 'Gradient Full' },
    gradh: { name: 'Gradient Horizontal' }, gradv: { name: 'Gradient Vertical' }, edgemag: { name: 'Edge Magnitude' },
    erode: { name: 'Erode', p: 'kernel' }, dilate: { name: 'Dilate', p: 'kernel' }, open: { name: 'Open', p: 'kernel' }, close: { name: 'Close', p: 'kernel' },
    filldark: { name: 'Fill Dark Holes' }, filllight: { name: 'Fill Light Holes' },
    tophat: { name: 'Top Hat', p: 'kernel' }, bothat: { name: 'Bot Hat', p: 'kernel' }, maxhat: { name: 'Max (Top Hat/Bottom Hat)', p: 'kernel' },
    localmediannorm: { name: 'Local Median Normalization', p: 'kernel' }
  };
  var FILTER_PARAMS = {
    kernel: [{ k: 'rows', label: 'Rows', def: 5 }, { k: 'cols', label: 'Columns', def: 5 }],
    clip: [{ k: 'low', label: 'Low', def: 40 }, { k: 'high', label: 'High', def: 200 }],
    range: [{ k: 'low', label: 'Low', def: 0 }, { k: 'high', label: 'High', def: 110 }],
    grey: [{ k: 'grey', label: 'Grey level', def: 128 }]
  };

  /* ---------- the Image Enhancement recorded when the model was trained ----------
     Shared prototype state localStorage["ie-proto:v1"]. The first time this page loads inside the workflow shell
     and no "trainedChain" is stored yet, the current "chain" (and the area / module names) are copied into
     "trainedChain" / "trainedAreaName" / "trainedModuleName". From then on this page shows only that record, so
     later edits to "chain" (Vision Edit filters, Edge) do not change it. Nothing stored: LMN 15x15 -> Binarize -> Invert. */
  var STORE_KEY = 'ie-proto:v1';
  var DEFAULT_AREA = 'Enhanced Search Area 1', DEFAULT_MODULE = 'IE_1';
  var FALLBACK_CHAIN = [{ f: 'localmediannorm', p: { rows: 15, cols: 15 } }, { f: 'binarize' }, { f: 'invert' }];
  function readShared() {
    try { var o = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); return o && typeof o === 'object' ? o : null; } catch (e) { return null; }
  }
  function cleanChain(list) {
    if (!Array.isArray(list)) return null;
    var out = list.filter(function (s) { return s && FILTERS[s.f]; });
    return out.length ? out : null;
  }
  function name(v, d) { return typeof v === 'string' && v.trim() ? v.trim() : d; }
  function trainingRecord() {
    var st = readShared();
    var trained = st && cleanChain(st.trainedChain);
    if (trained) return { chain: trained, area: name(st.trainedAreaName, name(st.areaName, DEFAULT_AREA)), module: name(st.trainedModuleName, name(st.moduleName, DEFAULT_MODULE)) };
    var current = st && cleanChain(st.chain);
    if (!current) return { chain: FALLBACK_CHAIN, area: DEFAULT_AREA, module: DEFAULT_MODULE };
    var rec = { chain: JSON.parse(JSON.stringify(current)), area: name(st.areaName, DEFAULT_AREA), module: name(st.moduleName, DEFAULT_MODULE) };
    if (framed) {
      try {
        var o = readShared() || {};
        o.trainedChain = rec.chain; o.trainedAreaName = rec.area; o.trainedModuleName = rec.module;
        localStorage.setItem(STORE_KEY, JSON.stringify(o));
      } catch (e) {}
    }
    return rec;
  }
  var REC = trainingRecord();

  function valuesText(s) {
    var defs = FILTER_PARAMS[FILTERS[s.f].p];
    if (!defs) return '';
    var P = s.p && typeof s.p === 'object' ? s.p : {};
    var v = defs.map(function (d) { var x = +P[d.k]; return { label: d.label, v: isFinite(x) ? Math.round(x) : d.def }; });
    if (FILTERS[s.f].p === 'kernel') return v[0].label + ' ' + v[0].v + ' × ' + v[1].label + ' ' + v[1].v;
    return v.map(function (o) { return o.label + ' ' + o.v; }).join(', ');
  }
  function filterLine(s, i) {
    var vals = valuesText(s);
    return (i + 1) + '. ' + FILTERS[s.f].name + (vals ? ' — ' + vals : '');
  }

  /* ---------- sample model (GET /model/model-data) ---------- */
  var MODEL = {
    name: 'Print Text Detection',
    modelCategory: 'Straight Text Detection',            // model store index 10 (PSENet)
    desc: 'Lot and expiry print',
    classes: ['Lot Prefix', 'Lot Number', 'Expiry Prefix', 'Expiry Date'],
    // index.tsx augmentationsMap — OCR defaults (configuration.tsx advancedSettingsMapper + ocrAugmentations)
    augmentations: ['Gaussian Blur', 'Gaussian Noise', 'Random Brightness Contrast', 'Character Shuffling', 'Character Length Changing'],
    percentage: '214/300', patience: 60,                  // status 8 (completed) -> post training info
    gpu: '40-series Server',                              // Detail.jsx GPU_LABELS
    imageSize: 736,                                       // configuration.tsx modelResolutionMapping[10]
    datasets: [
      { g: 'Print Images', p: 'Line 1', n: 'Batch 1', a: 24, c: 24 },
      { g: 'Print Images', p: 'Line 1', n: 'Batch 2', a: 18, c: 18 }
    ]
  };

  /* ---------- shared/components/ClassChip.tsx stringToColor ---------- */
  function hashString(str) {
    var hash = 0;
    for (var i = 0; i < str.length; i++) { hash = (hash << 5) - hash + str.charCodeAt(i); hash |= 0; }
    hash ^= hash >>> 16; hash = Math.imul(hash, 0x45d9f3b);
    hash ^= hash >>> 16; hash = Math.imul(hash, 0x45d9f3b);
    hash ^= hash >>> 16;
    return hash;
  }
  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    function k(n) { return (n + h / 30) % 12; }
    var a = s * Math.min(l, 1 - l);
    function f(n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); }
    function hx(x) { return Math.round(255 * x).toString(16).padStart(2, '0'); }
    return '#' + hx(f(0)) + hx(f(8)) + hx(f(4));
  }
  function stringToColor(str) { var hue = ((hashString('cls-' + str) % 360) + 360) % 360; return hslToHex(hue, 85, 38); }
  function chip(n) {
    var c = stringToColor(n);
    return '<span class="chip" style="background-color:' + c + '35;color:' + c + ';border:1px solid ' + c + '70">' + esc(n) + '</span>';
  }

  /* ---------- shared/ui/Table.tsx ---------- */
  function table(headers, rows, colWidths) {
    return '<div class="tbl" data-cols="' + headers.length + '"' + (colWidths ? ' data-w="' + colWidths.join(',') + '"' : '') + '><div class="tbl-in"><table>' +
      '<colgroup>' + headers.map(function () { return '<col>'; }).join('') + '</colgroup>' +
      '<thead><tr>' + headers.map(function (h) { return '<th scope="col">' + esc(h) + '<div class="th-rs"></div></th>'; }).join('') + '</tr></thead>' +
      '<tbody>' + rows.map(function (r) {
        return '<tr>' + r.map(function (cell) { return '<td><div class="td-in">' + cell + '</div></td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table></div></div>';
  }
  function sizeTables() {
    Array.prototype.forEach.call(document.querySelectorAll('.tbl[data-cols]'), function (t) {
      var n = +t.getAttribute('data-cols'), W = t.offsetWidth; if (!W) return;
      var fixed = (t.getAttribute('data-w') || '').split(',').map(function (x) { return x === '' ? undefined : +x; });
      var avail = W, flex = n;
      fixed.forEach(function (w) { if (w !== undefined && !isNaN(w)) { avail -= w; flex--; } });
      var fw = flex > 0 ? Math.max(avail / flex, 0) : 0;
      Array.prototype.forEach.call(t.querySelectorAll('col'), function (c, i) {
        var w = fixed[i]; c.style.width = (w !== undefined && !isNaN(w) ? w : fw) + 'px';
      });
    });
  }

  function info(text) {
    return '<span class="info-ico" data-tip="' + esc(text) + '"><span role="button" tabindex="0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span></span>';
  }

  /* ---------- Detail.jsx:148-340 ---------- */
  function render() {
    var after = mode === 'after';
    // OCR_1's base search area, as recorded in the model's moduleInfo at training time.
    var searchArea = after ? REC.area : 'Search Area 1';
    var parts = curEp();
    var h = '';
    h += '<div><span class="b7">Model Name: </span>' + esc(MODEL.name) + '</div>';
    h += '<div><span class="b7">Model Type: </span>' + esc(MODEL.modelCategory) + '</div>';
    h += '<div><span class="b7">Model Description: </span>' + esc(MODEL.desc) + '</div>';
    h += '<div class="fx"><span class="b7">Classes: </span><div class="cls-list">' + MODEL.classes.map(chip).join('') + '</div></div>';

    h += '<div class="dt-h">Following project configurations can use this AI model :</div>';
    h += table(['Variant', 'Capture', 'Module', 'Model Type', 'Search Area', 'Classes'], [[
      'Variant A', 'Capture 1', 'OCR_1', esc(MODEL.modelCategory),
      '<div class="col1"><div>' + esc(searchArea) + '</div></div>',
      '<div class="cls-wrap">' + MODEL.classes.map(chip).join('') + '</div>'
    ]]);

    if (after) {
      // NEW: the Image Enhancement this model was trained with (recorded at training time). It sits in a block div
      // like the datasets block: a Table placed straight in this max-h flex column shrinks to nothing once the
      // details are taller than the box (that is what happens to the configurations table above).
      h += '<div class="ds-wrap" id="ieBlock"><p class="dt-h m8">Following Image Enhancement was used for training this AI Model :</p>' +
        table(['Variant', 'Capture', 'Module', 'Search Area', 'Filters'], [[
          'Variant A', 'Capture 1', esc(REC.module), esc(REC.area),
          '<div class="col1 l">' + REC.chain.map(function (s, i) { return '<div>' + esc(filterLine(s, i)) + '</div>'; }).join('') + '</div>'
        ]], ['', '', '', '', 480]) +
        '</div>';
    }

    h += '<div class="ds-wrap"><p class="dt-h m8">Following datasets were used for training this AI Model :</p>' +
      '<div class="ds-pad"><div class="ds-list"><div class="ds-grp">' +
        '<div class="ds-hd"><div class="vch"><div class="vch-in"><span class="mr1">Variant -</span><span>Variant A</span><span class="sep">|</span><span class="mr1">Capture -</span> <span>Capture 1</span></div></div></div>' +
        '<div class="ds-rule"></div>' +
        table(['Dataset Folder 1', 'Dataset Folder 2', 'Dataset Folder 3', 'Images'], MODEL.datasets.map(function (d) {
          return [esc(d.g), esc(d.p), esc(d.n), '<div class="ds-n">' + d.a + '/' + d.c + '</div>'];
        })) +
      '</div></div></div></div>';

    h += '<div><span class="b7">Augmentations: </span>' + esc(MODEL.augmentations.join(', ')) + '</div>';
    h += '<div class="fx-c"><span class="b7">Max epochs: </span>' + parts.total + '</div>';
    h += '<div class="fx-c"><span class="b7">Trained epochs: </span>' + parts.cur + '</div>';
    h += '<div class="fx-c"><span class="b7">Best model epoch: </span>' + (parts.cur - MODEL.patience) + info('The epoch whose weights were kept — the last epoch minus the patience window.') + '</div>';
    h += '<div><span class="b7">Training GPU: </span>' + esc(MODEL.gpu) + '</div>';
    h += '<div><span class="b7">Image Size: </span>' + MODEL.imageSize + '</div>';

    var dt = document.getElementById('detail');
    dt.innerHTML = h;
    sizeTables();
  }
  function curEp() { var p = MODEL.percentage.split('/').map(Number); return { cur: p[0], total: p[1] }; }

  document.getElementById('bcModel').innerHTML = '<span class="bc-lbl" title="' + esc(MODEL.name) + '"><span class="truncate">' + esc(MODEL.name) + '</span></span>';

  // Other tabs (Training Results, Evaluation Results) are not part of this prototype.
  Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.psb a'), function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.bc a'), function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); });
  });

  /* Tooltip.tsx hover bubble (getSafeCoords, position top) */
  var hoverTip = document.getElementById('hoverTip'), timer = null, cur = null;
  function place(tip, trig) {
    var r = trig.getBoundingClientRect(), t = tip.getBoundingClientRect(), P = 8, G = 8;
    var bottom = r.top - G - t.height < P;
    var left = Math.min(Math.max(r.left + r.width / 2 - t.width / 2, P), Math.max(innerWidth - P - t.width, P));
    tip.style.left = left + 'px'; tip.style.top = (bottom ? r.bottom + G : r.top - G - t.height) + 'px';
  }
  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest && e.target.closest('[data-tip]');
    if (el === cur) return;
    cur = el; clearTimeout(timer); hoverTip.hidden = true;
    if (!el) return;
    timer = setTimeout(function () { hoverTip.textContent = el.getAttribute('data-tip'); hoverTip.hidden = false; place(hoverTip, el); }, 150);
  });
  document.addEventListener('scroll', function () { hoverTip.hidden = true; cur = null; }, true);

  function setMode(m) {
    mode = m;
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) { b.classList.toggle('on', b.getAttribute('data-mode') === mode); });
    try { var u = new URL(location.href); u.searchParams.set('mode', mode); history.replaceState(null, '', u); } catch (e) {}
    render();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
    b.addEventListener('click', function () { setMode(b.getAttribute('data-mode')); });
  });

  setMode(mode);
  addEventListener('resize', sizeTables);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeTables);
})();
</script>
</body>
</html>
