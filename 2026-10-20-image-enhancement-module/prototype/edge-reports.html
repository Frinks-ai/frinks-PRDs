<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics &amp; Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<style>
/* Replica of frinksedge-report-frontend: shared/layouts/main (sidebar.jsx, heading.jsx), modules/analytics
   (index.jsx header + filter toolbar + summary, ResultTable.jsx, ImageViewer.jsx). tailwind f-primary = #ff4301, font Outfit. */
:root{
  --primary:#ff4301; --primary-ring:rgba(255,67,1,.3); --on-primary:#fff;
  --bg:#fff; --surface:#fff; --text:#000; --text-2:#374151; --label:#4b5563; --muted:#6b7280; --muted-2:#9ca3af;
  --border:#e5e7eb; --border-strong:#d1d5db; --track:#f3f4f6; --hover:#f9fafb;
  --sidebar:#1e1c1c; --sidebar-edge:#d1d5db;
  --pass:#16a34a; --fail:#ef4444; --link:#3b82f6; --link-hover:#3730a3;
  --sum-pass-bg:#f0fdf4; --sum-pass:#15803d; --sum-fail-bg:#fef2f2; --sum-fail:#dc2626;
  --sum-def-bg:#fff7ed; --sum-def:#ea580c; --sum-rj-bg:#eff6ff; --sum-rj:#2563eb;
  --tg-bg:rgba(255,255,255,.92); --tg-text:#6b7280; --tg-border:#d1d5db; --tg-on-bg:#1e1c1c; --tg-on-text:#fff;
  color-scheme:light; /* the Edge reports app is light-only */
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Sidebar (shared/layouts/main/sidebar.jsx, collapsed as the app opens by default) */
.side{position:fixed;left:0;top:0;z-index:100;width:114px;height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:24px 8px;background:var(--sidebar);border-right:1px solid var(--sidebar-edge);box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}
.logo{margin:12px 0 40px;width:60px;height:60px;display:flex;align-items:center;justify-content:center}
.nav{margin-top:32px;flex:1;width:100%;list-style:none}
.nav a{display:flex;align-items:center;justify-content:center;border-radius:6px;padding:8px 0;color:#fff}
.nav a:hover{background:rgba(255,255,255,.2)}
.collapse{color:#fff;padding:8px 0}
.collapse:hover{opacity:.75}
.main{margin-left:114px;min-height:100vh;display:flex;flex-direction:column;background:var(--surface)}

/* Header (analytics/index.jsx:1203-1268 + layouts/main/heading.jsx) */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface)}
.heading{display:flex;align-items:baseline;gap:8px;height:60px;margin-top:4px;padding:16px 20px}
.heading h1{font-size:30px;line-height:36px;font-weight:500}
.top-right{display:flex;align-items:center;gap:12px;margin:8px 20px 0;flex-wrap:wrap}
.tabs{display:flex;align-items:center;height:36px;padding:0 4px;border-radius:8px;background:var(--track)}
.tabs button{display:flex;align-items:center;gap:4px;height:36px;padding:0 16px;border-radius:6px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button + button{margin-left:4px}
.tabs button.on{background:var(--primary);color:var(--on-primary)}
.tabs button:not(.on):hover{color:var(--text)}
.search{position:relative;display:flex;align-items:center}
.search .i{position:absolute;left:12px;width:18px;height:18px;color:var(--muted-2)}
.search input{height:36px;width:256px;max-width:100%;border:1px solid var(--border);border-radius:8px;padding:0 40px;font-size:14px;background:var(--surface)}
.search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}

/* Filter toolbar (index.jsx:1273+) */
.fbar{position:relative;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--border);padding:16px 20px 12px}
.fleft{display:flex;flex:1;flex-wrap:wrap;align-items:center;gap:12px;min-width:0}
.fbtn{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;height:38px;padding:0 12px;border-radius:8px;
  background:var(--surface);font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap}
.fbtn:hover{background:var(--hover)}
.fbtn .i{color:var(--muted)}
.fbtn .t{overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:-4px;right:-4px;display:flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:999px;
  background:var(--primary);color:#fff;font-size:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.abtn{display:flex;align-items:center;justify-content:center;width:38px;height:32px;border-radius:6px;background:var(--primary);color:#fff;flex-shrink:0}
.abtn:hover{background:rgba(255,67,1,.9)}
.fright{display:flex;gap:8px;flex-shrink:0}

/* Summary bar */
.sum{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--surface)}
.sum > div{display:flex;flex-grow:1;align-items:center;gap:16px;padding:10px 20px;border-right:1px solid var(--border);font-size:14px}
.sum > div:last-child{border-right:0}
.sum span{font-weight:500}
.sum b{margin-left:auto;font-weight:600}
.s-total span{color:var(--label)}
.s-pass{background:var(--sum-pass-bg);color:var(--sum-pass)}
.s-fail{background:var(--sum-fail-bg);color:var(--sum-fail)}
.s-def{background:var(--sum-def-bg);color:var(--sum-def)}
.s-rj{background:var(--sum-rj-bg)} .s-rj span{color:var(--sum-rj)}

/* Results table (ResultTable.jsx + shared/ui/Table) */
.tablewrap{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;margin-top:12px;padding:0 20px 20px}
.tscroll{flex:1;min-height:0;min-width:0;overflow:auto}
table{width:100%;min-width:100%;border-collapse:collapse;table-layout:fixed}
th{position:sticky;top:0;z-index:11;background:var(--primary);color:#fff;font-size:16px;font-weight:500;text-align:center;padding:16px 8px}
th::after{content:"";position:absolute;top:10px;bottom:10px;right:0;width:2px;border-radius:16px;background:#fff}
th:last-child::after{display:none}
tbody{background:var(--surface);border-top:1px solid var(--border-strong)}
tbody tr + tr{border-top:1px solid var(--border)}
td{padding:8px;color:var(--text);vertical-align:middle;overflow:visible}
td > div{display:flex;align-items:center;justify-content:center;width:100%;height:100%;text-align:center}
.lnk{display:flex;align-items:center;gap:6px;color:var(--link);font-weight:500}
.lnk:hover{color:var(--link-hover)}
.res{font-size:14px;font-weight:600}
.res.p{color:var(--pass)} .res.f{color:var(--fail)}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:16px;border-top:1px solid var(--border);padding:8px 16px}
.pager span{font-size:14px;color:var(--muted)}
.pager button{border-radius:4px;padding:4px;display:flex}
.pager button:disabled{opacity:.3;cursor:default}
.pager .i{width:18px;height:18px}

/* Image viewer (ImageViewer.jsx; always dark, as in the app) */
.vw{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.9);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-family:'Outfit',sans-serif}
.vw-in{position:relative;display:flex;flex-direction:column;width:100%;height:100%;padding:24px}
.vw-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;color:#fff}
.vw-head > div:first-child{display:flex;flex-direction:column;gap:4px}
.vw-head h3{font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.025em}
.vw-sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;line-height:20px;font-weight:500;color:#d1d5db}
.chip{border-radius:4px;padding:2px 8px;font-size:14px;font-weight:600}
.chip.p{background:rgba(34,197,94,.2);color:#4ade80} .chip.f{background:rgba(239,68,68,.2);color:#f87171}
.vw-count{color:#6b7280}
.vw-tools{display:flex;align-items:center;gap:8px}
.zoomg{display:flex;align-items:center;gap:4px;border-radius:999px;background:rgba(255,255,255,.1);padding:4px}
.zoomg button{display:flex;align-items:center;justify-content:center;border-radius:999px;padding:8px;color:#fff}
.zoomg button:hover{background:rgba(255,255,255,.15)}
.zoomg button:disabled{opacity:.3;cursor:not-allowed}
.zoomg .zr{min-width:72px;gap:4px;padding:6px 8px;font-size:14px;font-weight:600}
.vw-close{display:flex;border-radius:999px;background:rgba(255,255,255,.1);padding:10px;color:#fff;transition:transform .15s}
.vw-close:hover{transform:scale(1.1);background:rgba(255,255,255,.2)}
.vw-port{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;background:rgba(0,0,0,.4)}
.vw-nav{position:absolute;z-index:10;display:flex;border-radius:999px;background:rgba(0,0,0,.6);padding:16px;color:#fff;box-shadow:0 10px 15px -3px rgba(0,0,0,.3)}
.vw-nav:hover{background:#fff;color:#000}
.vw-nav.l{left:24px} .vw-nav.r{right:24px}
.vw-stage{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:16px}
.vw-stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;box-shadow:0 0 50px rgba(0,0,0,.5);transition:transform .2s ease-out}
.vw-thumbs{display:flex;justify-content:center;gap:12px;margin-top:32px;padding:0 16px 8px;overflow-x:auto}
.th{position:relative;flex-shrink:0;width:128px;height:80px;overflow:hidden;border-radius:8px;border:2px solid rgba(255,255,255,.1);opacity:.4;transition:all .2s}
.th:hover{opacity:1;border-color:rgba(255,255,255,.3);transform:scale(1.05)}
.th.on{opacity:1;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-ring)}
.th.on::after{content:"";position:absolute;inset:0;background:rgba(255,67,1,.1)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th b{position:absolute;bottom:4px;left:4px;z-index:1;border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;line-height:1;color:#fff}
.th b.p{background:rgba(22,163,74,.9)} .th b.f{background:rgba(220,38,38,.9)}

/* Today | After change switch (prototype only) */
.mode{position:fixed;left:126px;bottom:10px;z-index:2000;display:inline-flex;padding:2px;border-radius:999px;
  background:var(--tg-bg);border:1px solid var(--tg-border);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mode button{font-size:11px;font-weight:600;line-height:16px;padding:2px 10px;border-radius:999px;color:var(--tg-text)}
.mode button[aria-pressed="true"]{background:var(--tg-on-bg);color:var(--tg-on-text)}

@media (max-width:767px){
  .side{display:none}
  .main{margin-left:0}
  .top-right{margin:0 16px 8px}
  .heading{padding:12px 16px;height:auto}
  .heading h1{font-size:24px;line-height:32px}
  .fbar{flex-wrap:wrap;padding:12px 16px}
  .sum > div{flex-basis:50%}
  .tablewrap{padding:0 16px 16px}
  table{min-width:960px}
  .vw-in{padding:16px}
  .vw-head{flex-wrap:wrap}
  .vw-nav{padding:10px}
  .vw-nav.l{left:8px} .vw-nav.r{right:8px}
  .mode{left:12px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
  <symbol id="i-zin" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></symbol>
  <symbol id="i-zout" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></symbol>
  <symbol id="i-dl" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
</svg>

<aside class="side">
  <div class="logo" aria-hidden="true">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="#fff" stroke-width="2"><circle cx="22" cy="22" r="19"/><path d="M15 31V13h14M15 22h10"/></svg>
  </div>
  <ul class="nav">
    <li><a href="#" title="Analytics &amp; Reports" onclick="return false">
      <svg width="14" height="18" viewBox="0 0 14 18" fill="none"><path d="M13 17V7M7 17V1M1 17V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a></li>
  </ul>
  <button class="collapse" type="button" aria-label="Expand sidebar">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 18 8 13 3 8"/><line x1="11" y1="9" x2="11" y2="17"/><line x1="14" y1="9" x2="14" y2="17"/></svg>
  </button>
</aside>

<div class="main">
  <header class="top">
    <div class="heading"><h1>Analytics &amp; Reports</h1></div>
    <div class="top-right">
      <div class="tabs">
        <button type="button" class="on">Cycle-wise</button>
        <button type="button" title="For deployments made in Fast Mode.">Minute-wise <svg class="i" style="width:18px;height:18px"><use href="#i-info"/></svg></button>
      </div>
      <div class="search">
        <svg class="i"><use href="#i-search"/></svg>
        <input type="text" placeholder="Search" aria-label="Search">
      </div>
    </div>
  </header>

  <div class="fbar">
    <div class="fleft">
      <button type="button" class="fbtn">21/10/2026 00:00 → 21/10/2026 23:59 <svg class="i"><use href="#i-down"/></svg></button>
      <button type="button" class="fbtn" style="max-width:131px"><span class="t">Line 1 Instance</span><svg class="i"><use href="#i-down"/></svg></button>
      <button type="button" class="fbtn">Variant <svg class="i"><use href="#i-down"/></svg><span class="badge">1</span></button>
      <button type="button" class="fbtn" style="width:100px">Outcome <svg class="i"><use href="#i-down"/></svg><span class="badge">2</span></button>
    </div>
    <button type="button" class="abtn" title="Edit Table"><svg class="i"><use href="#i-edit"/></svg></button>
    <button type="button" class="abtn" title="Download"><svg class="i"><use href="#i-dl"/></svg></button>
    <div class="fright">
      <button type="button" class="abtn" title="Add Filter"><svg class="i"><use href="#i-filter"/></svg></button>
      <button type="button" class="abtn" title="Refresh"><svg class="i"><use href="#i-refresh"/></svg></button>
    </div>
  </div>

  <div class="sum">
    <div class="s-total"><span>Total</span><b>3</b></div>
    <div class="s-pass"><span>Pass</span><b>2</b></div>
    <div class="s-fail"><span>Fail</span><b>1</b></div>
    <div class="s-def"><span>Defect %</span><b>33.333%</b></div>
    <div class="s-rj"><span>Reverse Judgement</span><b>0</b></div>
  </div>

  <section class="tablewrap">
    <div class="tscroll">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pager">
      <span>1–3 of 3</span>
      <button type="button" disabled aria-label="Previous page"><svg class="i"><use href="#i-left"/></svg></button>
      <button type="button" disabled aria-label="Next page"><svg class="i"><use href="#i-right"/></svg></button>
    </div>
  </section>
</div>

<div class="vw" id="vw" hidden>
  <div class="vw-in">
    <div class="vw-head">
      <div>
        <h3 id="vwTitle"></h3>
        <div class="vw-sub"><span id="vwName"></span><span id="vwChip" class="chip"></span><span id="vwCount" class="vw-count"></span></div>
      </div>
      <div class="vw-tools">
        <div class="zoomg">
          <button type="button" id="zOut" title="Zoom out (-)"><svg class="i" style="width:20px;height:20px"><use href="#i-zout"/></svg></button>
          <button type="button" id="zReset" class="zr" title="Reset zoom (0)"><svg class="i"><use href="#i-reset"/></svg><span id="zPct">100%</span></button>
          <button type="button" id="zIn" title="Zoom in (+)"><svg class="i" style="width:20px;height:20px"><use href="#i-zin"/></svg></button>
        </div>
        <button type="button" class="vw-close" id="vwClose" title="Close (Esc)"><svg class="i" style="width:28px;height:28px"><use href="#i-x"/></svg></button>
      </div>
    </div>
    <div class="vw-port" id="vwPort">
      <button type="button" class="vw-nav l" id="vwPrev" title="Previous (Left Arrow)"><svg class="i" style="width:36px;height:36px"><use href="#i-left"/></svg></button>
      <button type="button" class="vw-nav r" id="vwNext" title="Next (Right Arrow)"><svg class="i" style="width:36px;height:36px"><use href="#i-right"/></svg></button>
      <div class="vw-stage" id="vwStage"><img id="vwImg" alt="" draggable="false"></div>
    </div>
    <div class="vw-thumbs" id="vwThumbs"></div>
  </div>
</div>

<div class="mode" id="mode" role="group" aria-label="Prototype mode">
  <button type="button" data-mode="today" aria-pressed="false">Today</button>
  <button type="button" data-mode="after" aria-pressed="true">After change</button>
</div>

    runningChain().forEach((step) => {
      const P = { ...DEFAULT_P(step.f) };
      Object.keys(step.p || {}).forEach((k) => { P[k] = typeof step.p[k] === 'boolean' ? step.p[k] : Number(step.p[k]); });
      g = applyGreyFilter(g, w, h, step.f, P);
      for (let i = 0; i < n; i++) g[i] = clamp(Math.round(g[i]), 0, 255); // 8-bit between steps
    });
    const out = canvas(w, h), oid = out.getContext('2d').createImageData(w, h);
    for (let i = 0; i < n; i++) { oid.data[i * 4] = oid.data[i * 4 + 1] = oid.data[i * 4 + 2] = g[i]; oid.data[i * 4 + 3] = 255; }
    out.getContext('2d').putImageData(oid, 0, 0);
    return out;
  }

  // ---------- Saved result images, drawn as the engine draws them ----------
  // vip-inference-python resultProcess/utils/Visualisor.py: draw_box (cv2.rectangle, thickness default 5) and
  // write_name (Hershey simplex, fontScale default 0.8, fitted to the box, TL "outside", black outline then colour,
  // clamped inside the image). Search-area border from resultModule.py:1047-1054 (#008000 pass / #FF0000 fail,
  // borderWidth 10, labelSize 2). OCR boxes from resultProcess/ocr.py:869-905 (green = matched ground truth, red = failed).
  function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function drawBox(ctx, [x1, y1, x2, y2], color, thickness) {
    ctx.strokeStyle = color; ctx.lineWidth = thickness; ctx.lineJoin = 'miter';
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
  }
  function writeName(ctx, text, [x1, y1, x2, y2], color, textSize) {
    const W = ctx.canvas.width, H = ctx.canvas.height, CW = 20, CH = 22; // Hershey simplex char advance / height at scale 1
    let fs = textSize != null ? textSize : 0.8;
    const bw = Math.max(1, x2 - x1), bh = Math.max(1, y2 - y1), big = bw > 400;
    const maxW = bw * (big ? 0.5 : 0.9), maxH = bh * (big ? 0.3 : 0.4);
    if (text.length * CW * fs > maxW) fs = maxW / (text.length * CW);
    if (CH * fs > maxH) fs = maxH / CH;
    fs = Math.max(0.5, fs);
    const t = Math.max(1, Math.floor(2 * fs)), m = t + 2, tw = text.length * CW * fs, th = CH * fs, base = 10 * fs;
    const x = Math.max(m, Math.min(x1 + 3, W - tw - m)), y = Math.max(th + m, Math.min(y1 - 3, H - base - m));
    ctx.save();
    ctx.font = `300 ${(th / 0.72).toFixed(1)}px 'Helvetica Neue', Helvetica, Arial, sans-serif`; // thin, like Hershey's 1-px strokes
    ctx.textBaseline = 'alphabetic';
    const sx = tw / Math.max(1, ctx.measureText(text).width);
    ctx.translate(x, y); ctx.scale(sx, 1);
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#000'; ctx.lineWidth = (t + 1.5) / sx;
    ctx.strokeText(text, 0, 0);
    ctx.fillStyle = color; ctx.fillText(text, 0, 0);
    ctx.restore();
  }
  const SA1 = { x: 420, y: 285, w: 440, h: 150 };
  const OCR_LINES = [{ text: 'LOT A2419', box: [31, 14, 308, 59] }, { text: 'EXP 09/27', box: [31, 75, 308, 119] }];
  const IMG = {};
  function buildImages(master) {
    const M = canvas(master.naturalWidth, master.naturalHeight);
    M.getContext('2d').drawImage(master, 0, 0);
    const crop = () => { const c = canvas(SA1.w, SA1.h); c.getContext('2d').drawImage(M, SA1.x, SA1.y, SA1.w, SA1.h, 0, 0, SA1.w, SA1.h); return c; };
    const copy = (src) => { const c = canvas(src.width, src.height); c.getContext('2d').drawImage(src, 0, 0); return c; };
    const url = (c) => c.toDataURL('image/png');
    // OCR boxes go on every area above the OCR module (frinksedge-deployment-backend service/pythonModel.ts
    // getUpstreamSearchAreaIds: searchAreaId = [Input Image, ..., parent]); each is retraced into that area's pixels.
    const drawOcr = (ctx, pass, dx, dy) => OCR_LINES.forEach((l, i) => {
      const col = pass || i === 0 ? '#00FF00' : '#FF0000', b = [l.box[0] + dx, l.box[1] + dy, l.box[2] + dx, l.box[3] + dy];
      drawBox(ctx, b, col, 5); writeName(ctx, l.text, b, col);
    });
    const withOcr = (base, pass) => { const c = copy(base); drawOcr(c.getContext('2d'), pass, 0, 0); return c; };
    const input = (pass) => {
      const c = copy(M), ctx = c.getContext('2d'), col = pass ? '#008000' : '#FF0000', b = [SA1.x, SA1.y, SA1.x + SA1.w, SA1.y + SA1.h];
      drawOcr(ctx, pass, SA1.x, SA1.y); // module boxes first, then the search-area borders (resultModule.py run())
      drawBox(ctx, b, col, 10); writeName(ctx, 'SA_1', b, col, 2);
      return c;
    };
    IMG.raw = url(M); // raw image: the camera photo as captured, no drawing
    [true, false].forEach((p) => {
      const k = p ? 'p' : 'f';
      IMG['input_' + k] = url(input(p)); // normal picture + SA_1 border + OCR boxes
      IMG['sa1_' + k] = url(withOcr(crop(), p)); // normal picture of the area + OCR boxes
      IMG['enh_' + k] = url(withOcr(enhance(crop()), p)); // after: the enhanced area's picture + OCR boxes
    });
  }

  // ---------- Sample data (one capture per cycle) ----------
  const CYCLES = [
    { ts: '21/10/2026, 02:14:07 PM', variant: 'Variant A', result: true, caps: [{ pos: 'CP1', name: 'Capture 1', result: true }] },
    { ts: '21/10/2026, 02:14:01 PM', variant: 'Variant A', result: true, caps: [{ pos: 'CP1', name: 'Capture 1', result: true }] },
    { ts: '21/10/2026, 02:13:55 PM', variant: 'Variant A', result: false, caps: [{ pos: 'CP1', name: 'Capture 1', result: false }] },
  ];

  // ResultTable.jsx:110-140 — every analysed area image of every capture, sorted by sequence then name.
  // After change: within a sequence the Input Image comes first, then the search areas (SA_1 ...), then the
  // enhanced areas (Enhanced Search Area 1 ...), each group by name.
  // Names come from frinksedge-report analysis.service.ts:445-447 (name: saConfigs[k] || k).
  const KIND = (im) => (im.name === 'Input Image' ? 0 : im.enhanced ? 2 : 1);
  function resultImages(c) {
    const all = [];
    c.caps.forEach((cap) => {
      const k = cap.result ? 'p' : 'f', imgs = [
        { name: 'Input Image', src: IMG['input_' + k] },
        { name: 'SA_1', src: IMG['sa1_' + k] },
      ];
      if (mode === 'after') imgs.push({ name: 'Enhanced Search Area 1', src: IMG['enh_' + k], enhanced: true });
      imgs.sort((a, b) => (mode === 'after' && KIND(a) !== KIND(b) ? KIND(a) - KIND(b) : a.name < b.name ? -1 : a.name > b.name ? 1 : 0))
        .forEach(({ enhanced, ...img }) => all.push({ ...img, captureName: cap.name, result: cap.result, sequence: 0 }));
    });
    return all;
  }
  // ResultTable.jsx:151-164 — one raw image per capture, the camera photo as captured.
  const rawImages = (c) => c.caps.map((cap) => ({ captureName: cap.name, name: 'Raw Image', src: IMG.raw }));

  // ---------- Table (ResultTable.jsx: per-result cells rowSpan across capture sub-rows) ----------
  const COLS = [
    ['sno', 'S. No.'], ['timestamp', 'Timestamp'], ['overallResult', 'Overall Result'], ['variant', 'Variant'],
    ['resultImages', 'Result Images (SAs)'], ['rawImages', 'Raw Images'], ['resultsJson', 'Result JSON'],
    ['cameraPosition', 'Camera Position'], ['cameraConfig', 'Camera Configuration'], ['configResult', 'Config Result'],
  ];
  const PER_RESULT = new Set(['sno', 'timestamp', 'overallResult', 'variant', 'resultImages', 'rawImages', 'resultsJson']);
  const resultText = (ok) => `<span class="res ${ok ? 'p' : 'f'}">${ok ? 'Pass' : 'Fail'}</span>`;
  function cell(key, c, ci, cap, sno) {
    switch (key) {
      case 'sno': return sno;
      case 'timestamp': return c.ts;
      case 'overallResult': return resultText(c.result);
      case 'variant': return c.variant;
      case 'resultImages': return `<button type="button" class="lnk" data-view="result" data-cycle="${ci}">View Images </button>`;
      case 'rawImages': return `<button type="button" class="lnk" data-view="raw" data-cycle="${ci}">View Raw Images</button>`;
      case 'resultsJson': return '<span class="lnk" style="cursor:pointer">View JSON</span>';
      case 'cameraPosition': return cap.pos || '';
      case 'cameraConfig': return cap.name || '';
      case 'configResult': return resultText(cap.result);
      default: return '';
    }
  }
  const td = (html, span) => `<td${span > 1 ? ` rowspan="${span}"` : ''}><div>${html}</div></td>`;
  function renderTable() {
    document.getElementById('thead').innerHTML = COLS.map(([, label]) => `<th scope="col">${label}</th>`).join('');
    let html = '';
    CYCLES.forEach((c, ci) => {
      const rows = c.caps, sno = ci + 1;
      rows.forEach((cap, i) => {
        html += '<tr>' + COLS.map(([k]) => (PER_RESULT.has(k) ? (i === 0 ? td(cell(k, c, ci, cap, sno), rows.length) : '') : td(cell(k, c, ci, cap, sno)))).join('') + '</tr>';
      });
    });
    document.getElementById('tbody').innerHTML = html;
  }

  // ---------- Image viewer (ImageViewer.jsx) ----------
  const MIN_ZOOM = 0.5, MAX_ZOOM = 5, STEP = 0.25;
  const $ = (id) => document.getElementById(id);
  const V = { images: [], i: 0, zoom: 1, x: 0, y: 0, drag: null, open: null };
  function openViewer(images, index) {
    if (!images.length) return;
    Object.assign(V, { images, i: clamp(index || 0, 0, images.length - 1), zoom: 1, x: 0, y: 0 });
    $('vw').hidden = false;
    paint(true);
  }
  function closeViewer() { $('vw').hidden = true; V.open = null; }
  function applyTransform() {
    const img = $('vwImg');
    img.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.zoom})`;
    $('vwStage').style.cursor = V.zoom > 1 ? (V.drag ? 'grabbing' : 'grab') : 'default';
    $('zPct').textContent = Math.round(V.zoom * 100) + '%';
    $('zOut').disabled = V.zoom <= MIN_ZOOM;
    $('zIn').disabled = V.zoom >= MAX_ZOOM;
  }
  function setZoom(z) { V.zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, z)); if (V.zoom <= 1) { V.x = 0; V.y = 0; } applyTransform(); }
  function paint(rebuildThumbs) {
    const img = V.images[V.i], many = V.images.length > 1;
    V.zoom = 1; V.x = 0; V.y = 0;
    $('vwTitle').textContent = img.captureName || 'Unknown';
    $('vwName').textContent = img.name || 'Image';
    const chip = $('vwChip');
    chip.hidden = typeof img.result !== 'boolean';
    if (!chip.hidden) { chip.className = 'chip ' + (img.result ? 'p' : 'f'); chip.textContent = img.result ? 'Pass' : 'Fail'; }
    $('vwCount').textContent = `· Image ${V.i + 1} of ${V.images.length}`;
    const el = $('vwImg'); el.src = img.src; el.alt = img.captureName || img.name;
    $('vwPrev').hidden = $('vwNext').hidden = !many;
    const strip = $('vwThumbs');
    strip.hidden = !many;
    if (many && rebuildThumbs) {
      strip.innerHTML = V.images.map((t, idx) => `<button type="button" class="th" data-idx="${idx}" title="${t.name || 'Image'}${typeof t.result === 'boolean' ? ' — ' + (t.result ? 'Pass' : 'Fail') : ''}">` +
        `<img src="${t.src}" alt="${t.name}">${typeof t.result === 'boolean' ? `<b class="${t.result ? 'p' : 'f'}">${t.result ? 'Pass' : 'Fail'}</b>` : ''}</button>`).join('');
    }
    strip.querySelectorAll('.th').forEach((t) => t.classList.toggle('on', Number(t.dataset.idx) === V.i));
    applyTransform();
  }
  const go = (d) => { const n = V.images.length; V.i = (V.i + d + n) % n; paint(false); };
  function openFor(cycleIdx, view, index) {
    const c = CYCLES[cycleIdx];
    if (!c) return;
    V.open = { cycleIdx, view };
    openViewer(view === 'raw' ? rawImages(c) : resultImages(c), index);
  }

  $('vwPrev').addEventListener('click', () => go(-1));
  $('vwNext').addEventListener('click', () => go(1));
  $('vwClose').addEventListener('click', closeViewer);
  $('zIn').addEventListener('click', () => setZoom(V.zoom + STEP));
  $('zOut').addEventListener('click', () => setZoom(V.zoom - STEP));
  $('zReset').addEventListener('click', () => setZoom(1));
  $('vwThumbs').addEventListener('click', (e) => { const t = e.target.closest('.th'); if (t) { V.i = Number(t.dataset.idx); paint(false); } });
  $('vwPort').addEventListener('wheel', (e) => { e.preventDefault(); setZoom(V.zoom + (e.deltaY < 0 ? STEP : -STEP)); }, { passive: false });
  $('vwStage').addEventListener('mousedown', (e) => {
    if (V.zoom <= 1 || e.button !== 0) return;
    e.preventDefault();
    V.drag = { x: e.clientX, y: e.clientY, ox: V.x, oy: V.y };
    $('vwImg').style.transition = 'none';
    applyTransform();
  });
  window.addEventListener('mousemove', (e) => { if (!V.drag) return; V.x = V.drag.ox + e.clientX - V.drag.x; V.y = V.drag.oy + e.clientY - V.drag.y; applyTransform(); });
  window.addEventListener('mouseup', () => { if (!V.drag) return; V.drag = null; $('vwImg').style.transition = ''; applyTransform(); });
  window.addEventListener('keydown', (e) => {
    if ($('vw').hidden) return;
    if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'Escape') closeViewer();
    else if (e.key === '+' || e.key === '=') setZoom(V.zoom + STEP);
    else if (e.key === '-') setZoom(V.zoom - STEP);
    else if (e.key === '0') setZoom(1);
  });
  $('tbody').addEventListener('click', (e) => {
    const b = e.target.closest('[data-view]');
    if (b) openFor(Number(b.dataset.cycle), b.dataset.view, 0);
  });

  const ocrAreaIndex = (list) => Math.max(0, list.findIndex((im) => im.name === (mode === 'after' ? 'Enhanced Search Area 1' : 'SA_1')));

  // ---------- Today | After change ----------
  function syncMode() { document.querySelectorAll('#mode button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode))); }
  $('mode').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-mode]');
    if (!b || b.dataset.mode === mode) return;
    mode = b.dataset.mode;
    try { const u = new URL(location.href); u.searchParams.set('mode', mode); history.replaceState(null, '', u); } catch (err) { /* file:// may refuse */ }
    syncMode();
    if (V.open && !$('vw').hidden) {
      // Reopen on the area the OCR reads in that mode.
      const { cycleIdx, view } = V.open;
      openFor(cycleIdx, view, view === 'raw' ? 0 : ocrAreaIndex(resultImages(CYCLES[cycleIdx])));
    }
  });

  // ---------- Start ----------
  function start() {
    renderTable(); syncMode();
    const o = (qs.get('open') || '').split(':');
    if (o[0]) { openFor(Number(o[0]) - 1, o[1] === 'raw' ? 'raw' : 'result', Number(o[2] || 1) - 1); return; }
    if (state === 'table') return;
    if (state === 'raw') { openFor(0, 'raw', 0); return; }
    if (state === 'input' || state === 'sa1') {
      const want = state === 'input' ? 'Input Image' : 'SA_1';
      openFor(0, 'result', Math.max(0, resultImages(CYCLES[0]).findIndex((im) => im.name === want)));
      return;
    }
    // Default: View Images on cycle 1, showing the area the OCR reads (today SA_1, after Enhanced Search Area 1).
    openFor(0, 'result', ocrAreaIndex(resultImages(CYCLES[0])));
  }
  // Inside the workflow shell the shell's own Today | After toggle drives ?mode=.
  if (window.self !== window.top) $('mode').style.display = 'none';
  const master = new Image();
  master.onload = () => { buildImages(master); start(); };
  // Another screen of the flow changed the chain or the Edge values: redraw the enhanced area.
  window.addEventListener('storage', (e) => {
    if (e.key !== null && e.key !== KEY) return;
    if (!master.complete) return;
    buildImages(master);
    if (V.open && !$('vw').hidden) { const keep = V.i; openFor(V.open.cycleIdx, V.open.view, keep); }
  });
  master.src = MASTER_SRC;
})();
</script>
</body>
</html>
