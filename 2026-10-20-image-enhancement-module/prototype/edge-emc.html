/* ---- Tailwind preflight (subset) + src/index.css ---- */
*,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
html{line-height:1.5;-webkit-text-size-adjust:100%;tab-size:4;font-family:'Outfit',sans-serif}
html,body{font-size:16px;height:100vh;width:100vw;overflow-y:hidden;color:#000}
body.overflow-auto{overflow:auto}
:root{font-family:'Outfit',sans-serif;font-optical-sizing:auto;line-height:1.5;font-weight:400;font-style:normal;font-size:16px;min-height:100vh;height:fit-content;color-scheme:light;font-synthesis:weight style;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;line-height:inherit;background:#fff}
button,input{font-family:inherit;font-feature-settings:inherit;font-variation-settings:inherit;font-size:100%;font-weight:inherit;line-height:inherit;letter-spacing:inherit;color:inherit;margin:0;padding:0}
button{text-transform:none;-webkit-appearance:button;background-color:transparent;background-image:none;cursor:pointer}
:disabled{cursor:default}
svg{display:block;vertical-align:middle}
table{text-indent:0;border-color:inherit;border-collapse:collapse}
th{font-weight:inherit}
ul{list-style:none;margin:0;padding:0}
label{cursor:default}
input::placeholder{opacity:1;color:#9ca3af}
::-webkit-inner-spin-button,::-webkit-outer-spin-button{height:auto}
@media (max-width:1281px){*{font-size:96%}}

/* ---- Sidebar (shared/layouts/main/sidebar.jsx, collapsed = default) ---- */
.sb{position:fixed;left:0;top:0;z-index:100;display:flex;flex-direction:column;align-items:center;height:100vh;width:114px;
  border-right:1px solid #d1d5db;background:#1e1c1c;padding:24px 8px;overflow:hidden;white-space:nowrap;
  box-shadow:0 4px 6px -1px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.1)}
.sb-top{display:flex;min-height:0;width:100%;flex:1 1 0%;flex-direction:column}
.blk{position:relative;display:block}
.sb-logo{margin:12px 0 40px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sb-nav{margin-top:32px;min-height:0;width:100%;flex:1 1 0%;overflow-y:auto;overflow-x:hidden}
.sb-nav>ul{display:flex;width:100%;flex-direction:column;gap:8px;padding-bottom:16px}
.sb-grp{display:flex;flex-direction:column;border-radius:8px}
.sb-grp:hover{background:rgb(255 255 255/.1)}
.sb-grp.open{padding-bottom:12px}
.sb-item{display:flex;align-items:center;border-radius:6px;padding:8px 36px;color:#fff;overflow:hidden;cursor:pointer;text-decoration:none}
a.sb-item:hover{background:rgb(255 255 255/.2)}
.sb-row{display:flex;align-items:center;gap:0}
.sb-ico{display:flex;width:24px;flex-shrink:0;align-items:center;justify-content:center}
.sb-lbl{font-size:18px;line-height:28px;width:0;opacity:0}
.sb-bottom{margin-top:8px;display:flex;width:100%;flex-shrink:0;flex-direction:column;gap:8px;padding-top:12px}
.sb-expand{display:flex;width:100%;align-items:center;justify-content:center;border-radius:6px;padding:8px 0;color:#fff}
.sb-expand:hover{opacity:.75}

/* ---- Main layout + Heading (shared/layouts/main/index.jsx, heading.jsx) ---- */
.main{position:relative;height:100%;min-height:100vh;width:calc(100% - 114px);margin-left:114px;overflow-x:auto;background:#fff}
.page{color:#000}
.heading{margin-top:4px;display:flex;height:60px;align-items:baseline;gap:8px;background:#fff;padding:16px 20px}
.h-main{font-size:30px;line-height:36px;font-weight:500}
.h-sub{display:flex;align-items:baseline;gap:8px;font-size:20px;line-height:28px;font-weight:500}
.self-center{align-self:center}
.tip{position:relative;display:inline-flex;align-items:center;pointer-events:auto}
.tip-i{pointer-events:auto;display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;border-radius:9999px;color:#6b7280;transition:transform .15s}
.tip-i:hover{transform:scale(1.1)}
.tip-i.white{color:#fff;transform:none}

/* ---- Inferencing Customization card + fixed footer (inferencing-customizations/index.jsx) ---- */
.box{margin:20px auto;border:1px solid #e5e7eb;border-radius:4px;background:#fff}
.box-in{padding:16px 16px 80px;min-height:84vh}
.foot{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:1px solid #e5e7eb}
.foot-in{display:flex;justify-content:flex-end;gap:12px;border-top:1px solid #e5e7eb;padding:12px 20px}
.ib{position:relative;display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;height:fit-content;cursor:pointer;
  border:1px solid transparent;font-size:14px;line-height:20px;padding:8px 24px;border-radius:6px;width:96px}
.btn-border{background:transparent;border-color:#ff4301;color:#ff4301}
.btn-flat{color:#fff;background:#ff4301;border-color:transparent}
.btn:not(:disabled):hover{opacity:.7}
.btn:disabled{background:#d1d5db;color:#6b7280;border-color:transparent;cursor:not-allowed}

/* ---- EMC (EditModuleConfigurations.jsx, InstanceSelector.jsx) ---- */
.mb-3{margin-bottom:12px}
.mb-4{margin-bottom:16px}
.col4{display:flex;flex-direction:column;gap:16px}
.col6{display:flex;flex-direction:column;gap:24px}
.w-full{width:100%}
.lbl-inst{margin-bottom:8px;display:block;font-size:14px;line-height:20px;font-weight:600;color:#000}
.lbl{margin-bottom:4px;display:block;font-size:14px;line-height:20px;font-weight:500;color:#000}
.lbl-row{margin-bottom:4px;display:flex;align-items:center;gap:8px}
.lbl-row .lbl{margin-bottom:0}

/* SelectInput (shared/ui/SelectInput.jsx) */
.sel{position:relative}
.sel-btn{position:relative;width:100%;min-width:120px;cursor:default;border-radius:6px;border:1px solid #d1d5db;background:#fff;
  padding:8px 40px 8px 12px;text-align:left;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);font-size:14px;line-height:20px;color:#111827}
.sel-btn:focus{outline:none;border-color:#ff4301;box-shadow:0 0 0 1px #ff4301,0 1px 2px 0 rgb(0 0 0/.05)}
.sel-btn:disabled{cursor:not-allowed;background:#f3f4f6}
.sel-txt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-ph{color:#6b7280}
.sel-arr{pointer-events:none;position:absolute;top:0;bottom:0;right:0;display:flex;align-items:center;padding-right:8px}
.sel-arr svg{height:20px;width:20px;color:#9ca3af}
.sel-list{position:fixed;z-index:9999;max-height:240px;overflow:auto;border-radius:6px;background:#fff;padding:4px 0;font-size:14px;line-height:20px;
  box-shadow:0 0 0 1px rgb(0 0 0/.05),0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -4px rgb(0 0 0/.1)}
.sel-list li{position:relative;cursor:default;user-select:none;padding:8px 16px 8px 40px;color:#111827}
.sel-list li.on{background:#ff4301;color:#fff}
.sel-list li .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
.sel-list li.sel-d .t{font-weight:600}
.sel-list li .tick{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;padding-left:12px;color:#000}
.sel-list li .tick svg{height:20px;width:20px}

/* Table (shared/ui/Table.jsx) */
.tbl{display:flow-root;width:100%;overflow-x:auto;overflow-y:visible}
.tbl table{min-width:100%}
.tbl table> :not([hidden]) ~ :not([hidden]){border-top:1px solid #d1d5db;border-bottom:0}
.tbl thead{position:sticky;top:0;z-index:10}
.tbl thead tr{background:#ff4301;position:relative}
.tbl th{position:sticky;top:0;padding:16px 8px;text-align:center;font-size:16px;line-height:24px;font-weight:500;color:#fff}
.th-in{display:inline-flex;align-items:center;justify-content:center;gap:4px}
.rh{position:absolute;bottom:10px;right:0;top:10px;width:2px;cursor:col-resize;border-radius:16px;background:#fff}
.tbl th:last-child .rh{display:none}
.tbl tbody{background:#fff}
.tbl tbody> :not([hidden]) ~ :not([hidden]){border-top:1px solid #e5e7eb;border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#f3f4f6}
.tbl td{overflow:visible;padding:8px;color:#000}
.td-in{display:flex;height:100%;width:100%;align-items:center;justify-content:center;text-align:center}
.fc{display:flex;flex-direction:column}
.fc-c{display:flex;flex-direction:column;align-items:center}
.fr-c{display:flex;width:100%;align-items:center;justify-content:center;gap:8px}
.cls{font-size:14px;font-weight:500;color:#000}
.h4{height:16px}
.err{height:16px;font-size:11px;line-height:16px;color:#ef4444}
.num{width:100%;min-width:80px;border-radius:5px;border:1px solid #e5e7eb;padding:8px;font-size:14px;line-height:14px;background:#fff}
.num:focus{outline:2px solid #000;outline-offset:0}
.dash{margin-bottom:16px}

/* Empty state reused from ShapeExtractorConfigEditor.jsx / BeadInspectionConfigEditor.jsx */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;background:#f9fafb;border:1px dashed #d1d5db;border-radius:12px}
.empty span{font-size:14px;line-height:20px;font-weight:500;color:#4b5563}

/* ---- Prototype-only chrome ---- */
.proto-bar{position:fixed;top:18px;right:20px;z-index:60;display:flex;align-items:center;gap:10px}
.proto{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#4b5563;background:#f3f4f6;border:1px dashed #d1d5db;border-radius:999px;padding:2px 10px}
.seg{display:inline-flex;border:1px solid #d1d5db;border-radius:999px;padding:2px;background:#fff}
.seg button{font-size:12px;line-height:18px;font-weight:600;padding:3px 12px;border-radius:999px;color:#6b7280}
.seg button[aria-pressed="true"]{background:#1e1c1c;color:#fff}

/* Tailwind preflight bits the new parts need */
h3,p{margin:0;font-size:inherit;font-weight:inherit}
canvas{display:block}

/* SelectInput option states (shared/ui/SelectInput.jsx) */
.sel-list li.dis{cursor:not-allowed;color:#9ca3af;opacity:.5}

/* Section blocks (sections/OCRSection.jsx) */
.sec{display:flex;flex-direction:column;gap:16px}
.sec-title{font-size:16px;font-weight:600}
.sub-lbl{font-size:14px;font-weight:500}
.g2{gap:8px}
.ro{width:100%;border-radius:5px;border:1px solid #e5e7eb;background:#f9fafb;padding:8px;font-size:12px;line-height:16px;color:#374151;text-align:left}
.th-num{width:100%;min-width:120px;border-radius:5px;border:1px solid #e5e7eb;padding:8px;font-size:12px;line-height:16px;background:#fff}
.rm-row{display:flex;max-width:448px;align-items:center;gap:12px}
.rm-lbl{white-space:nowrap;font-size:14px;font-weight:500;color:#000}
.sw{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.sw input{position:absolute;width:1px;height:1px;opacity:0}
.sw .tr{position:relative;height:24px;width:44px;border-radius:9999px;background:#e5e7eb}
.sw .tr::after{content:'';position:absolute;left:2px;top:2px;height:20px;width:20px;border-radius:9999px;border:1px solid #d1d5db;background:#fff;transition:all .15s}
.sw input:checked+.tr{background:#ff4301}
.sw input:checked+.tr::after{transform:translateX(100%);border-color:#fff}

/* Image Enhancement section: same cells as the Classification priority table */
.step{font-size:13px;font-weight:500;color:#000}
.fname{font-size:13px;font-weight:600;color:#000}
.vals{display:flex;width:100%;align-items:center;justify-content:center;gap:8px}
.vl{font-size:13px;font-weight:500;color:#000;cursor:default}
.vin{width:72px;border-radius:4px;border:1px solid #e5e7eb;padding:6px 8px;font-size:12px;line-height:1;color:#000;outline:none;background:#fff}
.vin:focus{border-color:#000;box-shadow:0 0 0 1px #000}
.vin.bad{border-color:#ef4444}
.vx{font-size:12px;font-weight:700;color:#000;padding:0 4px}
.verr{margin-top:4px;font-size:11px;line-height:16px;color:#ef4444}
.verr:empty{display:none}
.dash-g{color:#9ca3af}

/* Image | Preview pair: MasterImageCanvas (shared/ui/MasterImageCanvas.jsx) inside the
   white bordered frame the Shape Extractor editor uses */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.frame{background:#fff;border:1px solid #e5e7eb}
.mic{position:relative;width:100%;overflow:hidden;background:#F0F0F0;cursor:grab}
.mic.drag{cursor:grabbing}
.mic-bar{position:absolute;top:12px;right:12px;z-index:30;display:flex;align-items:center;gap:6px;background:rgb(255 255 255/.9);border:1px solid rgb(229 231 235/.8);box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:4px;border-radius:8px;user-select:none;cursor:default}
.mic-btn{position:relative;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;color:#374151;transition:all .15s}
.mic-btn:hover{background:#f3f4f6;color:#ff4301}
.mic-btn:active{background:#e5e7eb}
.mic-btn svg{width:16px;height:16px}

/* Modal (modules/modal/index.jsx) + running-deployment pop-up body (inferencing-customizations/index.jsx) */
.ov{position:fixed;left:0;top:0;z-index:99991;height:100vh;width:100vw;border-radius:8px;background:rgb(107 114 128/.75)}
.mdl{position:relative;top:50%;margin:0 auto;transform:translateY(-50%);border-radius:8px;background:#fff;text-align:left;width:33.333333%;
  box-shadow:0 20px 25px -5px rgb(0 0 0/.1),0 8px 10px -6px rgb(0 0 0/.1)}
.mdl-in{border-radius:8px;background:#fff}
.mdl-h{display:flex;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding:16px 24px}
.mdl-h h3{text-align:left;font-weight:600}
.mdl-x{cursor:pointer}
.mdl-b{border-bottom:1px solid #e5e7eb;padding:16px 24px}
.pt-2{padding-top:8px}
.mdl-f{display:flex;justify-content:space-between;gap:16px;padding:16px 24px}
.mbtn{height:40px;cursor:pointer;border-radius:9999px;border:1px solid #e5e7eb;padding:0 16px;font-size:16px}
.mbtn.pri{background:#ff4301;color:#fff}

/* react-hot-toast */
.toaster{position:fixed;z-index:9999;top:16px;left:16px;right:16px;bottom:16px;pointer-events:none;display:flex;justify-content:center;align-items:flex-start}
.toast{display:flex;align-items:center;background:#fff;color:#363636;line-height:1.3;box-shadow:0 3px 10px rgba(0,0,0,.1),0 3px 3px rgba(0,0,0,.05);max-width:350px;pointer-events:auto;padding:8px 10px;border-radius:8px;font-size:16px;animation:tin .35s cubic-bezier(.21,1.02,.73,1) forwards}
.toast .msg{margin:4px 10px;display:flex;justify-content:center;flex:1 1 auto;white-space:pre-line}
.toast .ok{width:20px;height:20px;border-radius:10px;background:#61d345;position:relative;flex-shrink:0}
.toast .ok::after{content:'';box-sizing:border-box;position:absolute;border-right:2px solid #fff;border-bottom:2px solid #fff;bottom:6px;left:6px;height:10px;width:6px;transform:rotate(45deg)}
@keyframes tin{0%{transform:translate3d(0,-200%,0) scale(.6);opacity:.5}100%{transform:translate3d(0,0,0) scale(1);opacity:1}}
</style>

    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    if (this.src === outCanvas && !lastGood) return;
    ctx.setTransform(dpr * this.o.scale, 0, 0, dpr * this.o.scale, dpr * this.o.x, dpr * this.o.y);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(this.src, 0, 0);
  };

  function mountViewers() {
    viewers = [];
    var a = document.getElementById('micA'), b = document.getElementById('micB');
    if (!a || !b) return;
    viewers.push(new Viewer(a, srcCanvas), new Viewer(b, outCanvas));
    runChain();
  }
  window.addEventListener('resize', function () { viewers.forEach(function (v) { v.reset(); }); sizeColumns(); });

  // ---------- EMC page body (EditModuleConfigurations.jsx) ----------
  function render() {
    selects = {};
    closeList();
    var modules = modulesFor(selectedCap);
    var current = modules.filter(function (m) { return m.id === selectedModule; })[0];

    var h = '';
    h += '<div class="mb-3"><label class="lbl-inst" for="instance-select">Instances (Instance Name - Project Name - Plant Name)</label>' +
      selectHTML('inst', { data: INSTANCES, value: 'i1', placeholder: 'Select Instance', onChange: function () {} }) + '</div>';
    h += '<div class="mb-4 col4">';
    h += '<div class="w-full"><label class="lbl">Variant | Capture</label>' +
      selectHTML('cap', { data: CAPTURES, value: selectedCap, onChange: function (item) {
        if (item.id === selectedCap) return;
        selectedCap = item.id; selectedModule = null; resetDirty(); render();
      } }) + '</div>';
    h += '<div class="w-full"><div class="lbl-row"><label class="lbl">Module</label></div>' +
      selectHTML('mod', { data: modules.map(function (m) { return { id: m.id, name: m.name, disabled: m.type === 'orientator' }; }), value: selectedModule,
        disabled: modules.length === 0, onChange: function (item) {
          if (item.id === selectedModule) return;
          selectedModule = item.id; resetDirty(); render();
        } }) + '</div>';
    h += '</div>';

    if (current) {
      h += '<div class="col6">';
      if (current.type === 'imageEnhancement') h += ieHTML();
      else if (current.type === 'ocr') h += ocrHTML();
      else h += odcHTML();
      h += '</div>';
    }

    document.getElementById('emc').innerHTML = h;
    sizeColumns();
    mountViewers();
    syncFooter();
    document.querySelectorAll('#seg button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === mode));
    });
  }

  function resetDirty() { chain = clone(SAVED_CHAIN); dirty = false; }
  function syncFooter() {
    // index.jsx: on this tab Reset follows resetEnabled; Save is off when nothing changed or a value has an error.
    document.getElementById('btnReset').disabled = !dirty;
    document.getElementById('btnSave').disabled = !dirty || chainHasErrors();
  }

  var rerun = null;
  document.getElementById('emc').addEventListener('input', function (e) {
    var t = e.target;
    if (!t.matches('input.vin')) return;
    var i = Number(t.getAttribute('data-i')), k = t.getAttribute('data-k');
    chain[i].v[k] = t.value;
    dirty = JSON.stringify(chain) !== JSON.stringify(SAVED_CHAIN);
    var msg = stepError(chain[i]);
    var errEl = document.querySelector('.verr[data-err="' + i + '"]');
    if (errEl) errEl.textContent = msg;
    document.querySelectorAll('input.vin[data-i="' + i + '"]').forEach(function (inp) { inp.classList.toggle('bad', !!msg); });
    syncFooter();
    cancelAnimationFrame(rerun);
    rerun = requestAnimationFrame(runChain);
  });
  document.getElementById('emc').addEventListener('keydown', function (e) {
    if (e.target.matches('input.vin') && ['e', 'E', '+', '-', '.'].indexOf(e.key) >= 0) e.preventDefault();
  });

  // ---------- Save / Reset ----------
  var toaster = document.getElementById('toaster');
  function toast(msg) {
    toaster.innerHTML = '<div class="toast"><div class="ok"></div><div class="msg" role="status">' + esc(msg) + '</div></div>';
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { toaster.innerHTML = ''; }, 2000);
  }
  var modalEl = null;
  function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }
  function openSaveWarning() {
    closeModal();
    modalEl = document.createElement('div');
    modalEl.className = 'ov';
    modalEl.setAttribute('role', 'dialog');
    modalEl.setAttribute('aria-modal', 'true');
    modalEl.innerHTML =
      '<div class="mdl"><div class="mdl-in">' +
        '<div class="mdl-h"><h3>Confirmation Message</h3><div class="mdl-x" data-m="x">' + CLOSE_25 + '</div></div>' +
        '<div class="mdl-b">' +
          '<p>The models of the modules below ' + esc(moduleName) + ' (OCR_1) were trained on images enhanced with the old values.</p>' +
          '<p class="pt-2">Do you want to proceed to save these changes?</p>' +
        '</div>' +
        '<div class="mdl-f">' +
          '<button class="mbtn" type="button" data-m="cancel">Cancel</button>' +
          '<button class="mbtn pri" type="button" data-m="ok">Confirm</button>' +
        '</div>' +
      '</div></div>';
    modalEl.addEventListener('click', function (e) {
      var b = e.target.closest('[data-m]');
      if (!b) return;
      var m = b.getAttribute('data-m');
      closeModal();
      if (m === 'ok') {
        SAVED_CHAIN = clone(chain); dirty = false; syncFooter();
        writeEdgeChain();
        toast('Changes saved');
        // Inside the workflow shell, move on to the dashboard once the values are saved.
        if (inShell) setTimeout(function () { try { window.parent.postMessage({ type: 'ie-nav', to: 'edge-dashboard' }, '*'); } catch (err) { /* ignore */ } }, 700);
      }
    });
    document.body.appendChild(modalEl);
  }
  document.getElementById('btnReset').addEventListener('click', function () { resetDirty(); render(); });
  document.getElementById('btnSave').addEventListener('click', function () {
    var current = modulesFor(selectedCap).filter(function (m) { return m.id === selectedModule; })[0];
    if (current && current.type === 'imageEnhancement') openSaveWarning();
    else { dirty = false; syncFooter(); toast('Changes saved'); }
  });

  // ---------- Prototype switcher (hidden inside the workflow shell, whose own toggle passes ?mode=) ----------
  var inShell = window.self !== window.top;
  if (inShell) document.querySelector('.proto-bar').style.display = 'none';
  document.getElementById('seg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]');
    if (!b || b.getAttribute('data-mode') === mode) return;
    location.search = '?mode=' + b.getAttribute('data-mode');
  });

  // Another screen of the flow changed the shared state: pick up the new chain unless values are being edited here.
  window.addEventListener('storage', function (e) {
    if (e.key !== null && e.key !== KEY) return;
    SAVED_CHAIN = loadSaved();
    if (!dirty) { chain = clone(SAVED_CHAIN); render(); }
  });

  render();
  if (state === 'module-list') {
    var modWrap = document.querySelector('.sel[data-sel="mod"]');
    openSelect(modWrap, mode === 'after' ? 'm2' : null);
    pinned = true;
  } else if (state === 'save-warning') {
    openSaveWarning();
  }
})();
</script>
</body>
</html>
